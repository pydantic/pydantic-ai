[project.urls]
Homepage = "https://github.com/pydantic/pydantic-ai/tree/main/src/pydantic_ai_pax"
Source = "https://github.com/pydantic/pydantic-ai"
Changelog = "https://github.com/pydantic/pydantic-ai/releases"

[project.scripts]
clai2 = "pydantic_clai2.__main__:main"
# Matches the distribution name so `uvx pydantic-clai2` works without `--from`.
pydantic-clai2 = "pydantic_clai2.__main__:main"

[tool.hatch.metadata]
# Only for the `main` channel's sdist, which is never uploaded to PyPI.
allow-direct-references = true

# The deprecated `pydantic_clai2` import alias, owned by this distribution alone so upgrading it never removes it.
[tool.hatch.build.targets.wheel]
packages = ["pydantic_clai2"]

[tool.hatch.build.targets.sdist]
include = ["/pydantic_clai2", "/README.md", "/LICENSE"]

[tool.uv.sources]
pydantic-ai-pax = { workspace = true }
