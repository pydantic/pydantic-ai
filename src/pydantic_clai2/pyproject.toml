anthropic = ["pydantic-ai-pax[anthropic]{% if env.PAX_SDIST_URL %} @ {{ env.PAX_SDIST_URL }}{% else %}==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}{% endif %}"]
xai = ["pydantic-ai-pax[xai]{% if env.PAX_SDIST_URL %} @ {{ env.PAX_SDIST_URL }}{% else %}==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}{% endif %}"]
