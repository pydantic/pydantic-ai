[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Same scheme as `pydantic-ai-pax`, which this package pins exactly; keep the two in sync.
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
format-jinja = "0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"

[project]
name = "pydantic-clai2"
dynamic = ["version", "dependencies", "optional-dependencies"]
description = "Deprecated: renamed to pydantic-ai-pax"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[tool.hatch.metadata.hooks.uv-dynamic-versioning]
dependencies = ["pydantic-ai-pax==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]

# The extras `pydantic-ai-pax` offers, so `pydantic-clai2[e2b]` keeps installing them.
[tool.hatch.metadata.hooks.uv-dynamic-versioning.optional-dependencies]
openai = ["pydantic-ai-pax[openai]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
cohere = ["pydantic-ai-pax[cohere]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
google = ["pydantic-ai-pax[google]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
anthropic = ["pydantic-ai-pax[anthropic]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
xai = ["pydantic-ai-pax[xai]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
groq = ["pydantic-ai-pax[groq]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
openrouter = ["pydantic-ai-pax[openrouter]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
mistral = ["pydantic-ai-pax[mistral]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
bedrock = ["pydantic-ai-pax[bedrock]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
bedrock-mantle = ["pydantic-ai-pax[bedrock-mantle]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
zai = ["pydantic-ai-pax[zai]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
snowflake = ["pydantic-ai-pax[snowflake]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
crusoe = ["pydantic-ai-pax[crusoe]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
cerebras = ["pydantic-ai-pax[cerebras]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
claude-agent = ["pydantic-ai-pax[claude-agent]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
typesafe = ["pydantic-ai-pax[typesafe]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
huggingface = ["pydantic-ai-pax[huggingface]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
boxd = ["pydantic-ai-pax[boxd]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
daytona = ["pydantic-ai-pax[daytona]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
e2b = ["pydantic-ai-pax[e2b]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
kubernetes = ["pydantic-ai-pax[kubernetes]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
local = ["pydantic-ai-pax[local]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
modal = ["pydantic-ai-pax[modal]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
opensandbox = ["pydantic-ai-pax[opensandbox]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
render = ["pydantic-ai-pax[render]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
sprites = ["pydantic-ai-pax[sprites]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
all = ["pydantic-ai-pax[all]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]

[project.urls]
Homepage = "https://github.com/pydantic/pydantic-ai/tree/main/src/pydantic_ai_pax"
Source = "https://github.com/pydantic/pydantic-ai"
Changelog = "https://github.com/pydantic/pydantic-ai/releases"

[project.scripts]
clai2 = "pydantic_clai2.__main__:main"
# Matches the distribution name so `uvx pydantic-clai2` works without `--from`.
pydantic-clai2 = "pydantic_clai2.__main__:main"

# The deprecated `pydantic_clai2` import alias, owned by this distribution alone so upgrading it never removes it.
[tool.hatch.build.targets.wheel]
packages = ["pydantic_clai2"]

[tool.hatch.build.targets.sdist]
include = ["/pydantic_clai2", "/README.md", "/LICENSE"]

[tool.uv.sources]
pydantic-ai-pax = { workspace = true }
