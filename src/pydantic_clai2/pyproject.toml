[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Same scheme as `pydantic-ai-harness`, which this package pins exactly; keep the two in sync.
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
format-jinja = "0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"

[project]
name = "pydantic-clai2"
dynamic = ["version", "dependencies", "optional-dependencies"]
description = "A capability-aware streaming terminal client for Pydantic AI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.hatch.metadata.hooks.uv-dynamic-versioning]
dependencies = [
    "pydantic-ai-harness[coder]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}",
    # Speculative execution runs CodeMode's Monty sandbox. Pinned directly rather than via
    # `pydantic-ai-harness[code-mode]`, which also pulls a web-search client CLAI does not use.
    "pydantic-monty>=1.0.0,<2",
    # Built-in MCP client: https://github.com/pydantic/pydantic-ai/issues/9267.
    "pydantic-ai-slim[anthropic,mcp,openai]=={{ major }}.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}",
    # FastMCP's browser sign-in (`/mcp` OAuth and the day_ai, notion, ordinal, posthog, pylon, and grain
    # plugins) runs a uvicorn callback server with `ws="websockets-sansio"`, which imports `websockets`
    # on start. `fastmcp-slim[client]` does not declare it, so without this the sign-in fails.
    "websockets>=13.0",
    "genai-prices>=0.1.7",
    # 1.0 adds `termflow.live` (ScreenBuffer, render_diff, Widget), which paints the transcript panel.
    "termflow-md>=1.0.0,<2",
    "pyfiglet>=1.0.4",
    "prompt-toolkit>=3.0.52",
    "python-dotenv>=1.2.2",
    "rich>=14",
    "keyring>=25.6",
    # Encrypts saved credentials with the one key kept in keyring, so a session prompts for keychain access once.
    "cryptography>=42",
    "pillow>=12.3.0",
    # Default telemetry plugin: https://github.com/pydantic/pydantic-ai-harness/issues/979.
    "logfire[httpx]>=4.31.0",
    # Required for HTTPX2ClientInstrumentor, including when the observability HTTPX option is off.
    "opentelemetry-instrumentation-httpx>=0.65b0",
]

# Providers whose SDK CLAI does not install by default. `/model` names the extra when it is missing.
[tool.hatch.metadata.hooks.uv-dynamic-versioning.optional-dependencies]
typesafe = ["pydantic-ai-slim[typesafe]=={{ major }}.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]

[project.urls]
Homepage = "https://github.com/pydantic/pydantic-ai/tree/main/src/pydantic_clai2"
Source = "https://github.com/pydantic/pydantic-ai"
Changelog = "https://github.com/pydantic/pydantic-ai/releases"

[project.scripts]
clai2 = "pydantic_clai2.__main__:main"
# Matches the distribution name so `uvx pydantic-clai2` works without `--from`.
pydantic-clai2 = "pydantic_clai2.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["pydantic_clai2"]

[tool.hatch.build.targets.sdist]
include = ["/pydantic_clai2", "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md"]

[tool.uv.sources]
pydantic-ai-harness = { workspace = true }
pydantic-ai-slim = { workspace = true }
