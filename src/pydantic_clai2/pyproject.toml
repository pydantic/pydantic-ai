[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Same scheme as `pydantic-ai-pax`, which this package pins exactly; keep the two in sync.
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
format-jinja = "0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"

[project]
name = "pydantic-clai2"
dynamic = ["version", "dependencies", "optional-dependencies"]
description = "Deprecated: renamed to pydantic-ai-pax"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[tool.hatch.metadata.hooks.uv-dynamic-versioning]
dependencies = ["pydantic-ai-pax==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]

# The extras `pydantic-ai-pax` offers, so `pydantic-clai2[e2b]` keeps installing them.
[tool.hatch.metadata.hooks.uv-dynamic-versioning.optional-dependencies]
typesafe = ["pydantic-ai-pax[typesafe]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
boxd = ["pydantic-ai-pax[boxd]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
daytona = ["pydantic-ai-pax[daytona]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
e2b = ["pydantic-ai-pax[e2b]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
kubernetes = ["pydantic-ai-pax[kubernetes]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
modal = ["pydantic-ai-pax[modal]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
opensandbox = ["pydantic-ai-pax[opensandbox]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
render = ["pydantic-ai-pax[render]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
sprites = ["pydantic-ai-pax[sprites]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]

[project.urls]
Homepage = "https://github.com/pydantic/pydantic-ai/tree/main/src/pydantic_ai_pax"
Source = "https://github.com/pydantic/pydantic-ai"
Changelog = "https://github.com/pydantic/pydantic-ai/releases"

# `pydantic_clai2.__main__` ships in `pydantic-ai-pax`; this package adds only the old command names.
[project.scripts]
clai2 = "pydantic_clai2.__main__:main"
# Matches the distribution name so `uvx pydantic-clai2` works without `--from`.
pydantic-clai2 = "pydantic_clai2.__main__:main"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
include = ["/README.md", "/LICENSE"]

[tool.uv.sources]
pydantic-ai-pax = { workspace = true }
