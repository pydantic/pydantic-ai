[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Same scheme as `pydantic-ai-pax`, which this package pins exactly; keep the two in sync.
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
format-jinja = "0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"

[project]
name = "pydantic-clai2"
dynamic = ["version", "dependencies", "optional-dependencies"]
description = "Deprecated: renamed to pydantic-ai-pax"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

# The `main` channel's build pins Pax's sdist in the same release: `scripts/build_bleeding.sh` sets `PAX_SDIST_URL`.
# Builds from before the rename update this package without naming Pax, which PyPI does not have at that version.
[tool.hatch.metadata.hooks.uv-dynamic-versioning]
dependencies = ["pydantic-ai-pax{% if env.PAX_SDIST_URL %} @ {{ env.PAX_SDIST_URL }}{% else %}==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}{% endif %}"]

# The extras `pydantic-ai-pax` offers, so `pydantic-clai2[e2b]` keeps installing them, pinned like the base dependency.
[tool.hatch.metadata.hooks.uv-dynamic-versioning.optional-dependencies]
openai = ["pydantic-ai-pax[openai]{% if env.PAX_SDIST_URL %} @ {{ env.PAX_SDIST_URL }}{% else %}==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}{% endif %}"]
cohere = ["pydantic-ai-pax[cohere]{% if env.PAX_SDIST_URL %} @ {{ env.PAX_SDIST_URL }}{% else %}==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}{% endif %}"]
