[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Same scheme as `pydantic-ai-harness`, which this package pins exactly; keep the two in sync.
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
format-jinja = "0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"

[project]
name = "pydantic-ai-pax"
dynamic = ["version", "dependencies", "optional-dependencies"]
description = "A capability-aware streaming terminal client for Pydantic AI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development",
]

[tool.hatch.metadata.hooks.uv-dynamic-versioning]
dependencies = [
    "pydantic-ai-harness[coder,skills]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}",
    # Direct `httpx` use in `pydantic-ai-pax` until its own `httpx2` migration; the harness no longer installs it.
    "httpx>=0.28.1",
    # The `skills` extra's dependency, declared directly as well: `/update` to `main` runs the old build,
    # whose uv overrides replace the harness requirement with its own extras, so an extra added since is
    # dropped. Without PyYAML the `coder` plugin, which imports `pydantic_ai_harness.skills`, fails to load.
    "pyyaml>=6.0.2",
    # Speculative execution runs CodeMode's Monty sandbox. Pinned directly rather than via
    # `pydantic-ai-harness[code-mode]`, which also pulls a web-search client Pax does not use. 1.7.0 matches that
    # extra's floor: the first Monty to import every module the `run_code` description lists.
    "pydantic-monty>=1.7.0,<2",
    # Built-in MCP client: https://github.com/pydantic/pydantic-ai/issues/9267.
    "pydantic-ai-slim[anthropic,google,mcp,openai]=={{ major }}.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}",
    # Above the `[mcp]` extra's 3.3.0: browser sign-in passes `OAuth(callback_host=...)`, new in FastMCP 3.4.0.
    "fastmcp-slim[client]>=3.4.0,<5",
    # FastMCP 3's browser sign-in (`/mcp` OAuth and the day_ai, notion, ordinal, posthog, pylon, and grain
    # plugins) runs a uvicorn callback server with `ws="websockets-sansio"`, which imports `websockets`
    # on start. `fastmcp-slim[client]` does not declare it, so without this the sign-in fails.
    # 15 for `connect(proxy=None)`, which keeps `web.client`'s loopback WebSocket off any configured proxy.
    "websockets>=15.0",
    # The `web` plugin's server (`/web`, `pax --web`). A dependency rather than an extra so that
    # `uvx pydantic-ai-pax --web` works as is; uvicorn and starlette already come with `mcp`.
    "fastapi>=0.115.0",
    "uvicorn>=0.38.0",
    "genai-prices>=0.1.7",
    # 1.0 adds `termflow.live` (ScreenBuffer, render_diff, Widget), which paints the transcript panel.
    "termflow-md>=1.0.0,<2",
    "pyfiglet>=1.0.4",
    "prompt-toolkit>=3.0.52",
    "python-dotenv>=1.2.2",
    "rich>=14",
    "keyring>=25.6",
    # Encrypts saved credentials with the one key kept in keyring, so a session prompts for keychain access once.
    "cryptography>=42",
    "pillow>=12.3.0",
    # Default telemetry plugin: https://github.com/pydantic/pydantic-ai-harness/issues/979.
    "logfire[httpx]>=4.31.0",
    # Required for HTTPX2ClientInstrumentor, including when the observability HTTPX option is off.
    "opentelemetry-instrumentation-httpx>=0.65b0",
]

[tool.hatch.metadata.hooks.uv-dynamic-versioning.optional-dependencies]
# A model provider's SDK, for each provider extra of `pydantic-ai-slim`, so `pydantic-ai-pax[groq]` installs Groq's.
# The OpenAI, Anthropic, and Google SDKs come with Pax, and their extras exist so every provider has one.
# `/model` names the extra when a provider's SDK is missing.
# BEGIN provider extras: one per `pydantic-ai-slim` extra, less the ones `tests/pax/test_provider_extras.py` excludes.
openai = ["pydantic-ai-slim[openai]=={{ major }}.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
cohere = ["pydantic-ai-slim[cohere]=={{ major }}.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
google = ["pydantic-ai-slim[google]=={{ major }}.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
anthropic = ["pydantic-ai-slim[anthropic]=={{ major }}.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
xai = ["pydantic-ai-slim[xai]=={{ major }}.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
groq = ["pydantic-ai-slim[groq]=={{ major }}.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
openrouter = ["pydantic-ai-slim[openrouter]=={{ major }}.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
mistral = ["pydantic-ai-slim[mistral]=={{ major }}.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
bedrock = ["pydantic-ai-slim[bedrock]=={{ major }}.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
bedrock-mantle = ["pydantic-ai-slim[bedrock-mantle]=={{ major }}.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
zai = ["pydantic-ai-slim[zai]=={{ major }}.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
snowflake = ["pydantic-ai-slim[snowflake]=={{ major }}.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
crusoe = ["pydantic-ai-slim[crusoe]=={{ major }}.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
cerebras = ["pydantic-ai-slim[cerebras]=={{ major }}.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
claude-agent = ["pydantic-ai-slim[claude-agent]=={{ major }}.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
typesafe = ["pydantic-ai-slim[typesafe]=={{ major }}.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
huggingface = ["pydantic-ai-slim[huggingface]=={{ major }}.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
# END provider extras
# `/sandbox PROVIDER`: each installs the harness backend for that provider.
boxd = ["pydantic-ai-harness[boxd]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
daytona = ["pydantic-ai-harness[daytona]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
e2b = ["pydantic-ai-harness[e2b]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
kubernetes = ["pydantic-ai-harness[kubernetes]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
# `/sandbox local smol` and `local boxlite` on macOS and Linux; neither SDK has a Windows wheel, where
# `/sandbox local smol` uses the `smolvm` CLI.
local = ["pydantic-ai-harness[smol,boxlite]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
modal = ["pydantic-ai-harness[modal]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
opensandbox = ["pydantic-ai-harness[opensandbox]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
render = ["pydantic-ai-harness[render]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
sprites = ["pydantic-ai-harness[sprites]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"]
# Every extra above that installs on every platform: all but `local`, whose SDKs have no Windows wheel.
all = [
    "pydantic-ai-slim[anthropic,bedrock,bedrock-mantle,cerebras,cohere,crusoe,google,groq,huggingface,mistral,openai,openrouter,snowflake,typesafe,xai,zai]=={{ major }}.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}",
    "pydantic-ai-harness[boxd,daytona,e2b,kubernetes,modal,opensandbox,render,sprites]==0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}",
]

[project.urls]
Homepage = "https://github.com/pydantic/pydantic-ai/tree/main/src/pydantic_ai_pax"
Source = "https://github.com/pydantic/pydantic-ai"
Changelog = "https://github.com/pydantic/pydantic-ai/releases"

[project.scripts]
pax = "pydantic_ai_pax.__main__:main"
# Matches the distribution name so `uvx pydantic-ai-pax` works without `--from`.
pydantic-ai-pax = "pydantic_ai_pax.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["pydantic_ai_pax"]

# The docs `read_pax_docs` serves; `pax_docs._PAX_DOCS` lists them. An editable install reads them from the checkout.
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "pydantic_ai_pax/_docs/README.md"
"PLUGINS.md" = "pydantic_ai_pax/_docs/PLUGINS.md"
"docs/reference.md" = "pydantic_ai_pax/_docs/reference.md"
"docs/declarative-plugins.md" = "pydantic_ai_pax/_docs/declarative-plugins.md"

[tool.hatch.build.targets.sdist]
include = [
    "/pydantic_ai_pax",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
    "/PLUGINS.md",
    "/docs/reference.md",
    "/docs/declarative-plugins.md",
]

[tool.uv.sources]
pydantic-ai-harness = { workspace = true }
pydantic-ai-slim = { workspace = true }
