[build-system]
requires = ['hatchling', 'uv-dynamic-versioning>=0.7.0']
build-backend = 'hatchling.build'

[project]
name = 'pydantic-ai-harness'
dynamic = ['version']
description = 'The official capability library and harness for Pydantic AI'
readme = 'README.md'
requires-python = '>=3.10'
license = 'MIT'
authors = [
    { name = 'Douwe Maan', email = 'douwe@pydantic.dev' },
    { name = 'David SF', email = 'david.sanchez@pydantic.dev' },
    { name = 'Aditya Vardhan', email = 'aditya@pydantic.dev' },
]
classifiers = [
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Topic :: Software Development :: Libraries',
    'Typing :: Typed',
]
dependencies = [
    "genai-prices>=0.0.71",
    "httpx>=0.28.1",
    # The compaction estimator and the conversation-search indexer both have to recognise
    # `ToolAvailabilityDeltaPart`, which lands in 2.23.0 — it is the one `ModelRequestPart`
    # that carries no `content`, so code that walks request parts raises `AttributeError`
    # on it rather than merely ignoring it (#577). Handling it needs the class to import,
    # so the floor is the version that introduced it, not merely the one we lock.
    # (`CodeMode` separately reads `ModelRequestParameters.revealed_tool_names`, from 2.22.0.)
    "pydantic-ai-slim>=2.28.0",
]

[project.optional-dependencies]
# Provider/CLI pass-throughs so `uv add "pydantic-ai-harness[anthropic,cli]"` works standalone,
# without separately naming pydantic-ai-slim. (No openai/google pass-throughs: browser-use pins
# provider SDKs that conflict with slim's floors when the workspace resolves all extras together.)
anthropic = [
    "pydantic-ai-slim[anthropic]>=2.28.0",
]
cli = [
    "pydantic-ai-slim[cli]>=2.28.0",
]
code-mode = [
    "pydantic-ai-slim[duckduckgo]>=2.28.0",
    "pydantic-monty>=0.0.19",
]
# Extras metadata has no native redirect syntax, so aliases are represented as duplicate extras.
codemode = [
    "pydantic-ai-slim[duckduckgo]>=2.28.0",
    "pydantic-monty>=0.0.19",
]
researcher = [
    "pydantic-ai-slim[duckduckgo,web-fetch]>=2.28.0",
]
temporal = [
    'pydantic-ai-slim[temporal]',
]
dbos = [
    'pydantic-ai-slim[dbos]',
]
logfire = [
    'logfire>=4.31.0',
    "pydantic-ai-slim[spec]>=2.18.0",
]
modal = [
    "modal>=1.5.0",
]
dynamic-workflow = [
    "pydantic-monty>=0.0.19",
]
acp = [
    # The SDK breaks across minors, so cap per minor.
    "agent-client-protocol>=0.11,<0.12",
]
exa = [
    "exa-py>=2.16.0",
]
youdotcom = [
    "youdotcom>=3.1.1,<4",
]
mongodb = [
    "pymongo>=4.17.0",
]
skills = [
    "pyyaml>=6.0.2",
]
browser-use = [
    "browser-use>=0.13.6,<0.14 ; python_full_version >= '3.11'",
]
playwright = [
    "idna>=3.4",
    "playwright>=1.61.0",
]
stackone = [
    "fastmcp>=3.4.5,<4",
    "pydantic-ai-slim[mcp]>=2.18.0",
]
prompt-injection-defender = [
    "stackone-defender>=0.7.3,<0.8 ; python_full_version >= '3.11'",
]
prompt-injection-defender-ml = [
    "stackone-defender[onnx]>=0.7.3,<0.8 ; python_full_version >= '3.11'",
]

[project.urls]
Homepage = 'https://github.com/pydantic/pydantic-ai-harness'
Source = 'https://github.com/pydantic/pydantic-ai-harness'
Issues = 'https://github.com/pydantic/pydantic-ai-harness/issues'

[dependency-groups]
dev = [
    'pydantic-ai-harness[code-mode]',
    # Floors selected to keep the `test-floor` job (using `--resolution lowest-direct`)
    # working: `anyio>=4.11.0` is when the pytest plugin started registering the
    # `anyio_mode` ini option. `pytest-anyio` has only version 0.0.0 on PyPI, so no
    # floor. The rest match pydantic-ai's discipline.
    'pytest>=9.0.0',
    'anyio[trio]>=4.11.0',
    'pytest-anyio',
    'coverage>=7.10.7',
    'logfire[httpx]>=4.31.0',
    'dirty-equals>=0.9.0',
    'inline-snapshot>=0.32.5',
    "pydantic-ai-slim[anthropic]",
    "pydantic-ai-slim[openai]",
    "pydantic-ai-slim[spec]>=2.18.0",
    "pytest-examples>=0.0.18",
    "pytest-recording>=0.13.4",
    "mongomock-motor>=0.0.36",
    "redis>=6.0.0",
]
lint = [
    'ruff>=0.14',
    'pyright>=1.1.408',
]

[tool.hatch.version]
source = 'uv-dynamic-versioning'

[tool.uv-dynamic-versioning]
vcs = 'git'
style = 'pep440'
bump = true

[tool.uv]
# `browser-use` pins provider SDKs to exact versions far below the floors `pydantic-ai-slim`
# declares (`anthropic==0.76.0`, `openai==2.16.0`), so they only resolve together under an
# override -- browser-use then runs against SDKs newer than it pins. That is deliberate and
# one-way: keeping pydantic-ai's floors current outranks tracking browser-use, whose exact-pin
# policy has open, unaddressed resolution conflicts upstream (browser-use/browser-use#4824 and
# #4877). When a floor can no longer be overridden without breaking browser-use, the extra
# yields, not the floor.
#
# An override *replaces* every requirement on the package it names, so it erases upper bounds
# too, and `lowest-direct` resolves `pydantic-ai-slim` to its floor while taking provider SDKs
# to the newest release this range admits. `anthropic` is therefore closed at the major that
# floor predates: `anthropic>=1` is built on HTTPX2, and slim hands it an `httpx2.AsyncClient`
# only from the release that raises its own floor to match. Move this bound together with the
# `pydantic-ai-slim` floor below.
override-dependencies = ['anthropic>=0.108.0,<1', 'openai>=2.45.0']


[tool.hatch.build.targets.wheel]
packages = ['pydantic_ai_harness']

[tool.ruff]
line-length = 120
target-version = 'py310'
exclude = ['template']

[tool.ruff.lint]
extend-select = ['Q', 'RUF100', 'C90', 'UP', 'I', 'D', 'TID251']

[tool.ruff.lint.per-file-ignores]
'tests/**/*.py' = ['D']

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = 'google'

[tool.ruff.format]
# don't format python in docstrings, pytest-examples takes care of it
docstring-code-format = false
quote-style = 'single'

[tool.pyright]
pythonVersion = '3.10'
typeCheckingMode = 'strict'
exclude = ['template', '.venv', 'mutants', '.agents', '.claude']
# `reportUnusedFunction` is disabled for tests because fixtures and `@agent.tool_plain`
# helpers are registered via decorators and never referenced by name (matches pydantic-ai).
executionEnvironments = [
    { root = 'tests', reportPrivateUsage = false, reportUnusedFunction = false },
    # `redis.asyncio.Redis` ships `py.typed` but leaves most of its command surface
    # partially unknown (`from_url`, `ping`, `scan_iter`, `ttl`). Only the live-Redis
    # tests touch the client directly -- `RedisSpendStore` itself goes through the
    # `RedisClient` protocol and stays fully checked.
    { root = 'integration_tests/redis', reportUnknownMemberType = false, reportUnknownVariableType = false, reportUnknownArgumentType = false },
]

[tool.pytest.ini_options]
testpaths = ['tests']
xfail_strict = true
markers = ['modal_live: runs against a real Modal control plane; needs credentials']
filterwarnings = [
    'error',
    # DBOS's run_sync triggers this on Python 3.12+ — not our code.
    'ignore:There is no current event loop:DeprecationWarning',
    # browser-use's observability decorators call asyncio.iscoroutinefunction at
    # import time, which Python 3.14+ deprecates — not our code.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
    # Experimental capabilities warn on import by design; assert it explicitly where it matters.
    'ignore::pydantic_ai_harness.experimental.HarnessExperimentalWarning',
]
anyio_mode = 'auto'

[tool.coverage.run]
branch = true
source = ['pydantic_ai_harness', 'tests']
omit = ['tests/**/test_modal_live.py']

[tool.coverage.paths]
source = ['.', '/home/runner/work/pydantic-ai-harness/pydantic-ai-harness']

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    'pragma: no cover',
    'pragma: lax no cover',
    'assert_never',
    'if TYPE_CHECKING:',
]

[tool.mutmut]
paths_to_mutate = [
    'pydantic_ai_harness/filesystem/_toolset.py',
    'pydantic_ai_harness/shell/_toolset.py',
]
tests_dir = ['tests/filesystem/', 'tests/shell/']
also_copy = ['pydantic_ai_harness/', 'tests/']
# Skip trio-parametrized tests during mutation testing — trio segfaults in
# mutmut's subprocess environment on Python 3.14 (not a code bug).
pytest_add_cli_args = ['-k', 'not trio']
# See docs/mutation-testing.md for full results (89.7% kill rate, 60 equivalent mutants).
