[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Harness stays on 0.x and follows pydantic-ai's minor and patch: pydantic-ai 2.51.0 ships
# pydantic-ai-harness 0.51.0. `{{ version }}` in the dependency templates below is still the
# pydantic-ai version, so `pydantic-ai-slim` is pinned to the release it was built with.
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
format-jinja = "0.{{ minor }}.{{ patch }}{% if distance %}.dev{{ distance }}+{{ commit }}{% endif %}"

[project]
name = "pydantic-ai-harness"
dynamic = ["version", "dependencies", "optional-dependencies"]
description = "The official capability library and harness for Pydantic AI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Douwe Maan", email = "douwe@pydantic.dev" },
    { name = "David SF", email = "david.sanchez@pydantic.dev" },
    { name = "Aditya Vardhan", email = "aditya@pydantic.dev" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[tool.hatch.metadata.hooks.uv-dynamic-versioning]
dependencies = ["genai-prices>=0.0.71", "httpx>=0.28.1", "json-repair>=0.58.0", "pydantic-ai-slim=={{ version }}"]

[tool.hatch.metadata.hooks.uv-dynamic-versioning.optional-dependencies]
anthropic = ["pydantic-ai-slim[anthropic]=={{ version }}"]
cli = ["pydantic-ai-slim[cli]=={{ version }}"]
code-mode = ["pydantic-ai-slim[duckduckgo]=={{ version }}", "pydantic-monty>=1.0.0,<2"]
# Extras metadata has no native redirect syntax, so aliases are represented as duplicate extras.
codemode = ["pydantic-ai-slim[duckduckgo]=={{ version }}", "pydantic-monty>=1.0.0,<2"]
researcher = ["pydantic-ai-slim[duckduckgo,web-fetch]=={{ version }}"]
temporal = ["pydantic-ai-slim[temporal]=={{ version }}"]
dbos = ["pydantic-ai-slim[dbos]=={{ version }}"]
logfire = ["logfire>=4.31.0", "pydantic-ai-slim[spec]=={{ version }}"]
modal = ["modal>=1.5.0"]
dynamic-workflow = ["pydantic-monty>=1.0.0,<2"]
# The SDK breaks across minors, so cap per minor.
acp = ["agent-client-protocol>=0.11,<0.12"]
exa = ["exa-py>=2.16.0"]
# 2.0 changed tool-result serialization in a way the durable bridge does not handle yet.
aws-lambda = ["aws-durable-execution-sdk-python>=1.7.0,<2 ; python_full_version >= '3.11'"]
# 3.2 types `page_age` as `datetime | str`, and the toolset formats it as a `datetime`.
youdotcom = ["youdotcom>=3.1.2,<3.2"]
mongodb = ["pymongo>=4.17.0"]
skills = ["pyyaml>=6.0.2"]
browser-use = ["browser-use>=0.13.6,<0.14 ; python_full_version >= '3.11'"]
playwright = ["idna>=3.4", "playwright>=1.61.0"]
stackone = ["fastmcp>=3.4.5,<4", "pydantic-ai-slim[mcp]=={{ version }}"]
ordinal = ["pydantic-ai-slim[mcp]=={{ version }}"]
grain = ["pydantic-ai-slim[mcp]=={{ version }}"]
day-ai = ["pydantic-ai-slim[mcp]=={{ version }}"]
posthog = ["pydantic-ai-slim[mcp]=={{ version }}"]
pylon = ["pydantic-ai-slim[mcp]=={{ version }}"]
prompt-injection-defender = ["stackone-defender>=0.7.3,<0.8 ; python_full_version >= '3.11'"]
prompt-injection-defender-ml = ["stackone-defender[onnx]>=0.7.3,<0.8 ; python_full_version >= '3.11'"]
github = ["pydantic-ai-slim[mcp]=={{ version }}"]
slack = ["pydantic-ai-slim[mcp]=={{ version }}"]
coder = ["ripgrep==14.1.0 ; sys_platform != 'android'"]
logfire-mcp = ["pydantic-ai-slim[mcp]=={{ version }}"]
linear = ["pydantic-ai-slim[mcp]=={{ version }}"]
notion = ["pydantic-ai-slim[mcp]=={{ version }}"]
google-workspace = ["pydantic-ai-slim[mcp]=={{ version }}"]

[project.urls]
Homepage = "https://pydantic.dev/docs/ai/harness/"
Source = "https://github.com/pydantic/pydantic-ai"
Documentation = "https://pydantic.dev/docs/ai/harness/"
Changelog = "https://github.com/pydantic/pydantic-ai/releases"

[tool.hatch.build.targets.wheel]
packages = ["pydantic_ai_harness"]

[tool.hatch.build.targets.sdist]
include = ["/pydantic_ai_harness", "/README.md", "/LICENSE"]

[tool.uv.sources]
pydantic-ai-slim = { workspace = true }
