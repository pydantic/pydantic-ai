changelog:
  exclude:
    labels:
      - docs
      - chore
      - pkg:clai2
  # GitHub lists each PR only under the first category it matches, so categories are
  # change types. The release manager lists `compatibility impact` PRs again under
  # Compatibility Notes, and copies those notes into the "Catching up across V2 minor releases"
  # section of docs/changelog.md: a `###` heading linking to the release, at the top (newest
  # first), then one line per note without its `by @author`, keeping its PR link and linking
  # each API name that has a reference page.
  categories:
    - title: 🚀 Features
      labels:
        - feature
    - title: 🐛 Bug Fixes
      labels:
        - bug
    - title: 📦 Dependencies
      labels:
        - dependency
