# Temporary fixture generator; removed before the PR opens.
# Runs the pinned claude-code-action against a localhost API that simulates a
# Claude subscription-window rejection. No secrets: the OAuth token is fake.
name: Douwebot quota fixture
on:
  push:
    branches: [douwebot-opencode-quota-fixture]
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        window: [five_hour, seven_day]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start simulated Anthropic API
        env:
          WINDOW: ${{ matrix.window }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fixture"
          cat > "$RUNNER_TEMP/fake_api.py" <<'PY'
          import json
          import os
          import time
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          WINDOW = os.environ['WINDOW']
          LOG = os.path.join(os.environ['RUNNER_TEMP'], 'fixture', 'requests.jsonl')
          NOW = int(time.time())
          RESET_5H = NOW + 3600
          RESET_7D = NOW + 3 * 86400
          FIVE_HOUR = WINDOW == 'five_hour'
          HEADERS = {
              'anthropic-ratelimit-unified-status': 'rejected',
              'anthropic-ratelimit-unified-reset': str(RESET_5H if FIVE_HOUR else RESET_7D),
              'anthropic-ratelimit-unified-representative-claim': WINDOW,
              'anthropic-ratelimit-unified-5h-status': 'rejected' if FIVE_HOUR else 'allowed',
              'anthropic-ratelimit-unified-5h-reset': str(RESET_5H),
              'anthropic-ratelimit-unified-5h-utilization': '1.0' if FIVE_HOUR else '0.42',
              'anthropic-ratelimit-unified-7d-status': 'allowed' if FIVE_HOUR else 'rejected',
              'anthropic-ratelimit-unified-7d-reset': str(RESET_7D),
              'anthropic-ratelimit-unified-7d-utilization': '0.42' if FIVE_HOUR else '1.0',
              'anthropic-ratelimit-unified-overage-status': 'rejected',
              'anthropic-ratelimit-unified-overage-disabled-reason': 'overage_not_provisioned',
              'anthropic-ratelimit-unified-fallback-percentage': '0.5',
              'request-id': 'req_simulated_quota_fixture',
          }
          BODY = json.dumps({
              'type': 'error',
              'error': {'type': 'rate_limit_error', 'message': "This request would exceed your account's rate limit. Please try again later."},
              'request_id': 'req_simulated_quota_fixture',
          }).encode()


          class Handler(BaseHTTPRequestHandler):
              def _record(self, status: int) -> None:
                  length = int(self.headers.get('content-length') or 0)
                  raw = self.rfile.read(length) if length else b''
                  try:
                      body = json.loads(raw) if raw else {}
                  except ValueError:
                      body = {}
                  entry = {
                      'method': self.command,
                      'path': self.path,
                      'status': status,
                      'anthropic-beta': self.headers.get('anthropic-beta'),
                      'user-agent': self.headers.get('user-agent'),
                      'model': body.get('model') if isinstance(body, dict) else None,
                      'max_tokens': body.get('max_tokens') if isinstance(body, dict) else None,
                  }
                  with open(LOG, 'a', encoding='utf-8') as handle:
                      handle.write(json.dumps(entry) + '\n')

              def do_POST(self) -> None:
                  if self.path.startswith('/v1/messages'):
                      self._record(429)
                      self.send_response(429)
                      for name, value in HEADERS.items():
                          self.send_header(name, value)
                      self.send_header('content-type', 'application/json')
                      self.send_header('content-length', str(len(BODY)))
                      self.end_headers()
                      self.wfile.write(BODY)
                  else:
                      self._not_found()

              def do_GET(self) -> None:
                  self._not_found()

              def _not_found(self) -> None:
                  self._record(404)
                  payload = b'{"type":"error","error":{"type":"not_found_error","message":"not found"}}'
                  self.send_response(404)
                  self.send_header('content-type', 'application/json')
                  self.send_header('content-length', str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

              def log_message(self, format: str, *args: object) -> None:
                  pass


          ThreadingHTTPServer(('127.0.0.1', 8765), Handler).serve_forever()
          PY
          nohup python3 -I "$RUNNER_TEMP/fake_api.py" > "$RUNNER_TEMP/fixture/server.log" 2>&1 &
          for _ in $(seq 50); do
            curl -s -o /dev/null http://127.0.0.1:8765/ready && exit 0
            sleep 0.2
          done
          echo '::error::simulated API did not start'
          cat "$RUNNER_TEMP/fixture/server.log"
          exit 1
      - id: review
        continue-on-error: true
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        env:
          ANTHROPIC_BASE_URL: http://127.0.0.1:8765
        with:
          claude_code_oauth_token: sk-ant-oat01-simulated-quota-fixture-not-a-real-token
          github_token: ${{ github.token }}
          allowed_non_write_users: '*'
          display_report: 'true'
          claude_args: |
            --model claude-opus-5-5[1m]
            --json-schema '{"$defs":{"Finding":{"description":"One inline finding; GitHub validates the position against the pinned diff.","properties":{"path":{"title":"Path","type":"string"},"line":{"exclusiveMinimum":0,"title":"Line","type":"integer"},"side":{"enum":["LEFT","RIGHT"],"title":"Side","type":"string"},"body":{"minLength":1,"title":"Body","type":"string"}},"required":["path","line","side","body"],"title":"Finding","type":"object"}},"description":"Structured review judgment; source identity is supplied by the host.","properties":{"verdict":{"enum":["APPROVE","REQUEST_CHANGES","INCOMPLETE"],"title":"Verdict","type":"string"},"comments":{"items":{"$ref":"#/$defs/Finding"},"title":"Comments","type":"array"},"discussion":{"title":"Discussion","type":"string"}},"required":["verdict","comments","discussion"],"title":"ReviewResult","type":"object"}'
          prompt: Review this pull request.
      - name: Collect execution file and CLI provenance
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/fixture"
          echo "review outcome: $REVIEW_OUTCOME" | tee "$out/provenance.txt"
          echo "execution_file output: ${EXECUTION_FILE:-<unset>}" | tee -a "$out/provenance.txt"
          claude_bin=$(readlink -f "$HOME/.local/bin/claude")
          echo "claude binary: $claude_bin" | tee -a "$out/provenance.txt"
          "$HOME/.local/bin/claude" --version 2>&1 | tee -a "$out/provenance.txt"
          grep -c 'SDKRateLimitEvent\|rate_limit_event' "$claude_bin" | sed 's/^/rate_limit_event mentions: /' | tee -a "$out/provenance.txt"
          strings "$claude_bin" | grep -o 'anthropic-ratelimit-unified-[a-z0-9-]*' | sort -u > "$out/cli-ratelimit-headers.txt"
          cat "$out/cli-ratelimit-headers.txt"
          sdk=$(find "$GITHUB_ACTION_PATH" "$HOME" /home/runner/work/_actions -path '*claude-agent-sdk/package.json' 2>/dev/null | head -1)
          [ -n "$sdk" ] && jq -r '"agent sdk: \(.version)"' "$sdk" | tee -a "$out/provenance.txt"
          cp "$RUNNER_TEMP/claude-execution-output.json" "$out/claude-execution-output.json" || echo 'no execution file'
          echo "--- classifier"
          EXECUTION_FILE="$out/claude-execution-output.json" GITHUB_OUTPUT="$out/classifier-output.txt" \
            python3 -I .github/scripts/douwebot_usage_limit.py; echo "classifier exit: $?" | tee -a "$out/provenance.txt"
          cat "$out/classifier-output.txt" 2>/dev/null
          echo "--- rate_limit_event and result messages"
          jq -c '.[] | select(.type == "rate_limit_event" or .type == "result" or (.type == "system" and .subtype != "init"))' "$out/claude-execution-output.json" || true
          echo "--- requests"
          cat "$out/requests.jsonl" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: quota-fixture-${{ matrix.window }}
          path: ${{ runner.temp }}/fixture
