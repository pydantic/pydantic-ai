name: PR Review Checks proof

# Temporary: dry-runs each check against one open PR that touches its paths, before `PR Review Checks`
# is on the default branch. It posts nothing to those PRs and sets no status. Remove it before merge.

on:
  pull_request:
    types: [opened, synchronize]

permissions: {}

concurrency:
  group: pr-review-checks-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  proof:
    name: Proof (${{ matrix.check }} on #${{ matrix.pr }})
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/security-review-checks'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { check: general, pr: 11877 }
          - { check: url-fetch, pr: 12440 }
          - { check: ui, pr: 11956 }
          - { check: telemetry, pr: 12756 }
          - { check: sandboxes, pr: 12642 }
          - { check: tests-and-dependencies, pr: 11777 }
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    steps:
      - name: Checkout this branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the target PR
        run: gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '"BASE_SHA=\(.base.sha)\nHEAD_SHA=\(.head.sha)"' >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.pr }}

      - name: Checkout target PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ matrix.pr }}/head
          path: pr-head
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm detection selects this check
        run: |
          matrix=$(python3 -I .github/scripts/pr_review_checks.py pr-head "$BASE_SHA" "$HEAD_SHA")
          echo "Selected: $matrix"
          jq -e --arg check "$CHECK" 'any(.[]; .check == $check)' <<< "$matrix"
        env:
          CHECK: ${{ matrix.check }}

      - name: Gather PR context
        run: |
          gh api "repos/${REPO}/contents/scripts/gather-review-context.sh?ref=main" --jq .content | base64 -d > /tmp/gather-review-context.sh
          bash /tmp/gather-review-context.sh "$PR_NUMBER" "$REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.pr }}
          PR_HEAD_DIR: pr-head

      - name: Set up OpenCode and review tools
        uses: ./.github/actions/setup-douwebot-tools

      # No TRIAGE_WEBHOOK_URL: a private report fails this dry run instead of reaching the triage channel.
      - name: Review with OpenCode Go
        run: |
          export PATH="$RUNNER_TEMP/douwebot-tools/bin:$RUNNER_TEMP/douwebot-tools/opencode/node_modules/.bin:$PATH"
          python3 .github/scripts/run_pr_review_check.py
        env:
          CHECK: ${{ matrix.check }}
          PR_NUMBER: ${{ matrix.pr }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # zizmor: ignore[secrets-outside-env] -- temporary proof; the runner hands OpenCode only this key and the Logfire token
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }} # zizmor: ignore[secrets-outside-env] -- temporary proof; a write-only ingest token
          LOGFIRE_URL: ${{ vars.LOGFIRE_URL }}
          PYTHONPATH: ${{ runner.temp }}/douwebot-tools/python

      - name: Show the review it would post
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os, sys
          from pathlib import Path

          sys.path.insert(0, '.github/scripts')
          from publish_pr_review_checks import CheckResult, review_payload, verdict

          check = os.environ['CHECK']
          path = Path(os.environ['RUNNER_TEMP'], 'pr-review-checks-result', f'{check}.json')
          result = CheckResult.model_validate_json(path.read_text())
          state, description = verdict([check], {check: result})
          payload = json.loads(review_payload([result], os.environ['HEAD_SHA'], int(os.environ['GITHUB_RUN_ID']), inline=True))
          print(f"### `{check}` on #{os.environ['PR_NUMBER']}\n\nWould set `PR Review Checks` to `{state}`: {description}\n")
          print(payload['body'])
          for comment in payload.get('comments', []):
              print(f"\n**`{comment['path']}` line {comment['line']}**\n\n{comment['body']}")
          EOF
        env:
          CHECK: ${{ matrix.check }}
          PR_NUMBER: ${{ matrix.pr }}
          PYTHONPATH: ${{ runner.temp }}/douwebot-tools/python
