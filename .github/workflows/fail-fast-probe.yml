# TEMPORARY experiment for merge-group fail-fast; never merged.
name: Fail fast probe

on:
  push:
    branches:
      - ci-fail-fast-probe

permissions:
  contents: read

jobs:
  times-out:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: sleep 600

  cancel-after-times-out:
    needs: times-out
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: echo "result=${{ needs.times-out.result }} at $(date -u +%T)"

  fails:
    runs-on: ubuntu-latest
    steps:
      - run: exit 1

  cancel-after-fails:
    needs: fails
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: echo "result=${{ needs.fails.result }} at $(date -u +%T)"; sleep 75; gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"

  slow:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 900

  check:
    if: always()
    needs: [times-out, fails, slow]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
