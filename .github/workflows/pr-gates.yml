name: PR Gates

# Metadata merge gates: one job check and two latest-per-context commit statuses.
# `.github/workflows/AGENTS.md` ("PR Gates") documents their rules and trust boundaries.
# The logic and tests live in `.github/scripts/pr_gates.py`.
#
# No `paths:` filter: a required check that never runs stays pending and blocks the merge, so
# every PR event runs every gate.

on:
  pull_request:
    # `labeled` and `unlabeled` change the verdict. `edited` is the only event fired when the base
    # branch changes, which changes the diff the gate judges.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- executes only default-branch code and evaluates live metadata
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  workflow_run: # zizmor: ignore[dangerous-triggers] -- no artifacts or upstream code are consumed; reevaluates live metadata
    workflows: [PR Bots, PR Gates Events]
    types: [completed]
  # A required check has to report on the merge group's commit, or the queue stalls. The gate
  # judges the PR's own diff and labels, settled on its head before it could be enqueued, so it
  # skips here, and a job skipped by `if:` reports success.
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  compatibility-waiver:
    name: 'Gate: compatibility waiver labeled'
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/pr_gates.py
            .github/scripts/publish_douwebot_review.py
            .github/scripts/check_api_compatibility.py
          sparse-checkout-cone-mode: false
      - name: Install pinned script dependencies
        run: python3 -m pip install --quiet 'pydantic==2.13.4'
      - name: Require `compatibility impact` on a PR that adds an API compatibility waiver
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_STATE: ${{ github.event.pull_request.state }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/pr_gates.py compatibility-waiver

  review-target:
    name: Resolve review gate target
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      number: ${{ steps.target.outputs.number }}
      group: ${{ steps.target.outputs.group }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: target
        with:
          script: |
            if (context.eventName === 'merge_group') {
              core.setOutput('group', context.payload.merge_group.head_sha);
              return;
            }
            let number;
            if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run;
              const paths = {
                'PR Bots': '.github/workflows/bots.yml',
                'PR Gates Events': '.github/workflows/pr-gates-events.yml'
              };
              const match = /^(PR Bots|PR Gates Events) #([1-9][0-9]*) @ ([a-f0-9]{40})$/.exec(run.display_title);
              if (!match || run.path !== paths[match[1]] ||
                  run.repository.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                throw new Error('Unrecognized review gate wake-up');
              }
              number = Number(match[2]);
              if (!Number.isSafeInteger(number)) throw new Error('Invalid PR number');
            } else {
              number = context.payload.pull_request.number;
            }
            if (!Number.isSafeInteger(number) || number < 1) throw new Error('Invalid PR number');
            core.setOutput('number', number);

  review-statuses:
    name: Publish size-dependent review gates
    needs: review-target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: review-gates-${{ needs.review-target.outputs.number || needs.review-target.outputs.group }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    steps:
      # Fail closed even if checkout or dependency installation fails after an earlier success.
      - name: Mark both review requirements pending
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.review-target.outputs.number }}
          MERGE_GROUP_SHA: ${{ needs.review-target.outputs.group }}
        with:
          script: |
            let head = process.env.MERGE_GROUP_SHA;
            if (!head) {
              // The observer's title supplies only a PR number. Resolve its live
              // canonical ref inside the PR lock before any write or setup step.
              const number = Number(process.env.PR_NUMBER);
              if (!Number.isSafeInteger(number) || number < 1) throw new Error('Invalid PR number');
              const ref = `refs/pull/${number}/head`;
              const output = require('node:child_process').execFileSync('git', [
                'ls-remote', `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}.git`, ref
              ], {encoding: 'utf8'}).trim().split(/\s+/);
              if (output.length !== 2 || !/^[a-f0-9]{40}$/.test(output[0]) || output[1] !== ref) {
                throw new Error('Cannot resolve a verified PR head');
              }
              head = output[0];
            }
            for (const name of ['Gate: clean douwebot approval', 'Gate: human approval']) {
              await github.rest.repos.createCommitStatus({
                ...context.repo, sha: head, context: name,
                state: 'pending', description: 'Reading current size and reviews.',
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
            }
      - name: Checkout trusted default-branch gate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/pr_gates.py
            .github/scripts/publish_douwebot_review.py
            .github/scripts/pr_size.sh
            .github/scripts/check_api_compatibility.py
          sparse-checkout-cone-mode: false
      - name: Install pinned script dependencies
        run: python3 -m pip install --quiet 'pydantic==2.13.4'
      - name: Reevaluate live size and review requirements
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.review-target.outputs.number }}
          MERGE_GROUP_SHA: ${{ needs.review-target.outputs.group }}
        run: python3 .github/scripts/pr_gates.py review-gates
