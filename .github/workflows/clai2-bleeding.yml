# description: Publishes pydantic-ai-pax and its pinned workspace sdists, plus clai2-bleeding.json, as the moving clai2-bleeding prerelease.
name: Pax bleeding

# Publishes what `/update` installs on Pax's `main` channel: sdists of `pydantic-ai-pax` and of
# the workspace packages it pins exactly, built from each `main` commit that changes them, and
# `clai2-bleeding.json`, which names that commit. They replace the assets of the `clai2-bleeding`
# prerelease, whose tag moves with them. Release downloads are not GitHub API requests, so `/update`
# does not meet the unauthenticated API rate limit that a shared IP exhausts.
#
# In pydantic/pydantic-ai only `main` publishes. A fork can run this from "Run workflow" on any
# branch and point Pax at its own release with `CLAI_BLEEDING_URL` (see "Updating" in
# `src/pydantic_ai_pax/docs/reference.md`).

on:
  push:
    branches:
      - main
    paths:
      - src/pydantic_ai_pax/**
      - src/pydantic_clai2/**
      - src/pydantic_ai_harness/**
      - pydantic_ai_slim/**
      - pydantic_graph/**
      - .github/workflows/clai2-bleeding.yml
      - .github/workflows/clai2-web.yml
      - .github/actions/build-clai2-web-ui/**
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Publish in push order. A newer commit replaces a run still waiting, never one that is uploading.
  group: clai2-bleeding
  cancel-in-progress: false

jobs:
  validate:
    name: validate the published commit
    if: github.ref == 'refs/heads/main' || github.repository != 'pydantic/pydantic-ai'
    uses: ./.github/workflows/clai2-web.yml
    with:
      # `publish` ships this build.
      npm-cache: "false"

  publish:
    name: publish clai2-bleeding
    needs: validate
    if: github.ref == 'refs/heads/main' || github.repository != 'pydantic/pydantic-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: clai2-bleeding
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # The packages read their versions from tags and history.
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      # The committed bundle lags a web UI change until `clai2-web-bundle.yml` lands its rebuild, so
      # publish the bundle `validate` built from this commit. Building it here would run npm code in
      # a job with write access. Replaced rather than overlaid, so a file the build no longer writes
      # goes too.
      - run: rm -rf src/pydantic_ai_pax/pydantic_ai_pax/builtin_plugins/web/static

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clai2-web-static
          path: src/pydantic_ai_pax/pydantic_ai_pax/builtin_plugins/web/static

      - run: src/pydantic_ai_pax/scripts/build_bleeding.sh dist/bleeding

      - name: Smoke-test the sdists outside the workspace
        run: |
          smoke_dir=$(mktemp -d)
          uv venv "$smoke_dir"
          uv pip install --python "$smoke_dir/bin/python" dist/bleeding/*.tar.gz
          "$smoke_dir/bin/pax" --help
          "$smoke_dir/bin/clai2" --help
          "$smoke_dir/bin/python" -I src/pydantic_ai_pax/scripts/check_web_assets.py \
            src/pydantic_ai_pax/pydantic_ai_pax/builtin_plugins/web/static

      - name: Move the tag and replace the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Ref updates made with GITHUB_TOKEN start no workflow runs, so CI's tag trigger stays quiet.
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$SHA" -F force=true \
            || gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            # A prerelease that is never "latest", so it stays out of the release list's baselines.
            gh release create "$TAG" --verify-tag --prerelease --latest=false --title 'Pax bleeding' \
              --notes 'Sdists rebuilt from `main` for `/update` on the Pax `main` channel. Not a release.'
          fi
          # Sdists first and the manifest last, so the manifest never names a commit without its files.
          gh release upload "$TAG" dist/bleeding/*.tar.gz --clobber
          gh release upload "$TAG" dist/bleeding/clai2-bleeding.json --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r name; do
            [ -e "dist/bleeding/$name" ] || gh release delete-asset "$TAG" "$name" --yes
          done
