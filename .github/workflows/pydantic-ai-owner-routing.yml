name: Semantic owner routing

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  # zizmor: ignore[dangerous-triggers] -- executable checkouts use the reusable workflow's trusted SHA
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  schedule:
    - cron: '25 */6 * * *'
    - cron: '40 7 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      legacy_recovery:
        description: Route up to six recently active items from before the recovery epoch
        required: false
        type: boolean
        default: false
    secrets:
      PYDANTIC_AI_TRIAGE_SLACK_WEBHOOK_URL:
        required: true

permissions: {}

jobs:
  select:
    name: Select routing batch
    # Keep this cheap runner gate aligned with `_PARTICIPATION_OWNERS` in the routing policy.
    if: >-
      (github.repository == 'pydantic/pydantic-ai' || github.repository == 'pydantic/pydantic-ai-harness') &&
      (github.event_name != 'issue_comment' ||
      github.event.comment.user.login == 'adtyavrdhn' ||
      github.event.comment.user.login == 'dsfaccini' ||
      github.event.comment.user.login == 'DouweM')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      should_route: ${{ steps.select.outputs.should_assign }}
      routes: ${{ steps.select.outputs.routes }}
    steps:
      - name: Check out trusted routing policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/issue_pr_attention_monitor.py
            .github/scripts/semantic_owner_router.py
          sparse-checkout-cone-mode: false
      - name: Select routing decisions
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROUTING_ISSUE_NUMBER: ${{ github.event.issue.number }}
          ROUTING_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          ROUTING_PARTICIPANT_LOGIN: ${{ github.event.comment.user.login }}
          ROUTING_LEGACY_RECOVERY: ${{ github.event.schedule == '40 7 * * *' || inputs.legacy_recovery }}
        run: python .github/scripts/semantic_owner_router.py select

  route:
    name: Notify intent and assign maintainer
    needs: select
    if: needs.select.outputs.should_route == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        route: ${{ fromJSON(needs.select.outputs.routes) }}
    concurrency:
      group: semantic-owner-${{ github.repository }}-${{ matrix.route.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      # GitHub authorizes assignments by item type even though both use the Issues REST endpoint.
      pull-requests: write
    steps:
      - name: Check out trusted routing policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/issue_pr_attention_monitor.py
            .github/scripts/semantic_owner_router.py
          sparse-checkout-cone-mode: false
      - name: Revalidate and prepare canonical routing intent
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYDANTIC_AI_TRIAGE_SLACK_MENTIONS: ${{ vars.PYDANTIC_AI_TRIAGE_SLACK_MENTIONS }}
          ROUTE_NUMBER: ${{ matrix.route.number }}
          ROUTE_OWNER: ${{ matrix.route.owner }}
          ROUTE_EVIDENCE: ${{ matrix.route.evidence }}
        run: >-
          python .github/scripts/semantic_owner_router.py prepare
          --number "$ROUTE_NUMBER"
          --owner "$ROUTE_OWNER"
          --evidence "$ROUTE_EVIDENCE"
      - name: Send canonical routing intent
        if: steps.prepare.outputs.should_notify == 'true'
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          errors: true
          payload: ${{ steps.prepare.outputs.slack_payload }}
          webhook: ${{ secrets.PYDANTIC_AI_TRIAGE_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
      - name: Revalidate and assign
        if: steps.prepare.outputs.should_notify == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROUTE_NUMBER: ${{ matrix.route.number }}
          ROUTE_OWNER: ${{ matrix.route.owner }}
          ROUTE_EVIDENCE: ${{ matrix.route.evidence }}
        run: >-
          python .github/scripts/semantic_owner_router.py assign
          --number "$ROUTE_NUMBER"
          --owner "$ROUTE_OWNER"
          --evidence "$ROUTE_EVIDENCE"

  alert:
    name: Report routing failure
    needs: [select, route]
    if: ${{ always() && !cancelled() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Alert triage channel
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          webhook: ${{ secrets.PYDANTIC_AI_TRIAGE_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          errors: true
          payload: >-
            {"text":":rotating_light: Maintainer routing failed for ${{ github.repository }}. Inspect the canonical Actions run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
