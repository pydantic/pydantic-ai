# description: Runs the all-extras test selection nightly in one shuffled order and files each test that fails and then passes or fails again on its rerun as a flake issue.
name: Tests Shuffled Nightly

# One unsharded run of the `test-all-extras` selection on that job's newest Python, in the order `pytest-randomly`
# shuffles from a logged seed. When tests fail, they are rerun once in the default order. A test that then passes
# depends on the order, and `report` files it as a flake with `.github/scripts/flake_report.py`. A test that fails
# both times fails the run, and `report` files it too, as one that fails on rerun too.

on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

# The environment `ci.yml` gives its test jobs; see the comments there.
env:
  COLUMNS: 150
  UV_FROZEN: "1"
  UV_PYTHON_PREFERENCE: only-managed
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: url.https://x-access-token:${{ github.token }}@github.com/.insteadOf
  GIT_CONFIG_VALUE_0: https://github.com/
  PYTHONWARNDEFAULTENCODING: "1"
  PYTEST_JUNIT_DIR: junit-reports

jobs:
  shuffled:
    name: all-extras tests on 3.15, shuffled
    # A copy of the repository runs it only on demand.
    if: github.event_name != 'schedule' || github.repository == 'pydantic/pydantic-ai'
    runs-on: ubuntu-24.04
    # `test-all-extras` runs this selection on 3.15 in two shards, each within its 20-minute timeout, so the
    # unsharded run fits in 40 minutes. The other 20 cover setup and the rerun of the failed tests.
    timeout-minutes: 60
    outputs:
      seed: ${{ steps.seed.outputs.seed }}
    env:
      CI: true
      # As on the 3.15 `test-all-extras` legs.
      BLOCKBUSTER_ENABLED: false
      TYPECHECK_EXAMPLES: false
      ABSURD_REQUIRE_LIVE: "1"
      ABSURD_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PGTASK_REQUIRE_LIVE: "1"
      PGTASK_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: start PostgreSQL 16
        uses: ./.github/actions/start-postgres

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          enable-cache: true
          cache-suffix: all-extras

      - run: uv sync --all-packages --all-extras

      # A step of its own, which always succeeds, so `report` gets the seed when the tests fail.
      - name: pick the seed
        id: seed
        run: echo "seed=$(((RANDOM << 15) | RANDOM))" >> "$GITHUB_OUTPUT"

      # `-p randomly` turns on `pytest-randomly`, which `addopts` in `pyproject.toml` turns off. Exit status 1 means
      # tests failed and the session finished, so only then are the failed tests rerun.
      - name: run the tests shuffled, and rerun the failed ones once in the default order
        env:
          SEED: ${{ steps.seed.outputs.seed }}
        run: |
          args=(--durations=100 -n logical --dist=loadgroup --ignore=tests/durable_exec -m 'not temporal')
          printf -v shown '%q ' "${args[@]}"
          echo "::notice::Shuffled with seed $SEED. Reproduce the order with: uv run --all-packages --all-extras pytest -p randomly --randomly-seed=$SEED $shown"
          status=0
          uv run --no-sync pytest -p randomly --randomly-seed="$SEED" "${args[@]}" || status=$?
          if (( status == 1 )); then
            echo '::warning::Tests failed in the shuffled order. Rerunning them once in the default order.'
            status=0
            uv run --no-sync pytest "${args[@]}" --last-failed --last-failed-no-failures none -p no:randomly || status=$?
          fi
          exit "$status"

      - name: store JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ github.job }}-${{ strategy.job-index }}
          path: junit-reports
          if-no-files-found: ignore
          overwrite: true

  report:
    needs: [shuffled]
    # A manual run from another branch files nothing; its result is on its own page. A run whose tests never started
    # has no seed and no reports.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.shuffled.outputs.seed != '' }}
    # Filing lists the open flake issues and then creates the missing ones, so two reports at once could file one test
    # twice. `file-flakes` in `ci.yml` shares the group.
    concurrency:
      group: flake-report
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: junit-*
          path: ${{ runner.temp }}/junit-reports

      - name: Install the typed-boundary dependency
        # The `pydantic` pin and dependency closure every triage-script job shares, with `--no-deps`
        # so pip resolves nothing else: this job holds a write-scoped token, so no new release may
        # reach it.
        run: >-
          python3 -m pip install --quiet 'pydantic==2.13.4'
          'pydantic-core==2.46.4' 'typing-extensions==4.16.0' 'annotated-types==0.7.0' 'typing-inspection==0.4.4'
          --no-deps

      - name: File the flaky tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SEED: ${{ needs.shuffled.outputs.seed }}
        run: >-
          python3 .github/scripts/flake_report.py --reports "$RUNNER_TEMP/junit-reports" --seed "$SEED"
          --fails-on-rerun
