name: PostgreSQL pilot

on:
  push:
    branches-ignore: [main]
    paths:
      - .github/workflows/postgres-pilot.yml
      - .github/scripts/postgres_pilot.py
      - .github/scripts/shard_durations.py
      - .github/scripts/postgres_pilot_plugin.py
      - .github/scripts/test_postgres_pilot.py
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

env:
  UV_FROZEN: "1"
  UV_PYTHON_PREFERENCE: only-managed
  COLUMNS: 150
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: url.https://x-access-token:${{ github.token }}@github.com/.insteadOf
  GIT_CONFIG_VALUE_0: https://github.com/

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --only-dev
      - name: check comparison logic
        run: uv run --no-sync pytest .github/scripts/test_postgres_pilot.py
      - id: matrix
        run: echo "matrix=$(uv run --no-sync python .github/scripts/postgres_pilot.py matrix)" >> "$GITHUB_OUTPUT"
      - name: fetch one shared production shard baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir baseline
          for python in 3.11 3.12 3.13 3.14 3.15; do
            shards=2
            if [[ "$python" == 3.11 ]]; then shards=3; fi
            python3 .github/scripts/shard_durations.py fetch --prefix "test-durations-$python-all-extras-" \
              --shards "$shards" --output "baseline/$python.json"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgres-pilot-baseline
          path: baseline
          retention-days: 30
          if-no-files-found: error

  trial:
    name: ${{ matrix.strategy }} / ${{ matrix.selection }} / ${{ matrix.python }} / ${{ matrix.shard }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      CELL: ${{ toJSON(matrix) }}
      SHARD: ${{ matrix.shard }}
      SPLITS: ${{ matrix.shards }}
      TEST_PATHS: ${{ matrix.selection == 'harness' && 'tests/harness tests/clai2' || '' }}
      PYTHON_VERSION: ${{ matrix.python }}
      POSTGRES_PILOT_EVIDENCE: ${{ github.workspace }}/local-notes/postgres-pilot
      CI: true
      COLLECT_COVERAGE: ${{ matrix.python == '3.11' || matrix.python == '3.14' }}
      BLOCKBUSTER_ENABLED: false
      TYPECHECK_EXAMPLES: ${{ matrix.python == '3.14' }}
      PYTEST_TEST_BUDGET_SECONDS: ${{ matrix.python == '3.13' && '8' || '' }}
      PYTEST_COLLECT_BUDGET_SECONDS: ${{ matrix.python == '3.13' && '8' || '' }}
      ABSURD_REQUIRE_LIVE: "1"
      PGTASK_REQUIRE_LIVE: "1"
      ABSURD_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PGTASK_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - run: uv sync --only-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: postgres-pilot-baseline
          path: baseline
      - name: start and probe PostgreSQL
        id: start
        run: >-
          uv run --no-sync python .github/scripts/postgres_pilot.py start
          --cell "$CELL" --directory "$POSTGRES_PILOT_EVIDENCE" --baseline "baseline/$PYTHON_VERSION.json"
      - name: restore the same immutable sentence-transformers model as production
        if: matrix.python != '3.14' && matrix.python != '3.15'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub/models--sentence-transformers-testing--stsb-bert-tiny-safetensors
          key: hf-${{ runner.os }}-stsb-bert-tiny-safetensors-f3cb857cba53019a20df283396bcca179cf051a4
      - name: warm sentence-transformers model
        if: matrix.python != '3.14' && matrix.python != '3.15'
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            if uv run --all-extras --no-extra mcp-tasks python -c "from huggingface_hub import snapshot_download; from sentence_transformers import SentenceTransformer; snapshot_download('sentence-transformers-testing/stsb-bert-tiny-safetensors', revision='f3cb857cba53019a20df283396bcca179cf051a4'); SentenceTransformer('sentence-transformers-testing/stsb-bert-tiny-safetensors', revision='f3cb857cba53019a20df283396bcca179cf051a4')"; then
              exit 0
            fi
            sleep 15
          done
          exit 1
      - name: run the production all-extras selection
        id: tests
        shell: bash
        run: |
          set -x
          mkdir -p .coverage
          export PYTHONPATH="$PWD/.github/scripts"
          if [[ "$COLLECT_COVERAGE" == true ]]; then
            export COVERAGE_PROCESS_START="$PWD/pyproject.toml"
            runner=(coverage run -m pytest)
          else
            unset COVERAGE_PROCESS_START
            runner=(pytest)
          fi
          uv run --no-project python .github/scripts/shard_durations.py select --durations "baseline/$PYTHON_VERSION.json" \
            --shards "$SPLITS" --shard "$SHARD" --exclude tests/durable_exec > "$POSTGRES_PILOT_EVIDENCE/shard-args.txt"
          mapfile -t shard_args < "$POSTGRES_PILOT_EVIDENCE/shard-args.txt"
          read -ra test_paths <<< "$TEST_PATHS"
          uv run --all-packages --all-extras --no-extra mcp-tasks "${runner[@]}" --durations=100 -n logical --dist=loadgroup \
            -p postgres_pilot_plugin --ignore=tests/durable_exec -m "not temporal" "${shard_args[@]}" "${test_paths[@]}" \
            --store-durations --clean-durations --durations-path "$POSTGRES_PILOT_EVIDENCE/test-durations.json" \
            2>&1 | tee "$POSTGRES_PILOT_EVIDENCE/tests.log"
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage/.coverage.pilot
      - name: preserve missing-URL skips
        id: smoke
        shell: bash
        if: always() && matrix.python == '3.14' && matrix.shard == 1 && steps.start.outcome == 'success'
        run: |
          env -u ABSURD_TEST_DATABASE_URL -u PGTASK_TEST_DATABASE_URL \
            uv run --all-packages --all-extras --no-extra mcp-tasks coverage run -m pytest --junitxml="$POSTGRES_PILOT_EVIDENCE/missing-url.xml" \
            tests/harness/absurd/test_absurd.py::TestDurability::test_replay_serves_cached_model_response \
            tests/harness/pgtask/test_pgtask.py::TestReplay::test_model_response_served_from_checkpoint \
            2>&1 | tee "$POSTGRES_PILOT_EVIDENCE/missing-url.log"
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage/.coverage.pilot
      - name: record final state and stop PostgreSQL
        if: always() && steps.start.outcome != 'skipped'
        env:
          TEST_EXIT: ${{ steps.tests.outcome == 'success' && '0' || '1' }}
          SMOKE_EXIT: ${{ (steps.smoke.outcome == 'success' || steps.smoke.outcome == 'skipped') && '0' || '1' }}
        run: >-
          uv run --no-sync python .github/scripts/postgres_pilot.py finish
          --directory "$POSTGRES_PILOT_EVIDENCE" --test-exit "$TEST_EXIT" --smoke-exit "$SMOKE_EXIT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: postgres-pilot-${{ matrix.strategy }}-${{ matrix.selection }}-${{ matrix.python }}-${{ matrix.shard }}
          path: ${{ env.POSTGRES_PILOT_EVIDENCE }}
          retention-days: 30
          if-no-files-found: error

  comparison:
    needs: [prepare, trial]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --only-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: postgres-pilot-*
          path: evidence
      - run: uv run --no-sync python .github/scripts/postgres_pilot.py summarize --directory evidence
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: postgres-pilot-comparison
          path: comparison
          retention-days: 30
          if-no-files-found: error
