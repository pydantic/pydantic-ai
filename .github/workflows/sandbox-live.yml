# description: Runs the requested pydantic-ai-harness sandbox providers' live tests against their real services.
name: Sandbox live tests

# Runs each `pydantic-ai-harness` sandbox provider's live tier against the provider's real
# service. Most tests start a billed cloud sandbox, so `sandbox-live-nightly.yml` calls this
# only on its daily schedule or when a maintainer explicitly dispatches it.
#
# Adding a provider adds its name to `PRESENT` and its secret below. Docker is the exception:
# it has no extra or secret, and its live tier runs a second time against Podman in a step of
# its own. Kubernetes and OpenSandbox have no secret either. Kubernetes's steps below first
# create a kind cluster on the runner, with the newest agent-sandbox release and sandboxd from its
# staging `latest-main`; OpenSandbox's tier runs against a server started on this runner's Docker.
#
# There is deliberately no `ref` input: a scheduled or manual caller runs with the cache of
# the branch it started from (usually `main`), and checking out another ref there would run
# untrusted code that can write to that cache.

on:
  workflow_call:
    inputs:
      providers:
        description: "JSON list of provider names, or `all` for every provider in the tree."
        type: string
        required: true
    secrets:
      MODAL_TOKEN_ID:
        required: false
      MODAL_TOKEN_SECRET:
        required: false
      E2B_API_KEY:
        required: false
      SPRITE_TOKEN:
        required: false
      DAYTONA_API_KEY:
        required: false
      BOXD_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  plan:
    name: plan sandbox live tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      providers: ${{ steps.plan.outputs.providers }}
    steps:
      # Resolves `all`, drops repeated names, and rejects a name that is not a provider in
      # the workflow, so the matrix below starts each known provider once.
      - id: plan
        env:
          PRESENT: '["modal", "e2b", "sprites", "daytona", "boxd", "docker", "kubernetes", "opensandbox"]'
          REQUESTED: ${{ inputs.providers }}
        run: |
          providers="$(python3 -c '
          import json, os, sys
          present = json.loads(os.environ["PRESENT"])
          requested = os.environ["REQUESTED"]
          providers = present if requested == "all" else list(dict.fromkeys(json.loads(requested)))
          unknown = [name for name in providers if name not in present]
          if unknown or not providers:
              sys.exit(f"No live tier to run for {requested!r}; providers in this tree: {present}")
          print(json.dumps(providers))
          ')"
          echo "providers=${providers}" >> "$GITHUB_OUTPUT"

  live:
    needs: [plan]
    name: ${{ matrix.provider }} live tests
    runs-on: ubuntu-latest
    # Sandbox creation goes through each provider's control plane; bound a wedged run. Kubernetes
    # also creates its cluster first.
    timeout-minutes: ${{ matrix.provider == 'kubernetes' && 25 || 15 }}
    strategy:
      # One provider's outage must not cancel the others' results.
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(needs.plan.outputs.providers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned rather than the runner image's copies, so the cluster is the one the tests were written against.
      - name: Install kind and kubectl
        if: matrix.provider == 'kubernetes'
        run: |
          curl -fsSLo "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  $RUNNER_TEMP/kind" | sha256sum --check
          curl -fsSLo "$RUNNER_TEMP/kubectl" https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl
          echo "6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f  $RUNNER_TEMP/kubectl" | sha256sum --check
          sudo install "$RUNNER_TEMP/kind" "$RUNNER_TEMP/kubectl" /usr/local/bin/
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Create the kind cluster
        if: matrix.provider == 'kubernetes'
        run: tests/harness/kubernetes_sandbox/cluster/up.sh

      # kind's pods are reachable from the host once their range routes through the node's
      # container; the in-cluster connection tests need that.
      - name: Route the pod network
        if: matrix.provider == 'kubernetes'
        run: |
          node=pydantic-ai-live-control-plane
          sudo ip route add "$(kubectl get node "$node" -o jsonpath='{.spec.podCIDR}')" \
            via "$(docker inspect -f '{{.NetworkSettings.Networks.kind.IPAddress}}' "$node")"
          echo KUBERNETES_POD_NETWORK=1 >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: sandbox-${{ matrix.provider }}

      # The provider SDK is an extra of the `pydantic-ai-harness` workspace member, so
      # `--package` selects that member and `--group dev` adds the root test tooling. Each
      # cloud provider's guide has a Temporal worker example, which the docs-example test runs;
      # `code-mode` and `coder` are what the provider test modules import at collection.
      # Docker has no extra: it drives the `docker` CLI that GitHub's Ubuntu runners ship with.
      #
      # Kubernetes upgrades its SDK past the lock: agent-sandbox ships breaking changes in patch
      # releases, and users get them with `<2`. The upgrade still honours `exclude-newer`, because
      # the test step below holds every provider's secrets.
      - run: |
          provider_extra=(--extra "$PROVIDER")
          [ "$PROVIDER" != docker ] || provider_extra=()
          resolution=(--locked)
          [ "$PROVIDER" != kubernetes ] || resolution=(--upgrade-package k8s-agent-sandbox)
          uv sync "${resolution[@]}" --package pydantic-ai-harness --group dev \
            "${provider_extra[@]}" --extra temporal --extra code-mode --extra coder
          [ "$PROVIDER" != kubernetes ] || uv pip show k8s-agent-sandbox | grep '^Version'
        env:
          PROVIDER: ${{ matrix.provider }}

      # A local OpenSandbox server on the runner's Docker, without an API key; the backend needs execd
      # 1.1.1 or later, and the server's example config pins an older one.
      - if: matrix.provider == 'opensandbox'
        run: |
          server=(uvx --from opensandbox-server==1.2.0 opensandbox-server)
          "${server[@]}" init-config "$RUNNER_TEMP/sandbox.toml" --example docker
          sed -i 's#^execd_image = .*#execd_image = "opensandbox/execd:release-1.2.0"#' "$RUNNER_TEMP/sandbox.toml"
          OPENSANDBOX_INSECURE_SERVER=YES nohup "${server[@]}" --config "$RUNNER_TEMP/sandbox.toml" \
            > "$RUNNER_TEMP/opensandbox.log" 2>&1 &
          for _ in $(seq 60); do curl -sf http://127.0.0.1:8080/health > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/opensandbox.log"
          exit 1

      # `<NAME>_REQUIRE_LIVE` turns a missing or empty secret into a failure; without it the
      # live tests skip themselves and the job would report green having tested nothing.
      - run: |
          upper="$(printf %s "$PROVIDER" | tr '[:lower:]' '[:upper:]')"
          export "PYDANTIC_AI_HARNESS_${upper}_LIVE=1" "${upper}_REQUIRE_LIVE=1"
          uv run --no-sync pytest -p no:cacheprovider -m "${PROVIDER}_live" "tests/harness/${PROVIDER}_sandbox" -q
        env:
          PROVIDER: ${{ matrix.provider }}
          # Scoped to this step so checkout and setup never see the secrets.
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          SPRITE_TOKEN: ${{ secrets.SPRITE_TOKEN }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          BOXD_API_KEY: ${{ secrets.BOXD_API_KEY }}
          # The server the OpenSandbox step started; other providers ignore it.
          OPEN_SANDBOX_DOMAIN: 127.0.0.1:8080

      # The runners ship Podman too, which `DockerSandbox` supports through `executable='podman'`.
      - if: matrix.provider == 'docker'
        run: uv run --no-sync pytest -p no:cacheprovider -m docker_live tests/harness/docker_sandbox -q
        env:
          PYDANTIC_AI_HARNESS_DOCKER_LIVE: "1"
          DOCKER_REQUIRE_LIVE: "1"
          PYDANTIC_AI_HARNESS_DOCKER_EXECUTABLE: podman
