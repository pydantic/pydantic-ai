name: Deploy learning roadmap to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - learning-roadmap.html
      - hero.jpg
      - logo.svg
      - .github/workflows/roadmap-pages.yml
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp learning-roadmap.html _site/index.html
          cp hero.jpg _site/hero.jpg
          cp logo.svg _site/logo.svg
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
