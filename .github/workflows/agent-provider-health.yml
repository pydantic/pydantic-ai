name: Agent Provider Health

on:
  # zizmor: ignore[dangerous-triggers] -- workflow_run only handles allowlisted agent artifacts;
  # it checks out the default-branch controller, parses artifacts as data, and receives no MiniMax key.
  workflow_run:
    workflows:
      - Pydantic AI Attention Triage
      - Pydantic AI Bug Hunter
      - Pydantic AI Community Demand
      - Pydantic AI Docs Drift
      - Pydantic AI Feature Digest
      - CI Review
      - Pydantic AI Provider Mapping Sweep
      - Pydantic AI Provider Parity Explore
      - Pydantic AI Regression Detector
      - Pydantic AI Round-Trip Sweep
      - Pydantic AI Stale Issues Finder
      - Pydantic AI Streaming Resilience Sweep
      - Pydantic AI UI Security Review
    types: [completed]
  schedule:
    - cron: '13 */6 * * *'
  workflow_dispatch:
    inputs:
      recover_issue:
        description: Incident issue number to verify before recovery
        required: true
        type: number

permissions: {}

concurrency:
  group: agent-provider-health-reconciliation
  cancel-in-progress: false
  queue: max

jobs:
  monitor:
    if: github.repository == 'pydantic/pydantic-ai' && github.ref != 'refs/heads/codex/glm-workflow-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYDANTIC_AI_RUN_ATTEMPT: ${{ github.run_attempt }}
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out trusted provider-health controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts/agent_provider_health.py
          sparse-checkout-cone-mode: false
      - name: Download provider-health decision
        if: github.event_name == 'workflow_run'
        id: health-artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provider-health
          path: provider-health
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Download terminal agent result
        if: github.event_name == 'workflow_run'
        id: agent-artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent
          path: agent
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Represent a blocked or missing agent artifact
        if: github.event_name == 'workflow_run' && steps.agent-artifact.outcome != 'success'
        run: |
          mkdir -p agent
          : > agent/agent-stdio.log
      - name: Reconcile completed agent workflow
        if: github.event_name == 'workflow_run' && steps.health-artifact.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: >-
          python3 .github/scripts/agent_provider_health.py monitor
          --repository "$GITHUB_REPOSITORY"
          --run-id "$RUN_ID"
          --run-attempt "$RUN_ATTEMPT"
          --conclusion "$CONCLUSION"
          --health-artifact provider-health/provider-health.json
          --agent-artifact agent/agent-stdio.log
      - name: Check quota and recover known elapsed provider windows
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }} # zizmor: ignore[secrets-outside-env] -- scheduled quota recovery only; workflow_run receives no MiniMax key.
          MINIMAX_QUOTA_RESOURCE: ${{ vars.MINIMAX_QUOTA_RESOURCE }}
        run: python3 .github/scripts/agent_provider_health.py monitor --repository "$GITHUB_REPOSITORY"
      - name: Verify requested incident recovery
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }} # zizmor: ignore[secrets-outside-env] -- requested recovery only; workflow_run receives no MiniMax key.
          MINIMAX_QUOTA_RESOURCE: ${{ vars.MINIMAX_QUOTA_RESOURCE }}
          ISSUE_NUMBER: ${{ inputs.recover_issue }}
        run: >-
          python3 .github/scripts/agent_provider_health.py monitor
          --repository "$GITHUB_REPOSITORY"
          --recover-issue "$ISSUE_NUMBER"

  quota-probe:
    if: ${{ github.repository == 'pydantic/pydantic-ai' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/glm-workflow-validation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check out the trusted repository revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-suffix: lint
      - name: Install dependencies
        run: uv sync --frozen --all-extras --no-extra mcp-tasks --all-packages --group lint
      - name: Check quota and active incidents
        id: health
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          PYDANTIC_AI_TASK_KEY: ${{ github.workflow }}:${{ github.event_name }}:${{ github.ref_name }}:${{ github.sha }}:${{ github.run_id }}
          PYDANTIC_AI_TRIGGER_EVENT: ${{ github.event_name }}
          PYDANTIC_AI_RUN_ATTEMPT: ${{ github.run_attempt }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }} # zizmor: ignore[secrets-outside-env] -- scoped to the read-only health check step only.
        run: |
          mkdir -p provider-health
          python3 .github/scripts/agent_provider_health.py check --output provider-health/provider-health.json
          python3 -c "import json; from pathlib import Path; health = json.loads(Path('provider-health/provider-health.json').read_text()); assert health['ready'] is True, health.get('reason', 'provider is not ready')"
      - name: Diagnose Z.ai quota response safely
        if: ${{ !cancelled() && steps.health.outcome == 'failure' }}
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }} # zizmor: ignore[secrets-outside-env] -- scoped to the read-only quota diagnostic step only.
        run: |
          python3 - <<'PY'
          import json
          import math
          import os
          import sys
          from urllib.error import HTTPError
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          api_key = os.environ.get('ZAI_API_KEY', '')

          def emit(field: str, value: object) -> None:
              rendered = str(value)
              if api_key:
                  rendered = rendered.replace(api_key, '[REDACTED]')
              print(f'{field}={rendered}')

          def safe_type(value: object) -> str:
              value_type = type(value)
              if value is None:
                  return 'null'
              if value_type in (bool, int, float, str, list, dict):
                  return value_type.__name__
              return 'other'

          def safe_number(value: object) -> int | float | None:
              if isinstance(value, bool):
                  return None
              if isinstance(value, int) and abs(value) <= 1_000_000_000_000:
                  return value
              if isinstance(value, float) and math.isfinite(value) and abs(value) <= 1_000_000_000_000:
                  return value
              return None

          if not api_key:
              emit('request_error', 'missing_api_key')
              sys.exit(1)

          request = Request(
              'https://api.z.ai/api/monitor/usage/quota/limit',
              headers={'Authorization': api_key, 'Accept': 'application/json'},
              method='GET',
          )
          request.redirect_dict = {}
          redirect_handler = HTTPRedirectHandler()
          redirect_handler.max_redirections = 0
          try:
              with build_opener(redirect_handler).open(request, timeout=20) as response:
                  status = response.status
                  body = response.read(1_000_001)
          except HTTPError as error:
              emit('request_error', type(error).__name__)
              emit('http_status', safe_number(error.code) or 'unknown')
              sys.exit(1)
          except Exception as error:
              emit('request_error', type(error).__name__)
              sys.exit(1)

          emit('http_status', safe_number(status) or 'unknown')
          if not isinstance(status, int) or isinstance(status, bool) or not 200 <= status < 300:
              sys.exit(1)
          if len(body) > 1_000_000:
              emit('json_parse', 'size_limit')
              sys.exit(1)

          try:
              payload = json.loads(body)
          except (UnicodeDecodeError, json.JSONDecodeError, ValueError):
              emit('json_parse', 'failed')
              sys.exit(1)

          if not isinstance(payload, dict):
              emit('envelope_type', safe_type(payload))
              sys.exit(1)

          code = safe_number(payload.get('code'))
          emit('envelope_code', code if code is not None else 'unknown')
          success = payload.get('success')
          emit('envelope_success', success if isinstance(success, bool) else 'unknown')

          data = payload.get('data')
          limits = data.get('limits') if isinstance(data, dict) else None
          if not isinstance(limits, list):
              emit('limits_type', safe_type(limits) if limits is not None else 'missing')
              sys.exit(0)

          emit('window_count', len(limits))
          known_window_types = {'TOKENS_LIMIT', 'CREDIT_LIMIT', 'TIME_LIMIT'}
          for row in limits[:20]:
              if not isinstance(row, dict):
                  emit('window_type', 'unknown')
                  emit('window_unit', 'unknown')
                  emit('window_number', 'unknown')
                  emit('window_percentage', 'unknown')
                  emit('next_reset_time_presence', 'absent')
                  emit('next_reset_time_type', 'unknown')
                  continue

              window_type = row.get('type')
              if isinstance(window_type, str) and window_type in known_window_types:
                  emit('window_type', window_type)
              else:
                  emit('window_type', 'unknown')
              for source, target in (('unit', 'window_unit'), ('number', 'window_number')):
                  value = safe_number(row.get(source))
                  emit(target, value if value is not None else 'unknown')
              percentage = safe_number(row.get('percentage'))
              if percentage is not None and 0 <= percentage <= 100:
                  emit('window_percentage', percentage)
              else:
                  emit('window_percentage', 'unknown')

              if 'nextResetTime' not in row:
                  emit('next_reset_time_presence', 'absent')
                  emit('next_reset_time_type', 'missing')
              else:
                  reset_time = row['nextResetTime']
                  emit('next_reset_time_presence', 'present')
                  emit('next_reset_time_type', safe_type(reset_time))
                  if isinstance(reset_time, int) and not isinstance(reset_time, bool):
                      emit('next_reset_time_value', reset_time)
          PY
      - name: Verify the Z.ai x-api-key request path
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }} # zizmor: ignore[secrets-outside-env] -- scoped to this live SDK request only.
          UV_NO_SYNC: "1"
        run: |
          test -n "$ZAI_API_KEY"
          uv run python - <<'PY'
          import asyncio
          import os

          from anthropic import APIStatusError, AsyncAnthropic
          from pydantic_ai import Agent
          from pydantic_ai.exceptions import ModelHTTPError
          from pydantic_ai.models.anthropic import AnthropicModel
          from pydantic_ai.providers.anthropic import AnthropicProvider

          stage = 'construct_client'

          async def main() -> None:
              global stage
              async with AsyncAnthropic(
                  api_key=os.environ['ZAI_API_KEY'], base_url='https://api.z.ai/api/anthropic'
              ) as client:
                  stage = 'check_auth_headers'
                  auth_headers = {header.lower() for header in client.auth_headers}
                  print(f'auth_header_names={",".join(sorted(auth_headers))}')
                  assert 'x-api-key' in auth_headers
                  assert 'authorization' not in auth_headers
                  model = AnthropicModel('glm-5.3-flash', provider=AnthropicProvider(anthropic_client=client))
                  stage = 'run_model'
                  result = await Agent(model).run('Reply with OK.')
                  stage = 'check_usage'
                  usage = result.usage
                  assert result.output.strip()
                  assert usage.input_tokens > 0
                  assert usage.output_tokens > 0

          try:
              asyncio.run(main())
          except Exception as exc:
              print(f'header_probe=failed stage={stage} error_type={type(exc).__name__}')
              if isinstance(exc, ModelHTTPError):
                  print(f'provider_http_status={exc.status_code}')
                  body = exc.body
                  error_body = body.get('error') if isinstance(body, dict) else None
                  code = error_body.get('code') if isinstance(error_body, dict) else None
                  if isinstance(code, str) and code.isdecimal():
                      print(f'provider_error_code={code}')
                  elif isinstance(code, int) and not isinstance(code, bool):
                      print(f'provider_error_code={code}')
              elif isinstance(exc, APIStatusError):
                  print(f'provider_http_status={exc.status_code}')
              raise SystemExit(1) from None

          print('header_probe=passed model=glm-5.3-flash header_type=x-api-key')
          PY
      - name: Verify the live GLM runner
        if: ${{ !cancelled() && steps.health.outcome == 'success' }}
        env:
          GH_AW_SHIM_LIVE_API_KEY: ${{ secrets.ZAI_API_KEY }} # zizmor: ignore[secrets-outside-env] -- scoped to this live endpoint test only.
          GH_AW_SHIM_LIVE_BASE_URL: https://api.z.ai/api/anthropic
          GH_AW_SHIM_LIVE_MODEL: glm-5.3-flash
          UV_NO_SYNC: "1"
        run: |
          test -n "$GH_AW_SHIM_LIVE_API_KEY"
          uv run pytest .github/scripts/test_pydantic_ai_runner.py::test_live_anthropic_compatible_endpoint --show-capture=no --tb=short
