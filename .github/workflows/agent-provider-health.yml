name: Agent Provider Health

on:
  # zizmor: ignore[dangerous-triggers] -- workflow_run only handles allowlisted agent artifacts;
  # it checks out the default-branch controller, parses artifacts as data, and receives no MiniMax key.
  workflow_run:
    workflows:
      - Pydantic AI Attention Triage
      - Pydantic AI Bug Hunter
      - Pydantic AI Community Demand
      - Pydantic AI Docs Drift
      - Pydantic AI Feature Digest
      - CI Review
      - Pydantic AI Provider Mapping Sweep
      - Pydantic AI Provider Parity Explore
      - Pydantic AI Regression Detector
      - Pydantic AI Round-Trip Sweep
      - Pydantic AI Stale Issues Finder
      - Pydantic AI Streaming Resilience Sweep
      - Pydantic AI UI Security Review
    types: [completed]
  schedule:
    - cron: '13 */6 * * *'
  workflow_dispatch:
    inputs:
      recover_issue:
        description: Incident issue number to verify before recovery
        required: true
        type: number

permissions: {}

concurrency:
  group: agent-provider-health-reconciliation
  cancel-in-progress: false
  queue: max

jobs:
  monitor:
    if: github.repository == 'pydantic/pydantic-ai' && github.ref != 'refs/heads/codex/glm-workflow-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYDANTIC_AI_RUN_ATTEMPT: ${{ github.run_attempt }}
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out trusted provider-health controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts/agent_provider_health.py
          sparse-checkout-cone-mode: false
      - name: Download provider-health decision
        if: github.event_name == 'workflow_run'
        id: health-artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provider-health
          path: provider-health
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Download terminal agent result
        if: github.event_name == 'workflow_run'
        id: agent-artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent
          path: agent
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Represent a blocked or missing agent artifact
        if: github.event_name == 'workflow_run' && steps.agent-artifact.outcome != 'success'
        run: |
          mkdir -p agent
          : > agent/agent-stdio.log
      - name: Reconcile completed agent workflow
        if: github.event_name == 'workflow_run' && steps.health-artifact.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: >-
          python3 .github/scripts/agent_provider_health.py monitor
          --repository "$GITHUB_REPOSITORY"
          --run-id "$RUN_ID"
          --run-attempt "$RUN_ATTEMPT"
          --conclusion "$CONCLUSION"
          --health-artifact provider-health/provider-health.json
          --agent-artifact agent/agent-stdio.log
      - name: Check quota and recover known elapsed provider windows
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }} # zizmor: ignore[secrets-outside-env] -- scheduled quota recovery only; workflow_run receives no MiniMax key.
          MINIMAX_QUOTA_RESOURCE: ${{ vars.MINIMAX_QUOTA_RESOURCE }}
        run: python3 .github/scripts/agent_provider_health.py monitor --repository "$GITHUB_REPOSITORY"
      - name: Verify requested incident recovery
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }} # zizmor: ignore[secrets-outside-env] -- requested recovery only; workflow_run receives no MiniMax key.
          MINIMAX_QUOTA_RESOURCE: ${{ vars.MINIMAX_QUOTA_RESOURCE }}
          ISSUE_NUMBER: ${{ inputs.recover_issue }}
        run: >-
          python3 .github/scripts/agent_provider_health.py monitor
          --repository "$GITHUB_REPOSITORY"
          --recover-issue "$ISSUE_NUMBER"

  quota-probe:
    if: ${{ github.repository == 'pydantic/pydantic-ai' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/glm-workflow-validation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the trusted repository revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Inspect quota fields
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }} # zizmor: ignore[secrets-outside-env] -- scoped to the quota probe step only.
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          api_key = os.environ.get('ZAI_API_KEY', '')
          if not api_key:
              print('request_error=missing_api_key')
              sys.exit(1)

          request = Request(
              'https://api.z.ai/api/monitor/usage/quota/limit',
              headers={'Authorization': api_key},
              method='GET',
          )
          try:
              with urlopen(request, timeout=30) as response:
                  status = response.status
                  body = response.read()
          except HTTPError as error:
              status = error.code
              body = error.read()
          except Exception as error:
              print(f'request_error={type(error).__name__}')
              sys.exit(1)

          print(f'http_status={status}')
          try:
              payload = json.loads(body)
          except (UnicodeDecodeError, json.JSONDecodeError):
              print('json_parse=failed')
              sys.exit(1)

          def safe_value(value: object) -> object:
              if isinstance(value, str):
                  return value.replace(api_key, '[REDACTED]')[:100]
              if isinstance(value, (int, float, bool)) or value is None:
                  return value
              return None

          if not isinstance(payload, dict):
              print(f'envelope_type={type(payload).__name__}')
              sys.exit(1)

          print(f'top_level_fields={sorted(payload)}')
          for field in ('code', 'success'):
              if field in payload:
                  print(f'envelope_{field}={safe_value(payload[field])!r}')

          data = payload.get('data')
          if isinstance(data, dict):
              print(f'data_fields={sorted(data)}')
          elif isinstance(data, list):
              data_fields = sorted({key for row in data if isinstance(row, dict) for key in row})
              print(f'data_fields={data_fields}')
          else:
              print(f'data_type={type(data).__name__}')

          safe_names = {
              'type', 'unit', 'number', 'percentage', 'usage', 'currentvalue',
              'total', 'used', 'remaining', 'limit',
          }

          def is_safe_field(name: str) -> bool:
              normalized = re.sub(r'[^a-z0-9]', '', name.lower())
              return normalized in safe_names or any(
                  part in normalized for part in ('reset', 'timestamp', 'period', 'interval', 'window')
              )

          rows: list[dict[str, object]] = []

          def collect_rows(value: object, depth: int = 0) -> None:
              if depth > 5:
                  return
              if isinstance(value, dict):
                  if any(is_safe_field(key) for key in value):
                      rows.append(value)
                  for child in value.values():
                      collect_rows(child, depth + 1)
              elif isinstance(value, list):
                  for child in value[:20]:
                      collect_rows(child, depth + 1)

          collect_rows(data)
          print(f'quota_row_count={len(rows)}')
          for index, row in enumerate(rows[:20], start=1):
              fields = sorted(row)
              safe_values = {
                  key: safe_value(value)
                  for key, value in row.items()
                  if is_safe_field(key) and isinstance(value, (str, int, float, bool))
              }
              print(f'quota_row={index} fields={fields} safe_values={safe_values}')

          if not 200 <= status < 300:
              sys.exit(1)
          PY
