name: '@claude'

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions: {}

env:
  UV_PYTHON: 3.13
  UV_FROZEN: "1"

jobs:
  get-pr-info:
    permissions:
      contents: read
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association ||
        github.event.review.author_association ||
        github.event.issue.author_association)
    runs-on: ubuntu-latest
    outputs:
      is_fork: ${{ steps.pr-info.outputs.is_fork }}
      pr_head_repo: ${{ steps.pr-info.outputs.pr_head_repo }}
      pr_head_sha: ${{ steps.pr-info.outputs.pr_head_sha }}
      pr_base_sha: ${{ steps.pr-info.outputs.pr_base_sha }}
      pr_author_permission: ${{ steps.pr-info.outputs.pr_author_permission }}
    steps:
      - name: Get PR info
        if: github.event.issue.pull_request || github.event.pull_request
        id: pr-info
        # Review events record the commit the reviewer was looking at, so pin to
        # it rather than the live PR head, which the author may have moved since.
        # issue_comment events carry no commit, so they fall back to the live
        # head and at-claude-fork checks it against the comment time.
        run: |
          PR_NUMBER=${{ github.event.pull_request.number || github.event.issue.number }}
          PR_DATA=$(gh api repos/${{ github.repository }}/pulls/${PR_NUMBER})
          case "$EVENT_NAME" in
            pull_request_review | pull_request_review_comment)
              if [[ -z "$EVENT_COMMIT_ID" ]]; then
                echo "::error::${EVENT_NAME} event has no commit_id; refusing to fall back to the live PR head."
                exit 1
              fi
              HEAD_SHA="$EVENT_COMMIT_ID"
              ;;
            *)
              HEAD_SHA=$(echo "$PR_DATA" | jq -r '.head.sha')
              ;;
          esac
          echo "pr_head_repo=$(echo "$PR_DATA" | jq -r '.head.repo.full_name')" >> $GITHUB_OUTPUT
          echo "pr_head_sha=${HEAD_SHA}" >> $GITHUB_OUTPUT
          echo "pr_base_sha=$(echo "$PR_DATA" | jq -r '.base.sha')" >> $GITHUB_OUTPUT
          echo "is_fork=$(echo "$PR_DATA" | jq -r '.head.repo.fork')" >> $GITHUB_OUTPUT
          PR_AUTHOR=$(echo "$PR_DATA" | jq -r '.user.login')
          PR_AUTHOR_PERMISSION=$(gh api "repos/${{ github.repository }}/collaborators/${PR_AUTHOR}/permission" --jq '.permission' 2>/dev/null || echo "unknown")
          echo "pr_author_permission=${PR_AUTHOR_PERMISSION}" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_COMMIT_ID: ${{ github.event.review.commit_id || github.event.comment.commit_id }}

  at-claude:
    needs: get-pr-info
    if: needs.get-pr-info.outputs.is_fork != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-suffix: claude-code

      - run: uv tool install pre-commit

      - run: make install

      - name: Install bubblewrap
        run: sudo apt-get install -y bubblewrap

      - uses: anthropics/claude-code-action@428971d2ecd6e3a7cb0ee0da2a3a8b33fdb3678d # v1.0.157
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh pr list:*),Bash(gh pr create:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh run view:*),Bash(gh run list:*),Bash(git log:*),Bash(git diff:*),Bash(git grep:*),Bash(git show:*),Bash(git status:*),Bash(git add:*),Bash(git checkout:*),Bash(git commit:*),Bash(git push:*),Bash(rg:*),Bash(ls:*),Bash(tree:*),Bash(grep:*),Bash(uv run:*),Bash(make:*)"

  at-claude-fork:
    needs: get-pr-info
    if: needs.get-pr-info.outputs.is_fork == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Least privilege: on forks Claude may only read code and comment (see the
    # restricted --allowedTools below — no push / pr create), so this job runs
    # with read-only `contents` and passes this job's token to the action (see
    # `github_token` below). It never gets write access to repository code.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Reject commits newer than the @claude comment
        # issue_comment events carry no commit SHA, so get-pr-info reads the PR
        # head after the comment was posted. If the author pushed in between,
        # Claude would run on code the maintainer never saw (TOCTOU). The
        # committer date is set by the author, so this narrows the race rather
        # than closing it; the read-only permissions and tool allowlist below
        # remain the real boundary. Every lookup and conversion is a standalone
        # assignment so a failure stops the job instead of passing the check.
        if: github.event_name == 'issue_comment'
        run: |
          commit_at=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}" --jq '.commit.committer.date')
          if [[ -z "$commit_at" || -z "$COMMENT_AT" ]]; then
            echo "::error::Could not read the commit or comment time; refusing to run."
            exit 1
          fi
          commit_ts=$(date -d "$commit_at" +%s)
          comment_ts=$(date -d "$COMMENT_AT" +%s)
          if (( commit_ts >= comment_ts )); then
            echo "::error::PR head changed after the @claude comment; comment again to run on the new code."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ needs.get-pr-info.outputs.pr_head_sha }}
          COMMENT_AT: ${{ github.event.comment.created_at }}

      - name: Checkout fork repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ needs.get-pr-info.outputs.pr_head_repo }}
          ref: ${{ needs.get-pr-info.outputs.pr_head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check for modified config files
        # Maintainers are trusted to change agent config in their own PRs. Use
        # their actual repository permission rather than `author_association`,
        # which can report `CONTRIBUTOR` for maintainers with private org
        # membership. The API's `.permission` maps maintain and custom roles onto
        # their stable base access level.
        #
        # Compare the exact immutable SHAs captured in get-pr-info (and checked
        # out above) rather than the live PR head. Using `gh pr diff` would read
        # whatever the PR points at now, so a force-push after get-pr-info could
        # slip a modified CLAUDE.md/AGENTS.md past this guard while different
        # code is what actually runs (TOCTOU). Pinning to BASE_SHA...HEAD_SHA
        # ties the check to the code Claude will see.
        #
        # Use the diff media type, not the compare JSON: the JSON `.files` array
        # is capped at 300 entries (and `--paginate` only pages commits, not
        # files), so a >300-file PR could hide an agent-config edit. The diff
        # emits a `diff --git a/<old> b/<new>` header for every changed file,
        # including renames, so matching those lines cannot miss a path.
        #
        # The same pinned diff is saved for Claude, since `gh pr diff` would show
        # the live PR rather than the checked-out commit.
        run: |
          gh api "repos/${{ github.repository }}/compare/${BASE_SHA}...${HEAD_SHA}" -H 'Accept: application/vnd.github.v3.diff' > "$RUNNER_TEMP/pr.diff"

          case "$AUTHOR_PERMISSION" in
            write | admin)
              echo "PR author has ${AUTHOR_PERMISSION} access; skipping agent-config guard."
              exit 0
              ;;
          esac

          CHANGED=$(grep '^diff --git ' "$RUNNER_TEMP/pr.diff" || true)
          if echo "$CHANGED" | grep -qiE '/(AGENTS\.md|CLAUDE\.md)( |$)|/\.claude/'; then
            echo "::error::PR modifies agent config files (AGENTS.md, CLAUDE.md, or .claude/). Skipping for security."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ needs.get-pr-info.outputs.pr_base_sha }}
          HEAD_SHA: ${{ needs.get-pr-info.outputs.pr_head_sha }}
          AUTHOR_PERMISSION: ${{ needs.get-pr-info.outputs.pr_author_permission }}

      - name: Install bubblewrap
        run: sudo apt-get install -y bubblewrap

      # Passing `prompt` puts the action in agent mode. In tag mode (an @claude
      # mention with no prompt) it fetches the live `pull/<N>/head` and checks
      # it out, replacing the pinned commit above; agent mode leaves the
      # checkout alone, so Claude reads exactly the commit checked above.
      #
      # `github_token` makes the action use this job's read-only token instead
      # of exchanging OIDC for its App token, which always requests
      # `contents: write`. `--setting-sources user` skips the repo's
      # `.claude/settings.json`, whose allow list (`make`, `uv run`, ...) is
      # meant for trusted branches (it also skips the repo CLAUDE.md), and
      # `--disallowedTools` denies those commands even if a settings source
      # allows them. `rg` is denied because `rg --pre <cmd>` runs a command;
      # the built-in Grep tool covers searching.
      - uses: anthropics/claude-code-action@428971d2ecd6e3a7cb0ee0da2a3a8b33fdb3678d # v1.0.157
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You were mentioned with @claude on pull request #${{ github.event.pull_request.number || github.event.issue.number }} in ${{ github.repository }}, which comes from a fork.

            The working directory is the PR's code at commit ${{ needs.get-pr-info.outputs.pr_head_sha }}. The PR's full diff against its base at that commit is saved at ${{ runner.temp }}/pr.diff; use it instead of `gh pr diff`, which would show later pushes you were not asked about. Use `gh pr view` for the description and discussion.

            You can read code and comment, but you cannot push or change the repository. Reply with `gh pr comment`, or with inline review comments that pass `commit_id: ${{ needs.get-pr-info.outputs.pr_head_sha }}` so they attach to the code you read.

            The request${{ github.event.comment.path && format(' (an inline review comment on `{0}` line {1})', github.event.comment.path, github.event.comment.line || github.event.comment.original_line) || '' }}:

            ${{ github.event.comment.body || github.event.review.body }}
          claude_args: |
            --setting-sources user
            --disallowedTools "Bash(make:*),Bash(uv:*),Bash(rg:*),Bash(gh pr diff:*)"
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh run view:*),Bash(gh run list:*),Bash(git log:*),Bash(git diff:*),Bash(git grep:*),Bash(git show:*),Bash(git status:*),Bash(ls:*),Bash(tree:*),Bash(grep:*)"
