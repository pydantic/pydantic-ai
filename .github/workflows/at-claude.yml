name: '@claude'

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions: {}

env:
  UV_PYTHON: 3.13
  UV_FROZEN: "1"

jobs:
  get-pr-info:
    permissions:
      contents: read
    if: |
      (
        (github.event_name == 'issue_comment' && !contains(github.event.issue.labels.*.name, 'pydanty:meta') &&
          contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && !contains(github.event.issue.labels.*.name, 'pydanty:meta') &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association ||
        github.event.review.author_association ||
        github.event.issue.author_association)
    runs-on: ubuntu-latest
    outputs:
      is_fork: ${{ steps.pr-info.outputs.is_fork }}
      pr_head_sha: ${{ steps.pr-info.outputs.pr_head_sha }}
      pr_base_sha: ${{ steps.pr-info.outputs.pr_base_sha }}
      pr_author_permission: ${{ steps.pr-info.outputs.pr_author_permission }}
    steps:
      - name: Get PR info
        if: github.event.issue.pull_request || github.event.pull_request
        id: pr-info
        run: |
          PR_NUMBER=${{ github.event.pull_request.number || github.event.issue.number }}
          PR_DATA=$(gh api repos/${{ github.repository }}/pulls/${PR_NUMBER})
          echo "pr_head_sha=$(echo "$PR_DATA" | jq -r '.head.sha')" >> $GITHUB_OUTPUT
          echo "pr_base_sha=$(echo "$PR_DATA" | jq -r '.base.sha')" >> $GITHUB_OUTPUT
          echo "is_fork=$(echo "$PR_DATA" | jq -r '.head.repo.fork')" >> $GITHUB_OUTPUT
          PR_AUTHOR=$(echo "$PR_DATA" | jq -r '.user.login')
          PR_AUTHOR_PERMISSION=$(gh api "repos/${{ github.repository }}/collaborators/${PR_AUTHOR}/permission" --jq '.permission' 2>/dev/null || echo "unknown")
          echo "pr_author_permission=${PR_AUTHOR_PERMISSION}" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  at-claude:
    needs: get-pr-info
    if: needs.get-pr-info.outputs.is_fork != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-suffix: claude-code

      - run: uv tool install pre-commit

      - run: make install

      - name: Install bubblewrap
        run: sudo apt-get install -y bubblewrap

      - uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh pr list:*),Bash(gh pr create:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh run view:*),Bash(gh run list:*),Bash(git log:*),Bash(git diff:*),Bash(git grep:*),Bash(git show:*),Bash(git status:*),Bash(git add:*),Bash(git checkout:*),Bash(git commit:*),Bash(git push:*),Bash(rg:*),Bash(ls:*),Bash(tree:*),Bash(grep:*),Bash(uv run:*),Bash(make:*)"

  at-claude-fork:
    needs: get-pr-info
    if: needs.get-pr-info.outputs.is_fork == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Least privilege: on forks Claude may only read code and comment (see the
    # restricted --allowedTools below — no push / pr create), so this job runs
    # with read-only `contents` and passes this job's token to the action (see
    # `github_token` below). It never gets write access to repository code.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      # Check out this repository, same as the job above. claude-code-action
      # fetches the PR head itself (via `refs/pull/<n>/head`, which works for
      # forks) and switches to it before starting Claude.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Review events would otherwise check out the PR's merge ref, which
          # doesn't exist while the PR has conflicts.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      # The action fetches the PR into a local branch named after the fork's
      # branch, which git refuses while a branch of that name exists here, so a
      # fork PR from `main` would fail. Leave no local branch behind.
      - name: Drop local branch
        run: |
          branch=$(git branch --show-current)
          git checkout --detach
          if [ -n "$branch" ]; then git branch -D "$branch"; fi

      - name: Check for modified config files
        # Maintainers are trusted to change agent config in their own PRs. Use
        # their actual repository permission rather than `author_association`,
        # which can report `CONTRIBUTOR` for maintainers with private org
        # membership. The API's `.permission` maps maintain and custom roles onto
        # their stable base access level.
        #
        # Compare the exact immutable SHAs captured in get-pr-info rather than
        # the live PR head. Using `gh pr diff` would read whatever the PR points
        # at now, so a force-push after get-pr-info could slip a modified
        # CLAUDE.md/AGENTS.md past this guard while different code is what
        # actually runs (TOCTOU).
        #
        # Use the diff media type, not the compare JSON: the JSON `.files` array
        # is capped at 300 entries (and `--paginate` only pages commits, not
        # files), so a >300-file PR could hide an agent-config edit. The diff
        # emits a `diff --git a/<old> b/<new>` header for every changed file,
        # including renames, so matching those lines cannot miss a path.
        run: |
          case "$AUTHOR_PERMISSION" in
            write | admin)
              echo "PR author has ${AUTHOR_PERMISSION} access; skipping agent-config guard."
              exit 0
              ;;
          esac

          CHANGED=$(gh api "repos/${{ github.repository }}/compare/${BASE_SHA}...${HEAD_SHA}" -H 'Accept: application/vnd.github.v3.diff' | grep '^diff --git ')
          if echo "$CHANGED" | grep -qiE '/(AGENTS\.md|CLAUDE\.md)( |$)|/\.claude/'; then
            echo "::error::PR modifies agent config files (AGENTS.md, CLAUDE.md, or .claude/). Skipping for security."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ needs.get-pr-info.outputs.pr_base_sha }}
          HEAD_SHA: ${{ needs.get-pr-info.outputs.pr_head_sha }}
          AUTHOR_PERMISSION: ${{ needs.get-pr-info.outputs.pr_author_permission }}

      - name: Install bubblewrap
        run: sudo apt-get install -y bubblewrap

      # The action fetches the live `refs/pull/<n>/head`, which can move after
      # the check above ran on HEAD_SHA. This hook only lets local branches and
      # a detached HEAD point at HEAD_SHA, so the action fails instead of
      # running on code the check never saw. HEAD is checked too because the
      # fork's branch name picks the ref the action fetches into, and a name
      # like `tags/x` lands outside `refs/heads/`.
      - name: Pin PR checkout to the checked commit
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Unexpected PR head SHA: $HEAD_SHA"; exit 1; }
          hook="$(git rev-parse --git-path hooks)/reference-transaction"
          cat > "$hook" <<EOF
          #!/bin/sh
          [ "\$1" = prepared ] || exit 0
          while read -r old new ref; do
            case "\$ref:\$new" in
              refs/heads/*:$HEAD_SHA | HEAD:$HEAD_SHA | HEAD:ref:refs/heads/*) ;;
              refs/heads/* | HEAD:*)
                echo "::error::PR head changed after the @claude comment; comment again to run on the new code." >&2
                exit 1
                ;;
            esac
          done
          EOF
          chmod +x "$hook"
        env:
          HEAD_SHA: ${{ needs.get-pr-info.outputs.pr_head_sha }}

      # `github_token` makes the action use this job's token and permissions
      # instead of its App token. This job only reads code and comments, so
      # `--setting-sources user` skips the repo's `.claude/settings.json` (and
      # CLAUDE.md), whose allow list covers building and running the project,
      # and `--disallowedTools` keeps those commands off. Searching uses the
      # built-in Grep tool.
      - uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --setting-sources user
            --disallowedTools "Bash(make:*),Bash(uv:*),Bash(rg:*)"
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh run view:*),Bash(gh run list:*),Bash(git log:*),Bash(git diff:*),Bash(git grep:*),Bash(git show:*),Bash(git status:*),Bash(ls:*),Bash(tree:*),Bash(grep:*)"
