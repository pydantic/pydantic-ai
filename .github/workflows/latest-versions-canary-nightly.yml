# description: Runs the latest-versions canary daily on main and files each new failure signature as a deduplicated issue.
name: Latest Versions Canary Nightly

# The daily run of `latest-versions-canary.yml`, and the job that reports it. The report job lives
# here rather than in the canary because `ci.yml` also calls the canary, granting it only
# `contents: read`, and a called workflow cannot request more than its caller grants.
#
# `.github/scripts/latest_versions_canary_report.py` files one issue per new failure signature,
# labeled `p:1-highest` and `pydanty:triage-issue`, and comments on the issues it filed before.
# Its docstring has the deduplication rules. A manual run of the canary reports nothing; its
# result is on its own page.

on:
  schedule:
    - cron: '23 7 * * *'

permissions:
  contents: read

jobs:
  canary:
    uses: ./.github/workflows/latest-versions-canary.yml

  report:
    needs: [canary]
    # A green run reports too: it is how an issue learns its failure passed. A fork only runs the tests.
    if: ${{ !cancelled() && github.repository == 'pydantic/pydantic-ai' }}
    # Filing lists the open issues and then creates the missing ones, so two reports at once, such as a
    # re-run beside the next night's run, could file one signature twice.
    concurrency:
      group: latest-versions-canary-report
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: latest-versions-canary-*
          path: ${{ runner.temp }}/canary-reports

      - name: Install the typed-boundary dependency
        # The `pydantic` pin and dependency closure every triage-script job shares, with `--no-deps`
        # so pip resolves nothing else: this job holds a write-scoped token, so no new release may
        # reach it.
        run: >-
          python3 -m pip install --quiet 'pydantic==2.13.4'
          'pydantic-core==2.46.4' 'typing-extensions==4.16.0' 'annotated-types==0.7.0' 'typing-inspection==0.4.4'
          --no-deps

      - name: File or update the canary issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANARY_RESULT: ${{ needs.canary.result }}
        run: >-
          python3 .github/scripts/latest_versions_canary_report.py
          --reports "${RUNNER_TEMP}/canary-reports"
          --result "$CANARY_RESULT"
          --tested-at "$(git log -1 --format=%cI)"

  alert:
    needs: [report]
    # A reporter that fails files nothing, so its failure reports privately through the triage Slack webhook.
    if: ${{ !cancelled() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Report canary reporter failure privately
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          errors: true
          payload: '{"text":":rotating_light: Latest versions canary reporter failed: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|inspect the run>"}'
          webhook: ${{ secrets.PYDANTIC_AI_TRIAGE_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
