# description: Verifies the Pydantic recorder with released native Linux AWF capture and final session collection.
name: gh-aw native capture

on:
  pull_request:
    paths:
      - '.github/workflows/gh-aw-native-capture.yml'
      - '.github/scripts/gh_aw_native_capture/**'
      - '.github/scripts/gh_aw_native_capture.py'
      - 'src/pydantic_ai_harness/gh-aw/**'
      - 'tests/harness/gh_aw/**'

permissions:
  contents: read

concurrency:
  group: gh-aw-native-capture-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  native-capture:
    name: gh-aw / native signed capture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Run the released AWF acceptance fixture
        run: python3 .github/scripts/gh_aw_native_capture.py --work-dir "$RUNNER_TEMP/gh-aw-native-capture"

      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gh-aw-native-capture
          path: ${{ runner.temp }}/gh-aw-native-capture/evidence
          if-no-files-found: ignore
          retention-days: 7

  conclusion-roundtrip:
    name: gh-aw / downloaded artifact collection
    needs: native-capture
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gh-aw-native-capture
          path: ${{ runner.temp }}/native-capture-input

      - name: Collect the downloaded native capture artifacts
        run: |
          node .github/scripts/gh_aw_native_capture/collect_downloaded.cjs "$RUNNER_TEMP/native-capture-input" "$RUNNER_TEMP/native-capture-roundtrip"
          node -e 'const r = require(process.argv[1]); if (r.status !== "passed" || r.cases.length !== 3) process.exit(1)' "$RUNNER_TEMP/native-capture-roundtrip/result.json"

      - name: Preserve artifact roundtrip evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gh-aw-native-capture-roundtrip
          path: ${{ runner.temp }}/native-capture-roundtrip
          if-no-files-found: ignore
          retention-days: 7
