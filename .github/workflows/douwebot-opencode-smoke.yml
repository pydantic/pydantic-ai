# Temporary pre-merge test; remove after the real Go-backed run.
name: Douwebot OpenCode smoke
on:
  push:
    branches: [douwebot-opencode-fallback]
permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
jobs:
  smoke:
    if: contains(github.event.head_commit.message, '[douwebot-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: target
        name: Resolve a review target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/12649" > "$RUNNER_TEMP/smoke-pr.json"
          jq -e '.state == "open" and (.head.sha | test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/smoke-pr.json" > /dev/null
          echo "sha=$(jq -r .head.sha "$RUNNER_TEMP/smoke-pr.json")" >> "$GITHUB_OUTPUT"
          echo "repo=$(jq -r .head.repo.full_name "$RUNNER_TEMP/smoke-pr.json")" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.target.outputs.repo }}
          ref: ${{ steps.target.outputs.sha }}
          path: pr-head
          fetch-depth: 0
          persist-credentials: false
      - name: Gather review context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_HEAD_DIR: pr-head
        run: bash scripts/gather-review-context.sh 12649 "$REPO"
      - name: Install OpenCode and validator
        run: |
          sudo apt-get update && sudo apt-get install -y ripgrep
          npm install --global @opencode/cli@2.2.5
          python3 -m pip install --quiet 'pydantic==2.13.4' 'pyyaml==6.0.3'
      - name: Run candidate and verify model metadata
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # zizmor: ignore[secrets-outside-env] -- branch-restricted temporary smoke test.
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import contextlib
          import json
          import os
          import re
          import sqlite3
          import sys
          import tempfile
          from pathlib import Path

          import yaml

          sys.path.insert(0, str(Path('.github/scripts').resolve()))
          import douwebot_opencode_run

          pr = json.loads((Path(os.environ['RUNNER_TEMP']) / 'smoke-pr.json').read_text())
          workflow = yaml.load(Path('.github/workflows/bots.yml').read_text(), Loader=yaml.BaseLoader)
          steps = workflow['jobs']['review']['steps']
          prompt = next(step['with']['prompt'] for step in steps if step.get('id') == 'review')
          values = {
              'github.repository': os.environ['REPO'],
              'github.event.pull_request.number': str(pr['number']),
              'github.event.pull_request.user.login': pr['user']['login'],
              'github.event.pull_request.author_association': pr['author_association'],
              'github.event.pull_request.head.sha': pr['head']['sha'],
          }
          prompt = re.sub(r'\$\{\{\s*(.*?)\s*\}\}', lambda match: values[match.group(1)], prompt)
          os.environ['REVIEW_PROMPT'] = prompt
          captured = Path(tempfile.mkdtemp(dir=os.environ['RUNNER_TEMP'], prefix='douwebot-smoke-'))

          @contextlib.contextmanager
          def retain_temp(**kwargs):
              yield str(captured)

          douwebot_opencode_run.tempfile.TemporaryDirectory = retain_temp
          douwebot_opencode_run.main()
          db = sqlite3.connect(captured / 'data' / 'opencode' / 'opencode.db')
          messages = [json.loads(row[0]) for row in db.execute("SELECT data FROM session_message WHERE type = 'assistant'")]
          if not messages:
              raise ValueError('OpenCode stored no assistant messages')
          models = {(m['model']['providerID'], m['model']['id']) for m in messages}
          if models != {('opencode-go', 'deepseek-v4.1-flash')}:
              raise ValueError(f'Unexpected assistant model metadata: {models}')
          print('Assistant model metadata: opencode-go/deepseek-v4.1-flash')
          PY
      - name: Validate review result
        run: python3 .github/scripts/douwebot_opencode_result.py "$RUNNER_TEMP/douwebot-opencode.ndjson"
