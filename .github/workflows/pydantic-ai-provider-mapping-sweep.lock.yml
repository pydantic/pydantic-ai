name: "Pydantic AI Provider Mapping Sweep"
on:
  schedule:
    - cron: "35 8 * * 1"  # Friendly format: weekly on monday (scattered)
  workflow_dispatch:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (Reserved for Agentic Workflows)."
        required: false
        type: string
      recovery_issue:
        description: Open workflow incident to verify with this run
        required: false
        type: string

# Jobs receive only their explicitly declared permissions.
permissions: {}

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-provider-mapping-sweep

run-name: "Pydantic AI Provider Mapping Sweep"

env:
  PYDANTIC_AI_JOB_TIMEOUT_MINUTES: "30"
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.LOGFIRE_URL || 'https://logfire-api.pydantic.dev' }}
  OTEL_SERVICE_NAME: gh-aw.pydantic-ai-provider-mapping-sweep
  OTEL_RESOURCE_ATTRIBUTES: 'gh-aw.workflow.name=Pydantic%20AI%20Provider%20Mapping%20Sweep,gh-aw.repository=${{ github.repository }},gh-aw.run.id=${{ github.run_id }},github.run_id=${{ github.run_id }},gh-aw.engine.id=pydantic-ai'
  OTEL_EXPORTER_OTLP_HEADERS: Authorization=${{ secrets.LOGFIRE_TOKEN }}
  GH_AW_OTLP_ENDPOINTS: '[{"url":"${{ vars.LOGFIRE_URL || ''https://logfire-api.pydantic.dev'' }}","headers":"Authorization=${{ secrets.LOGFIRE_TOKEN }}"}]'

jobs:
  activation:
    name: activation
    needs:
      - fetch_dynamic_prompt
      - provider_health
    if: needs.provider_health.outputs.ready == 'true'
    runs-on: ubuntu-slim
