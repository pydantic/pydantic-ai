          os.environ['GH_AW_SESSION_CAPTURE_FD'] = str(capture_fd)
          import gh_aw_recording

          target, prompt_file, *cli_args = sys.argv[1:]
          if os.environ.pop('GH_AW_PREWRITTEN_NOOP', '') == '1':
