                          status = part.outcome
                          output = _json_value(part.content)
                          error = None if success else _json_value(part.content)
                          tool_name = part.tool_name
                      data: dict[str, object] = {
                          'toolCallId': part.tool_call_id if native else event.tool_call_id,
