name: Security Review

# Default-branch code reviews each pull request head as data with a read-only model, and
# publishes one `Security Review` commit status on that head. Each check is a config entry in
# `.github/scripts/security_review_checks.py`. `.github/workflows/AGENTS.md` documents the
# trust boundaries, the run label and the acceptance label.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- runs only default-branch code; the head is read as data by a model without write tools
    types: [opened, reopened, synchronize, ready_for_review, edited, labeled]
  # Every head is reviewed before admission; report success on the merge-group SHA.
  merge_group:
    types: [checks_requested]

permissions: {}

concurrency:
  # Unrelated label events and edits that keep the base use their own groups, so they cannot replace a queued review.
  group: security-review-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}${{ ((github.event.action == 'labeled' && github.event.label.name != 'security-review:run' && github.event.label.name != 'security-review:accepted') || (github.event.action == 'edited' && !github.event.changes.base)) && format('-noop-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

jobs:
  gate:
    name: Security Review gate
    if: >-
      github.event_name == 'merge_group'
      || ((github.event.action != 'labeled' || github.event.label.name == 'security-review:run' || github.event.label.name == 'security-review:accepted')
      && (github.event.action != 'edited' || github.event.changes.base))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    outputs:
      review: ${{ steps.gate.outputs.review }}
    steps:
      - name: Checkout trusted default-branch gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/publish_security_review.py
            .github/scripts/pr_gates.py
            .github/scripts/check_api_compatibility.py
          sparse-checkout-cone-mode: false
      - name: Install pinned script dependencies
        run: python3 -m pip install --quiet 'pydantic==2.13.4'
      - name: Decide whether this event reviews the head
        id: gate
        run: python3 .github/scripts/publish_security_review.py gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_SHA: ${{ github.event.merge_group.head_sha }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_SENDER: ${{ github.event.sender.login }}
          EVENT_SENDER_TYPE: ${{ github.event.sender.type }}

  detect:
    name: Security Review checks
    needs: gate
    if: needs.gate.outputs.review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      checks: ${{ steps.select.outputs.checks }}
    steps:
      - name: Checkout trusted default-branch selection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts/security_review_checks.py
          sparse-checkout-cone-mode: false
      # The head is data: git reads its objects, and nothing in it runs.
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - name: Select checks and files
        id: select
        run: |
          set -euo pipefail
          git -C pr-head fetch --no-tags --quiet "https://github.com/${GITHUB_REPOSITORY}.git" "$BASE_SHA"
          matrix=$(python3 -I .github/scripts/security_review_checks.py pr-head "$BASE_SHA" "$HEAD_SHA")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "checks=$(jq -c 'map(.check)' <<< "$matrix")" >> "$GITHUB_OUTPUT"
          echo "Selected: $matrix"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  review:
    name: Security Review (${{ matrix.check }})
    needs: detect
    if: needs.detect.outputs.checks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.job_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    steps:
      - name: Checkout base ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Gather PR context
        run: |
          gh api "repos/${REPO}/contents/scripts/gather-review-context.sh?ref=${BASE_REF}" --jq .content | base64 -d > /tmp/gather-review-context.sh
          bash /tmp/gather-review-context.sh "$PR_NUMBER" "$REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_DIR: pr-head

      - name: Set up OpenCode and review tools
        uses: ./.github/actions/setup-douwebot-tools

      - name: Review with OpenCode Go
        run: |
          export PATH="$RUNNER_TEMP/douwebot-tools/bin:$RUNNER_TEMP/douwebot-tools/opencode/node_modules/.bin:$PATH"
          python3 .github/scripts/security_review_run.py
        env:
          CHECK: ${{ matrix.check }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # zizmor: ignore[secrets-outside-env] -- the default-branch runner hands OpenCode only this key
          TRIAGE_WEBHOOK_URL: ${{ secrets.PYDANTIC_AI_TRIAGE_SLACK_WEBHOOK_URL }} # zizmor: ignore[secrets-outside-env] -- only the default-branch runner reads it; OpenCode never does
          PYTHONPATH: ${{ runner.temp }}/douwebot-tools/python

      # Artifacts on this repository are public; the result holds only publishable fields.
      - name: Upload the publishable result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-review-result-${{ matrix.check }}
          path: ${{ runner.temp }}/security-review-result/${{ matrix.check }}.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Security Review
    needs: [gate, detect, review]
    if: always() && needs.gate.outputs.review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      # A check without a result fails the status, so a failed download fails closed.
      - name: Download review results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: security-review-result-*
          merge-multiple: true
          path: ${{ runner.temp }}/security-review-result
      - name: Checkout trusted default-branch publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/publish_security_review.py
            .github/scripts/pr_gates.py
            .github/scripts/check_api_compatibility.py
          sparse-checkout-cone-mode: false
      - name: Install pinned script dependencies
        run: python3 -m pip install --quiet 'pydantic==2.13.4'
      - name: Publish findings and the final status
        run: python3 .github/scripts/publish_security_review.py publish
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DETECT_RESULT: ${{ needs.detect.result }}
          SECURITY_CHECKS: ${{ needs.detect.outputs.checks }}
          RESULTS_DIR: ${{ runner.temp }}/security-review-result
