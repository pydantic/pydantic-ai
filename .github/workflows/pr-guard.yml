# description: Every 10 minutes, closes non-maintainer pull requests to the default branch that duplicate an open pull request or do not link an assigned open issue.
name: PR Guard

on:
  # A fork pull request's own runs hold a read-only token, so the guard sweeps from the default
  # branch instead. `pr_guard_sweep.py` reacts to the opened, reopened, ready-for-review and edited
  # events since the last successful sweep, so a failed or late sweep loses none within the
  # sweep's three-hour lookback.
  schedule:
    - cron: '3-59/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-guard

jobs:
  guard:
    name: Duplicate & Issue-Link Guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      # A dispatch runs on whichever branch it names, and an app can push `.github/scripts/` to its
      # own branch. Run the default branch's scripts, since they hold write permissions.
      - name: Checkout the guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/pr_guard.sh
            .github/scripts/pr_guard_sweep.py
          sparse-checkout-cone-mode: false
      - name: Install pinned script dependencies
        run: python3 -m pip install --quiet 'pydantic==2.13.4'
      - name: Check the pull requests changed since the last sweep
        run: python3 .github/scripts/pr_guard_sweep.py
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
