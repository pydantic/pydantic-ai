name: CI

on:
  push:
    branches:
      - main
    tags:
      - "**"
  pull_request: {}

env:
  COLUMNS: 150
  UV_PYTHON: 3.12
  UV_FROZEN: "1"
  # Ubuntu's system interpreters are older and slower than uv's optimized managed builds.
  UV_PYTHON_PREFERENCE: only-managed
  # Authenticate the Git fetches uv makes for Git-sourced dependencies. Anonymous HTTPS clones are
  # capped per client IP, and runners that share an egress pool exhaust that budget as a matrix
  # fans out, at which point GitHub answers with a credential challenge that surfaces as
  # `could not read Username for 'https://github.com'` and fails the install before any test runs.
  # `GIT_CONFIG_*` applies to every `uv sync` and implicit `uv run` sync without writing credentials
  # into the checkout, so `actions/checkout`'s `persist-credentials: false` still holds.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: url.https://x-access-token:${{ github.token }}@github.com/.insteadOf
  GIT_CONFIG_VALUE_0: https://github.com/

permissions:
  contents: read

concurrency:
  # PRs: one group per ref so newer pushes cancel superseded in-flight runs.
  # push/tag: one group per run_id so main and tag runs never share a group
  # (avoids GitHub's pending-run cancellation between distinct main commits).
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: classify changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      content_only: ${{ steps.classify.outputs.content_only }}
      docs_changed: ${{ steps.classify.outputs.docs_changed }}
      clai2_only: ${{ steps.classify.outputs.clai2_only }}
      clai2_changed: ${{ steps.classify.outputs.clai2_changed }}
      pyright_changed: ${{ steps.classify.outputs.pyright_changed }}
    steps:
      - name: Classify pull request changes
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Keep classification inline so this token-bearing job never executes PR-authored files.
          run_all_checks() {
            echo 'content_only=false' >> "$GITHUB_OUTPUT"
            echo 'docs_changed=false' >> "$GITHUB_OUTPUT"
            echo 'clai2_only=false' >> "$GITHUB_OUTPUT"
            echo 'clai2_changed=true' >> "$GITHUB_OUTPUT"
            echo 'pyright_changed=true' >> "$GITHUB_OUTPUT"
          }

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            run_all_checks
            exit 0
          fi

          if ! total=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.changed_files'); then
            echo '::warning::Could not read the PR changed-file count; running full CI.'
            run_all_checks
            exit 0
          fi
          if ! [[ "$total" =~ ^[0-9]+$ ]]; then
            echo "::warning::PR changed-file count is not numeric ($total); running full CI."
            run_all_checks
            exit 0
          fi
          if [ "$total" -eq 0 ] || [ "$total" -ge 3000 ]; then
            echo "::warning::PR changed-file count is $total; running full CI."
            run_all_checks
            exit 0
          fi
          if ! gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[] | [.filename, (.previous_filename // "")] | @tsv' > "$RUNNER_TEMP/changed-files.txt"; then
            echo '::warning::Could not list the PR changed files; running full CI.'
            run_all_checks
            exit 0
          fi

          mapfile -t changed_files < "$RUNNER_TEMP/changed-files.txt"
          if [ "${#changed_files[@]}" -ne "$total" ]; then
            echo "::warning::Expected $total changed files, received ${#changed_files[@]}; running full CI."
            run_all_checks
            exit 0
          fi

          needs_docs_checks() {
            # `test_examples.py` also scans Markdown under the published package directories.
            case "$1" in
              README.md|clai/README.md|src/pydantic_clai2/README.md|src/pydantic_ai_harness/README.md) ;;
              docs/*.md|docs/*.mdc|docs/*.png|docs/*.svg|docs/*.ico|docs/*.jpg|docs/*.jpeg|docs/*.gif|docs/*.webp|docs/*.avif) ;;
              examples/*.md|pydantic_ai_slim/*.md|pydantic_graph/*.md|pydantic_evals/*.md) ;;
              *) return 1 ;;
            esac
          }

          is_non_test_content() {
            case "$1" in
              tests/*|.github/*|.macroscope/*) return 1 ;;
            esac
            if needs_docs_checks "$1"; then
              return 0
            fi
            case "$1" in
              .agents/*.md|.claude/*.md|agent_docs/*.md|*/AGENTS.md|*/CLAUDE.md) return 0 ;;
              *.md) [[ "$1" != */* ]] ;;
              *) return 1 ;;
            esac
          }

          # Nothing outside `pydantic-clai2` imports it, so a change confined to these paths cannot
          # break another package's suite: it runs only the `pydantic-clai2` test cells, and skips
          # the jobs that exercise the rest of the workspace. Shared inputs (`pyproject.toml`,
          # `uv.lock`, `tests/conftest.py`, ...) are outside them and still run everything.
          is_clai2() {
            case "$1" in
              src/pydantic_clai2/*|tests/clai2/*) ;;
              *) return 1 ;;
            esac
          }

          # `test-clai2-clipboard` runs on macOS and Windows runners, so only for a change that reaches
          # `pydantic-clai2` or the job itself.
          is_clai2_input() {
            is_clai2 "$1" || [ "$1" = .github/workflows/ci.yml ]
          }

          is_pyright_input() {
            # All Python/stub files conservatively cover Pyright's include and import graph;
            # the remaining paths change its command, configuration, dependencies, or this gate.
            case "$1" in
              *.py|*.pyi|*/py.typed|py.typed|pyproject.toml|*/pyproject.toml|uv.lock|uv.toml|*/uv.toml|pyrightconfig*.json|*/pyrightconfig*.json|Makefile|.github/workflows/ci.yml) ;;
              *) return 1 ;;
            esac
          }

          content_only=true
          docs_changed=false
          clai2_only=true
          clai2_changed=false
          pyright_changed=false
          for changed_file in "${changed_files[@]}"; do
            IFS=$'\t' read -r filename previous_filename <<< "$changed_file"
            if ! is_non_test_content "$filename" || \
              { [ -n "$previous_filename" ] && ! is_non_test_content "$previous_filename"; }; then
              content_only=false
            fi
            if needs_docs_checks "$filename" || \
              { [ -n "$previous_filename" ] && needs_docs_checks "$previous_filename"; }; then
              docs_changed=true
            fi
            if ! is_clai2 "$filename" || \
              { [ -n "$previous_filename" ] && ! is_clai2 "$previous_filename"; }; then
              clai2_only=false
            fi
            if is_clai2_input "$filename" || \
              { [ -n "$previous_filename" ] && is_clai2_input "$previous_filename"; }; then
              clai2_changed=true
            fi
            if is_pyright_input "$filename" || \
              { [ -n "$previous_filename" ] && is_pyright_input "$previous_filename"; }; then
              pyright_changed=true
            fi
          done
          echo "content_only=$content_only" >> "$GITHUB_OUTPUT"
          echo "docs_changed=$docs_changed" >> "$GITHUB_OUTPUT"
          echo "clai2_only=$clai2_only" >> "$GITHUB_OUTPUT"
          echo "clai2_changed=$clai2_changed" >> "$GITHUB_OUTPUT"
          echo "pyright_changed=$pyright_changed" >> "$GITHUB_OUTPUT"

  quality:
    name: quality checks
    needs: classify
    if: needs.classify.outputs.content_only != 'true'
    runs-on: ubuntu-latest
    # `pull-requests: read` is for the lock-regeneration guard's PR file listing. Reading
    # it works today on `contents: read` alone only because this repo is public; declaring
    # it keeps the step working on a private fork or mirror.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-suffix: lint

      # `--no-extra mcp-tasks` everywhere `--all-extras` appears: the extra lives in the
      # FastMCP 4 / MCP SDK v2 lock fork, which `tool.uv.conflicts` bars from co-installing
      # with the FastMCP 3 dev environment (the `test-fastmcp-4` job covers that universe).
      - name: Install dependencies
        id: install
        run: uv sync --all-extras --no-extra mcp-tasks --all-packages --group lint

      - name: Test GitHub agentic workflow policy
        env:
          UV_NO_SYNC: "1"
        run: >-
          uv run pytest
          .github/scripts/test_pydantic_ai_runner.py
          .github/scripts/test_agent_provider_health.py
          .github/scripts/test_check_api_compatibility.py
          .github/scripts/test_issue_pr_attention_monitor.py
          .github/scripts/test_semantic_owner_router.py
          .github/scripts/test_community_demand.py
          .github/scripts/test_triage_telemetry.py
          .github/scripts/test_feature_digest.py
          .github/scripts/test_agentic_workflow_guard.py
          .github/scripts/test_agent_spend_report.py
          .github/scripts/test_docs_navigation_workflow.py
          .github/scripts/test_protect_github_dir.py
          .github/scripts/test_ci_content_classifier.py

      # `make typecheck-changed` narrows Pyright to the files a change reaches, so a wrong
      # answer here silently stops type errors reaching a developer's terminal.
      # It lives outside `testpaths`, in the job that installs Pyright, because one of its
      # tests runs Pyright for real.
      - name: Test the incremental typecheck script
        env:
          UV_NO_SYNC: "1"
        run: uv run pytest scripts/test_typecheck_changed.py

      # `uv run --script` in the smoke test below silently re-locks a stale runner lock, so
      # it can't catch one. A change to the runner's dependencies, `pydantic_ai_slim`'s
      # included, must refresh it.
      - name: Check the gh-aw runner's script lock is up to date
        run: >-
          uv lock --script .github/scripts/pydantic-ai-runner --check
          || { echo "::error file=.github/scripts/pydantic-ai-runner.lock::Stale gh-aw runner lock; run: uv lock --script .github/scripts/pydantic-ai-runner"; exit 1; }

      # The tests above import the shim inside this job's workspace venv, which is not
      # the environment it runs in: gh-aw executes it via `uv run --script` against the
      # runner's own locked dependency set. Run it there, with no argv, so it reaches
      # the empty-prompt short-circuit without touching the network. This catches
      # general shim breakage — a syntax error, a bad import, a module the runner lock
      # doesn't carry. It is not what guards against importing an unreleased
      # `pydantic_ai` symbol: the runner's workspace source (#6998) does that, by making
      # the shim's library the same checkout as its code. The shim exits non-zero on
      # that path, so the assertion is on its output, never its status: `|| true` holds
      # whether or not the shell has `pipefail` (the default `run` shell here is
      # `bash -e`, but `shell: bash` would add it).
      - name: Smoke-test the gh-aw shim against the runner's own dependencies
        run: |
          uv run --script .github/scripts/pydantic-ai-runner 2>&1 | tee /tmp/shim-smoke.log || true
          grep -q 'empty prompt' /tmp/shim-smoke.log

      # Every check except lock freshness reads the tree alone, so run them on `main`
      # too. Two independently-green PRs can still merge into a drifted `main` — the
      # classic case being one that bumps the gh-aw compiler while another adds a lock
      # at the old version — and without this the drift first surfaces as a red `quality checks`
      # on whichever contributor next opens a PR, about workflows they never touched.
      - name: Fetch gh-aw compatibility policy
        run: >-
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors
          https://raw.githubusercontent.com/github/gh-aw/main/.github/aw/compat.json
          --output /tmp/gh-aw-compat.json

      - name: Check agentic workflow policy
        env:
          UV_NO_SYNC: "1"
        run: >-
          uv run python .github/scripts/agentic_workflow_guard.py check
          --compatibility-file /tmp/gh-aw-compat.json

      # Actions runs the `*.lock.yml`, never the `*.md`, so a source edited without
      # its recompiled lock is a silent no-op. The checkout is shallow, so feed the
      # guard the PR's file list rather than a `git diff` range.
      - name: Check agentic workflow locks were regenerated
        if: github.event_name == 'pull_request'
        env:
          UV_NO_SYNC: "1"
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # `gh pr view --json files` truncates at 100 files, which would silently hide an
          # un-recompiled lock on a large PR. Paginate the REST endpoint instead — and since
          # that endpoint itself hard-caps at 3,000 files, fail closed when the list comes
          # back short rather than let the guard pass on an incomplete changeset.
          total=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.changed_files')
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[] | {filename, previous_filename, status} | tojson' > /tmp/pr-files.jsonl
          # One JSON object per changed file, so this is the count to compare against.
          retrieved=$(wc -l < /tmp/pr-files.jsonl | tr -d '[:space:]')
          # A renamed file reports only its new path in `filename`; the old path lives in
          # `previous_filename`. Without it, renaming a source away from its lock leaves the
          # lock orphaned and runnable, and the guard never sees the old source as gone.
          jq -r '.filename, (select(.status == "renamed") | .previous_filename)' \
            /tmp/pr-files.jsonl > /tmp/changed-files.txt
          if [ "$retrieved" -lt "$total" ]; then
            echo "::error::Retrieved only $retrieved of $total changed files (the PR files API caps at 3000)." \
              "Lock freshness cannot be verified for this PR, so failing closed rather than passing blind."
            exit 1
          fi
          uv run python .github/scripts/agentic_workflow_guard.py check --changed-file-list /tmp/changed-files.txt

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --all-files --verbose
        env:
          SKIP: no-commit-to-branch
          # pre-commit hooks shell out via `uv run`; without this they would re-sync the venv
          # down to the root package and drop the `--all-packages` install above.
          UV_NO_SYNC: "1"

      # The full Pyright check runs here, not in pre-commit. With `CI` set, `make typecheck-changed`
      # hands the whole project to `make typecheck-pyright`, under the `PYRIGHT_TIME_BUDGET` that only
      # that script enforces. It runs whenever the install succeeded, so a failing pre-commit hook or
      # policy check does not hide type errors.
      - name: Type-check with Pyright
        if: ${{ !cancelled() && steps.install.outcome == 'success' && needs.classify.outputs.pyright_changed == 'true' }}
        env:
          # The `Makefile` leaves pyright single-process by default, for laptops where a worker
          # per core swaps. A runner has the memory, and this step is the longest in the job, so
          # CI opts back in.
          PYRIGHT_THREADS: auto
          # Fail a passing pyright run that outlasts this many seconds, so a change that makes
          # pyright itself slow fails its own PR instead of `main`. #8077 made pyright slow and
          # nothing caught it (see #8177): pyright ran 328 to 490 s over the five `main` runs
          # between those two. The budget was 110 (1.1x the p99 of 60 main runs, derived in
          # https://github.com/pydantic/pydantic-ai/issues/8182#issuecomment-5575016259), but by
          # 2026-09-23 pyright ran 66 to 111 s on the same day's main runs (runner variance alone
          # spans about 30 s); the pyright 1.1.414 bump (#8690) and type-checking docs examples (#8646)
          # probably lifted the baseline to about 105 to 111 s, and a 110.6 s passing run failed main;
          # 150 leaves room for that variance while still failing a regression like #8077's 328 to
          # 490 s. Type-checking `pydantic-ai-harness` and `pydantic-clai2` took a passing run to
          # 156 s, so 200 keeps the same headroom.
          PYRIGHT_TIME_BUDGET: "200"
          UV_NO_SYNC: "1"
        run: make typecheck-changed

      # Run inside `quality checks`, which finishes several minutes before the test/coverage critical path.
      - name: Check public API compatibility with the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          UV_NO_SYNC: "1"
        run: |
          # Exclude the tag being built: once its GitHub release exists, `gh release view`
          # would otherwise compare the release to itself and make this gate a no-op.
          release_tag=$(gh release list --repo pydantic/pydantic-ai --limit 20 \
            --exclude-drafts --exclude-pre-releases --json tagName \
            | jq -r --arg current "$GITHUB_REF_NAME" \
              'map(select(.tagName != $current))[0].tagName // empty')
          if [ -z "$release_tag" ]; then
            echo '::error::Could not find a prior stable release for the API compatibility baseline.'
            exit 1
          fi
          git fetch --depth=1 origin tag "$release_tag"
          uv run python .github/scripts/check_api_compatibility.py --against "$release_tag"

      # `src/pydantic_ai_harness/gh-aw/pydantic.md` is the engine definition gh-aw consumers compile
      # from the default branch, so nothing downstream re-checks it. `--published` refuses an
      # `engine.version` PyPI does not serve.
      - run: uv run --script src/pydantic_ai_harness/scripts/gh_aw_engine_version.py --published

      - run: uv build --all-packages --no-sources
      - run: uv run python .github/scripts/check_http_dependencies.py
      - run: ls -lh dist/
      - run: uvx twine check --strict dist/*

  # mypy and quality checks are a bit slower than other jobs, so we run them separately
  mypy:
    needs: classify
    if: needs.classify.outputs.content_only != 'true' && needs.classify.outputs.clai2_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-suffix: mypy

      - name: Install dependencies
        run: uv sync --no-dev --group lint

      - run: make typecheck-mypy

  # The unified-docs repository renders and validates published documentation.
  # Keep this source-repository check for assets that live alongside Pydantic AI docs.
  docs-assets:
    needs: classify
    if: needs.classify.outputs.content_only != 'true' || needs.classify.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-suffix: docs-assets

      # Check all documentation images are tinified. You will need a Tinify API key to fix failures.
      - run: uvx tinicly docs --check

      # Check that links between doc pages resolve, including their `#anchor` fragments. Runs
      # `--offline` so only local files are checked: external hosts are swept weekly by
      # link-check.yml instead, where being down doesn't block a PR.
      - name: Check doc links and heading anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --offline --include-fragments --config .github/workflows/lychee.toml './docs/**/*.md' './*.md' './examples/**/*.md'
          fail: true

  # Documentation examples are runtime-checked on one representative Python version. A
  # version-specific miss is low-impact and easy to repair, while multiplying this job across
  # the support matrix would recreate much of the CI cost this reduced path avoids.
  docs-only:
    name: docs-only checks on Python 3.13
    needs: classify
    if: needs.classify.outputs.content_only == 'true' && needs.classify.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
      # Match the all-extras cells in the full matrix: optional SDKs make blocking-call
      # detection noisy, while the dedicated 3.13 non-all-extras cells still cover it.
      BLOCKBUSTER_ENABLED: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-suffix: docs-only

      - name: Install documentation test dependencies
        run: uv sync --all-extras --no-extra mcp-tasks --all-packages

      - name: Check Markdown files
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --all-files --verbose
        env:
          SKIP: no-commit-to-branch,format,lint,check-cassettes
          UV_NO_SYNC: "1"

      - name: Test documentation snippets
        run: >-
          uv run --no-sync pytest
          tests/test_examples.py
          tests/harness/test_docs_installation.py
          tests/test_docs_parity.py
          tests/test_docs_navigation.py
          tests/harness/test_docs_parity.py
          tests/harness/test_doc_snippets.py
          tests/harness/test_workspace_quickstarts.py
          -n logical --dist=loadgroup

  content-checks:
    name: content checks
    needs: classify
    if: needs.classify.outputs.content_only == 'true' && needs.classify.outputs.docs_changed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --all-files --verbose
        env:
          SKIP: no-commit-to-branch,clai-help,format,lint,check-cassettes

  test:
    name: test on ${{ matrix.python-version }} (${{ matrix.install.name }})
    needs: classify
    if: needs.classify.outputs.content_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # `latest-versions-canary.yml` runs the endpoints of this list; update it alongside.
        # Growing this or any other test matrix grows the tracked-job count that
        # `REPORT_ROW_LIMIT` in `.github/scripts/ci_duration.py` must stay above, or the duration
        # report truncates. That constant's comment enumerates all four.
        # `all-extras` is the slowest install shape -- it runs sharded in `test-all-extras` instead.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        install:
          - name: pydantic-ai-slim
            command: "--package pydantic-ai-slim"
          - name: pydantic-evals
            command: "--package pydantic-evals"
          # The extras its suite always ran with; every other extra is covered by `all-extras`.
          - name: pydantic-ai-harness
            command: "--package pydantic-ai-harness --extra code-mode --extra coder --extra logfire"
            # Its own suite: the rest of `tests/` is covered by the other cells.
            paths: tests/harness
          - name: pydantic-clai2
            command: "--package pydantic-clai2"
            paths: tests/clai2
          - name: standard
            command: ""
        # A single-value dimension, so the `exclude` below can drop every cell but
        # `pydantic-clai2` when `classify` found a change confined to it.
        clai2_only: ["${{ needs.classify.outputs.clai2_only }}"]
        exclude:
          - clai2_only: "true"
            install: { name: pydantic-ai-slim }
          - clai2_only: "true"
            install: { name: pydantic-evals }
          - clai2_only: "true"
            install: { name: pydantic-ai-harness }
          - clai2_only: "true"
            install: { name: standard }
    env:
      CI: true
      # Coverage adds roughly 50% to test execution before Python 3.14. Collect every install shape
      # on 3.14, where coverage uses the faster sys.monitoring core; the other versions still run
      # every applicable test without duplicate coverage. A `pydantic-clai2`-only change also
      # collects it on 3.10: `tests/clai2` has 3.10-only branches that `all-extras` covers otherwise.
      COLLECT_COVERAGE: ${{ matrix.python-version == '3.14' || matrix.clai2_only == 'true' && matrix.python-version == '3.10' }}
      BLOCKBUSTER_ENABLED: ${{ matrix.python-version == '3.13' }}
      CLAI2_EXTRA: ${{ matrix.clai2_only == 'true' && 'typesafe' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: ${{ matrix.install.name }}

      - run: mkdir .coverage

      # Every test install includes the `dev` group, whose `mongomock-motor` pulls in PyMongo, so only
      # this install catches a module that imports `pymongo` (the `mongodb` extra) eagerly instead of
      # behind its lazy `__getattr__`. It runs before `uv sync --only-dev`, which removes it again.
      - name: import pydantic-ai-harness without extras or dependency groups
        if: matrix.install.name == 'pydantic-ai-harness'
        run: |
          uv sync --package pydantic-ai-harness --no-default-groups
          # Fail if a base dependency pulls PyMongo back in, rather than pass while testing nothing.
          uv run --no-sync python -c "
          import importlib.util
          assert importlib.util.find_spec('pymongo') is None, 'the base install must not include pymongo'
          import pydantic_ai_harness, pydantic_ai_harness.media, pydantic_ai_harness.step_persistence
          "

      - run: uv sync --only-dev

      # `-n logical`, not `-n auto`: when `psutil` is importable, xdist's `auto` counts
      # *physical* cores while `logical` counts every vCPU, which is what hyperthreaded
      # runners want. `psutil` is not in `uv.lock` and `UV_FROZEN` pins CI to it, so both
      # spellings resolve to the same count today; the flag is here for when that stops
      # being true.
      # Everything under `tests/durable_exec` and every test marked `temporal` runs in
      # `test-durable-exec` instead: those tests pin xdist groups around real local servers, so
      # the chains they form would otherwise be the critical-path floor of the all-extras cells --
      # the other install variants skip the suites at module level, for want of the engine packages.
      # Its `lowest` leg proves the minimum `temporalio`/`dbos`/`prefect` bounds.
      - name: run tests
        shell: bash
        run: |
          extra=()
          if [[ -n "$CLAI2_EXTRA" ]]; then
            extra=(--extra "$CLAI2_EXTRA")
          fi
          if [[ "$COLLECT_COVERAGE" == "true" ]]; then
            export COVERAGE_PROCESS_START="$PWD/pyproject.toml"
            runner=(coverage run -m pytest)
          else
            unset COVERAGE_PROCESS_START
            runner=(pytest)
          fi
          uv run ${{ matrix.install.command }} "${extra[@]}" "${runner[@]}" --durations=100 -n logical --dist=loadgroup \
            --ignore=tests/durable_exec -m "not temporal" ${{ matrix.install.paths }}
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage/.coverage.${{ matrix.python-version }}-${{ matrix.install.name }}

      # Merge this job's per-worker/per-subprocess data files into one before upload: the
      # combine work runs in parallel across the matrix instead of serially in the `coverage`
      # job, which would otherwise merge hundreds of files on the critical path.
      - name: combine coverage files
        if: env.COLLECT_COVERAGE == 'true'
        shell: bash
        run: |
          extra=()
          if [[ -n "$CLAI2_EXTRA" ]]; then
            extra=(--extra "$CLAI2_EXTRA")
          fi
          uv run ${{ matrix.install.command }} "${extra[@]}" coverage combine
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage/.coverage.${{ matrix.python-version }}-${{ matrix.install.name }}

      - name: store coverage files
        if: env.COLLECT_COVERAGE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.install.name }}
          path: .coverage
          include-hidden-files: true

  # `all-extras` is the slowest install shape by a wide margin -- it alone pulls in every
  # optional dependency -- so it gets its own job, split into shards, instead of sharing the
  # `test` job's timeout budget with the three much lighter install shapes.
  test-all-extras:
    name: test on ${{ matrix.python-version }} (all-extras, shard ${{ matrix.shard }}/${{ matrix.python-version == '3.10' && 3 || 2 }})
    needs: classify
    if: needs.classify.outputs.content_only != 'true' && needs.classify.outputs.clai2_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        shard: [1, 2]
        include:
          # The third 3.10 shard `SPLITS` accounts for; `shard: 3` matches no base combination,
          # so this adds a cell rather than overriding one.
          - python-version: "3.10"
            shard: 3
    env:
      CI: true
      # Collect every shard on 3.14, where coverage uses the faster sys.monitoring core, plus
      # every shard on 3.10 for version-specific branches -- both are combined across shards
      # and install shapes in the `coverage` job. The other versions run without duplicate
      # coverage.
      # 3.10 also covers the extras that do not install on 3.14 -- `voyageai` for one, which
      # nothing else imports -- so it cannot hand this back to 3.14 (#9288 tried, and
      # `coverage` came to 99.97%), and coverage's cheap `sys.monitoring` core does not measure
      # branches before 3.14, so no pre-3.14 cell can avoid the legacy tracer.
      COLLECT_COVERAGE: ${{ matrix.python-version == '3.14' || matrix.python-version == '3.10' }}
      # That tracer more than doubles what these cells run and the gap grows with the suite: on
      # run 36695601609 the 3.10 shards took 1047s and 1098s where their two-way siblings took
      # 359-503s and the same shard without coverage (3.10 lowest-versions) took 484s. It cannot
      # be removed, so divide it. Three ways lands each 3.10 shard around 730s, which is where
      # this stops: `test-lowest-versions` shard 2 runs ~660s, so a fourth shard (measured at
      # 561s on run 36709751517) only trades a whole job for the ~60s between them.
      SPLITS: ${{ matrix.python-version == '3.10' && 3 || 2 }}
      # Rebenchmark after https://github.com/cbornet/blockbuster/pull/61 is released in a
      # compatible version; re-enable if a shard then stays comfortably within its timeout.
      BLOCKBUSTER_ENABLED: false
      # `tests/test_examples.py` type-checks the docs examples with pyright; once per run is enough.
      TYPECHECK_EXAMPLES: ${{ matrix.python-version == '3.14' }}
      # `tests/harness/absurd` runs on Absurd's schema; an unreachable server fails rather than skips.
      ABSURD_REQUIRE_LIVE: "1"
      ABSURD_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: all-extras

      - run: mkdir .coverage

      - run: uv sync --only-dev

      # Cache only the immutable model used by `TestSentenceTransformers`. The old
      # shared HF cache could be populated first by a matrix job that never downloaded
      # this model, permanently turning an exact cache hit into a cold model cache.
      - name: restore sentence-transformers test model
        id: sentence-transformers-cache
        if: matrix.python-version != '3.14'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub/models--sentence-transformers-testing--stsb-bert-tiny-safetensors
          key: hf-${{ runner.os }}-stsb-bert-tiny-safetensors-f3cb857cba53019a20df283396bcca179cf051a4

      # Warm the HF cache out-of-band (retried, non-fatal) so the sentence-transformers
      # test model is on disk when the ST tests load it: the pinned revision is then
      # served from cache without revalidating against the Hub (see the
      # `stsb_bert_tiny_model` fixture). On a cache miss, fetch the full pinned
      # snapshot — this job and `test-lowest-versions` share the cache key, so the
      # cached snapshot must not depend on which resolution flavor warmed it — then
      # construct the model once to prove it is usable before saving. On a sustained
      # HF outage the real-model smoke tests skip; deterministic adapter tests still
      # preserve coverage. Both shards race to warm/save this key; the loser's save is a
      # harmless no-op against the already-populated cache.
      - name: pre-download sentence-transformers test model
        id: sentence-transformers-download
        if: >-
          matrix.python-version != '3.14'
          && steps.sentence-transformers-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            if uv run --all-extras --no-extra mcp-tasks python -c "from huggingface_hub import snapshot_download; from sentence_transformers import SentenceTransformer; snapshot_download('sentence-transformers-testing/stsb-bert-tiny-safetensors', revision='f3cb857cba53019a20df283396bcca179cf051a4'); SentenceTransformer('sentence-transformers-testing/stsb-bert-tiny-safetensors', revision='f3cb857cba53019a20df283396bcca179cf051a4')"; then
              exit 0
            fi
            echo "HF model download attempt $i failed; retrying in 15s..."
            sleep 15
          done
          echo "sentence-transformers test model unavailable after retries; ST tests will skip"
          exit 1

      # A failed non-fatal download must not become an immutable exact cache hit.
      - name: save sentence-transformers test model
        if: >-
          matrix.python-version != '3.14'
          && steps.sentence-transformers-cache.outputs.cache-hit != 'true'
          && steps.sentence-transformers-download.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub/models--sentence-transformers-testing--stsb-bert-tiny-safetensors
          key: ${{ steps.sentence-transformers-cache.outputs.cache-primary-key }}

      # `-n logical` (see note on the `test` job). Split into `SPLITS` shards with `pytest-split`
      # so this, the slowest install shape, keeps pace with the rest of the matrix. The split is
      # by test count, not measured duration -- no `.test_durations` file is committed -- so
      # rebalance with `--store-durations` if `ci_duration.py`'s report shows the shards
      # drifting apart. `pytest-split` repartitions when `--splits` changes, so 3.10's three
      # shards hold a different partition than the other versions' two; every test still runs
      # exactly once per version, but a shard is only comparable to the same version's.
      # Everything under `tests/durable_exec` and every test marked `temporal` runs in
      # `test-durable-exec` instead: those tests pin xdist groups around real local servers, so
      # the chains they form would otherwise be this job's critical-path floor.
      - name: run tests
        shell: bash
        run: |
          if [[ "$COLLECT_COVERAGE" == "true" ]]; then
            export COVERAGE_PROCESS_START="$PWD/pyproject.toml"
            runner=(coverage run -m pytest)
          else
            unset COVERAGE_PROCESS_START
            runner=(pytest)
          fi
          # `--all-packages` so the extras of every workspace member are installed, not just the
          # root package's: that is where `pydantic-ai-harness`'s optional integrations get tested.
          uv run --all-packages --all-extras --no-extra mcp-tasks "${runner[@]}" --durations=100 -n logical --dist=loadgroup \
            --ignore=tests/durable_exec -m "not temporal" --splits "$SPLITS" --group ${{ matrix.shard }}
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage/.coverage.${{ matrix.python-version }}-all-extras-${{ matrix.shard }}

      - name: cover Absurd without a database URL
        if: matrix.python-version == '3.14' && matrix.shard == 1
        run: >-
          env -u ABSURD_TEST_DATABASE_URL
          uv run --all-packages --all-extras --no-extra mcp-tasks
          coverage run -m pytest
          tests/harness/absurd/test_absurd.py::TestDurability::test_replay_serves_cached_model_response
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage/.coverage.${{ matrix.python-version }}-all-extras-${{ matrix.shard }}

      # See the matching step in the `test` job.
      - name: combine coverage files
        if: env.COLLECT_COVERAGE == 'true'
        run: uv run --all-packages --all-extras --no-extra mcp-tasks coverage combine
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage/.coverage.${{ matrix.python-version }}-all-extras-${{ matrix.shard }}

      - name: store coverage files
        if: env.COLLECT_COVERAGE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.python-version }}-all-extras-${{ matrix.shard }}
          path: .coverage
          include-hidden-files: true

  # The durable-execution suites pin their tests to xdist groups sharing a real local server --
  # one group per core Temporal test module, one shared harness Temporal group, one for DBOS, and
  # one for Prefect -- so inside the main matrix those groups dominate its critical path. Running
  # them in their own job takes them off that path entirely; `--dist=loadgroup` still spreads the
  # groups across this job's workers, and only the tests within one group run in sequence.
  # New durable-exec tests land anywhere under `tests/durable_exec` and are picked up
  # automatically. Harness tests that start or connect to a Temporal dev server use the
  # registered `temporal` marker. Both sets run only in this job, which sets
  # `BLOCKBUSTER_ENABLED: false`. A test that needs blocking detection belongs elsewhere under
  # `tests/`, where the `test` job turns it on for the 3.13 cells (`test-all-extras` leaves it off).
  # The `lowest` resolution leg is the only place the declared minimum bounds
  # (`temporalio`, `dbos`, `prefect`) are proven: `test-lowest-versions` skips this directory.
  test-durable-exec:
    name: test durable-exec on ${{ matrix.python-version }} (${{ matrix.resolution }})
    needs: classify
    if: needs.classify.outputs.content_only != 'true' && needs.classify.outputs.clai2_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        resolution: [locked, lowest]
    env:
      CI: true
      # Python 3.10 and 3.14 cover version endpoints; both 3.12 resolutions cover Temporal dependency branches.
      COLLECT_COVERAGE: >-
        ${{
          matrix.python-version == '3.12'
          || ((matrix.python-version == '3.10' || matrix.python-version == '3.14') && matrix.resolution == 'locked')
        }}
      # Blocking detection already runs in the Python 3.13 slim, evals, and standard jobs.
      BLOCKBUSTER_ENABLED: false
      # Puts every Temporal worker in debug mode, which disables the workflow deadlock detector
      # (temporalio sets the per-activation budget to `None` instead of 2s). That budget is
      # wall-clock, so it measures runner contention as readily as a blocking call, and a
      # descheduled workflow thread trips it as `TMPRL1101`. The cost: a genuine in-workflow
      # blocking call now hangs to the job timeout instead of failing in 2s. Since `temporalio`
      # 1.29, debug mode also runs every workflow activation inline on the worker's event loop
      # instead of in the executor thread a production worker uses, so on the `locked` legs only a
      # test that unsets this variable runs workflow code on that thread.
      TEMPORAL_DEBUG: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: durable-exec-${{ matrix.resolution }}

      - run: mkdir .coverage

      # The Temporal tests download the dev-server binary on first use, to the directory that
      # `temporal_dev_server_cache_dir` in tests/temporal_utils.py returns; cache it so a CDN
      # hiccup can't fail the suite at setup (#5399).
      # Separate key per resolution: the lowest leg may resolve a different temporalio version
      # wanting a different binary. A stale restored dir is safe because the SDK names the
      # binary by its own version and re-downloads on a miss.
      - name: cache Temporal dev-server binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/temporal-dev-server
          key: temporal-cli-${{ runner.os }}-${{ runner.arch }}-${{ matrix.resolution }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            temporal-cli-${{ runner.os }}-${{ runner.arch }}-${{ matrix.resolution }}-

      - name: install lowest resolution
        if: matrix.resolution == 'lowest'
        run: uv sync --all-packages --all-extras --no-extra mcp-tasks --resolution lowest-direct
        env:
          UV_FROZEN: "0"

      # `--all-extras` matches the all-extras matrix cell these tests used to run in, so
      # the module-level `try_import` skip-gating (logfire, mcp, openai, anthropic, ...)
      # behaves identically and coverage combination stays complete. The lowest leg was
      # synced above, so `--no-sync` there keeps its resolution.
      - name: run tests
        shell: bash
        run: |
          if [[ "$COLLECT_COVERAGE" == "true" ]]; then
            export COVERAGE_PROCESS_START="$PWD/pyproject.toml"
            runner=(coverage run -m pytest)
          else
            unset COVERAGE_PROCESS_START
            runner=(pytest)
          fi
          uv run ${{ matrix.resolution == 'lowest' && '--no-sync' || '--all-packages --all-extras --no-extra mcp-tasks' }} \
            "${runner[@]}" --durations=20 -n logical --dist=loadgroup tests/durable_exec
          uv run ${{ matrix.resolution == 'lowest' && '--no-sync' || '--all-packages --all-extras --no-extra mcp-tasks' }} \
            "${runner[@]}" --durations=20 -n logical --dist=loadgroup -m temporal tests/harness
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage/.coverage.${{ matrix.python-version }}-durable-exec-${{ matrix.resolution }}

      # See the matching step in the `test` job.
      - name: combine coverage files
        if: env.COLLECT_COVERAGE == 'true'
        run: >-
          uv run ${{ matrix.resolution == 'lowest' && '--no-sync' || '--all-packages --all-extras --no-extra mcp-tasks' }}
          coverage combine
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage/.coverage.${{ matrix.python-version }}-durable-exec-${{ matrix.resolution }}

      - name: store coverage files
        if: env.COLLECT_COVERAGE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.python-version }}-durable-exec-${{ matrix.resolution }}
          path: .coverage
          include-hidden-files: true

  test-lowest-versions:
    name: test on ${{ matrix.python-version }} (lowest-versions, shard ${{ matrix.shard }}/2)
    needs: classify
    if: needs.classify.outputs.content_only != 'true' && needs.classify.outputs.clai2_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        shard: [1, 2]
    env:
      CI: true
      # Python 3.14's sys.monitoring coverage core is substantially cheaper than the legacy tracer.
      COLLECT_COVERAGE: ${{ matrix.python-version == '3.14' }}
      # Blocking detection already runs in the Python 3.13 slim, evals, and standard jobs;
      # repeating its stack-inspection overhead here pushes lowest-version jobs past the CI budget.
      BLOCKBUSTER_ENABLED: false
      # The docs examples are type-checked in the Python 3.14 all-extras jobs.
      TYPECHECK_EXAMPLES: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: lowest-versions

      - run: mkdir .coverage

      - name: restore sentence-transformers test model
        id: sentence-transformers-cache
        if: matrix.python-version != '3.14'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub/models--sentence-transformers-testing--stsb-bert-tiny-safetensors
          key: hf-${{ runner.os }}-stsb-bert-tiny-safetensors-f3cb857cba53019a20df283396bcca179cf051a4

      - run: uv sync --all-packages --all-extras --no-extra mcp-tasks --resolution lowest-direct
        env:
          UV_FROZEN: "0"

      # Warm the HF cache out-of-band: full pinned snapshot, then a validation
      # construct (see the matching step in the `test` job for the full rationale).
      - name: pre-download sentence-transformers test model
        id: sentence-transformers-download
        if: >-
          matrix.python-version != '3.14'
          && steps.sentence-transformers-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            if uv run --no-sync python -c "from huggingface_hub import snapshot_download; from sentence_transformers import SentenceTransformer; snapshot_download('sentence-transformers-testing/stsb-bert-tiny-safetensors', revision='f3cb857cba53019a20df283396bcca179cf051a4'); SentenceTransformer('sentence-transformers-testing/stsb-bert-tiny-safetensors', revision='f3cb857cba53019a20df283396bcca179cf051a4')"; then
              exit 0
            fi
            echo "HF model download attempt $i failed; retrying in 15s..."
            sleep 15
          done
          echo "sentence-transformers test model unavailable after retries; ST tests will skip"
          exit 1

      - name: save sentence-transformers test model
        if: >-
          matrix.python-version != '3.14'
          && steps.sentence-transformers-cache.outputs.cache-hit != 'true'
          && steps.sentence-transformers-download.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub/models--sentence-transformers-testing--stsb-bert-tiny-safetensors
          key: ${{ steps.sentence-transformers-cache.outputs.cache-primary-key }}

      # `-n logical` (see note on the `test` job). Split into 2 shards with `pytest-split`
      # (see the matching note in `test-all-extras` for why, and for the rebalancing caveat).
      # The durable-execution suites and harness `temporal` tests run in `test-durable-exec`
      # (its `lowest` leg covers this resolution), keeping their grouped xdist chains off this
      # job's critical path.
      - name: run tests
        shell: bash
        run: |
          if [[ "$COLLECT_COVERAGE" == "true" ]]; then
            export COVERAGE_PROCESS_START="$PWD/pyproject.toml"
            runner=(coverage run -m pytest)
          else
            unset COVERAGE_PROCESS_START
            runner=(pytest)
          fi
          uv run --no-sync "${runner[@]}" --durations=100 -n logical --dist=loadgroup \
            --ignore=tests/durable_exec -m "not temporal" --splits 2 --group ${{ matrix.shard }}
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage/.coverage.${{ matrix.python-version }}-lowest-versions-${{ matrix.shard }}

      # See the matching step in the `test` job.
      - name: combine coverage files
        if: env.COLLECT_COVERAGE == 'true'
        run: uv run --no-sync coverage combine
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage/.coverage.${{ matrix.python-version }}-lowest-versions-${{ matrix.shard }}

      - name: store coverage files
        if: env.COLLECT_COVERAGE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.python-version }}-lowest-versions-${{ matrix.shard }}
          path: .coverage
          include-hidden-files: true

  test-temporal-latest:
    name: test Temporal latest on Python 3.10
    needs: classify
    if: needs.classify.outputs.content_only != 'true' && needs.classify.outputs.clai2_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.10"
          enable-cache: true
          cache-suffix: temporal-latest

      - run: uv sync --extra temporal --upgrade-package temporalio
        env:
          UV_FROZEN: "0"

      - run: >-
          uv run --no-sync pytest
          tests/durable_exec/temporal/test_durability.py::test_durability_rejects_unknown_activity_config_keys
          tests/durable_exec/temporal/test_durability.py::test_durability_coerces_activity_config_values

  test-examples:
    name: test examples on ${{ matrix.python-version }}
    needs: classify
    if: needs.classify.outputs.content_only != 'true' && needs.classify.outputs.clai2_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: examples

      - run: uv run --all-extras --no-extra mcp-tasks python tests/import_examples.py

  # `browser-use` pins every one of its dependencies exactly, so the workspace lock excludes it
  # (`exclude-dependencies` in pyproject.toml) and no other job installs it. This one installs it on
  # top of the locked environment, getting the versions `pydantic-ai-harness[browser-use]` users get,
  # and runs and type-checks `BrowserUse` there.
  test-harness-browser-use:
    name: test harness browser-use
    needs: classify
    if: needs.classify.outputs.content_only != 'true' && needs.classify.outputs.clai2_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
      # Not yet for the harness suites: https://github.com/pydantic/pydantic-ai/issues/8821
      BLOCKBUSTER_ENABLED: "false"
      # No other job installs `browser-use`, so the `coverage` job sees `BrowserUse` only from here.
      COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
      COVERAGE_FILE: ${{ github.workspace }}/.coverage/.coverage.harness-browser-use
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-suffix: harness-browser-use

      - run: mkdir .coverage

      - run: uv sync --all-packages --all-extras --no-extra mcp-tasks --group lint
      # `--no-config`: the project's `exclude-dependencies` would otherwise drop the package too.
      - run: uv pip install --no-config "browser-use>=0.13.6,<0.14"
      - run: uv run --no-sync coverage run -m pytest tests/harness/browser_use
      - run: uv run --no-sync pyright -p tests/harness/browser_use
        env:
          PYRIGHT_PYTHON_IGNORE_WARNINGS: 1

      # See the matching step in the `test` job.
      - name: combine coverage files
        run: uv run --no-sync coverage combine

      - name: store coverage files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-harness-browser-use
          path: .coverage
          include-hidden-files: true

  # CLAI2 pastes images through Pillow's native macOS and Windows clipboard readers and through
  # `xclip` on Linux. Every other job runs on Linux and skips the opt-in native clipboard test, which
  # replaces the system clipboard: safe here, where each runner's clipboard belongs to this job alone.
  # Skipped on tags: a clipboard regression is caught on its PR and on `main`, and must not hold a release.
  test-clai2-clipboard:
    name: test clai2 clipboard on ${{ matrix.os }}
    needs: classify
    if: >-
      github.ref_type != 'tag'
      && needs.classify.outputs.content_only != 'true'
      && needs.classify.outputs.clai2_changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CI: true
      CLAI_TEST_CLIPBOARD: "1"
      # Drop the workflow-level `GIT_CONFIG_*` rewrite that puts the token in GitHub URLs: with it,
      # `actions/checkout`'s fetch hung on macOS runners until the job timed out. This job installs
      # no Git-sourced dependency, which is all the rewrite is for.
      GIT_CONFIG_COUNT: "0"
      GIT_CONFIG_KEY_0: ""
      GIT_CONFIG_VALUE_0: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-suffix: clai2-clipboard

      - run: uv sync --only-dev

      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xclip xvfb

      - name: run tests
        shell: bash
        run: |
          tests=(tests/clai2/test_image_input.py tests/clai2/test_image_clipboard_native.py)
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a uv run --package pydantic-clai2 pytest "${tests[@]}"
          else
            uv run --package pydantic-clai2 pytest "${tests[@]}"
          fi

  test-fastmcp-4:
    name: test FastMCP 4 compatibility
    needs: classify
    if: needs.classify.outputs.content_only != 'true' && needs.classify.outputs.clai2_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
      COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-suffix: fastmcp-4

      - run: mkdir .coverage

      # Keep the normal matrix locked to FastMCP 3 while `--with` gives these tests an isolated
      # FastMCP 4 environment without mutating the project environment.
      # TODO: Drop these package-specific cutoffs after 2026-08-14, when the pinned artifacts clear
      # the workspace's seven-day cooldown. Unrelated dependencies remain subject to the cooldown.
      # uv only opts direct requirements into prereleases, so the two beta distributions that
      # FastMCP pins transitively must also be named as direct requirements.
      - run: >-
          uv run
          --all-extras
          --no-extra mcp-tasks
          --all-packages
          --with "fastmcp[tasks]==4.0.0b2"
          --with "fastmcp-slim==4.0.0b2"
          --with "fastmcp-tasks==4.0.0b2"
          --exclude-newer-package "fastmcp=2026-08-08T00:00:00Z"
          --exclude-newer-package "fastmcp-slim=2026-08-08T00:00:00Z"
          --exclude-newer-package "fastmcp-tasks=2026-08-08T00:00:00Z"
          --exclude-newer-package "mcp=2026-08-08T00:00:00Z"
          --exclude-newer-package "mcp-types=2026-08-08T00:00:00Z"
          coverage run -m pytest
          tests/test_mcp.py
          tests/models/test_mcp_sampling.py
          tests/test_conftest.py
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage/.coverage.fastmcp-4

      # See the matching step in the `test` job. Plain `uv run`: combining is
      # environment-independent, so the FastMCP 4 `--with` overlay isn't needed.
      - name: combine coverage files
        run: uv run --all-extras --no-extra mcp-tasks --all-packages coverage combine
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage/.coverage.fastmcp-4

      - name: store coverage files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-fastmcp-4
          path: .coverage
          include-hidden-files: true

  # Live-service suites for the harness storage and AWS backends, outside `tests/` because they need
  # a real server. Each runs when its capability, the dependencies, or this workflow change, and
  # always on tags.
  harness-integration-changes:
    name: classify harness integration changes
    if: github.event_name == 'pull_request' || github.ref_type == 'branch'
    runs-on: ubuntu-latest
    outputs:
      localstack: ${{ steps.detect.outputs.localstack }}
      mongodb: ${{ steps.detect.outputs.mongodb }}
      redis: ${{ steps.detect.outputs.redis }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: detect
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          H=src/pydantic_ai_harness
          # `Makefile` because the jobs below run its `integration-*` targets.
          shared=(pyproject.toml uv.lock Makefile "$H/pyproject.toml" .github/workflows/ci.yml)
          detect() {
            local name=$1; shift
            if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "$@" "${shared[@]}"; then
              echo "$name=false" >> "$GITHUB_OUTPUT"
            else
              status=$?
              [ "$status" -eq 1 ] || exit "$status"
              echo "$name=true" >> "$GITHUB_OUTPUT"
            fi
          }
          detect localstack "$H/pydantic_ai_harness/localstack" tests/harness/localstack "$H/integration_tests/localstack"
          detect mongodb "$H/pydantic_ai_harness/step_persistence" "$H/pydantic_ai_harness/media" \
            tests/harness/step_persistence tests/harness/media "$H/integration_tests/mongodb"
          detect redis "$H/pydantic_ai_harness/spend" tests/harness/spend "$H/integration_tests/redis"

  harness-localstack-integration:
    name: harness LocalStack integration tests
    needs: [harness-integration-changes]
    # Also skipped where `LOCALSTACK_AUTH_TOKEN` is unreadable (fork and Dependabot pull requests):
    # `LOCALSTACK_REQUIRE_AUTH_TOKEN` turns a missing token into a failure, not a skip.
    # Disabled until the secret is set: https://github.com/pydantic/pydantic-ai/issues/8824
    if: >-
      ${{ false
          && always()
          && (github.ref_type == 'tag' || needs.harness-integration-changes.outputs.localstack == 'true')
          && (github.event_name != 'pull_request'
              || (github.event.pull_request.head.repo.full_name == github.repository
                  && github.actor != 'dependabot[bot]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOCALSTACK_REQUIRE_AUTH_TOKEN: "1"
      LOCALSTACK_AWS_CLI: aws
      LOCALSTACK_IMAGE: localstack/localstack
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: harness-localstack

      - uses: LocalStack/setup-localstack@7c8a0cb3405bc58be4c8f763f812aa000bc46303 # v0.3.2
        with:
          install-awslocal: "true"
          skip-startup: "true"

      - run: make integration-localstack
        env:
          # The job executes the full PR checkout, so path detection is not a security boundary.
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }} # zizmor: ignore[secrets-outside-env]

  harness-mongodb-integration:
    name: harness MongoDB integration tests
    needs: [harness-integration-changes]
    # No fork clause: the service below reads no secret.
    if: >-
      ${{ always()
          && (github.ref_type == 'tag' || needs.harness-integration-changes.outputs.mongodb == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # An unreachable server is a skip locally and must be a failure here.
      MONGODB_REQUIRE_LIVE: "1"
      MONGODB_TEST_URL: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: harness-mongodb

      - run: make integration-mongodb

  harness-redis-integration:
    name: harness Redis integration tests
    needs: [harness-integration-changes]
    if: >-
      ${{ always()
          && (github.ref_type == 'tag' || needs.harness-integration-changes.outputs.redis == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_REQUIRE_LIVE: "1"
      REDIS_TEST_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: harness-redis

      - run: make integration-redis

  # Release gate: resolve the workspace at the top of the ranges this tag declares and run the
  # suite there, so we can't publish a version whose own dependency ranges already admit an SDK
  # we cannot drive (the `anthropic` 1.0.0 case). Tag refs only — on every other event the job
  # skips, which `check` allows below. It runs alongside the test matrix rather than after it,
  # so it lands well before `coverage` and adds nothing to the critical path.
  latest-versions-canary:
    name: latest versions canary
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/latest-versions-canary.yml

  coverage:
    runs-on: ubuntu-latest
    needs: [classify, test, test-all-extras, test-durable-exec, test-lowest-versions, test-fastmcp-4, test-harness-browser-use]
    # A `pydantic-clai2`-only change skips every test job but `test`, and a skipped need would
    # otherwise skip this job too.
    if: ${{ !failure() && !cancelled() && needs.classify.outputs.content_only != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: get coverage files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true
          path: .coverage

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-suffix: dev

      - run: uv sync --group dev --group coverage
      - run: uv run --no-sync coverage combine
      # Only the `pydantic-clai2` cells ran for a change confined to it, so they can only vouch
      # for its own tests: the rest of the workspace is covered on the full path.
      - name: coverage report
        env:
          CLAI2_ONLY: ${{ needs.classify.outputs.clai2_only }}
        run: |
          if [ "$CLAI2_ONLY" = true ]; then
            uv run --no-sync coverage report --include='tests/clai2/*'
          else
            uv run --no-sync coverage report
          fi

      - run: uv run --no-sync strict-no-cover
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage/.coverage

  # https://github.com/marketplace/actions/alls-green#why used for branch protection checks
  check:
    if: always()
    needs:
      - classify
      - quality
      - mypy
      - docs-assets
      - docs-only
      - content-checks
      - test
      - test-all-extras
      - test-durable-exec
      - test-lowest-versions
      - test-temporal-latest
      - test-examples
      - test-fastmcp-4
      - test-harness-browser-use
      - test-clai2-clipboard
      - harness-integration-changes
      - harness-localstack-integration
      - harness-mongodb-integration
      - harness-redis-integration
      - latest-versions-canary
      - coverage
    runs-on: ubuntu-latest

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          # The canary is advisory because it tests dependency versions we do not lock; its failures
          # signal upstream drift rather than release blockers. It runs on tag refs only, and
          # `docs-only` covers published docs and assets; `content-checks` covers other
          # non-test content. Workflow and configuration changes keep the full test matrix.
          # Each reduced path must run its selected checks.
          # The harness integration jobs run only when their paths change (always on tags), and
          # LocalStack also skips where its secret is unreadable. `test-clai2-clipboard` runs only when
          # a change reaches `pydantic-clai2` (always on pushes to `main`), and never on tags.
          allowed-failures: latest-versions-canary
          allowed-skips: >-
            ${{
              needs.classify.outputs.content_only == 'true'
              && needs.classify.outputs.docs_changed == 'true'
              && 'quality,mypy,test,test-all-extras,test-durable-exec,test-lowest-versions,test-temporal-latest,test-examples,test-fastmcp-4,test-harness-browser-use,test-clai2-clipboard,harness-integration-changes,harness-localstack-integration,harness-mongodb-integration,harness-redis-integration,latest-versions-canary,coverage,content-checks'
              || needs.classify.outputs.content_only == 'true'
              && needs.classify.outputs.docs_changed != 'true'
              && 'quality,mypy,test,test-all-extras,test-durable-exec,test-lowest-versions,test-temporal-latest,test-examples,test-fastmcp-4,test-harness-browser-use,test-clai2-clipboard,harness-integration-changes,harness-localstack-integration,harness-mongodb-integration,harness-redis-integration,latest-versions-canary,coverage,docs-only,docs-assets'
              || needs.classify.outputs.clai2_only == 'true'
              && 'docs-only,content-checks,mypy,test-all-extras,test-durable-exec,test-lowest-versions,test-temporal-latest,test-examples,test-fastmcp-4,test-harness-browser-use,latest-versions-canary,harness-integration-changes,harness-localstack-integration,harness-mongodb-integration,harness-redis-integration'
              || github.ref_type == 'tag'
              && 'docs-only,content-checks,test-clai2-clipboard,harness-integration-changes,harness-localstack-integration'
              || 'docs-only,content-checks,latest-versions-canary,test-clai2-clipboard,harness-integration-changes,harness-localstack-integration,harness-mongodb-integration,harness-redis-integration'
            }}
          jobs: ${{ toJSON(needs) }}

  # `check` may succeed with intentionally skipped ancestors, so downstream jobs must override
  # GitHub's default success check and inspect the result of their direct dependency.
  # Note: this should match the `deploy-docs-manual` job in manually-deploy-docs.yml
  deploy-docs:
    needs: [check]
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.DOCS_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: unified-docs

      - name: Trigger unified-docs deployment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/pydantic/unified-docs/dispatches \
            --method POST \
            -f event_type=docs-update \
            -f "client_payload[source]=pydantic/pydantic-ai@${{ github.sha }}"

  # Build wheels in an isolated job with no publish credentials. If anything in
  # `uv build` (build backend, transitive build deps, restored cache) is
  # compromised, the OIDC token for PyPI is in a separate job that only runs
  # `pypi-publish` against the already-built artifacts.
  release-build:
    name: build release artifacts
    needs: [check]
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.check.result == 'success' }}
    runs-on: ubuntu-latest

    outputs:
      package-version: ${{ steps.inspect_package.outputs.version }}
      harness-version: ${{ steps.inspect_package.outputs.harness-version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - run: uv build --all-packages --no-sources

      - name: Smoke-test release wheels outside the workspace
        run: |
          smoke_dir=$(mktemp -d)
          uv venv "$smoke_dir"
          uv pip install --python "$smoke_dir/bin/python" dist/*.whl
          "$smoke_dir/bin/python" -I -c "import clai, pydantic_ai, pydantic_evals, pydantic_graph, pydantic_ai_harness, pydantic_clai2"
          "$smoke_dir/bin/pai" --help
          "$smoke_dir/bin/clai" --help
          "$smoke_dir/bin/clai2" --help

      - name: Inspect package version
        id: inspect_package
        run: |
          uv tool install --with uv-dynamic-versioning hatchling
          version=$(uvx hatchling version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          harness_version=$(cd src/pydantic_ai_harness && uvx hatchling version)
          echo "harness-version=$harness_version" >> "$GITHUB_OUTPUT"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/

  release:
    name: publish to PyPI
    needs: [release-build]
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.release-build.result == 'success' }}
    runs-on: ubuntu-latest

    environment:
      name: release
      url: https://pypi.org/project/pydantic-ai/${{ needs.release-build.outputs.package-version }}

    permissions:
      id-token: write

    outputs:
      package-version: ${{ needs.release-build.outputs.package-version }}

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true

  gh-aw-engine-pin:
    name: gh-aw engine / read pin
    needs: [release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `uv run --script` resolves the guard script's dependencies from PyPI without a lockfile, so it
    # runs in its own job, on its own runner, with no write token: a step can extend `GITHUB_PATH`
    # for the steps after it, so a separate step would not keep a dependency away from the token.
    permissions:
      contents: read
    # The workflow-level `GIT_CONFIG_*` would otherwise carry the token here. Nothing here installs
    # from git.
    env:
      GIT_CONFIG_COUNT: '0'
      GIT_CONFIG_KEY_0: ''
      GIT_CONFIG_VALUE_0: ''
    outputs:
      version: ${{ steps.engine.outputs.version }}
    steps:
      # Consumers compile the definition from the default branch, which may have moved past the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - id: engine
        run: |
          version=$(uv run --script src/pydantic_ai_harness/scripts/gh_aw_engine_version.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # `src/pydantic_ai_harness/gh-aw/pydantic.md` pins the `pydantic-ai-harness` release a generated
  # gh-aw workflow installs, and consumers compile the definition straight from the default branch.
  # Shipping a bump is therefore an ordinary pull request against that file, and this job publishes
  # nothing: it only notices that the harness release just cut is not the release the definition
  # names, and asks for that pull request.
  #
  # An issue rather than a pull request, because a pull request opened with GITHUB_TOKEN triggers no
  # workflow runs: it would arrive with none of this repository's required checks.
  gh-aw-engine-pin-reminder:
    name: gh-aw engine / pin reminder
    needs: [release-build, gh-aw-engine-pin]
    if: ${{ !cancelled() && needs.gh-aw-engine-pin.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Ask for a pin bump when the release moved past the definition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PINNED: ${{ needs.gh-aw-engine-pin.outputs.version }}
          # The harness releases as `0.<minor>.<patch>` with every tag, so the tag name is not
          # the version the engine installs.
          RELEASED: ${{ needs.release-build.outputs.harness-version }}
        run: |
          pinned="$PINNED"
          released="$RELEASED"
          # The harness version carries no pre-release stage, so the tag is what tells a final
          # release apart, and a pre-release is not a pin consumers should move to.
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "${GITHUB_REF_NAME} is not a final release."
            exit 0
          fi
          if [ "$pinned" = "$released" ]; then
            echo "The gh-aw engine definition already pins ${released}."
            exit 0
          fi

          title="Bump the gh-aw engine pin to ${released}"
          # `--search` matches words rather than the phrase, so it narrows the
          # listing and the exact title is compared here.
          existing_titles=$(gh issue list --state open --search "${title} in:title" \
            --json title --jq '.[].title')
          if grep -qxF "${title}" <<< "$existing_titles"; then
            echo "An open issue already asks for this: ${title}"
            exit 0
          fi

          # A heredoc rather than an inline `--body`: the body is Markdown with
          # blank lines and backticks, and only `$pinned` and `$released` are
          # meant to expand.
          cat > "${RUNNER_TEMP}/pin-reminder.md" <<EOF
          \`src/pydantic_ai_harness/gh-aw/pydantic.md\` on the default branch still pins \`engine.version: ${pinned}\`, and pydantic-ai-harness ${released} is now released.

          gh-aw compiles that file from the default branch, so a pull request bumping \`engine.version\` to ${released} is what ships the new pin: consumers pick it up on their next recompile.

          Lint refuses a pin PyPI does not serve, so that pull request goes green once ${released} is on PyPI.
          EOF

          gh issue create --title "${title}" --body-file "${RUNNER_TEMP}/pin-reminder.md"
