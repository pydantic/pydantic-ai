name: Temporary Claude gateway probe

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  probe: # zizmor: ignore[secrets-outside-env] -- temporary probe restricted to this maintainer-owned branch
    name: Probe Claude gateway authentication
    if: github.event.pull_request.head.ref == 'codex/fix-pr-category-labeling'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Probe gateway HTTP authentication modes
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.CLAUDE_CODE_BASE_URL }}
          GATEWAY_KEY: ${{ secrets.CLAUDE_CODE_API_KEY }}
        run: |
          probe() {
            auth_name="$1"
            auth_header="$2"
            model="$3"
            response_file="$RUNNER_TEMP/claude-gateway-$auth_name.json"
            request_body=$(jq -nc --arg model "$model" '{model: $model, max_tokens: 1, messages: [{role: "user", content: "."}]}')
            curl_args=()
            if [ -n "$auth_header" ]; then
              curl_args+=(--header "$auth_header")
            fi
            metadata=$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}|%{content_type}|%{size_download}' \
              --request POST "$ANTHROPIC_BASE_URL/v1/messages" \
              "${curl_args[@]}" \
              --header 'anthropic-version: 2023-06-01' \
              --header 'content-type: application/json' \
              --data "$request_body") || metadata='000|none|0'
            IFS='|' read -r status content_type size_download <<< "$metadata"
            response_type=$(jq -r '.error.type // .type // "json-other"' "$response_file" 2>/dev/null || true)
            if [ -z "$response_type" ]; then
              if rg --ignore-case --quiet 'cloudflare|cf-ray|web application firewall|waf' "$response_file"; then
                response_type=edge-firewall
              elif rg --ignore-case --quiet 'api.?key|token|credential|unauthori[sz]ed|revoked' "$response_file"; then
                response_type=credential
              elif rg --ignore-case --quiet 'quota|billing|credit|spend|rate.?limit' "$response_file"; then
                response_type=quota
              elif rg --ignore-case --quiet 'forbidden|access denied|permission|blocked' "$response_file"; then
                response_type=access-policy
              elif rg --ignore-case --quiet 'model|route|deployment' "$response_file"; then
                response_type=model-route
              elif rg --ignore-case --quiet 'disabled|deactivated|inactive|suspended|expired' "$response_file"; then
                response_type=disabled
              elif rg --ignore-case --quiet 'account|organi[sz]ation|workspace|team' "$response_file"; then
                response_type=account-policy
              elif rg --ignore-case --quiet 'subscription|plan|entitlement|tier' "$response_file"; then
                response_type=entitlement
              elif rg --ignore-case --quiet 'usage|capacity|temporar|available|service' "$response_file"; then
                response_type=service-policy
              else
                response_type=unclassified
              fi
            fi
            response_hash=$(sha256sum "$response_file" | cut -c1-12)
            echo "$auth_name: HTTP $status; content-type $content_type; bytes $size_download; class $response_type; fingerprint $response_hash"
          }

          probe no-auth '' claude-opus-4-8
          probe x-api-key-opus "x-api-key: $GATEWAY_KEY" claude-opus-4-8
          probe bearer-opus "Authorization: Bearer $GATEWAY_KEY" claude-opus-4-8
          probe x-api-key-sonnet "x-api-key: $GATEWAY_KEY" claude-sonnet-4-6
          probe x-api-key-haiku "x-api-key: $GATEWAY_KEY" claude-haiku-4-5-20251001
