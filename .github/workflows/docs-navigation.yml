# description: Requests navigation validation and same-repository rendered previews from pydantic/unified-docs when trigger:docs-preview is applied.
name: Docs Navigation Check

# Adding `trigger:docs-preview` requests navigation validation and a rendered
# preview for same-repository PRs. Fork PRs receive navigation validation only.
#
# This workflow only dispatches; validation, rendering, and final reports run in
# unified-docs. It never checks out or executes PR content. The label is removed
# after dispatch; re-add it after source changes.

on:
  # zizmor: ignore[dangerous-triggers] -- pull_request_target is required so fork PRs can
  # access the DOCS_APP credentials. The dispatch explicitly verifies that the label
  # actor has write access, and this workflow does not check out or execute PR code.
  pull_request_target:
    types: [labeled]

permissions: {}

concurrency:
  group: docs-navigation-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch Docs Navigation Check
    if: github.event.label.name == 'trigger:docs-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Needed to post the "queued" comment and to remove the trigger:docs-preview label.
      pull-requests: write

    steps:
      - name: Verify a maintainer triggered the check
        id: verify
        env:
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          permission=$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" --jq .permission)
          case "$permission" in
            admin|maintain|write) ;;
            *)
              echo "${ACTOR} does not have permission to dispatch a docs navigation check" >&2
              exit 1
              ;;
          esac

      - name: Generate app token (for dispatching to unified-docs)
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DOCS_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: unified-docs
          permission-contents: write

      - name: Dispatch navigation check
        id: dispatch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          gh api repos/pydantic/unified-docs/dispatches \
            --method POST \
            -f event_type=docs-preview \
            -f "client_payload[library]=ai" \
            -f "client_payload[source_repo]=${REPO}" \
            -f "client_payload[source_pr]=${PR_NUMBER}" \
            -f "client_payload[source_sha]=${HEAD_SHA}"

      - name: Acknowledge on PR
        id: acknowledge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          sha7=$(echo "$HEAD_SHA" | cut -c1-7)
          body=$(cat <<EOF
          ## Docs Navigation Check — queued

          Navigation validation for commit \`${sha7}\` has been queued. A rendered preview is also requested for same-repository PRs. \`pydantic-docs[bot]\` posts separate result comments on this PR; fork PRs receive navigation validation only.
          EOF
          )

          # Update an existing navigation or legacy preview comment on reruns.
          # `gh api` rejects `--slurp` together with `--jq`, so the filter runs in a
          # separate `jq`. `--slurp` is what makes the pages one array of arrays, which
          # is why the filter opens with `.[][]`.
          existing=$(gh api --paginate --slurp "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" \
            | jq -r '([.[][] | select(.user.login == "github-actions[bot]" and ((.body | startswith("## Docs Navigation Check")) or (.body | startswith("## Docs Preview"))))] | last).url // empty')
          if [ -n "$existing" ]; then
            gh api -X PATCH "$existing" -f body="$body"
          else
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$body"
          fi

      - name: Comment failure on PR
        if: failure() && (steps.verify.outcome == 'failure' || steps.app-token.outcome == 'failure' || steps.dispatch.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(cat <<EOF
          ## Docs Navigation Check — dispatch failed

          The docs validation request could not be queued. See [the workflow run](${RUN_URL}) for details.

          <sub>Re-add the \`trigger:docs-preview\` label to retry.</sub>
          EOF
          )
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$body"

      - name: Report acknowledgement failure on PR
        if: failure() && steps.dispatch.outcome == 'success' && steps.acknowledge.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(cat <<EOF
          ## Docs Navigation Check — queued

          The docs validation request was queued, but this workflow could not post its normal acknowledgement. See [the workflow run](${RUN_URL}) for details.
          EOF
          )
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$body"

      - name: Remove trigger:docs-preview label
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh api -X DELETE "repos/${REPO}/issues/${PR_NUMBER}/labels/trigger:docs-preview" || true
