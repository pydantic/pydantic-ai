name: CLAI 2 web

on:
  workflow_call:
    inputs:
      npm-cache:
        description: Whether the web UI build may restore npm downloads. Pass `false` when a caller publishes this build.
        type: string
        default: "true"

permissions:
  contents: read

jobs:
  web-ui:
    name: build web UI and run browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: true
      CLAI2_BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The tests and packages below use this build, not the committed bundle, which `main`
      # refreshes only after a web UI change merges (`clai2-web-bundle.yml`).
      - uses: ./.github/actions/build-clai2-web-ui
        with:
          npm-cache: ${{ inputs.npm-cache }}

      # Two pull requests that each commit a rebuilt minified bundle conflict on it even when their
      # sources merge cleanly, which kept ejecting them from the merge queue (#11554). So a pull
      # request changes the bundle only to commit the build of `main`'s sources, as
      # `clai2-web-bundle.yml` does, and changes nothing else. `HEAD` is the pull request's merge
      # commit, or its merge group entry, so its first parent is what it merges into. The merge
      # queue checks again, so a bundle refresh a later web UI change made stale does not land.
      - name: Check the pull request leaves the built web UI to `main`
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        env:
          STATIC: src/pydantic_clai2/pydantic_clai2/builtin_plugins/web/static
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          if ! grep -q "^$STATIC/" <<< "$changed"; then
            exit 0
          fi
          if grep -qv "^$STATIC/" <<< "$changed"; then
            echo "::error::Do not commit the built web UI in $STATIC: after this merges, the 'CLAI 2 web bundle' workflow rebuilds it on main. Restore it with: git checkout origin/main -- $STATIC"
            exit 1
          fi
          if ! git diff --quiet -- "$STATIC" || [[ -n "$(git status --porcelain --untracked-files=all -- "$STATIC")" ]]; then
            git status --short --untracked-files=all -- "$STATIC"
            echo "::error::The committed web UI in $STATIC is not the build of this commit's src/pydantic_clai2/web-ui."
            exit 1
          fi

      # `clai2-bleeding.yml` and the release build in `ci.yml` publish this build, so the jobs that
      # package and publish run no npm code.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clai2-web-static
          path: src/pydantic_clai2/pydantic_clai2/builtin_plugins/web/static
          if-no-files-found: error
          # A release rerun ("Re-run failed jobs") downloads it again, maybe days later.
          retention-days: ${{ github.ref_type == 'tag' && 30 || 1 }}
          # A rerun of the job uploads the same name again.
          overwrite: true

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.13'
          enable-cache: true
          cache-suffix: clai2-web

      - name: Build and validate wheel and source distribution assets
        shell: bash
        run: |
          uv build --no-sources --package pydantic-clai2 --out-dir "$RUNNER_TEMP/clai2-web-dist"
          uv venv "$RUNNER_TEMP/clai2-web-package"
          for kind in whl tar.gz; do
            uv pip install --python "$RUNNER_TEMP/clai2-web-package/bin/python" --no-deps --reinstall "$RUNNER_TEMP"/clai2-web-dist/*.$kind
            "$RUNNER_TEMP/clai2-web-package/bin/python" -I src/pydantic_clai2/scripts/check_web_assets.py src/pydantic_clai2/pydantic_clai2/builtin_plugins/web/static
          done

      - name: Install CLAI 2 and test dependencies
        run: uv sync --locked --package pydantic-clai2 --group dev --group clai2-browser

      - name: Install Chromium
        run: uv run --no-sync playwright install --with-deps chromium

      - name: Run web browser tests and check `Guard` coverage
        env:
          COVERAGE_FILE: ${{ runner.temp }}/clai2-web.coverage
        run: |
          uv run --no-sync coverage run --branch --include='*/builtin_plugins/web/app.py' -m pytest tests/clai2/browser tests/clai2/test_web.py::test_access_checks tests/clai2/test_web.py::test_lifespan_passes_through
          uv run --no-sync coverage combine
          uv run --no-sync coverage json --fail-under=0 -o "$RUNNER_TEMP/clai2-web-coverage.json"
          jq -e '[.files[] | .classes.Guard? // empty] as $guards | ($guards | length) == 1 and $guards[0].missing_lines == [] and $guards[0].missing_branches == []' "$RUNNER_TEMP/clai2-web-coverage.json"
