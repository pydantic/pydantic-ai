updates:
- directory: /src/pydantic_clai2/web-ui
  labels:
  - dependencies
  - web-ui
  - pkg:clai2
  open-pull-requests-limit: 0
  package-ecosystem: npm # zizmor: ignore[dependabot-cooldown] -- Security-only updates; cooldown applies only to version updates.
  schedule:
    interval: monthly
- cooldown:
    default-days: 7
  directory: /
  groups:
    python-packages:
      patterns:
      - "*"
  # Setting `labels` replaces Dependabot's defaults (`dependencies` plus the ecosystem label),
  # so they are listed again next to `pkg:core`, which the `Package Label` check requires.
  labels:
  - dependencies
  - python:uv
  - pkg:core
  package-ecosystem: uv
  schedule:
    interval: monthly
- cooldown:
    default-days: 7
  directory: /
  groups:
    github-actions:
      patterns:
      - "*"
  ignore:
  - dependency-name: "github/gh-aw-actions/**" # Managed by gh aw compile. Version-locked to the gh-aw compiler; do not bump.
  labels:
  - dependencies
  - github_actions
  - pkg:core
  package-ecosystem: github-actions
  schedule:
    interval: monthly
version: 2
