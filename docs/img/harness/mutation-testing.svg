<svg xmlns="http://www.w3.org/2000/svg" width="880" height="657" viewBox="0 0 880 657" role="img" aria-labelledby="t d">
<title id="t">Mutation testing: check that the tests pin the behavior down</title>
<desc id="d">mutmut makes small changes, called mutants, to the filesystem and shell toolset sources and runs the test suite against each one. A mutant that makes a test fail is killed. A mutant that survives is triaged: either a test is missing and should be written, or the change is an equivalent mutant that no test could tell apart from the original, such as a mutated default parameter that the mutmut wrapper never uses.</desc>
