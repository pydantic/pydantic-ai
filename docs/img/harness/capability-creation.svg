<svg xmlns="http://www.w3.org/2000/svg" width="880" height="631" viewBox="0 0 880 631" role="img" aria-labelledby="t d">
<title id="t">Capability Creation: the agent writes capabilities for its next run</title>
<desc id="d">In one run the model calls author_capability with a name and Python source. CapabilityCreation writes it to &lt;directory&gt;/&lt;name&gt;.py, imports it, checks that it holds exactly one AbstractCapability subclass that constructs with no arguments, calls its static getters, and records it in manifest.json. The capability is not live in that run. Your loop calls creation.store.load_active() and passes the result to the next agent.run as capabilities, so its tools, hooks and instructions take effect there. The authored code runs in the agent process, so a run requires a writable LocalWorkspace.</desc>
