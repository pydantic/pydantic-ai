<svg xmlns="http://www.w3.org/2000/svg" width="880" height="646" viewBox="0 0 880 646" role="img" aria-labelledby="t d">
<title id="t">Step Persistence: save a run so you can continue or fork it later</title>
<desc id="d">StepPersistence hooks write a RunRecord, step events, tool effects, and complete snapshots to a step store. A crash mid-tool-call leaves that effect at started, unknown after the crash. Later, any process finds the run with list_runs, loads it with continue_run, and passes its messages to a new Agent.run.</desc>
<defs><marker id="ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#092224"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#55726A"/></marker><marker id="al" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B417B7"/></marker><marker id="al2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E520E9"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7B57E8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E9C86"/></marker><marker id="ac" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E5533D"/></marker><marker id="af" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8FA8A3"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#97998B"/></marker></defs>
<rect x="0.5" y="0.5" width="879" height="645" rx="16" fill="#FFFFFF" stroke="#E6EAEA"/>
<text x="32" y="50" font-size="21" fill="#092224" text-anchor="start" font-weight="700" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Step Persistence: save a run so you can continue or fork it later</text>
<text x="32" y="78" font-size="14.5" fill="#55726A" text-anchor="start" font-weight="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Each run records step events, a tool-effect ledger, and message-history snapshots in a store you choose.</text>
<text x="32" y="98" font-size="14.5" fill="#55726A" text-anchor="start" font-weight="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">After a crash, your code continues from the last complete snapshot.</text>
<rect x="32" y="130" width="560" height="136" rx="10" fill="#092224"/>
<text x="46" y="154" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve"><tspan fill="#FBFFEA">store = </tspan><tspan fill="#77FFD8">SqliteStepStore</tspan><tspan fill="#FBFFEA">(database=</tspan><tspan fill="#FFD4E5">&#x27;runs.db&#x27;</tspan><tspan fill="#FBFFEA">)</tspan></text>
<text x="46" y="173" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve"><tspan fill="#FBFFEA">agent = </tspan><tspan fill="#77FFD8">Agent</tspan><tspan fill="#FBFFEA">(</tspan></text>
<text x="46" y="192" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve"><tspan fill="#FBFFEA">    model,</tspan></text>
<text x="46" y="211" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve"><tspan fill="#FBFFEA">    capabilities=[</tspan><tspan fill="#77FFD8">StepPersistence</tspan><tspan fill="#FBFFEA">(store=store, agent_name=</tspan><tspan fill="#FFD4E5">&#x27;librarian&#x27;</tspan><tspan fill="#FBFFEA">)],</tspan></text>
<text x="46" y="230" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve"><tspan fill="#FBFFEA">)</tspan></text>
<text x="46" y="249" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve"><tspan fill="#F07CF3">await </tspan><tspan fill="#FBFFEA">agent.run(prompt, conversation_id=</tspan><tspan fill="#FFD4E5">&#x27;libr-conv&#x27;</tspan><tspan fill="#FBFFEA">)</tspan></text>
<text letter-spacing="1.3" x="614" y="144" font-size="11" fill="#55726A" text-anchor="start" font-weight="700" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">SETUP</text>
<text x="614" y="168" font-size="12.5" fill="#55726A" text-anchor="start" font-weight="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Other stores: InMemoryStepStore,</text>
<text x="614" y="185.8" font-size="12.5" fill="#55726A" text-anchor="start" font-weight="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">FileStepStore, MongoStepStore,</text>
