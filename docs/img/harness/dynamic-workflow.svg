<svg xmlns="http://www.w3.org/2000/svg" width="880" height="606" viewBox="0 0 880 606" role="img" aria-labelledby="t d">
<title id="t">Dynamic Workflow: coordinate sub-agents with one script</title>
<desc id="d">The orchestrator agent has one tool, run_workflow. Its model writes a Python script that runs in the Monty sandbox, where each sub-agent is an async function: the script runs reviewer twice in parallel with asyncio.gather, then passes both reports to summarizer. Each call is a separate sub-agent run with its own model loop. Only the script&#x27;s final value, the summary, goes back to the orchestrator&#x27;s next model request.</desc>
<defs><marker id="ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#092224"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#55726A"/></marker><marker id="al" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B417B7"/></marker><marker id="al2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E520E9"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7B57E8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E9C86"/></marker><marker id="ac" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E5533D"/></marker><marker id="af" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8FA8A3"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#97998B"/></marker></defs>
<rect x="0.5" y="0.5" width="879" height="605" rx="16" fill="#FFFFFF" stroke="#E6EAEA"/>
<text x="32" y="50" font-size="21" fill="#092224" text-anchor="start" font-weight="700" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Dynamic Workflow: coordinate sub-agents with one script</text>
<text x="32" y="78" font-size="14.5" fill="#55726A" text-anchor="start" font-weight="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">The orchestrator gets one tool, run_workflow. Its model writes Python that calls your sub-agents as async functions, so</text>
<text x="32" y="98" font-size="14.5" fill="#55726A" text-anchor="start" font-weight="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">fan-out, chaining and retries run in one tool call.</text>
<rect x="32" y="130" width="590" height="98" rx="10" fill="#092224"/>
<text x="46" y="154" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve"><tspan fill="#FBFFEA">reviewer = </tspan><tspan fill="#77FFD8">Agent</tspan><tspan fill="#FBFFEA">(model, name=</tspan><tspan fill="#FFD4E5">&#x27;reviewer&#x27;</tspan><tspan fill="#FBFFEA">, description=</tspan><tspan fill="#FFD4E5">&#x27;Reviews code for bugs.&#x27;</tspan><tspan fill="#FBFFEA">)</tspan></text>
<text x="46" y="173" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve"><tspan fill="#FBFFEA">summarizer = </tspan><tspan fill="#77FFD8">Agent</tspan><tspan fill="#FBFFEA">(model, name=</tspan><tspan fill="#FFD4E5">&#x27;summarizer&#x27;</tspan><tspan fill="#FBFFEA">, description=</tspan><tspan fill="#FFD4E5">&#x27;...&#x27;</tspan><tspan fill="#FBFFEA">)</tspan></text>
<text x="46" y="192" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve"><tspan fill="#FBFFEA">orchestrator = </tspan><tspan fill="#77FFD8">Agent</tspan><tspan fill="#FBFFEA">(model, capabilities=[</tspan></text>
<text x="46" y="211" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve"><tspan fill="#FBFFEA">    </tspan><tspan fill="#77FFD8">DynamicWorkflow</tspan><tspan fill="#FBFFEA">(agents=[reviewer, summarizer], max_agent_calls=</tspan><tspan fill="#B9A3FF">50</tspan><tspan fill="#FBFFEA">)])</tspan></text>
<text letter-spacing="1.3" x="644" y="144" font-size="11" fill="#55726A" text-anchor="start" font-weight="700" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">SETUP</text>
<text x="644" y="168" font-size="12.5" fill="#55726A" text-anchor="start" font-weight="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Each sub-agent&#x27;s name becomes a</text>
<text x="644" y="185.8" font-size="12.5" fill="#55726A" text-anchor="start" font-weight="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">function in the script, and its</text>
<text x="644" y="203.5" font-size="12.5" fill="#55726A" text-anchor="start" font-weight="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">description the docstring.</text>
<rect x="32" y="262" width="180" height="226" rx="14" fill="none" stroke="#8FA8A3" stroke-width="1.3" stroke-dasharray="4 4"/>
<rect x="46" y="254" width="128.1" height="16" rx="4" fill="#FFFFFF"/>
<text letter-spacing="1.3" x="53" y="266" font-size="11" fill="#55726A" text-anchor="start" font-weight="700" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">ORCHESTRATOR</text>
<rect x="252" y="262" width="376" height="226" rx="14" fill="none" stroke="#B417B7" stroke-width="1.3" stroke-dasharray="4 4"/>
<rect x="266" y="254" width="136.1" height="16" rx="4" fill="#FFFFFF"/>
<text letter-spacing="1.3" x="273" y="266" font-size="11" fill="#B417B7" text-anchor="start" font-weight="700" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">MONTY SANDBOX</text>
<rect x="668" y="262" width="180" height="226" rx="14" fill="none" stroke="#8FA8A3" stroke-width="1.3" stroke-dasharray="4 4"/>
<rect x="682" y="254" width="141.5" height="16" rx="4" fill="#FFFFFF"/>
<text letter-spacing="1.3" x="689" y="266" font-size="11" fill="#55726A" text-anchor="start" font-weight="700" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">SUB-AGENT RUNS</text>
<rect x="62" y="288" width="120" height="36" rx="18" fill="#092224"/>
<text x="122" y="311" font-size="13.5" fill="#FBFFEA" text-anchor="middle" font-weight="700" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">request 1</text>
<line x1="122" y1="326" x2="122" y2="350" stroke="#092224" stroke-width="1.6" marker-end="url(#ai)"/>
<rect x="69.1" y="352" width="105.8" height="24" rx="6" fill="#FDEAFD" stroke="#B417B7" stroke-width="1.2"/>
<text x="122" y="368.3" font-size="12" fill="#092224" text-anchor="middle" font-weight="500" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">run_workflow</text>
<rect x="62" y="430" width="120" height="36" rx="18" fill="#092224"/>
<text x="122" y="453" font-size="13.5" fill="#FBFFEA" text-anchor="middle" font-weight="700" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">request 2</text>
<rect x="266" y="282" width="348" height="136" rx="10" fill="#092224"/>
<text x="280" y="306" font-size="11.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve"><tspan fill="#8FA8A3"># written by the orchestrator model</tspan></text>
<text x="280" y="325" font-size="11.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve"><tspan fill="#FBFFEA">reports = </tspan><tspan fill="#F07CF3">await </tspan><tspan fill="#FBFFEA">asyncio.gather(</tspan></text>
<text x="280" y="344" font-size="11.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve"><tspan fill="#FBFFEA">    </tspan><tspan fill="#77FFD8">reviewer</tspan><tspan fill="#FBFFEA">(task=</tspan><tspan fill="#FFD4E5">&#x27;Review auth.py ...&#x27;</tspan><tspan fill="#FBFFEA">),</tspan></text>
<text x="280" y="363" font-size="11.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve"><tspan fill="#FBFFEA">    </tspan><tspan fill="#77FFD8">reviewer</tspan><tspan fill="#FBFFEA">(task=</tspan><tspan fill="#FFD4E5">&#x27;Review parser.py ...&#x27;</tspan><tspan fill="#FBFFEA">),</tspan></text>
<text x="280" y="382" font-size="11.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve"><tspan fill="#FBFFEA">)</tspan></text>
<text x="280" y="401" font-size="11.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve"><tspan fill="#F07CF3">await </tspan><tspan fill="#77FFD8">summarizer</tspan><tspan fill="#FBFFEA">(task=</tspan><tspan fill="#FFD4E5">&#x27;\n&#x27;</tspan><tspan fill="#FBFFEA">.join(reports))</tspan></text>
<line x1="176.9" y1="364" x2="264" y2="364" stroke="#092224" stroke-width="1.6" marker-end="url(#ai)"/>
<text x="266" y="440" font-size="12" fill="#55726A" text-anchor="start" font-weight="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Type-checked against the sub-agent signatures before it runs.</text>
<text x="266" y="460" font-size="12" fill="#55726A" text-anchor="start" font-weight="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">max_agent_calls caps the sub-agent runs in one parent run.</text>
<path d="M 264 402 L 132 402 Q 122 402 122 412 L 122 428" stroke="#55726A" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#am)"/>
<text x="114" y="420" font-size="12" fill="#55726A" text-anchor="end" font-weight="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">summary only</text>
<rect x="680" y="286" width="156" height="40" rx="10" fill="#FFFFFF" stroke="#092224" stroke-width="1.4"/>
<text x="758" y="300.4" font-size="12.5" fill="#092224" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">reviewer</text>
<text x="758" y="318.8" font-size="11.5" fill="#55726A" text-anchor="middle" font-weight="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">auth.py</text>
<line x1="616" y1="301" x2="678" y2="301" stroke="#092224" stroke-width="1.6" marker-end="url(#ai)"/>
<line x1="678" y1="313" x2="616" y2="313" stroke="#55726A" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#am)"/>
<rect x="680" y="336" width="156" height="40" rx="10" fill="#FFFFFF" stroke="#092224" stroke-width="1.4"/>
<text x="758" y="350.4" font-size="12.5" fill="#092224" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">reviewer</text>
<text x="758" y="368.8" font-size="11.5" fill="#55726A" text-anchor="middle" font-weight="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">parser.py</text>
<line x1="616" y1="351" x2="678" y2="351" stroke="#092224" stroke-width="1.6" marker-end="url(#ai)"/>
<line x1="678" y1="363" x2="616" y2="363" stroke="#55726A" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#am)"/>
<rect x="680" y="386" width="156" height="40" rx="10" fill="#FFFFFF" stroke="#092224" stroke-width="1.4"/>
<text x="758" y="400.4" font-size="12.5" fill="#092224" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">summarizer</text>
<text x="758" y="418.8" font-size="11.5" fill="#55726A" text-anchor="middle" font-weight="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">both reports</text>
<line x1="616" y1="401" x2="678" y2="401" stroke="#092224" stroke-width="1.6" marker-end="url(#ai)"/>
<line x1="678" y1="413" x2="616" y2="413" stroke="#55726A" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#am)"/>
<text x="680" y="452" font-size="12" fill="#55726A" text-anchor="start" font-weight="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Each has its own model</text>
<text x="680" y="469" font-size="12" fill="#55726A" text-anchor="start" font-weight="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">loop and history.</text>
<text x="32" y="518" font-size="12.5" fill="#55726A" text-anchor="start" font-weight="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">The two reports stay in the sandbox: only the script&#x27;s last value reaches the orchestrator. A sub-agent failure raises RuntimeError in the</text>
<text x="32" y="535.8" font-size="12.5" fill="#55726A" text-anchor="start" font-weight="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">script; an uncaught one makes the model retry.</text>
<rect x="32" y="558.5" width="14" height="14" rx="7" fill="#092224" stroke="#092224" stroke-width="1.2"/>
<text x="52" y="569.5" font-size="12" fill="#55726A" text-anchor="start" font-weight="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">orchestrator model request</text>
<rect x="229" y="558.5" width="14" height="14" rx="4" fill="#FDEAFD" stroke="#B417B7" stroke-width="1.2"/>
<text x="249" y="569.5" font-size="12" fill="#55726A" text-anchor="start" font-weight="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">added by DynamicWorkflow</text>
<rect x="424.9" y="558.5" width="14" height="14" rx="4" fill="#FFFFFF" stroke="#092224" stroke-width="1.2"/>
<text x="444.9" y="569.5" font-size="12" fill="#55726A" text-anchor="start" font-weight="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">your sub-agents</text>
