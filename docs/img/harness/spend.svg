<svg xmlns="http://www.w3.org/2000/svg" width="880" height="646" viewBox="0 0 880 646" role="img" aria-labelledby="t d">
<title id="t">Spend: budgets that outlast one run</title>
<desc id="d">SpendLimits checks every budget window before each model request and adds the response&#x27;s price after it. Once the day window is spent, the next request raises SpendLimitExceeded and is not sent. The store can be in memory, Redis or PostgreSQL; the shared stores give several workers one counter.</desc>
<defs><marker id="ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#092224"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#55726A"/></marker><marker id="al" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B417B7"/></marker><marker id="al2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E520E9"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7B57E8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E9C86"/></marker><marker id="ac" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E5533D"/></marker><marker id="af" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8FA8A3"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#97998B"/></marker></defs>
<rect x="0.5" y="0.5" width="879" height="645" rx="16" fill="#FFFFFF" stroke="#E6EAEA"/>
<text x="32" y="50" font-size="21" fill="#092224" text-anchor="start" font-weight="700" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Spend: budgets that outlast one run</text>
<text x="32" y="78" font-size="14.5" fill="#55726A" text-anchor="start" font-weight="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">SpendLimits adds each response&#x27;s price to every budget window it counts against,</text>
<text x="32" y="98" font-size="14.5" fill="#55726A" text-anchor="start" font-weight="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">and refuses the next request once a window is spent.</text>
<rect x="32" y="130" width="580" height="136" rx="10" fill="#092224"/>
<text x="46" y="154" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve"><tspan fill="#FBFFEA">budgets = [</tspan></text>
<text x="46" y="173" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve"><tspan fill="#FBFFEA">    Budget(usd=Decimal(</tspan><tspan fill="#FFD4E5">&#x27;5&#x27;</tspan><tspan fill="#FBFFEA">), window=</tspan><tspan fill="#FFD4E5">&#x27;run&#x27;</tspan><tspan fill="#FBFFEA">),</tspan></text>
<text x="46" y="192" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve"><tspan fill="#FBFFEA">    Budget(usd=Decimal(</tspan><tspan fill="#FFD4E5">&#x27;100&#x27;</tspan><tspan fill="#FBFFEA">), window=</tspan><tspan fill="#FFD4E5">&#x27;day&#x27;</tspan><tspan fill="#FBFFEA">),</tspan></text>
<text x="46" y="211" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve"><tspan fill="#FBFFEA">    Budget(usd=Decimal(</tspan><tspan fill="#FFD4E5">&#x27;10&#x27;</tspan><tspan fill="#FBFFEA">), window=</tspan><tspan fill="#FFD4E5">&#x27;day&#x27;</tspan><tspan fill="#FBFFEA">, scope=tenant, name=</tspan><tspan fill="#FFD4E5">&#x27;tenant&#x27;</tspan><tspan fill="#FBFFEA">),</tspan></text>
<text x="46" y="230" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve"><tspan fill="#FBFFEA">]</tspan></text>
<text x="46" y="249" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve"><tspan fill="#77FFD8">SpendLimits</tspan><tspan fill="#FBFFEA">(budgets=budgets, store=</tspan><tspan fill="#77FFD8">RedisSpendStore</tspan><tspan fill="#FBFFEA">(redis))</tspan></text>
<text letter-spacing="1.3" x="634" y="144" font-size="11" fill="#55726A" text-anchor="start" font-weight="700" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">SETUP</text>
<text x="634" y="168" font-size="12.5" fill="#55726A" text-anchor="start" font-weight="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">A new day is a new store key.</text>
<text x="634" y="185.8" font-size="12.5" fill="#55726A" text-anchor="start" font-weight="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">A scope gives each tenant a counter.</text>
