<svg xmlns="http://www.w3.org/2000/svg" width="880" height="686" viewBox="0 0 880 686" role="img" aria-labelledby="t d">
<title id="t">Planning: a task list the model keeps up to date</title>
<desc id="d">The model keeps a task plan with the Planning tools: write_plan, read_plan, add_task, update_task_status, update_task_statuses and remove_task, plus add_subtask, set_dependency and get_available_tasks with enable_subtasks. The plan lives in a PlanStore, in memory by default or in SQLite, Postgres or Redis. Every tool that changes the plan ends its result with the whole plan as a checklist in a &lt;plan_reminder&gt; tag, so the plan stays in the conversation and never in the system prompt. Before each model request Planning reads the store and records the plan itself only when the model cannot see the current one.</desc>
