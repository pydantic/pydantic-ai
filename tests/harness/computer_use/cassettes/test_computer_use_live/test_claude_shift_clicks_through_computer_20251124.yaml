- request:
    method: POST
    uri: https://api.anthropic.com/v1/messages?beta=true
    headers:
      accept:
      - application/json
      accept-encoding:
      - gzip, deflate, br, zstd
      connection:
      - keep-alive
      content-length:
      - "3600"
