- request:
    method: POST
    uri: https://api.anthropic.com/v1/messages?beta=true
    headers:
      accept:
      - application/json
      accept-encoding:
      - gzip, deflate, br, zstd
      connection:
      - keep-alive
      content-length:
      - "9466"
      content-type:
      - application/json
      host:
      - api.anthropic.com
    body:
      type: json
      content:
        max_tokens: 128000
        messages:
        - role: user
          content:
          - text: >-
              Take a screenshot, then click at x=100 y=200, type "hello", and reply "done".
              Do nothing else.
            type: text
        model: claude-sonnet-5-5
        stream: true
        system:
        - type: text
          text: |-
            <pyai:context id="capability:deferred_capabilities">
            The following capabilities are deferred and can be loaded using the `load_capability` tool. A capability's tools stay hidden until it is loaded:
            - computer: See and control the screen of the computer you work on. Load it when the work needs the screen: using a program's window, checking what the screen shows, or doing what the user asked to be done on the screen.
            </pyai:context>
            A later <pyai:context> element with the same id replaces the earlier one and stays in effect until replaced again.
        tool_choice:
          type: auto
        tools:
        - name: load_capability
          description: >-
            Load a listed capability whenever it is plausibly relevant to the task. Loading
            makes the capability instructions and any tools it provides available.
          input_schema:
            description: Typed arguments for a `load_capability` tool call.
            properties:
              id:
                description: The id of the capability to load.
                type: string
            required:
            - id
            type: object
        - name: computer
          description: Run actions on the screen in order, then return a screenshot of the result.
          input_schema:
            additionalProperties: false
            properties:
              actions:
                description: >-
                  The steps to run, in order. Stop where you need to see the result before
                  deciding the next step.
                items:
                  discriminator:
                    mapping:
                      click: "#/$defs/Click"
                      cursor_position: "#/$defs/CursorPosition"
                      drag: "#/$defs/Drag"
                      hold_key: "#/$defs/HoldKeys"
                      keypress: "#/$defs/PressKeys"
                      mouse_down: "#/$defs/MouseDown"
                      mouse_up: "#/$defs/MouseUp"
                      move: "#/$defs/MoveMouse"
                      screenshot: "#/$defs/Screenshot"
                      scroll: "#/$defs/Scroll"
                      type: "#/$defs/TypeText"
                      wait: "#/$defs/Wait"
                      zoom: "#/$defs/Zoom"
                    propertyName: type
                  oneOf:
                  - $ref: "#/$defs/Click"
                  - $ref: "#/$defs/MoveMouse"
                  - $ref: "#/$defs/Drag"
                  - $ref: "#/$defs/MouseDown"
                  - $ref: "#/$defs/MouseUp"
                  - $ref: "#/$defs/Scroll"
                  - $ref: "#/$defs/TypeText"
                  - $ref: "#/$defs/PressKeys"
                  - $ref: "#/$defs/HoldKeys"
                  - $ref: "#/$defs/Wait"
                  - $ref: "#/$defs/Screenshot"
                  - $ref: "#/$defs/Zoom"
                  - $ref: "#/$defs/CursorPosition"
                minItems: 1
                type: array
            required:
            - actions
            type: object
            $defs:
              Click:
                additionalProperties: false
                description: Click a mouse button, at a position or where the pointer is.
                properties:
                  type:
                    const: click
                    default: click
                    type: string
                  x:
                    default: null
                    description: >-
                      From the left edge of the screenshot. Omit both `x` and `y` to click where the
                      pointer is.
                    anyOf:
                    - minimum: 0
                      type: integer
                    - type: "null"
                  "y":
                    default: null
                    description: From the top edge of the screenshot.
                    anyOf:
                    - minimum: 0
                      type: integer
                    - type: "null"
                  button:
                    default: left
                    enum:
                    - left
                    - middle
                    - right
                    - back
                    - forward
                    type: string
                  count:
                    default: 1
                    description: 1 for a click, 2 for a double click, 3 for a triple click.
                    maximum: 3
                    minimum: 1
                    type: integer
                  modifiers:
                    default: []
                    description: "Modifier keys held during the click: `ctrl`, `shift`, `alt` or `super`."
                    items:
                      type: string
                    type: array
                required:
                - type
                type: object
              CursorPosition:
                additionalProperties: false
                description: Report where the pointer is.
                properties:
                  type:
                    const: cursor_position
                    default: cursor_position
                    type: string
                required:
                - type
                type: object
              Drag:
                additionalProperties: false
                description: >-
                  Press the left button at the first point, move through the rest, and release at
                  the last.
                properties:
                  type:
                    const: drag
                    default: drag
                    type: string
                  path:
                    description: "The points to drag through: at least a start and an end."
                    items:
                      $ref: "#/$defs/Point"
                    minItems: 2
                    type: array
                  modifiers:
                    default: []
                    description: "Modifier keys held during the drag: `ctrl`, `shift`, `alt` or `super`."
                    items:
                      type: string
                    type: array
                required:
                - type
                - path
                type: object
              HoldKeys:
                additionalProperties: false
                description: Hold keys down for a while, then release them.
                properties:
                  type:
                    const: hold_key
                    default: hold_key
                    type: string
                  keys:
                    description: One key per entry, held together.
                    items:
                      type: string
                    minItems: 1
                    type: array
                  seconds:
                    description: How long to hold them.
                    exclusiveMinimum: 0
                    type: number
                required:
                - type
                - keys
                - seconds
                type: object
              MouseDown:
                additionalProperties: false
                description: Press a mouse button and keep it pressed until a `mouse_up`.
                properties:
                  type:
                    const: mouse_down
                    default: mouse_down
                    type: string
                  button:
                    default: left
                    enum:
                    - left
                    - middle
                    - right
                    - back
                    - forward
                    type: string
                required:
                - type
                type: object
              MouseUp:
                additionalProperties: false
                description: Release a mouse button pressed with `mouse_down`.
                properties:
                  type:
                    const: mouse_up
                    default: mouse_up
                    type: string
                  button:
                    default: left
                    enum:
                    - left
                    - middle
                    - right
                    - back
                    - forward
                    type: string
                required:
                - type
                type: object
              MoveMouse:
                additionalProperties: false
                description: Move the pointer, for example to reveal a hover menu.
                properties:
                  type:
                    const: move
                    default: move
                    type: string
                  x:
                    description: From the left edge of the screenshot.
                    minimum: 0
                    type: integer
                  "y":
                    description: From the top edge of the screenshot.
                    minimum: 0
                    type: integer
                  modifiers:
                    default: []
                    description: "Modifier keys held while moving: `ctrl`, `shift`, `alt` or `super`."
                    items:
                      type: string
                    type: array
                required:
                - type
                - x
                - "y"
                type: object
              Point:
                additionalProperties: false
                description: A position on the screenshot.
                properties:
                  x:
                    minimum: 0
                    type: integer
                  "y":
                    minimum: 0
                    type: integer
                required:
                - x
                - "y"
                type: object
              PressKeys:
                additionalProperties: false
                description: Press keys together as one combination, then release them.
                properties:
                  type:
                    const: keypress
                    default: keypress
                    type: string
                  keys:
                    description: "One key per entry, pressed together: `[\"enter\"]`, `[\"ctrl\", \"a\"]`, `[\"super\", \"shift\", \"t\"]`."
                    items:
                      type: string
                    minItems: 1
                    type: array
                  repeat:
                    default: 1
                    description: How many times to press the combination.
                    minimum: 1
                    type: integer
                required:
                - type
                - keys
                type: object
              Region:
                additionalProperties: false
                description: |-
                  A rectangle on the screenshot, from its top left corner to its bottom right one.

                  `right` and `bottom` are just outside it: `left=0, right=10` is 10 pixels wide.
                properties:
                  left:
                    minimum: 0
                    type: integer
                  top:
                    minimum: 0
                    type: integer
                  right:
                    minimum: 0
                    type: integer
                  bottom:
                    minimum: 0
                    type: integer
                required:
                - left
                - top
                - right
                - bottom
                type: object
              Screenshot:
                additionalProperties: false
                description: >-
                  Look at the screen without acting. A call's result already ends with a
                  screenshot.
                properties:
                  type:
                    const: screenshot
                    default: screenshot
                    type: string
                required:
                - type
                type: object
              Scroll:
                additionalProperties: false
                description: Scroll the content under a position, or under the pointer.
                properties:
                  type:
                    const: scroll
                    default: scroll
                    type: string
                  direction:
                    description: "Which way the content moves into view: `down` shows what is below."
                    enum:
                    - up
                    - down
                    - left
                    - right
                    type: string
                  amount:
                    default: 3
                    description: Mouse-wheel clicks; one click scrolls about three lines.
                    minimum: 1
                    type: integer
                  x:
                    default: null
                    description: >-
                      From the left edge of the screenshot. Omit both `x` and `y` to scroll where the
                      pointer is.
                    anyOf:
                    - minimum: 0
                      type: integer
                    - type: "null"
                  "y":
                    default: null
                    description: From the top edge of the screenshot.
                    anyOf:
                    - minimum: 0
                      type: integer
                    - type: "null"
                  modifiers:
                    default: []
                    description: |-
                      Modifier keys held while scrolling: `ctrl`, `shift`, `alt` or `super`.

                      `shift` scrolls sideways in some applications.
                    items:
                      type: string
                    type: array
                required:
                - type
                - direction
                type: object
              TypeText:
                additionalProperties: false
                description: |-
                  Type text at the keyboard focus. Use `keypress` for shortcuts and special keys.

                  `\n` presses Enter and `\t` presses Tab. Other control characters, including `\r`, are refused when the action
                  is validated, so every backend types the same keys.
                properties:
                  type:
                    const: type
                    default: type
                    type: string
                  text:
                    minLength: 1
                    type: string
                required:
                - type
                - text
                type: object
              Wait:
                additionalProperties: false
                description: Pause, for example while a page or application loads.
                properties:
                  type:
                    const: wait
                    default: wait
                    type: string
                  seconds:
                    default: 1
                    description: How long to wait.
                    exclusiveMinimum: 0
                    type: number
                required:
                - type
                type: object
              Zoom:
                additionalProperties: false
                description: Look closely at part of the screen, to read small text or find a small target.
                properties:
                  type:
                    const: zoom
                    default: zoom
                    type: string
                  region:
                    $ref: "#/$defs/Region"
                    description: >-
                      The part of the screen to look at. Positions in later actions are still on the
                      full screen.
                required:
                - type
                - region
                type: object
          defer_loading: true
