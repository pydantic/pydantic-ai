          context: all_turns
        tool_choice: auto
        tools:
        - name: computer
          parameters:
            additionalProperties: false
            properties:
              actions:
                description: >-
                  The steps to run, in order. Stop where you need to see the result before
                  deciding the next step.
                items:
                  oneOf:
                  - $ref: "#/$defs/Click"
                  - $ref: "#/$defs/MoveMouse"
                  - $ref: "#/$defs/Drag"
                  - $ref: "#/$defs/MouseDown"
                  - $ref: "#/$defs/MouseUp"
                  - $ref: "#/$defs/Scroll"
                  - $ref: "#/$defs/TypeText"
                  - $ref: "#/$defs/PressKeys"
                  - $ref: "#/$defs/HoldKeys"
                  - $ref: "#/$defs/Wait"
                  - $ref: "#/$defs/Screenshot"
                  - $ref: "#/$defs/Zoom"
                  - $ref: "#/$defs/CursorPosition"
                minItems: 1
                type: array
            required:
            - actions
            type: object
            $defs:
              Click:
                additionalProperties: false
                description: Click a mouse button, at a position or where the pointer is.
                properties:
                  type:
                    const: click
                    default: click
                    type: string
                  x:
                    default: null
                    description: >-
                      From the left edge of the screenshot. Omit both `x` and `y` to click where the
                      pointer is.
                    anyOf:
                    - minimum: 0
                      type: integer
                    - type: "null"
                  "y":
                    default: null
                    description: From the top edge of the screenshot.
                    anyOf:
                    - minimum: 0
                      type: integer
                    - type: "null"
                  button:
                    default: left
                    enum:
                    - left
                    - middle
                    - right
                    - back
                    - forward
                    type: string
                  count:
                    default: 1
                    description: 1 for a click, 2 for a double click, 3 for a triple click.
                    maximum: 3
                    minimum: 1
                    type: integer
                  modifiers:
                    default: []
                    description: "Modifier keys held during the click: `ctrl`, `shift`, `alt` or `super`."
                    items:
                      type: string
                    maxItems: 8
                    type: array
                required:
                - type
                type: object
              CursorPosition:
                additionalProperties: false
                description: Report where the pointer is.
                properties:
                  type:
                    const: cursor_position
                    default: cursor_position
                    type: string
                required:
                - type
                type: object
              Drag:
                additionalProperties: false
                description: >-
                  Press the left button at the first point, move through the rest, and release at
                  the last.
                properties:
                  type:
                    const: drag
                    default: drag
                    type: string
                  path:
                    description: "The points to drag through: at least a start and an end."
                    items:
                      $ref: "#/$defs/Point"
                    maxItems: 50
                    minItems: 2
                    type: array
                  modifiers:
                    default: []
                    description: "Modifier keys held during the drag: `ctrl`, `shift`, `alt` or `super`."
                    items:
                      type: string
                    maxItems: 8
                    type: array
                required:
                - type
                - path
                type: object
              HoldKeys:
                additionalProperties: false
                description: Hold keys down for a while, then release them.
                properties:
                  type:
                    const: hold_key
                    default: hold_key
                    type: string
                  keys:
                    description: One key per entry, held together.
                    items:
                      type: string
                    maxItems: 8
                    minItems: 1
                    type: array
                  seconds:
                    description: How long to hold them, up to 30 seconds.
                    exclusiveMinimum: 0
                    maximum: 30
                    type: number
                required:
                - type
                - keys
                - seconds
                type: object
              MouseDown:
                additionalProperties: false
                description: Press a mouse button and keep it pressed until a `mouse_up`.
                properties:
                  type:
                    const: mouse_down
                    default: mouse_down
                    type: string
                  button:
                    default: left
                    enum:
                    - left
                    - middle
                    - right
                    - back
                    - forward
                    type: string
                required:
                - type
                type: object
              MouseUp:
                additionalProperties: false
                description: Release a mouse button pressed with `mouse_down`.
                properties:
                  type:
                    const: mouse_up
                    default: mouse_up
                    type: string
                  button:
                    default: left
                    enum:
                    - left
                    - middle
                    - right
                    - back
                    - forward
                    type: string
                required:
                - type
                type: object
              MoveMouse:
                additionalProperties: false
                description: Move the pointer, for example to reveal a hover menu.
                properties:
                  type:
                    const: move
                    default: move
                    type: string
                  x:
                    description: From the left edge of the screenshot.
                    minimum: 0
                    type: integer
                  "y":
                    description: From the top edge of the screenshot.
                    minimum: 0
                    type: integer
                  modifiers:
                    default: []
                    description: "Modifier keys held while moving: `ctrl`, `shift`, `alt` or `super`."
                    items:
                      type: string
                    maxItems: 8
                    type: array
                required:
                - type
                - x
                - "y"
                type: object
              Point:
                additionalProperties: false
                description: A position on the screenshot.
                properties:
                  x:
                    minimum: 0
                    type: integer
                  "y":
                    minimum: 0
                    type: integer
                required:
                - x
                - "y"
                type: object
              PressKeys:
                additionalProperties: false
                description: Press keys together as one combination, then release them.
                properties:
                  type:
                    const: keypress
                    default: keypress
                    type: string
                  keys:
                    description: "One key per entry, pressed together: `[\"enter\"]`, `[\"ctrl\", \"a\"]`, `[\"super\", \"shift\", \"t\"]`."
                    items:
                      type: string
                    maxItems: 8
                    minItems: 1
                    type: array
                  repeat:
                    default: 1
                    description: How many times to press the combination.
                    maximum: 100
                    minimum: 1
                    type: integer
                required:
                - type
                - keys
                type: object
              Region:
                additionalProperties: false
                description: |-
                  A rectangle on the screenshot, from its top left corner to its bottom right one.
                  
                  `right` and `bottom` are just outside it: `left=0, right=10` is 10 pixels wide.
                properties:
                  left:
                    minimum: 0
                    type: integer
                  top:
                    minimum: 0
                    type: integer
                  right:
                    minimum: 0
                    type: integer
                  bottom:
                    minimum: 0
                    type: integer
                required:
                - left
                - top
                - right
                - bottom
                type: object
              Screenshot:
                additionalProperties: false
                description: >-
                  Look at the screen without acting. A call's result already ends with a
                  screenshot.
                properties:
                  type:
                    const: screenshot
                    default: screenshot
                    type: string
                required:
                - type
                type: object
              Scroll:
                additionalProperties: false
                description: Scroll the content under a position, or under the pointer.
                properties:
                  type:
                    const: scroll
                    default: scroll
                    type: string
                  direction:
                    description: "Which way the content moves into view: `down` shows what is below."
                    enum:
                    - up
                    - down
                    - left
                    - right
                    type: string
                  amount:
                    default: 3
                    description: Mouse-wheel clicks; one click scrolls about three lines.
                    maximum: 50
                    minimum: 1
                    type: integer
                  x:
                    default: null
                    description: >-
                      From the left edge of the screenshot. Omit both `x` and `y` to scroll where the
                      pointer is.
                    anyOf:
                    - minimum: 0
                      type: integer
                    - type: "null"
                  "y":
                    default: null
                    description: From the top edge of the screenshot.
                    anyOf:
                    - minimum: 0
                      type: integer
                    - type: "null"
                  modifiers:
                    default: []
                    description: |-
                      Modifier keys held while scrolling: `ctrl`, `shift`, `alt` or `super`.
                      
                      `shift` scrolls sideways in some applications.
                    items:
                      type: string
                    maxItems: 8
                    type: array
                required:
                - type
                - direction
                type: object
              TypeText:
                additionalProperties: false
                description: |-
                  Type text at the keyboard focus. Use `keypress` for shortcuts and special keys.
                  
                  `\n` presses Enter and `\t` presses Tab. Other control characters, including `\r`, are refused when the action
                  is validated, so every backend types the same keys.
                properties:
                  type:
                    const: type
                    default: type
                    type: string
                  text:
                    description: Up to 2,000 characters; type longer text in several actions.
                    maxLength: 2000
                    minLength: 1
                    type: string
                required:
                - type
                - text
                type: object
              Wait:
                additionalProperties: false
                description: Pause, for example while a page or application loads.
                properties:
                  type:
                    const: wait
                    default: wait
                    type: string
                  seconds:
                    default: 1
                    description: How long to wait, up to 30 seconds.
                    exclusiveMinimum: 0
                    maximum: 30
                    type: number
                required:
                - type
                type: object
              Zoom:
                additionalProperties: false
                description: Look closely at part of the screen, to read small text or find a small target.
