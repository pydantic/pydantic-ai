                      items:
                        type: string
                      type: array
                  required:
                  - type
                  - direction
                  type: object
                TypeText:
                  additionalProperties: false
                  description: Type text at the keyboard focus. Use `keypress` for shortcuts and special keys.
                  properties:
                    type:
                      default: type
                      type: string
                      enum:
                      - type
                    text:
                      minLength: 1
                      type: string
                  required:
                  - type
                  - text
                  type: object
                Wait:
                  additionalProperties: false
                  description: Pause, for example while a page or application loads.
                  properties:
                    type:
                      default: wait
                      type: string
                      enum:
                      - wait
                    seconds:
                      default: 1
                      description: How long to wait.
                      type: number
                  required:
                  - type
                  type: object
                Zoom:
                  additionalProperties: false
                  description: Look closely at part of the screen, to read small text or find a small target.
                  properties:
                    type:
                      default: zoom
                      type: string
                      enum:
                      - zoom
                    region:
