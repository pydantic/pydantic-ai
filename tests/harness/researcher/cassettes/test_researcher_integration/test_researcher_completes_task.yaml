    body: "{\"include\":[\"reasoning.encrypted_content\"],\"input\":[{\"role\":\"user\",\"content\":\"Compare
      the free-threaded Python support in CPython 3.13 and 3.14 using official sources.
      Delegate the 3.13 investigation to the researcher sub-agent while you investigate
      3.14, then synthesize the maturity status and main limitations. Search for and
      read the sources needed for each version, and include direct links.\"},{\"name\":\"delegate_task\",\"arguments\":\"{\\\"agent_name\\\":\\\"researcher\\\",\\\"task\\\":\\\"Investigate
      free-threaded Python support specifically in CPython 3.13 using only official
      Python sources (docs.python.org, peps.python.org, python.org, GitHub python/cpython
      if necessary). Search broadly and read the supporting sources. Report: maturity/experimental
      status, how to obtain/build/enable it, runtime identification and GIL toggling
