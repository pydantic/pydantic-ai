      could remove the underlying item;\\n- protect `PyDict_Next()` iteration with
      a Python critical section when concurrent mutation is possible;\\n- use the
      object-memory domain only for Python objects, and do not allocate ordinary buffers
      with `PyObject_Malloc()`;\\n- continue using thread-state APIs such as `PyGILState_Ensure()`,
      `PyEval_SaveThread()`, and `Py_BEGIN_ALLOW_THREADS`, even when the GIL is disabled.\\n\\nSource:
