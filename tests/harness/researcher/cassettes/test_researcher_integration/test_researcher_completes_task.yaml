      \xBB\\\\n\\\\n* [3.14.7 Documentation](../index.html) \xBB\\\\n* [Python HOWTOs](index.html)
      \xBB\\\\n* C API Extension Support for Free Threading\\\\n* |\\\\n* Theme\\\\n
      \ Auto\\\\n  Light\\\\n  Dark\\\\n   |\\\\n\\\\nC API Extension Support for
      Free Threading[\xB6](#c-api-extension-support-for-free-threading \\\\\\\"Link
      to this heading\\\\\\\")\\\\n=================================================================================================================\\\\n\\\\nStarting
      with the 3.13 release, CPython has support for running with\\\\nthe [global
      interpreter lock](../glossary.html#term-global-interpreter-lock) (GIL) disabled
      in a configuration\\\\ncalled [free threading](../glossary.html#term-free-threading).
      This document describes how to adapt C API\\\\nextensions to support free threading.\\\\n\\\\nIdentifying
      the Free-Threaded Build in C[\xB6](#identifying-the-free-threaded-build-in-c
      \\\\\\\"Link to this heading\\\\\\\")\\\\n-------------------------------------------------------------------------------------------------------------\\\\n\\\\nThe
      CPython C API exposes the `Py_GIL_DISABLED` macro: in the free-threaded\\\\nbuild
      it\u2019s defined to `1`, and in the regular build it\u2019s not defined.\\\\nYou
      can use it to enable code that only runs under the free-threaded build:\\\\n\\\\n```\\\\n#ifdef
      Py_GIL_DISABLED\\\\n/* code that only runs in the free-threaded build */\\\\n#endif\\\\n```\\\\n\\\\nNote\\\\n\\\\nOn
      Windows, this macro is not defined automatically, but must be specified\\\\nto
      the compiler when building. The [`sysconfig.get_config_var()`](../library/sysconfig.html#sysconfig.get_config_var
      \\\\\\\"sysconfig.get_config_var\\\\\\\") function\\\\ncan be used to determine
      whether the current running interpreter had the\\\\nmacro defined.\\\\n\\\\nModule
      Initialization[\xB6](#module-initialization \\\\\\\"Link to this heading\\\\\\\")\\\\n-----------------------------------------------------------------------\\\\n\\\\nExtension
      modules need to explicitly indicate that they support running with\\\\nthe GIL
      disabled; otherwise importing the extension will raise a warning and\\\\nenable
      the GIL at runtime.\\\\n\\\\nThere are two ways to indicate that an extension
      module supports running with\\\\nthe GIL disabled depending on whether the extension
      uses multi-phase or\\\\nsingle-phase initialization.\\\\n\\\\n### Multi-Phase
      Initialization[\xB6](#multi-phase-initialization \\\\\\\"Link to this heading\\\\\\\")\\\\n\\\\nExtensions
      that use multi-phase initialization (i.e.,\\\\n[`PyModuleDef_Init()`](../c-api/extension-modules.html#c.PyModuleDef_Init
      \\\\\\\"PyModuleDef_Init\\\\\\\")) should add a [`Py_mod_gil`](../c-api/module.html#c.Py_mod_gil
      \\\\\\\"Py_mod_gil\\\\\\\") slot in the\\\\nmodule definition. If your extension
      supports older versions of CPython,\\\\nyou should guard the slot with a [`PY_VERSION_HEX`](../c-api/apiabiversion.html#c.PY_VERSION_HEX
      \\\\\\\"PY_VERSION_HEX\\\\\\\") check.\\\\n\\\\n```\\\\nstatic struct PyModuleDef_Slot
      module_slots[] = {\\\\n    ...\\\\n#if PY_VERSION_HEX >= 0x030D0000\\\\n    {Py_mod_gil,
      Py_MOD_GIL_NOT_USED},\\\\n#endif\\\\n    {0, NULL}\\\\n};\\\\n\\\\nstatic struct
      PyModuleDef moduledef = {\\\\n    PyModuleDef_HEAD_INIT,\\\\n    .m_slots =
      module_slots,\\\\n    ...\\\\n};\\\\n```\\\\n\\\\n### Single-Phase Initialization[\xB6](#single-phase-initialization
      \\\\\\\"Link to this heading\\\\\\\")\\\\n\\\\nExtensions that use single-phase
      initialization (i.e.,\\\\n[`PyModule_Create()`](../c-api/module.html#c.PyModule_Create
      \\\\\\\"PyModule_Create\\\\\\\")) should call [`PyUnstable_Module_SetGIL()`](../c-api/module.html#c.PyUnstable_Module_SetGIL
      \\\\\\\"PyUnstable_Module_SetGIL\\\\\\\") to\\\\nindicate that they support
      running with the GIL disabled. The function is\\\\nonly defined in the free-threaded
      build, so you should guard the call with\\\\n`#ifdef Py_GIL_DISABLED` to avoid
      compilation errors in the regular build.\\\\n\\\\n```\\\\nstatic struct PyModuleDef
      moduledef = {\\\\n    PyModuleDef_HEAD_INIT,\\\\n    ...\\\\n};\\\\n\\\\nPyMODINIT_FUNC\\\\nPyInit_mymodule(void)\\\\n{\\\\n
      \   PyObject *m = PyModule_Create(&moduledef);\\\\n    if (m == NULL) {\\\\n
      \       return NULL;\\\\n    }\\\\n#ifdef Py_GIL_DISABLED\\\\n    PyUnstable_Module_SetGIL(m,
      Py_MOD_GIL_NOT_USED);\\\\n#endif\\\\n    return m;\\\\n}\\\\n```\\\\n\\\\nGeneral
      API Guidelines[\xB6](#general-api-guidelines \\\\\\\"Link to this heading\\\\\\\")\\\\n-------------------------------------------------------------------------\\\\n\\\\nMost
      of the C API is thread-safe, but there are some exceptions.\\\\n\\\\n* **Struct
      Fields**: Accessing fields in Python C API objects or structs\\\\n  directly
      is not thread-safe if the field may be concurrently modified.\\\\n* **Macros**:
      Accessor macros like [`PyList_GET_ITEM`](../c-api/list.html#c.PyList_GET_ITEM
      \\\\\\\"PyList_GET_ITEM\\\\\\\"),\\\\n  [`PyList_SET_ITEM`](../c-api/list.html#c.PyList_SET_ITEM
      \\\\\\\"PyList_SET_ITEM\\\\\\\"), and macros like\\\\n  [`PySequence_Fast_GET_SIZE`](../c-api/sequence.html#c.PySequence_Fast_GET_SIZE
      \\\\\\\"PySequence_Fast_GET_SIZE\\\\\\\") that use the object returned by\\\\n
      \ [`PySequence_Fast()`](../c-api/sequence.html#c.PySequence_Fast \\\\\\\"PySequence_Fast\\\\\\\")
      do not perform any error checking or locking.\\\\n  These macros are not thread-safe
      if the container object may be modified\\\\n  concurrently.\\\\n* **Borrowed
      References**: C API functions that return\\\\n  [borrowed references](../glossary.html#term-borrowed-reference)
      may not be thread-safe if\\\\n  the containing object is modified concurrently.
      See the section on\\\\n  [borrowed references](#id2) for more information.\\\\n\\\\n###
      Container Thread Safety[\xB6](#container-thread-safety \\\\\\\"Link to this
      heading\\\\\\\")\\\\n\\\\nContainers like [`PyListObject`](../c-api/list.html#c.PyListObject
      \\\\\\\"PyListObject\\\\\\\"),\\\\n[`PyDictObject`](../c-api/dict.html#c.PyDictObject
      \\\\\\\"PyDictObject\\\\\\\"), and [`PySetObject`](../c-api/set.html#c.PySetObject
      \\\\\\\"PySetObject\\\\\\\") perform internal locking\\\\nin the free-threaded
      build. For example, the [`PyList_Append()`](../c-api/list.html#c.PyList_Append
      \\\\\\\"PyList_Append\\\\\\\") will\\\\nlock the list before appending an item.\\\\n\\\\n####
      `PyDict_Next`[\xB6](#pydict-next \\\\\\\"Link to this heading\\\\\\\")\\\\n\\\\nA
      notable exception is [`PyDict_Next()`](../c-api/dict.html#c.PyDict_Next \\\\\\\"PyDict_Next\\\\\\\"),
      which does not lock the\\\\ndictionary. You should use [`Py_BEGIN_CRITICAL_SECTION`](../c-api/synchronization.html#c.Py_BEGIN_CRITICAL_SECTION
      \\\\\\\"Py_BEGIN_CRITICAL_SECTION\\\\\\\") to protect\\\\nthe dictionary while
      iterating over it if the dictionary may be concurrently\\\\nmodified:\\\\n\\\\n```\\\\nPy_BEGIN_CRITICAL_SECTION(dict);\\\\nPyObject
      *key, *value;\\\\nPy_ssize_t pos = 0;\\\\nwhile (PyDict_Next(dict, &pos, &key,
      &value)) {\\\\n    ...\\\\n}\\\\nPy_END_CRITICAL_SECTION();\\\\n```\\\\n\\\\nBorrowed
      References[\xB6](#borrowed-references \\\\\\\"Link to this heading\\\\\\\")\\\\n-------------------------------------------------------------------\\\\n\\\\nSome
      C API functions return [borrowed references](../glossary.html#term-borrowed-reference).\\\\nThese
      APIs are not thread-safe if the containing object is modified\\\\nconcurrently.
      For example, it\u2019s not safe to use [`PyList_GetItem()`](../c-api/list.html#c.PyList_GetItem
      \\\\\\\"PyList_GetItem\\\\\\\")\\\\nif the list may be modified concurrently.\\\\n\\\\nThe
      following table lists some borrowed reference APIs and their replacements\\\\nthat
      return [strong references](../glossary.html#term-strong-reference).\\\\n\\\\n|
      Borrowed reference API | Strong reference API |\\\\n| --- | --- |\\\\n| [`PyList_GetItem()`](../c-api/list.html#c.PyList_GetItem
      \\\\\\\"PyList_GetItem\\\\\\\") | [`PyList_GetItemRef()`](../c-api/list.html#c.PyList_GetItemRef
      \\\\\\\"PyList_GetItemRef\\\\\\\") |\\\\n| [`PyList_GET_ITEM()`](../c-api/list.html#c.PyList_GET_ITEM
      \\\\\\\"PyList_GET_ITEM\\\\\\\") | [`PyList_GetItemRef()`](../c-api/list.html#c.PyList_GetItemRef
      \\\\\\\"PyList_GetItemRef\\\\\\\") |\\\\n| [`PyDict_GetItem()`](../c-api/dict.html#c.PyDict_GetItem
      \\\\\\\"PyDict_GetItem\\\\\\\") | [`PyDict_GetItemRef()`](../c-api/dict.html#c.PyDict_GetItemRef
      \\\\\\\"PyDict_GetItemRef\\\\\\\") |\\\\n| [`PyDict_GetItemWithError()`](../c-api/dict.html#c.PyDict_GetItemWithError
      \\\\\\\"PyDict_GetItemWithError\\\\\\\") | [`PyDict_GetItemRef()`](../c-api/dict.html#c.PyDict_GetItemRef
      \\\\\\\"PyDict_GetItemRef\\\\\\\") |\\\\n| [`PyDict_GetItemString()`](../c-api/dict.html#c.PyDict_GetItemString
      \\\\\\\"PyDict_GetItemString\\\\\\\") | [`PyDict_GetItemStringRef()`](../c-api/dict.html#c.PyDict_GetItemStringRef
      \\\\\\\"PyDict_GetItemStringRef\\\\\\\") |\\\\n| [`PyDict_SetDefault()`](../c-api/dict.html#c.PyDict_SetDefault
      \\\\\\\"PyDict_SetDefault\\\\\\\") | [`PyDict_SetDefaultRef()`](../c-api/dict.html#c.PyDict_SetDefaultRef
      \\\\\\\"PyDict_SetDefaultRef\\\\\\\") |\\\\n| [`PyDict_Next()`](../c-api/dict.html#c.PyDict_Next
      \\\\\\\"PyDict_Next\\\\\\\") | none (see [PyDict\\\\\\\\_Next](#pydict-next))
      |\\\\n| [`PyWeakref_GetObject()`](../c-api/weakref.html#c.PyWeakref_GetObject
      \\\\\\\"PyWeakref_GetObject\\\\\\\") | [`PyWeakref_GetRef()`](../c-api/weakref.html#c.PyWeakref_GetRef
      \\\\\\\"PyWeakref_GetRef\\\\\\\") |\\\\n| [`PyWeakref_GET_OBJECT()`](../c-api/weakref.html#c.PyWeakref_GET_OBJECT
      \\\\\\\"PyWeakref_GET_OBJECT\\\\\\\") | [`PyWeakref_GetRef()`](../c-api/weakref.html#c.PyWeakref_GetRef
      \\\\\\\"PyWeakref_GetRef\\\\\\\") |\\\\n| [`PyImport_AddModule()`](../c-api/import.html#c.PyImport_AddModule
      \\\\\\\"PyImport_AddModule\\\\\\\") | [`PyImport_AddModuleRef()`](../c-api/import.html#c.PyImport_AddModuleRef
      \\\\\\\"PyImport_AddModuleRef\\\\\\\") |\\\\n| [`PyCell_GET()`](../c-api/cell.html#c.PyCell_GET
      \\\\\\\"PyCell_GET\\\\\\\") | [`PyCell_Get()`](../c-api/cell.html#c.PyCell_Get
      \\\\\\\"PyCell_Get\\\\\\\") |\\\\n\\\\nNot all APIs that return borrowed references
      are problematic. For\\\\nexample, [`PyTuple_GetItem()`](../c-api/tuple.html#c.PyTuple_GetItem
      \\\\\\\"PyTuple_GetItem\\\\\\\") is safe because tuples are immutable.\\\\nSimilarly,
      not all uses of the above APIs are problematic. For example,\\\\n[`PyDict_GetItem()`](../c-api/dict.html#c.PyDict_GetItem
      \\\\\\\"PyDict_GetItem\\\\\\\") is often used for parsing keyword argument\\\\ndictionaries
      in function calls; those keyword argument dictionaries are\\\\neffectively private
      (not accessible by other threads), so using borrowed\\\\nreferences in that
      context is safe.\\\\n\\\\nSome of these functions were added in Python 3.13.
      You can use the\\\\n[pythoncapi-compat](https://github.com/python/pythoncapi-compat)
      package\\\\nto provide implementations of these functions for older Python versions.\\\\n\\\\nMemory
      Allocation APIs[\xB6](#memory-allocation-apis \\\\\\\"Link to this heading\\\\\\\")\\\\n-------------------------------------------------------------------------\\\\n\\\\nPython\u2019s
      memory management C API provides functions in three different\\\\n[allocation
      domains](../c-api/memory.html#id1): \u201Craw\u201D, \u201Cmem\u201D, and \u201Cobject\u201D.\\\\nFor
      thread-safety, the free-threaded build requires that only Python objects\\\\nare
      allocated using the object domain, and that all Python objects are\\\\nallocated
      using that domain. This differs from the prior Python versions,\\\\nwhere this
      was only a best practice and not a hard requirement.\\\\n\\\\nNote\\\\n\\\\nSearch
      for uses of [`PyObject_Malloc()`](../c-api/memory.html#c.PyObject_Malloc \\\\\\\"PyObject_Malloc\\\\\\\")
      in your\\\\nextension and check that the allocated memory is used for Python
      objects.\\\\nUse [`PyMem_Malloc()`](../c-api/memory.html#c.PyMem_Malloc \\\\\\\"PyMem_Malloc\\\\\\\")
      to allocate buffers instead of\\\\n`PyObject_Malloc()`.\\\\n\\\\nThread State
      and GIL APIs[\xB6](#thread-state-and-gil-apis \\\\\\\"Link to this heading\\\\\\\")\\\\n-------------------------------------------------------------------------------\\\\n\\\\nPython
      provides a set of functions and macros to manage thread state and the\\\\nGIL,
      such as:\\\\n\\\\n* [`PyGILState_Ensure()`](../c-api/threads.html#c.PyGILState_Ensure
      \\\\\\\"PyGILState_Ensure\\\\\\\") and [`PyGILState_Release()`](../c-api/threads.html#c.PyGILState_Release
      \\\\\\\"PyGILState_Release\\\\\\\")\\\\n* [`PyEval_SaveThread()`](../c-api/threads.html#c.PyEval_SaveThread
      \\\\\\\"PyEval_SaveThread\\\\\\\") and [`PyEval_RestoreThread()`](../c-api/threads.html#c.PyEval_RestoreThread
      \\\\\\\"PyEval_RestoreThread\\\\\\\")\\\\n* [`Py_BEGIN_ALLOW_THREADS`](../c-api/threads.html#c.Py_BEGIN_ALLOW_THREADS
      \\\\\\\"Py_BEGIN_ALLOW_THREADS\\\\\\\") and [`Py_END_ALLOW_THREADS`](../c-api/threads.html#c.Py_END_ALLOW_THREADS
      \\\\\\\"Py_END_ALLOW_THREADS\\\\\\\")\\\\n\\\\nThese functions should still
      be used in the free-threaded build to manage\\\\nthread state even when the
      [GIL](../glossary.html#term-GIL) is disabled. For example, if you\\\\ncreate
      a thread outside of Python, you must call [`PyGILState_Ensure()`](../c-api/threads.html#c.PyGILState_Ensure
      \\\\\\\"PyGILState_Ensure\\\\\\\")\\\\nbefore calling into the Python API to
      ensure that the thread has a valid\\\\nPython thread state.\\\\n\\\\nYou should
      continue to call [`PyEval_SaveThread()`](../c-api/threads.html#c.PyEval_SaveThread
      \\\\\\\"PyEval_SaveThread\\\\\\\") or\\\\n[`Py_BEGIN_ALLOW_THREADS`](../c-api/threads.html#c.Py_BEGIN_ALLOW_THREADS
      \\\\\\\"Py_BEGIN_ALLOW_THREADS\\\\\\\") around blocking operations, such as
      I/O or\\\\nlock acquisitions, to allow other threads to run the\\\\n[cyclic
      garbage collector](../glossary.html#term-garbage-collection).\\\\n\\\\nProtecting
      Internal Extension State[\xB6](#protecting-internal-extension-state \\\\\\\"Link
      to this heading\\\\\\\")\\\\n---------------------------------------------------------------------------------------------------\\\\n\\\\nYour
      extension may have internal state that was previously protected by the\\\\nGIL.
      You may need to add locking to protect this state. The approach will\\\\ndepend
      on your extension, but some common patterns include:\\\\n\\\\n* **Caches**:
      global caches are a common source of shared state. Consider\\\\n  using a lock
      to protect the cache or disabling it in the free-threaded build\\\\n  if the
      cache is not critical for performance.\\\\n* **Global State**: global state
      may need to be protected by a lock or moved\\\\n  to thread local storage. C11
      and C++11 provide the `thread_local` or\\\\n  `_Thread_local` for\\\\n  [thread-local
      storage](https://en.cppreference.com/w/c/language/storage_duration).\\\\n\\\\nCritical
      Sections[\xB6](#critical-sections \\\\\\\"Link to this heading\\\\\\\")\\\\n---------------------------------------------------------------\\\\n\\\\nIn
      the free-threaded build, CPython provides a mechanism called \u201Ccritical\\\\nsections\u201D
      to protect data that would otherwise be protected by the GIL.\\\\nWhile extension
      authors may not interact with the internal critical section\\\\nimplementation
      directly, understanding their behavior is crucial when using\\\\ncertain C API
      functions or managing shared state in the free-threaded build.\\\\n\\\\n###
      What Are Critical Sections?[\xB6](#what-are-critical-sections \\\\\\\"Link to
      this heading\\\\\\\")\\\\n\\\\nConceptually, critical sections act as a deadlock
      avoidance layer built on\\\\ntop of simple mutexes. Each thread maintains a
      stack of active critical\\\\nsections. When a thread needs to acquire a lock
      associated with a critical\\\\nsection (e.g., implicitly when calling a thread-safe
      C API function like\\\\n[`PyDict_SetItem()`](../c-api/dict.html#c.PyDict_SetItem
      \\\\\\\"PyDict_SetItem\\\\\\\"), or explicitly using macros), it attempts to
      acquire\\\\nthe underlying mutex.\\\\n\\\\n### Using Critical Sections[\xB6](#using-critical-sections
      \\\\\\\"Link to this heading\\\\\\\")\\\\n\\\\nThe primary APIs for using critical
      sections are:\\\\n\\\\n* [`Py_BEGIN_CRITICAL_SECTION`](../c-api/synchronization.html#c.Py_BEGIN_CRITICAL_SECTION
      \\\\\\\"Py_BEGIN_CRITICAL_SECTION\\\\\\\") and [`Py_END_CRITICAL_SECTION`](../c-api/synchronization.html#c.Py_END_CRITICAL_SECTION
      \\\\\\\"Py_END_CRITICAL_SECTION\\\\\\\") -\\\\n  For locking a single object\\\\n*
      [`Py_BEGIN_CRITICAL_SECTION2`](../c-api/synchronization.html#c.Py_BEGIN_CRITICAL_SECTION2
      \\\\\\\"Py_BEGIN_CRITICAL_SECTION2\\\\\\\") and [`Py_END_CRITICAL_SECTION2`](../c-api/synchronization.html#c.Py_END_CRITICAL_SECTION2
      \\\\\\\"Py_END_CRITICAL_SECTION2\\\\\\\")\\\\n  - For locking two objects simultaneously\\\\n\\\\nThese
      macros must be used in matching pairs and must appear in the same C\\\\nscope,
      since they establish a new local scope. These macros are no-ops in\\\\nnon-free-threaded
      builds, so they can be safely added to code that needs to\\\\nsupport both build
      types.\\\\n\\\\nA common use of a critical section would be to lock an object
      while accessing\\\\nan internal attribute of it. For example, if an extension
      type has an internal\\\\ncount field, you could use a critical section while
      reading or writing that\\\\nfield:\\\\n\\\\n```\\\\n// read the count, returns
      new reference to internal count value\\\\nPyObject *result;\\\\nPy_BEGIN_CRITICAL_SECTION(obj);\\\\nresult
      = Py_NewRef(obj->count);\\\\nPy_END_CRITICAL_SECTION();\\\\nreturn result;\\\\n\\\\n//
      write the count, consumes reference from new_count\\\\nPy_BEGIN_CRITICAL_SECTION(obj);\\\\nobj->count
      = new_count;\\\\nPy_END_CRITICAL_SECTION();\\\\n```\\\\n\\\\n### How Critical
      Sections Work[\xB6](#how-critical-sections-work \\\\\\\"Link to this heading\\\\\\\")\\\\n\\\\nUnlike
      traditional locks, critical sections do not guarantee exclusive access\\\\nthroughout
      their entire duration. If a thread would block while holding a\\\\ncritical
      section (e.g., by acquiring another lock or performing I/O), the\\\\ncritical
      section is temporarily suspended\u2014all locks are released\u2014and then\\\\nresumed
      when the blocking operation completes.\\\\n\\\\nThis behavior is similar to
      what happens with the GIL when a thread makes a\\\\nblocking call. The key differences
      are:\\\\n\\\\n* Critical sections operate on a per-object basis rather than
      globally\\\\n* Critical sections follow a stack discipline within each thread
      (the \u201Cbegin\u201D and\\\\n  \u201Cend\u201D macros enforce this since they
      must be paired and within the same scope)\\\\n* Critical sections automatically
      release and reacquire locks around potential\\\\n  blocking operations\\\\n\\\\n###
      Deadlock Avoidance[\xB6](#deadlock-avoidance \\\\\\\"Link to this heading\\\\\\\")\\\\n\\\\nCritical
      sections help avoid deadlocks in two ways:\\\\n\\\\n1. If a thread tries to
      acquire a lock that\u2019s already held by another thread,\\\\n   it first suspends
      all of its active critical sections, temporarily releasing\\\\n   their locks\\\\n2.
      When the blocking operation completes, only the top-most critical section is\\\\n
      \  reacquired first\\\\n\\\\nThis means you cannot rely on nested critical sections
      to lock multiple objects\\\\nat once, as the inner critical section may suspend
      the outer ones. Instead, use\\\\n[`Py_BEGIN_CRITICAL_SECTION2`](../c-api/synchronization.html#c.Py_BEGIN_CRITICAL_SECTION2
      \\\\\\\"Py_BEGIN_CRITICAL_SECTION2\\\\\\\") to lock two objects simultaneously.\\\\n\\\\nNote
      that the locks described above are only [`PyMutex`](../c-api/synchronization.html#c.PyMutex
      \\\\\\\"PyMutex\\\\\\\") based locks.\\\\nThe critical section implementation
      does not know about or affect other locking\\\\nmechanisms that might be in
      use, like POSIX mutexes. Also note that while\\\\nblocking on any `PyMutex`
      causes the critical sections to be\\\\nsuspended, only the mutexes that are
      part of the critical sections are\\\\nreleased. If `PyMutex` is used without
      a critical section, it will\\\\nnot be released and therefore does not get the
      same deadlock avoidance.\\\\n\\\\n### Important Considerations[\xB6](#important-considerations
      \\\\\\\"Link to this heading\\\\\\\")\\\\n\\\\n* Critical sections may temporarily
      release their locks, allowing other threads\\\\n  to modify the protected data.
      Be careful about making assumptions about the\\\\n  state of the data after
      operations that might block.\\\\n* Because locks can be temporarily released
      (suspended), entering a critical\\\\n  section does not guarantee exclusive
      access to the protected resource\\\\n  throughout the section\u2019s duration.
      If code within a critical section calls\\\\n  another function that blocks (e.g.,
      acquires another lock, performs blocking\\\\n  I/O), all locks held by the thread
      via critical sections will be released.\\\\n  This is similar to how the GIL
      can be released during blocking calls.\\\\n* Only the lock(s) associated with
      the most recently entered (top-most)\\\\n  critical section are guaranteed to
      be held at any given time. Locks for\\\\n  outer, nested critical sections might
      have been suspended.\\\\n* You can lock at most two objects simultaneously with
      these APIs. If you need\\\\n  to lock more objects, you\u2019ll need to restructure
      your code.\\\\n* While critical sections will not deadlock if you attempt to
      lock the same\\\\n  object twice, they are less efficient than purpose-built
      reentrant locks for\\\\n  this use case.\\\\n* When using [`Py_BEGIN_CRITICAL_SECTION2`](../c-api/synchronization.html#c.Py_BEGIN_CRITICAL_SECTION2
      \\\\\\\"Py_BEGIN_CRITICAL_SECTION2\\\\\\\"), the order of the objects\\\\n  doesn\u2019t
      affect correctness (the implementation handles deadlock avoidance),\\\\n  but
      it\u2019s good practice to always lock objects in a consistent order.\\\\n*
      Remember that the critical section macros are primarily for protecting access\\\\n
      \ to *Python objects* that might be involved in internal CPython operations\\\\n
      \ susceptible to the deadlock scenarios described above. For protecting purely\\\\n
      \ internal extension state, standard mutexes or other synchronization\\\\n  primitives
      might be more appropriate.\\\\n\\\\nBuilding Extensions for the Free-Threaded
      Build[\xB6](#building-extensions-for-the-free-threaded-build \\\\\\\"Link to
      this heading\\\\\\\")\\\\n---------------------------------------------------------------------------------------------------------------------------\\\\n\\\\nC
      API extensions need to be built specifically for the free-threaded build.\\\\nThe
      wheels, shared libraries, and binaries are indicated by a `t` suffix.\\\\n\\\\n*
      [pypa/manylinux](https://github.com/pypa/manylinux) supports the\\\\n  free-threaded
      build, with the `t` suffix, such as `python3.14t`.\\\\n* [pypa/cibuildwheel](https://github.com/pypa/cibuildwheel)
      supports\\\\n  building wheels for the free-threaded build of Python 3.14 and
      newer.\\\\n\\\\n### Limited C API and Stable ABI[\xB6](#limited-c-api-and-stable-abi
      \\\\\\\"Link to this heading\\\\\\\")\\\\n\\\\nThe free-threaded build does
      not currently support the\\\\n[Limited C API](../c-api/stable.html#limited-c-api)
      or the stable ABI. If you use\\\\n[setuptools](https://setuptools.pypa.io/en/latest/setuptools.html)
      to build\\\\nyour extension and currently set `py_limited_api=True` you can
      use\\\\n`py_limited_api=not sysconfig.get_config_var(\\\\\\\"Py_GIL_DISABLED\\\\\\\")`
      to opt out\\\\nof the limited API when building with the free-threaded build.\\\\n\\\\nNote\\\\n\\\\nYou
      will need to build separate wheels specifically for the free-threaded\\\\nbuild.
      If you currently use the stable ABI, you can continue to build a\\\\nsingle
      wheel for multiple non-free-threaded Python versions.\\\\n\\\\n### Windows[\xB6](#windows
      \\\\\\\"Link to this heading\\\\\\\")\\\\n\\\\nDue to a limitation of the official
      Windows installer, you will need to\\\\nmanually define `Py_GIL_DISABLED=1`
      when building extensions from source.\\\\n\\\\nSee also\\\\n\\\\n[Porting Extension
      Modules to Support Free-Threading](https://py-free-threading.github.io/porting/):\\\\nA
      community-maintained porting guide for extension authors.\\\\n\\\\n### [Table
      of Contents](../contents.html)\\\\n\\\\n* [C API Extension Support for Free
