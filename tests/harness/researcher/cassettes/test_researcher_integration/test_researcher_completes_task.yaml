      Python is officially supported\",\"type\":\"find_in_page\",\"url\":\"https://docs.python.org/3.14/whatsnew/3.14.html\"},\"status\":\"completed\",\"type\":\"web_search_call\"},{\"name\":\"read_tool_result\",\"arguments\":\"{\\\"handle\\\":\\\"01a0021a-aa83-7252-8a64-d7108e706f29/call_ThjTLUpjfRlxSV43zSkDc4qF.0\\\",\\\"offset\\\":0,\\\"limit\\\":120}\",\"call_id\":\"call_H7yjfeTQBnxFNmNbiZimBniZ\",\"type\":\"function_call\",\"id\":\"fc_0e58f8341a296874006a7f8459f5c4819680b271ba2abd79fa\"},{\"type\":\"function_call_output\",\"call_id\":\"call_H7yjfeTQBnxFNmNbiZimBniZ\",\"output\":\"[handle
      '01a0021a-aa83-7252-8a64-d7108e706f29/call_ThjTLUpjfRlxSV43zSkDc4qF.0': 331
      matching line(s); showing 120]\\n# Free-threaded CPython 3.13\\n\\n## Executive
      summary\\n\\nCPython 3.13 introduced a **separate, experimental free-threaded
      build** in which the GIL is normally disabled. It is not the default CPython
      build, has a distinct ABI, requires separately built native extensions, and
      can automatically re-enable the GIL when an extension has not declared free-threading
      support. CPython 3.13\u2019s documentation warns of bugs, unsafe edge cases,
      increased memory use, and roughly **40% single-threaded overhead on `pyperformance`**.\\n\\nThe
      feature\u2019s acceptance was deliberately provisional: the Steering Council
      reserved the ability to roll back disruptive parts\u2014or even all\u2014of
      PEP 703.  \\nSources:  \\n<https://docs.python.org/3.13/howto/free-threading-python.html>
      \ \\n<https://docs.python.org/3.13/whatsnew/3.13.html#free-threaded-cpython>
      \ \\n<https://peps.python.org/pep-0703/> ([docs.python.org](https://docs.python.org/3.13/howto/free-threading-python.html))\\n\\n**Methodology
      note:** I treated the versioned CPython 3.13 documentation as authoritative
      for implemented behavior. The 3.13 \u201CWhat\u2019s New\u201D document itself
      warns that PEPs are usually not maintained after implementation, so I use PEP
      703 mainly for design intent, ABI rationale, and the Steering Council\u2019s
      acceptance proviso.  \\nSource: <https://docs.python.org/3.13/whatsnew/3.13.html>
      ([docs.python.org](https://docs.python.org/3.13/whatsnew/3.13.html))\\n\\n---\\n\\n##
      1. Maturity and experimental status\\n\\n- Python 3.13 itself is a stable language
      release, but its free-threaded mode is explicitly **experimental**, is **not
      enabled by default**, and uses a different executable, usually `python3.13t`
      or `python3.13t.exe`. The documentation says to expect bugs and a substantial
      single-threaded performance hit.  \\n  Source: <https://docs.python.org/3.13/whatsnew/3.13.html#free-threaded-cpython>
      ([docs.python.org](https://docs.python.org/3.13/whatsnew/3.13.html))\\n\\n-
      The dedicated 3.13 HOWTO repeats that the mode remains experimental and that
      work is ongoing.  \\n  Source: <https://docs.python.org/3.13/howto/free-threading-python.html>
      ([docs.python.org](https://docs.python.org/3.13/howto/free-threading-python.html))\\n\\n-
      Windows installation behavior is also explicitly marked experimental and \u201Cshould
      be expected to change in future releases.\u201D  \\n  Source: <https://docs.python.org/3.13/using/windows.html#installing-free-threaded-binaries>
      ([docs.python.org](https://docs.python.org/3.13/using/windows.html))\\n\\n-
      PEP 703 was accepted with a gradual-rollout proviso: changes may be rolled back
      if they prove too disruptive, potentially including all of PEP 703. This is
      a policy-level lack of permanence, not a claim that rollback is expected.  \\n
      \ Source: <https://peps.python.org/pep-0703/#note> ([peps.python.org](https://peps.python.org/pep-0703/))\\n\\n---\\n\\n##
      2. Obtaining, building, and enabling it\\n\\n### Official binaries\\n\\n- Official
      Python 3.13 installers for **macOS and Windows** optionally install free-threaded
      binaries. They are not the ordinary/default interpreter binaries.  \\n  Sources:
      \ \\n  <https://docs.python.org/3.13/howto/free-threading-python.html#installation>
      \ \\n  <https://docs.python.org/3.13/using/mac.html#installing-free-threaded-binaries>
      \ \\n  <https://docs.python.org/3.13/using/windows.html#installing-free-threaded-binaries>
      ([docs.python.org](https://docs.python.org/3.13/howto/free-threading-python.html))\\n\\n-
      On Windows, choose **Customize installation**, then select **Download free-threaded
      binaries**. For unattended installation, use `Include_freethreaded=1`. The main
      executable is `python3.13t.exe`; the launcher can select it with `py.exe -3.13t`.
      \ \\n  Source: <https://docs.python.org/3.13/using/windows.html#installing-free-threaded-binaries>
      ([docs.python.org](https://docs.python.org/3.13/using/windows.html))\\n\\n-
      Windows NuGet packages are named `python-freethreaded`, `pythonx86-freethreaded`,
      and `pythonarm64-freethreaded`.  \\n  Source: <https://docs.python.org/3.13/using/windows.html#free-threaded-packages>
      ([docs.python.org](https://docs.python.org/3.13/using/windows.html))\\n\\n###
      Building from source\\n\\nOn platforms using the normal `configure` build:\\n\\n```sh\\n./configure
      --disable-gil\\nmake\\nmake install       # or make altinstall\\n```\\n\\n`--disable-gil`
      defines `Py_GIL_DISABLED` and adds `t` to `sys.abiflags`.  \\nSources:  \\n<https://docs.python.org/3.13/using/configure.html#cmdoption-disable-gil>
      \ \\n<https://docs.python.org/3.13/howto/free-threading-python.html#installation>
      ([docs.python.org](https://docs.python.org/3.13/using/configure.html?utm_source=openai))\\n\\nThis
