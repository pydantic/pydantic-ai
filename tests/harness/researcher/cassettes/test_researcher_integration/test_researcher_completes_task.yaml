      free-threaded Python support specifically in CPython 3.13 using only official
      Python sources (docs.python.org, peps.python.org, python.org, GitHub python/cpython
      if necessary). Search broadly and read the supporting sources. Report: maturity/experimental
      status, how to obtain/build/enable it, runtime identification and GIL toggling
      behavior, extension compatibility requirements and GIL fallback, ABI/wheel tagging,
      important limitations/performance caveats, and any guarantees or lack thereof.
      Include direct source URLs for every factual claim, and distinguish any inference.\\\"}\",\"call_id\":\"call_ThjTLUpjfRlxSV43zSkDc4qF\",\"type\":\"function_call\",\"id\":\"fc_0e58f8341a296874006a7f83c2c3dc819699d5d5c3b5a14098\"},{\"type\":\"function_call_output\",\"call_id\":\"call_ThjTLUpjfRlxSV43zSkDc4qF\",\"output\":\"[Tool
      output too large (20,719 chars); stored to handle '01a0021a-aa83-7252-8a64-d7108e706f29/call_ThjTLUpjfRlxSV43zSkDc4qF.0'.
      Read it with read_tool_result(handle='01a0021a-aa83-7252-8a64-d7108e706f29/call_ThjTLUpjfRlxSV43zSkDc4qF.0',
      offset=0, limit=200, from_end=False, pattern=None).]\\n# Free-threaded CPython
      3.13\\n\\n## Executive summary\\n\\nCPython 3.13 introduced a **separate, experimental
      free-threaded build** in which the GIL is normally disabled. It is not the default
      CPython build, has a distinct ABI, requires separately built native extensions,
      and can automatically re-enable the GIL when an extension has not declared free-threading
      support. CPython 3.13\u2019s documentation warns of bugs, unsafe edge cases,
      increased memory use, and roughly **40% single-threaded overhead on `pyp\\n...[19,719
      chars omitted]...\\nhtml#c.PyUnstable_Module_SetGIL>  \\n<https://docs.python.org/3.13/using/windows.html#installing-free-threaded-binaries>
      \ \\n<https://peps.python.org/pep-0703/> ([docs.python.org](https://docs.python.org/3.13/howto/free-threading-python.html))\\n\\n**Bottom
      line:** CPython 3.13 free threading is suitable for experimentation, porting,
      compatibility testing, and carefully controlled workloads. Its own official
      documentation does not present it as a drop-in production replacement for ordinary
      CPython 3.13.\"},{\"id\":\"ws_0e58f8341a296874006a7f845146388196a71d0623a1466610\",\"action\":{\"type\":\"search\",\"queries\":[\"site:docs.python.org/3.14
