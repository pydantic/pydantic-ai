      and <https://docs.python.org/3.13/using/cmdline.html#envvar-PYTHON_GIL> ([docs.python.org](https://docs.python.org/3.13/using/cmdline.html))\\n\\n###
      Automatic fallback\\n\\nIf a C extension does not explicitly declare that it
      is safe without the GIL:\\n\\n1. importing it produces a warning; and\\n2. CPython
      enables the GIL at runtime.\\n\\nThe module declaration defaults to `Py_MOD_GIL_USED`
