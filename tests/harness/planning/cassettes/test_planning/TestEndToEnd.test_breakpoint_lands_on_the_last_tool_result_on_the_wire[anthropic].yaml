version: 1
interactions:
- request:
    method: POST
    uri: https://api.anthropic.com/v1/messages?beta=true
    headers:
      accept:
      - application/json
      accept-encoding:
      - gzip, deflate, br, zstd
      connection:
      - keep-alive
      content-length:
      - "6711"
      content-type:
      - application/json
      host:
      - api.anthropic.com
    body:
      type: json
      content:
        max_tokens: 128000
        messages:
        - role: user
          content:
          - text: >-
              First call `write_plan` with the single step "read the report". Then call
              `read_section` with n=1, then with n=2, one tool call per turn. After that, reply with
              just the word done.
            type: text
        model: claude-sonnet-4-6
        cache_control:
          type: ephemeral
          ttl: 5m
        stream: true
        system:
        - type: text
          text: "You have a planning tool, `write_plan`. For multi-step work, call it first to lay out the steps, then keep it current: mark exactly one step `in_progress`, and mark a step `completed` as soon as it is fully done. Pass the full plan every time you call `write_plan`. Use `add_task` to append a single step, `update_task_status`/`update_task_statuses` to move steps between statuses, and `read_plan` to see step ids before a granular edit."
        tool_choice:
          type: auto
        tools:
        - name: read_section
          description: Read section `n` of the incident report.
          input_schema:
            additionalProperties: false
            properties:
              "n":
                type: integer
            required:
            - "n"
            type: object
        - name: write_plan
          description: >-
            Create or replace the entire plan. Pass the whole ordered list every time --
            including steps that are unchanged, completed, or cancelled -- so there are no
            indices to track. Keep exactly one step `in_progress`. Call this first for multi-step
            work, then again as you start and finish steps.
          input_schema:
            additionalProperties: false
            properties:
              items:
                description: The complete ordered list of plan steps.
                items:
                  $ref: "#/$defs/PlanItem"
                type: array
            required:
            - items
            type: object
            $defs:
              PlanItem:
                description: |-
                  One step in the plan.

                  Used both as the `write_plan` input and as the stored item. `id` is
                  auto-generated when omitted, so the model can create a plan without ids and
                  reference existing steps by id when restructuring.

                  Attributes:
                      id: Stable identifier (auto-generated 8-char hex string).
                      content: Imperative description of the step, e.g. `Add the database migration`.
                      status: Current status of this step.
                      active_form: Optional present-continuous label shown while the step runs,
                          e.g. `Adding the database migration`.
                      parent_id: Parent step id for subtask hierarchies (subtasks mode only).
                      depends_on: Ids of steps that must complete before this one (subtasks mode only).
                properties:
                  id:
                    description: Step id. Auto-generated if omitted.
                    type: string
                  content:
                    description: Imperative description of the step, e.g. "Add the database migration".
                    type: string
                  status:
                    $ref: "#/$defs/TaskStatus"
                    default: pending
                    description: Current status of this step. "blocked" requires subtasks to be enabled.
                  active_form:
                    default: ""
                    description: >-
                      Present-continuous label shown while the step runs, e.g. "Adding the database
                      migration".
                    type: string
                  parent_id:
                    default: null
                    description: Parent step id for a subtask hierarchy. Requires subtasks to be enabled.
                    anyOf:
                    - type: string
                    - type: "null"
                  depends_on:
                    description: >-
                      Ids of steps that must complete before this one. Requires subtasks to be
                      enabled.
                    items:
                      type: string
                    type: array
                required:
                - content
                type: object
              TaskStatus:
                description: |-
                  Lifecycle status of a single plan step.

                  `blocked` is only reachable when the capability runs with
                  `enable_subtasks=True`; otherwise the toolset rejects it.
                enum:
                - pending
                - in_progress
                - completed
                - cancelled
                - blocked
                type: string
        - name: read_plan
          description: "Read the current plan: each step's id, content, and status, plus a progress summary. Use it before granular edits (the ids come from here) and to check what is left."
          input_schema:
            additionalProperties: false
            properties: {}
            type: object
        - name: add_task
          description: >-
            Append one new `pending` step without replacing the plan. Prefer this over
            write_plan when you only need to add a single step.
          input_schema:
            additionalProperties: false
            properties:
              content:
                description: The step description in imperative form.
                type: string
              active_form:
                default: ""
                description: Optional present-continuous label, e.g. "Fix bug" -> "Fixing bug".
                type: string
            required:
            - content
            type: object
        - name: update_task_status
          description: >-
            Update one step's status by id. Set `in_progress` when you START a step and
            `completed` when it is fully done -- never mark work complete while tests fail or
            the implementation is partial.
          input_schema:
            additionalProperties: false
            properties:
              task_id:
                description: Id of the step to update.
                type: string
              status:
                $ref: "#/$defs/TaskStatus"
                description: New status.
            required:
            - task_id
            - status
            type: object
            $defs:
              TaskStatus:
                description: |-
                  Lifecycle status of a single plan step.

                  `blocked` is only reachable when the capability runs with
                  `enable_subtasks=True`; otherwise the toolset rejects it.
                enum:
                - pending
                - in_progress
                - completed
                - cancelled
                - blocked
                type: string
        - name: update_task_statuses
          description: "Update several steps' statuses in one call -- ideal for handing off from a finished step to the next one. The whole batch is validated first: if any entry is invalid nothing is applied and the errors are returned. Entries apply in order, so when a batch both completes a prerequisite and starts its dependent, list the prerequisite's completion first."
          input_schema:
            additionalProperties: false
            properties:
              updates:
                description: The `{task_id, status}` entries to apply.
                items:
                  $ref: "#/$defs/PlanStatusUpdate"
                type: array
            required:
            - updates
            type: object
            $defs:
              PlanStatusUpdate:
                description: One entry of the `update_task_statuses` batch tool.
                properties:
                  task_id:
                    description: Id of the step to update (from `read_plan`).
                    type: string
                  status:
                    $ref: "#/$defs/TaskStatus"
                    description: "New status: pending, in_progress, completed, or cancelled -- or blocked, when subtasks are enabled."
                required:
                - task_id
                - status
                type: object
              TaskStatus:
                description: |-
                  Lifecycle status of a single plan step.

                  `blocked` is only reachable when the capability runs with
                  `enable_subtasks=True`; otherwise the toolset rejects it.
                enum:
                - pending
                - in_progress
                - completed
                - cancelled
                - blocked
                type: string
        - name: remove_task
          description: >-
            Permanently delete a step by id -- use it for steps that are no longer relevant
            or were created in error. To mark work done, use update_task_status instead.
          input_schema:
            additionalProperties: false
            properties:
              task_id:
                description: Id of the step to remove.
                type: string
            required:
            - task_id
            type: object
  response:
