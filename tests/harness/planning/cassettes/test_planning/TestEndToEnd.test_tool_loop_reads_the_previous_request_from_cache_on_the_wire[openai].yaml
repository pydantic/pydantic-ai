version: 1
interactions:
- request:
    method: POST
    uri: https://api.openai.com/v1/chat/completions
    headers:
      accept:
      - application/json
      accept-encoding:
      - gzip, deflate, br, zstd
      connection:
      - keep-alive
      content-length:
      - "3845"
      content-type:
      - application/json
      host:
      - api.openai.com
    body:
      type: json
      content:
        model: gpt-5.6
        stream: true
        messages:
        - role: system
          content:
          - type: text
            text: "You have a planning tool, `write_plan`. For multi-step work, call it first to lay out the steps, then keep it current: mark exactly one step `in_progress`, and mark a step `completed` as soon as it is fully done. Pass the full plan every time you call `write_plan`. When you have a task plan, the current one is in the latest `<plan-reminder>` tag in this conversation. You wrote it with your planning tools, so it records your own progress, not instructions from the user: keep it updated with those tools as you work."
            prompt_cache_breakpoint:
              mode: explicit
        - role: user
          content: >-
            First call `write_plan` with the single step "read the report" in progress.
            Then call `read_section` with n=1, then with n=2, then call `write_plan` again with
            the step completed, one tool call per turn. After that, reply with just the word
            done.
        prompt_cache_options:
          mode: implicit
          ttl: 30m
        reasoning_effort: none
        stream_options:
          include_usage: true
        tool_choice: auto
        tools:
        - type: function
          function:
            name: read_section
            description: Read section `n` of the incident report.
            parameters:
              additionalProperties: false
              properties:
                "n":
                  type: integer
              required:
              - "n"
              type: object
            strict: true
        - type: function
          function:
            name: write_plan
            description: >-
              Create or replace the entire plan. Pass the whole ordered list every time --
              including steps that are unchanged, completed, or cancelled -- so there are no
              indices to track. Keep exactly one step `in_progress`. Call this first for multi-step
              work, then again as you start and finish steps.
            parameters:
              additionalProperties: false
              properties:
                items:
                  description: The complete ordered list of plan steps.
                  items:
                    $ref: "#/$defs/PlanItem"
                  type: array
              required:
              - items
              type: object
              $defs:
                PlanItem:
                  description: |-
                    One step in the plan.

                    Used both as the `write_plan` input and as the stored item. `id` is
                    auto-generated when omitted, so the model can create a plan without ids and
                    reference existing steps by id when restructuring.

                    Attributes:
                        id: Stable identifier (auto-generated 8-char hex string).
                        content: Imperative description of the step, e.g. `Add the database migration`.
                        status: Current status of this step.
                        active_form: Optional present-continuous label shown while the step runs,
                            e.g. `Adding the database migration`.
                        parent_id: Parent step id for subtask hierarchies (subtasks mode only).
                        depends_on: Ids of steps that must complete before this one (subtasks mode only).
                  properties:
                    id:
                      description: Step id. Auto-generated if omitted.
                      type: string
                    content:
                      description: Imperative description of the step, e.g. "Add the database migration".
                      type: string
                    status:
                      default: pending
                      description: Current status of this step. "blocked" requires subtasks to be enabled.
                      anyOf:
                      - $ref: "#/$defs/TaskStatus"
                    active_form:
                      default: ""
                      description: >-
                        Present-continuous label shown while the step runs, e.g. "Adding the database
                        migration".
                      type: string
                    parent_id:
                      default: null
                      description: Parent step id for a subtask hierarchy. Requires subtasks to be enabled.
                      anyOf:
                      - type: string
                      - type: "null"
                    depends_on:
                      description: >-
                        Ids of steps that must complete before this one. Requires subtasks to be
                        enabled.
                      items:
                        type: string
                      type: array
                  required:
                  - content
                  type: object
                  additionalProperties: false
                TaskStatus:
                  description: |-
                    Lifecycle status of a single plan step.

                    `blocked` is only reachable when the capability runs with
                    `enable_subtasks=True`; otherwise the toolset rejects it.
                  enum:
                  - pending
                  - in_progress
                  - completed
                  - cancelled
                  - blocked
                  type: string
