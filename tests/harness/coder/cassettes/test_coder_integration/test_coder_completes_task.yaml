      incidents must not appear in exports unless a caller explicitly opts in.\\\"\\n\\n##
      4. Renderer boundary \u2014 `text_renderer.py`\\n\\n```python\\ndef render_text(incidents:
      list[Incident]) -> str:\\n    return '\\\\n'.join(f'[{item.severity.upper()}]
