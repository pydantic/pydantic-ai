      shell command to run.\",\"type\":\"string\"},\"timeout_seconds\":{\"default\":null,\"description\":\"Maximum
      seconds to wait (default: 30).\",\"anyOf\":[{\"type\":\"number\"},{\"type\":\"null\"}]}},\"required\":[\"command\"],\"type\":\"object\"}},{\"name\":\"start_command\",\"description\":\"<summary>Start
      a long-running command in the background (e.g. a server or watcher).\\n\\nCallers
      MUST call `stop_command(command_id)` when done to terminate the\\nprocess and
      clean up temporary output files.</summary>\\n<returns>\\n<description>A message
      containing the unique command ID for later check/stop calls.</description>\\n</returns>\",\"input_schema\":{\"additionalProperties\":false,\"properties\":{\"command\":{\"description\":\"The
      shell command to run in the background.\",\"type\":\"string\"}},\"required\":[\"command\"],\"type\":\"object\"}},{\"name\":\"check_command\",\"description\":\"<summary>Check
      the status and recent output of a background command.</summary>\\n<returns>\\n<description>Status
      and recent output of the background command.</description>\\n</returns>\",\"input_schema\":{\"additionalProperties\":false,\"properties\":{\"command_id\":{\"description\":\"The
      ID returned by start_command.\",\"type\":\"string\"}},\"required\":[\"command_id\"],\"type\":\"object\"}},{\"name\":\"stop_command\",\"description\":\"<summary>Stop
      a background command and return its final output.</summary>\\n<returns>\\n<description>Final
      output and exit status of the stopped command.</description>\\n</returns>\",\"input_schema\":{\"additionalProperties\":false,\"properties\":{\"command_id\":{\"description\":\"The
      ID returned by start_command.\",\"type\":\"string\"}},\"required\":[\"command_id\"],\"type\":\"object\"}},{\"name\":\"inventory_agent_context\",\"description\":\"Report
      where this repo's coding-assistant setup lives.\\n\\nReturns the locations of
      instruction dirs (`.claude`, `.agents`,\\n`.codex`, `.grok`) and, within each,
      the `skills/`, `agents/`, and\\n`settings.json` (hooks) it contains. This locates
      assets so you can read\\nand translate them; it does not parse their contents.\",\"input_schema\":{\"additionalProperties\":false,\"properties\":{},\"type\":\"object\"}},{\"name\":\"write_plan\",\"description\":\"Create
      or replace the entire plan. Pass the whole ordered list every time -- including
      steps that are unchanged, completed, or cancelled -- so there are no indices
      to track. Keep exactly one step `in_progress`. Call this first for multi-step
      work, then again as you start and finish steps.\",\"input_schema\":{\"additionalProperties\":false,\"properties\":{\"items\":{\"description\":\"The
      complete ordered list of plan steps.\",\"items\":{\"$ref\":\"#/$defs/PlanItem\"},\"type\":\"array\"}},\"required\":[\"items\"],\"type\":\"object\",\"$defs\":{\"PlanItem\":{\"description\":\"One
      step in the plan.\\n\\nUsed both as the `write_plan` input and as the stored
      item. `id` is\\nauto-generated when omitted, so the model can create a plan
      without ids and\\nreference existing steps by id when restructuring.\\n\\nAttributes:\\n
      \   id: Stable identifier (auto-generated 8-char hex string).\\n    content:
      Imperative description of the step, e.g. `Add the database migration`.\\n    status:
      Current status of this step.\\n    active_form: Optional present-continuous
      label shown while the step runs,\\n        e.g. `Adding the database migration`.\\n
      \   parent_id: Parent step id for subtask hierarchies (subtasks mode only).\\n
      \   depends_on: Ids of steps that must complete before this one (subtasks mode
      only).\",\"properties\":{\"id\":{\"description\":\"Step id. Auto-generated if
      omitted.\",\"type\":\"string\"},\"content\":{\"description\":\"Imperative description
      of the step, e.g. \\\"Add the database migration\\\".\",\"type\":\"string\"},\"status\":{\"$ref\":\"#/$defs/TaskStatus\",\"default\":\"pending\",\"description\":\"Current
      status of this step. \\\"blocked\\\" requires subtasks to be enabled.\"},\"active_form\":{\"default\":\"\",\"description\":\"Present-continuous
      label shown while the step runs, e.g. \\\"Adding the database migration\\\".\",\"type\":\"string\"},\"parent_id\":{\"default\":null,\"description\":\"Parent
      step id for a subtask hierarchy. Requires subtasks to be enabled.\",\"anyOf\":[{\"type\":\"string\"},{\"type\":\"null\"}]},\"depends_on\":{\"description\":\"Ids
      of steps that must complete before this one. Requires subtasks to be enabled.\",\"items\":{\"type\":\"string\"},\"type\":\"array\"}},\"required\":[\"content\"],\"type\":\"object\"},\"TaskStatus\":{\"description\":\"Lifecycle
      status of a single plan step.\\n\\n`blocked` is only reachable when the capability
      runs with\\n`enable_subtasks=True`; otherwise the toolset rejects it.\",\"enum\":[\"pending\",\"in_progress\",\"completed\",\"cancelled\",\"blocked\"],\"type\":\"string\"}}}},{\"name\":\"read_plan\",\"description\":\"Read
      the current plan: each step's id, content, and status, plus a progress summary.
      Use it before granular edits (the ids come from here) and to check what is left.\",\"input_schema\":{\"additionalProperties\":false,\"properties\":{},\"type\":\"object\"}},{\"name\":\"add_task\",\"description\":\"Append
      one new `pending` step without replacing the plan. Prefer this over write_plan
      when you only need to add a single step.\",\"input_schema\":{\"additionalProperties\":false,\"properties\":{\"content\":{\"description\":\"The
      step description in imperative form.\",\"type\":\"string\"},\"active_form\":{\"default\":\"\",\"description\":\"Optional
      present-continuous label, e.g. \\\"Fix bug\\\" -> \\\"Fixing bug\\\".\",\"type\":\"string\"}},\"required\":[\"content\"],\"type\":\"object\"}},{\"name\":\"update_task_status\",\"description\":\"Update
      one step's status by id. Set `in_progress` when you START a step and `completed`
      when it is fully done -- never mark work complete while tests fail or the implementation
      is partial.\",\"input_schema\":{\"additionalProperties\":false,\"properties\":{\"task_id\":{\"description\":\"Id
      of the step to update.\",\"type\":\"string\"},\"status\":{\"$ref\":\"#/$defs/TaskStatus\",\"description\":\"New
      status.\"}},\"required\":[\"task_id\",\"status\"],\"type\":\"object\",\"$defs\":{\"TaskStatus\":{\"description\":\"Lifecycle
      status of a single plan step.\\n\\n`blocked` is only reachable when the capability
      runs with\\n`enable_subtasks=True`; otherwise the toolset rejects it.\",\"enum\":[\"pending\",\"in_progress\",\"completed\",\"cancelled\",\"blocked\"],\"type\":\"string\"}}}},{\"name\":\"update_task_statuses\",\"description\":\"Update
      several steps' statuses in one call -- ideal for handing off from a finished
      step to the next one. The whole batch is validated first: if any entry is invalid
      nothing is applied and the errors are returned. Entries apply in order, so when
      a batch both completes a prerequisite and starts its dependent, list the prerequisite's
      completion first.\",\"input_schema\":{\"additionalProperties\":false,\"properties\":{\"updates\":{\"description\":\"The
      `{task_id, status}` entries to apply.\",\"items\":{\"$ref\":\"#/$defs/PlanStatusUpdate\"},\"type\":\"array\"}},\"required\":[\"updates\"],\"type\":\"object\",\"$defs\":{\"PlanStatusUpdate\":{\"description\":\"One
      entry of the `update_task_statuses` batch tool.\",\"properties\":{\"task_id\":{\"description\":\"Id
      of the step to update (from `read_plan`).\",\"type\":\"string\"},\"status\":{\"$ref\":\"#/$defs/TaskStatus\",\"description\":\"New
      status: pending, in_progress, completed, or cancelled -- or blocked, when subtasks
      are enabled.\"}},\"required\":[\"task_id\",\"status\"],\"type\":\"object\"},\"TaskStatus\":{\"description\":\"Lifecycle
      status of a single plan step.\\n\\n`blocked` is only reachable when the capability
      runs with\\n`enable_subtasks=True`; otherwise the toolset rejects it.\",\"enum\":[\"pending\",\"in_progress\",\"completed\",\"cancelled\",\"blocked\"],\"type\":\"string\"}}}},{\"name\":\"remove_task\",\"description\":\"Permanently
      delete a step by id -- use it for steps that are no longer relevant or were
      created in error. To mark work done, use update_task_status instead.\",\"input_schema\":{\"additionalProperties\":false,\"properties\":{\"task_id\":{\"description\":\"Id
      of the step to remove.\",\"type\":\"string\"}},\"required\":[\"task_id\"],\"type\":\"object\"}},{\"name\":\"delegate_task\",\"description\":\"Delegate
      a self-contained task to a named sub-agent and return its result.\\n\\nThe sub-agent
      runs in its own fresh context and does not see this\\nconversation, so `task`
      must contain everything it needs.\",\"input_schema\":{\"additionalProperties\":false,\"properties\":{\"agent_name\":{\"description\":\"Name
      of the sub-agent to run. Must be one of the agents\\nlisted in the instructions.\",\"type\":\"string\"},\"task\":{\"description\":\"The
      complete, self-contained instruction for the sub-agent.\",\"type\":\"string\"}},\"required\":[\"agent_name\",\"task\"],\"type\":\"object\"}},{\"name\":\"read_tool_result\",\"description\":\"Read
      a slice of a spilled tool result.\",\"input_schema\":{\"additionalProperties\":false,\"properties\":{\"handle\":{\"description\":\"The
      handle from the overflowed tool return.\",\"type\":\"string\"},\"offset\":{\"default\":0,\"description\":\"Number
      of matching lines to skip from the start (or end). Must be >= 0.\",\"type\":\"integer\"},\"limit\":{\"default\":200,\"description\":\"Maximum
      number of lines to return (>= 1; clamped to a built-in cap).\",\"type\":\"integer\"},\"from_end\":{\"default\":false,\"description\":\"Count
      `offset`/`limit` from the end of the result.\",\"type\":\"boolean\"},\"pattern\":{\"default\":null,\"description\":\"Optional
      literal substring; only lines containing it are returned.\",\"anyOf\":[{\"type\":\"string\"},{\"type\":\"null\"}]}},\"required\":[\"handle\"],\"type\":\"object\"}}]}"
