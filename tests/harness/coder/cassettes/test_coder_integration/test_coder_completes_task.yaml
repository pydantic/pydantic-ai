      on the **default** `include_internal=False` (and implicitly on the default output
      being text):\\n\\n```python\\n# dashboard.py\\ndef incident_card(items: list[Incident])
      -> str:\\n    return render_report(items)\\n```\\n\\n**`digest.py`** \u2014
      explicit internal opt-in via keyword:\\n\\n```python\\n# digest.py\\ndef internal_digest(items:
      list[Incident]) -> str:\\n    return render_report(items, include_internal=True)\\n```\\n\\n**`test_reports.py`**
      \u2014 calls only `cli.run` (see \xA76).\\n\\n**Breakage risks if you change
      signatures/defaults:**\\n- `dashboard.incident_card` passes no keywords \u2192
      any new required parameter, or changing the default format away from text, breaks
      it.\\n- Both keyword call sites use `include_internal=` \u2014 don't rename
      it or make it positional.\\n- All callers annotate/expect `-> str`, so `render_report`
      must keep returning `str` for JSON too (a JSON string, not a dict).\\n- Safe
      change: add `format_name: str = \\\"text\\\"` as an additional keyword-only
      param with a default.\\n\\n## 3. Privacy policy \u2014 `policy.py`\\n\\n```python\\n#
      policy.py\\ndef visible_incidents(\\n    incidents: list[Incident], *, include_internal:
      bool\\n) -> list[Incident]:\\n    if include_internal:\\n        return incidents\\n
      \   return [incident for incident in incidents if not incident.internal]\\n```\\n\\n-
      Internal opt-in is the keyword-only param `include_internal` (**no default here**
      \u2014 the default `False` lives only at the public boundary in `service.render_report`
      / `cli.run`).\\n- Filtering keeps input order (list comprehension preserves
      ordering).\\n- **Filtering happens in the service layer, before rendering**:
      `service.render_report` calls `visible_incidents(...)` first, then hands the
      already-filtered list to the renderer. Renderers never see internal incidents
      unless opted in. Your JSON renderer must be wired the same way (receive `visible`,
      not the raw list) so privacy is preserved automatically.\\n\\n## 4. Renderer
      boundary \u2014 `text_renderer.py`\\n\\n```python\\n# text_renderer.py (entire
      file)\\nfrom incidents import Incident\\n\\n\\ndef render_text(incidents: list[Incident])
      -> str:\\n    return '\\\\n'.join(f'[{item.severity.upper()}] {item.title}'
      for item in incidents)\\n```\\n\\n- **Input shape:** `list[Incident]` (already
      policy-filtered).\\n- **Output:** `str`, one line per incident, `[SEVERITY_UPPERCASED]
      title`, `\\\\n`-joined.\\n- **Selection:** there is **no format registry** \u2014
      `service.py` imports `render_text` directly and calls it unconditionally. Format
      selection/dispatch does not exist yet; you'll be adding it.\\n\\n## 5. Incident
      data model \u2014 `incidents.py`\\n\\n```python\\n# incidents.py (entire file)\\nfrom
      dataclasses import dataclass\\n\\n\\n@dataclass(frozen=True)\\nclass Incident:\\n
      \   title: str\\n    severity: str\\n    internal: bool = False\\n```\\n\\n-
      Frozen dataclass; fields: `title: str`, `severity: str`, `internal: bool = False`.
      Positional construction `Incident('API down', 'critical')` is used in tests.
      Your JSON objects need `title` and `severity` (raw, not uppercased \u2014 the
      uppercasing is a text-renderer presentation choice, not domain data); `internal`
      should presumably not leak into JSON output.\\n\\n## 6. Locked-in behaviors
      \u2014 `test_reports.py`\\n\\n```python\\nfrom cli import run\\nfrom incidents
      import Incident\\n\\n\\ndef test_text_report_hides_internal_by_default() ->
