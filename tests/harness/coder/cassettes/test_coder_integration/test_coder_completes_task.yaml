      should be able to select `format_name=\\\"json\\\"`; JSON contains an `incidents`
      array of objects with `title` and `severity`, in input order. Preserve text
      as the default and the existing internal-incident privacy behavior for both
      formats. Follow the repository architecture, cover the service and CLI paths
      including explicit internal opt-in, and run the full test suite.\",\"type\":\"text\"}]},{\"role\":\"assistant\",\"content\":[{\"thinking\":\"\",\"signature\":\"\",\"type\":\"thinking\"},{\"id\":\"toolu_01BqLzyjHnafXwTxPCSwH6xf\",\"type\":\"tool_use\",\"name\":\"inventory_agent_context\",\"input\":{}},{\"id\":\"toolu_01JzqeGbs5V2ES4WzgC4dYNM\",\"type\":\"tool_use\",\"name\":\"list_directory\",\"input\":{\"path\":\".\"}}]},{\"role\":\"user\",\"content\":[{\"tool_use_id\":\"toolu_01BqLzyjHnafXwTxPCSwH6xf\",\"type\":\"tool_result\",\"content\":[{\"text\":\"{\\\"roots\\\":[{\\\"root\\\":\\\".claude\\\",\\\"exists\\\":false,\\\"skills\\\":[],\\\"agents\\\":[],\\\"settings\\\":null,\\\"notes\\\":null},{\\\"root\\\":\\\".agents\\\",\\\"exists\\\":false,\\\"skills\\\":[],\\\"agents\\\":[],\\\"settings\\\":null,\\\"notes\\\":null},{\\\"root\\\":\\\".codex\\\",\\\"exists\\\":false,\\\"skills\\\":[],\\\"agents\\\":[],\\\"settings\\\":null,\\\"notes\\\":\\\"Codex
      uses TOML config; assets are derived from the .claude/.agents setup.\\\"},{\\\"root\\\":\\\".grok\\\",\\\"exists\\\":false,\\\"skills\\\":[],\\\"agents\\\":[],\\\"settings\\\":null,\\\"notes\\\":\\\"Grok
      setup is derived from the .claude/.agents setup.\\\"}]}\",\"type\":\"text\"}],\"is_error\":false},{\"tool_use_id\":\"toolu_01JzqeGbs5V2ES4WzgC4dYNM\",\"type\":\"tool_result\",\"content\":[{\"text\":\"AGENTS.md
