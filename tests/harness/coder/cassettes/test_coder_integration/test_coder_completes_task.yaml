      its consumers, the privacy policy, and renderer boundaries as a separate read-only
      compatibility investigation, then use those findings during implementation so
      existing callers stay intact. Callers of both the public service and CLI adapter
      should be able to select `format_name=\\\"json\\\"`; JSON contains an `incidents`
      array of objects with `title` and `severity`, in input order. Preserve text
      as the default and the existing internal-incident privacy behavior for both
      formats. Follow the repository architecture, cover the service and CLI paths
      including explicit internal opt-in, and run the full test suite.\",\"type\":\"text\"}]},{\"role\":\"assistant\",\"content\":[{\"thinking\":\"\",\"signature\":\"\",\"type\":\"thinking\"},{\"id\":\"toolu_01Qbov3cx389nmfxqJmST8f6\",\"type\":\"tool_use\",\"name\":\"inventory_agent_context\",\"input\":{}},{\"id\":\"toolu_011FXeZL5wwv2CtE7PFBzDmn\",\"type\":\"tool_use\",\"name\":\"list_directory\",\"input\":{\"path\":\".\"}}]},{\"role\":\"user\",\"content\":[{\"tool_use_id\":\"toolu_01Qbov3cx389nmfxqJmST8f6\",\"type\":\"tool_result\",\"content\":[{\"text\":\"{\\\"roots\\\":[{\\\"root\\\":\\\".claude\\\",\\\"exists\\\":false,\\\"skills\\\":[],\\\"agents\\\":[],\\\"settings\\\":null,\\\"notes\\\":null},{\\\"root\\\":\\\".agents\\\",\\\"exists\\\":false,\\\"skills\\\":[],\\\"agents\\\":[],\\\"settings\\\":null,\\\"notes\\\":null},{\\\"root\\\":\\\".codex\\\",\\\"exists\\\":false,\\\"skills\\\":[],\\\"agents\\\":[],\\\"settings\\\":null,\\\"notes\\\":\\\"Codex
