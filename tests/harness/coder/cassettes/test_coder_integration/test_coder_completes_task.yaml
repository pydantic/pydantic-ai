      -> list[Incident]:\\n    if include_internal:\\n        return incidents\\n
      \   return [incident for incident in incidents if not incident.internal]\\n```\\n\\n-
      Keyword-only `include_internal` with **no default here** \u2014 the policy layer
      forces callers (the service) to decide explicitly; the `False` default lives
