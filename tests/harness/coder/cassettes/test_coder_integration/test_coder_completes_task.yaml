      read the entire repo (it's small \u2014 every file fits below). Note: `inventory_agent_context`
      shows **no coding-assistant setup exists** (`.claude`, `.agents`, `.codex`,
      `.grok` all `exists: false`), so the only conventions come from `AGENTS.md`
      and `README.md`.\\n\\n---\\n\\n## 1. Public service entry point \u2014 `service.py`\\n\\nThere
      is exactly one entry point, and text rendering is **hardcoded** at the end of
      it:\\n\\n```python\\n# service.py (entire file)\\nfrom incidents import Incident\\nfrom
      policy import visible_incidents\\nfrom text_renderer import render_text\\n\\n\\ndef
      render_report(incidents: list[Incident], *, include_internal: bool = False)
      -> str:\\n    visible = visible_incidents(incidents, include_internal=include_internal)\\n
