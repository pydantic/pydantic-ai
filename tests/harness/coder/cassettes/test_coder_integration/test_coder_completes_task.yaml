      when you only need to add a single step.\",\"input_schema\":{\"additionalProperties\":false,\"properties\":{\"content\":{\"description\":\"The
      step description in imperative form.\",\"type\":\"string\"},\"active_form\":{\"default\":\"\",\"description\":\"Optional
      present-continuous label, e.g. \\\"Fix bug\\\" -> \\\"Fixing bug\\\".\",\"type\":\"string\"}},\"required\":[\"content\"],\"type\":\"object\"}},{\"name\":\"update_task_status\",\"description\":\"Update
      one step's status by id. Set `in_progress` when you START a step and `completed`
      when it is fully done -- never mark work complete while tests fail or the implementation
      is partial.\",\"input_schema\":{\"additionalProperties\":false,\"properties\":{\"task_id\":{\"description\":\"Id
      of the step to update.\",\"type\":\"string\"},\"status\":{\"$ref\":\"#/$defs/TaskStatus\",\"description\":\"New
      status.\"}},\"required\":[\"task_id\",\"status\"],\"type\":\"object\",\"$defs\":{\"TaskStatus\":{\"description\":\"Lifecycle
      status of a single plan step.\\n\\n`blocked` is only reachable when the capability
      runs with\\n`enable_subtasks=True`; otherwise the toolset rejects it.\",\"enum\":[\"pending\",\"in_progress\",\"completed\",\"cancelled\",\"blocked\"],\"type\":\"string\"}}}},{\"name\":\"update_task_statuses\",\"description\":\"Update
      several steps' statuses in one call -- ideal for handing off from a finished
      step to the next one. The whole batch is validated first: if any entry is invalid
      nothing is applied and the errors are returned. Entries apply in order, so when
      a batch both completes a prerequisite and starts its dependent, list the prerequisite's
      completion first.\",\"input_schema\":{\"additionalProperties\":false,\"properties\":{\"updates\":{\"description\":\"The
      `{task_id, status}` entries to apply.\",\"items\":{\"$ref\":\"#/$defs/PlanStatusUpdate\"},\"type\":\"array\"}},\"required\":[\"updates\"],\"type\":\"object\",\"$defs\":{\"PlanStatusUpdate\":{\"description\":\"One
      entry of the `update_task_statuses` batch tool.\",\"properties\":{\"task_id\":{\"description\":\"Id
      of the step to update (from `read_plan`).\",\"type\":\"string\"},\"status\":{\"$ref\":\"#/$defs/TaskStatus\",\"description\":\"New
      status: pending, in_progress, completed, or cancelled -- or blocked, when subtasks
      are enabled.\"}},\"required\":[\"task_id\",\"status\"],\"type\":\"object\"},\"TaskStatus\":{\"description\":\"Lifecycle
      status of a single plan step.\\n\\n`blocked` is only reachable when the capability
      runs with\\n`enable_subtasks=True`; otherwise the toolset rejects it.\",\"enum\":[\"pending\",\"in_progress\",\"completed\",\"cancelled\",\"blocked\"],\"type\":\"string\"}}}},{\"name\":\"remove_task\",\"description\":\"Permanently
      delete a step by id -- use it for steps that are no longer relevant or were
      created in error. To mark work done, use update_task_status instead.\",\"input_schema\":{\"additionalProperties\":false,\"properties\":{\"task_id\":{\"description\":\"Id
      of the step to remove.\",\"type\":\"string\"}},\"required\":[\"task_id\"],\"type\":\"object\"}},{\"name\":\"delegate_task\",\"description\":\"Delegate
      a self-contained task to a named sub-agent and return its result.\\n\\nThe sub-agent
