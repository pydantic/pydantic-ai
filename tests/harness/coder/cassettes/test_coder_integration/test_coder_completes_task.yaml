      steps that are unchanged, completed, or cancelled -- so there are no indices
      to track. Keep exactly one step `in_progress`. Call this first for multi-step
      work, then again as you start and finish steps.\",\"input_schema\":{\"additionalProperties\":false,\"properties\":{\"items\":{\"description\":\"The
      complete ordered list of plan steps.\",\"items\":{\"$ref\":\"#/$defs/PlanItem\"},\"type\":\"array\"}},\"required\":[\"items\"],\"type\":\"object\",\"$defs\":{\"PlanItem\":{\"description\":\"One
