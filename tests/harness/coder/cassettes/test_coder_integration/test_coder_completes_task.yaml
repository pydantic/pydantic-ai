      ID returned by start_command.\",\"type\":\"string\"}},\"required\":[\"command_id\"],\"type\":\"object\"}},{\"name\":\"stop_command\",\"description\":\"<summary>Stop
      a background command and return its final output.</summary>\\n<returns>\\n<description>Final
      output and exit status of the stopped command.</description>\\n</returns>\",\"input_schema\":{\"additionalProperties\":false,\"properties\":{\"command_id\":{\"description\":\"The
      ID returned by start_command.\",\"type\":\"string\"}},\"required\":[\"command_id\"],\"type\":\"object\"}},{\"name\":\"inventory_agent_context\",\"description\":\"Report
      where this repo's coding-assistant setup lives.\\n\\nReturns the locations of
      instruction dirs (`.claude`, `.agents`,\\n`.codex`, `.grok`) and, within each,
      the `skills/`, `agents/`, and\\n`settings.json` (hooks) it contains. This locates
      assets so you can read\\nand translate them; it does not parse their contents.\",\"input_schema\":{\"additionalProperties\":false,\"properties\":{},\"type\":\"object\"}},{\"name\":\"write_plan\",\"description\":\"Create
