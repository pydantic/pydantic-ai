      permissions-policy:
      - >-
        payment=(self "https://checkout.stripe.com" "https://connect-js.stripe.com"
        "https://js.stripe.com" "https://*.js.stripe.com" "https://hooks.stripe.com")
      referrer-policy:
      - no-referrer, strict-origin-when-cross-origin
      transfer-encoding:
      - chunked
