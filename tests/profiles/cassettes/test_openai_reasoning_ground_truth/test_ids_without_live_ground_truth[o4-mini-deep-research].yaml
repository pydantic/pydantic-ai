interactions:
- request:
    headers:
      accept:
      - application/json
      accept-encoding:
      - gzip, deflate, br, zstd
      connection:
      - keep-alive
      content-length:
      - '90'
      content-type:
      - application/json
      host:
      - api.openai.com
    method: POST
    parsed_body:
      input: hi
      max_output_tokens: 16
      model: o4-mini-deep-research
      store: false
    uri: https://api.openai.com/v1/responses
