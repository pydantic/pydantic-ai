      access-control-expose-headers:
      - X-Request-ID
      - CF-Ray
      - CF-Ray
      alt-svc:
      - h3=":443"; ma=86400
      connection:
      - keep-alive
      content-length:
      - '128'
      content-type:
      - application/json
      openai-processing-ms:
      - '48'
      openai-version:
      - '2020-10-01'
      strict-transport-security:
      - max-age=31536000; includeSubDomains; preload
      transfer-encoding:
      - chunked
    parsed_body:
      error:
        code: null
        message: Model not found o4-mini-deep-research
