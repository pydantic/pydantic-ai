              2.  **Availability (A):** Every request receives a (non-error) response, without guarantee that it contains the most recent write. This means the system is always operational and responsive to queries, even if some nodes fail.
              3.  **Partition Tolerance (P):** The system continues to operate despite an arbitrary number of messages being dropped (or delayed) by the network between nodes. In essence, the system can tolerate network partitions, where communication between some nodes is disrupted.

