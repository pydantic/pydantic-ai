          Review of `def add(a, b): return a + b`:

          The function is correct but lacks type annotations, which reduces clarity and prevents static type checkers (e.g., mypy) from catching misuse.

          **Suggested version:**
          ```python
          def add(a: int, b: int) -> int:
              return a + b
          ```

          If you want it to support floats too:
          ```python
          def add(a: float, b: float) -> float:
              return a + b
          ```

          **Time complexity:** O(1) -- a single arithmetic operation, independent of input size.
          **Space complexity:** O(1) -- no additional memory is used beyond the inputs and result.

          Going forward, I'll include type annotations and complexity notes in all code reviews as requested.
