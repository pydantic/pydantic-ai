          ## Review of `def add(a, b): return a + b`

          **Suggestion with type annotations:**

          ```python
          def add(a: int, b: int) -> int:
              return a + b
          ```

          **Time complexity:** O(1) -- a single addition operation runs in constant time (assuming fixed-width integers; for arbitrary-precision integers it's technically O(n) in the number of digits).

          **A few notes:**

          - The types above assume you want integer addition. If you need to support floats or mixed numeric types, consider being more general:

          ```python
          from numbers import Number

          def add(a: Number, b: Number) -> Number:
              return a + b
          ```

          - If you want to support any type that implements `+` (strings, lists, etc.), a `TypeVar` bound to a protocol would be more accurate -- let me know your intended use and I'll refine it.

          Otherwise, the function itself is simple and correct.
