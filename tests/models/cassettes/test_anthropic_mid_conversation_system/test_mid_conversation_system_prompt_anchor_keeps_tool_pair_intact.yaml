      content:
      - text: |-
          Based on the style guide, which recommends explicit signatures, here's my review of your function:

          ```python
          def add(a, b):
              return a + b
          ```

          **Review feedback:**

          The function is functionally correct, but it doesn't follow the project style guide's recommendation to **prefer explicit signatures**. Per the new requirement, every suggestion must include explicit type annotations.

          **Suggested revision:**

          ```python
          def add(a: int, b: int) -> int:
              return a + b
          ```

          **Notes:**

          1. **Type annotations added** -- Parameters `a` and `b` are annotated as `int`, and the return type is `-> int`, making the signature explicit as the style guide prefers.

          2. **Consider your intended use case** -- If this function is meant to handle other numeric types (e.g., `float`) or support both, you may want a more general annotation. Two options:

             ```python
             # For any numeric type
             from numbers import Number

             def add(a: Number, b: Number) -> Number:
                 return a + b
             ```

             ```python
             # For int or float specifically
             def add(a: int | float, b: int | float) -> int | float:
                 return a + b
             ```

          3. **Optional: add a docstring** -- For clarity, especially in a shared codebase:

             ```python
             def add(a: int, b: int) -> int:
                 """Return the sum of two integers."""
                 return a + b
             ```

          The core logic is fine--the main improvement is making the signature explicit with type annotations to comply with the style guide.
