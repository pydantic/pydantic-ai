          ```python
          def add(a: int, b: int) -> int:
              return a + b
          ```

          - If you want it to support multiple numeric types, `float` or `int | float` unions could work too.
          - No input validation -- fine for simple utility code, but worth adding if used in a larger system where bad input types are a risk.

