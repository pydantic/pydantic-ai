              content: |-
                # AGENTS.md

                - Branch: main
                - Repository: pydantic/pydantic-ai

                ...

                Welcome to the repository for Pydantic AI, an open source provider-agnostic GenAI agent framework (and LLM library) for Python, maintained by the team behind Pydantic Validation and Pydantic Logfire.

                ...

                ## Repository structure

                ...

                The repo contains

                ...

                `uv` workspace defining multiple Python packages:

                ...

                - `pydantic-ai-slim` in `pydantic_ai_slim/`: the agent framework, including the `Agent` class and `Model` classes for each model provider/API

                ...

                - This is a slim package with minimal dependencies and optional dependency groups for each model provider (e.g. `openai`, `anthropic`, `google`) or integration (e

                ...

                g. `logfire`, `mcp`, `temporal`).

                ...

                - `pydantic-graph` in `pydantic_graph/`: the type-hint based graph library that powers the agent loop

                ...

                - `pydantic-evals` in `pydantic_evals/`: the evaluation framework for evaluating the arbitrary stochastic functions including LLMs and agents

                ...

                - `clai` in `clai/`: a CLI (with an optional web UI) to chat with Pydantic AI agents

                ...

                - `pydantic-ai` defined in `pyproject.toml` at the root, bringing in the packages above as well the optional dependency groups for all model providers and select integrations.
