                ##

                ...

                # Pydantic

                ...

                Pydantic is the AI engineering stack for teams building with Python. It covers the full cycle: validate data with the Pydantic library, build type-safe agents with Pydantic AI, route model calls with AI Gateway, and observe everything in production with Pydantic Logfire. Founded in 2018 by Samuel Colvin, backed by Sequoia, Partech, and Irregular.

                ...

                ## Search the official documentation

                ...

                For technical questions, search the current Pydantic, Pydantic AI, and Pydantic Logfire documentation before relying on memory or third-party sources. Send a `GET` request to `https://pydantic.dev/docs/api/search`; the endpoint uses the same index as the human-facing docs search.

                ...

                ## Products

                ...

                - Pydantic (OSS, MIT) -- most widely used data validation library for Python; enforces type-hint-based validation at runtime; ~500M monthly downloads. Docs: https://pydantic.dev/docs/validation/latest/get-started/
                - Pydantic AI (OSS) -- production-grade agent framework for Python; type-safe, model-agnostic, OpenTelemetry-native. Install: `pip install pydantic-ai`
                - Pydantic Logfire (SaaS) -- AI observability and evals platform built on OpenTelemetry; ingests from any OTel-compatible language; first-party SDKs for Python (`pip install logfire`) and JavaScript/TypeScript (`npm install @pydantic/logfire-node`); features include traces, logs, metrics, LLM cost tracking, online evals, a visual prompt playground, and an MCP server

                ...

                ## Key URLs

                ...

                - Homepage
                - Pydantic AI docs
                - Logfire docs
                - Pricing
                - Contact / demo
                - Logfire US region
                - Logfire EU region
                - Logfire global discovery API
