            url_citation:
              content: "GitHub - pydantic/pydantic-ai at v1.84.0 · GitHub\n\n...\n\nv1.84.0\n\n...\n\n### GenAI Agent Framework,
                the Pydantic way\n\n...\n\n### Pydantic AI is a Python agent framework designed to help you quickly, confidently,
                and painlessly build production grade applications and workflows with Generative AI.\n\n...\n\nFastAPI revolutionized
                web development by offering an innovative and ergonomic design, built on the foundation of Pydantic Validation
                and modern Python features like type hints.\n\n...\n\n'\n\n...\n\nWe built Pydantic AI with one simple aim:
                to bring that FastAPI feeling to GenAI app and agent development.\n\n...\n\n## Why use Pydantic AI\n\n...\n\nBuilt
                by the Pydantic Team: Pydantic Validation is the validation layer of the OpenAI SDK, the Google ADK, the Anthropic
                SDK, LangChain, LlamaIndex, AutoGPT, Transformers, CrewAI, Instructor and many more. Why use the derivative
                when you can go straight to the source? \U0001F603\n\n...\n\nModel-agnostic: Supports virtually every model
                and provider: OpenAI, Anthropic, Gemini, DeepSeek, Grok, Cohere, Mistral, and Perplexity; Azure AI Foundry,
                Amazon Bedrock, Google Vertex AI, Ollama, LiteLLM, Groq, OpenRouter, Together AI, Fireworks AI, Cerebras,
                Hugging Face, GitHub, Heroku, Vercel, Nebius, OVHcloud, Alibaba Cloud, SambaNova, and Outlines. If your favorite
                model or provider is not listed, you can easily implement a custom model.\n\n...\n\nSeamless Observability:
                Tightly integrates with Pydantic Logfire, our general-purpose OpenTelemetry observability platform, for real-time
                debugging, evals-based performance monitoring, and behavior, tracing, and cost tracking. If you already have
                an observability platform that supports OTel, you can use that too.\n\n...\n\nFully Type-safe: Designed to
                give your IDE or AI coding agent as much context as possible for auto-completion and type checking, moving
                entire classes of errors from runtime to write-time for a bit of that Rust \"if it compiles, it works\" feel.\n\n...\n\nPowerful
                Evals: Enables you to systematically test and evaluate the performance and accuracy of the agentic systems
                you build, and monitor the performance over time in Pydantic Logfire.\n\n...\n\nExtensible by Design: Build
                agents from composable capabilities that bundle tools, hooks, instructions, and model settings into reusable
                units. Use built-in capabilities for web search, thinking, and MCP, pick from the Pydantic AI Harness capability
                library, build your own, or install third-party capability packages. Define agents entirely in YAML/JSON--
                no code required.\n\n...\n\nMCP, A2A, and UI: Integrates the Model Context Protocol, Agent2Agent, and various
                UI event stream standards to give your agent access to external tools and data, let it interoperate with other
                agents, and build interactive applications with streaming event-based communication.\n\n...\n\nHuman-in-the-Loop
                Tool Approval: Easily lets you flag that certain tool calls require approval before they can proceed, possibly
                depending on tool call arguments, conversation history, or user preferences.\n\n...\n\nDurable Execution:
                Enables you to build durable agents that can preserve their progress across transient API failures and application
