},{"type":"url","url":"https://www.rfc-editor.org/subjects/http/","title":"RFCs about HTTP | RFC Editor","snippet":"RFC 7694: Hypertext Transfer Protocol (HTTP) Client-Initiated Content-Encoding Proposed Standard - Obsoleted by RFC 9110 ... HTTP Authentication-Info and Proxy-Authentication-Info Response Header Fields ... - Obsoleted by RFC 9110, RFC 9112 ... - Obsoleted by RFC 9110","site_name":"» RFC Editor","site_icon":"https://cdn.deepseek.com/site-icons/rfc-editor.org"},{"type":"url","url":"https://ftp.nic.ad.jp/mirror/ftp.rfc-editor.org/in-notes/rfc9110.html#1","title":"RFC 9110: HTTP Semantics - RFC 9110 | HTTP Semantics | June 2022","snippet":"2. Conformance ### 2.1. Syntax Notation This specification uses the Augmented Backus-Naur Form (ABNF) notation of [RFC5234], extended with the notation for case-sensitivity in strings defined in [RFC7405].¶ It also uses a list extension, defined in Section 5.6.1, that allows for compact definition of comma-separated lists using a \"#\" operator (similar to how the \"*\" operator indicates repetition). Appendix A shows the collected grammar with all list operators expanded to standard ABNF notation.¶ As a convention, ABNF rule names prefixed with \"obs-\" denote obsolete grammar rules that appear for historical reasons.¶ The following core rules are included by reference, as defined in Appendix B.1 of [RFC5234]: ALPHA (letters), CR (carriage return), CRLF (CR LF), CTL (controls), DIGIT (decimal 0-9), DQUOTE (double quote), HEXDIG (hexadecimal 0-9/A-F/a-f), HTAB (horizontal tab), LF (line feed), OCTET (any 8-bit sequence of data), SP (space), and VCHAR (any visible US-ASCII character).¶ Section 5.6 defines some generic syntactic components for field values.¶ This specification uses the terms \"character\", \"character encoding scheme\", \"charset\", and \"protocol element\" as they are defined in [RFC6365].¶ ### 2.2. Requirements Notation The key words \"MUST\", \"MUST NOT\", \"REQUIRED\", \"SHALL\", \"SHALL NOT\", \"SHOULD\", \"SHOULD NOT\", \"RECOMMENDED\", \"NOT RECOMMENDED\", \"MAY\", and \"OPTIONAL\" in this document are to be interpreted as described in BCP 14 [RFC2119] [RFC8174] when, and only when, they appear in all capitals, as shown here.¶ This specification targets conformance criteria according to the role of a participant in HTTP communication. Hence, requirements are placed on senders, recipients, clients, servers, user agents, intermediaries, origin servers, proxies, gateways, or caches, depending on what behavior is being constrained by the requirement. Additional requirements are placed on implementations, resource owners, and protocol element registrations when they apply beyond the scope of a single communication.¶ The verb \"generate\" is used instead of \"send\" where a requirement applies only to implementations that create the protocol element, rather than an implementation that forwards a received element downstream.¶ An implementation is considered conformant if it complies with all of the requirements associated with the roles it partakes in HTTP.¶ A sender MUST NOT generate protocol elements that do not match the grammar defined by the corresponding ABNF rules. Within a given message, a sender MUST NOT generate protocol elements or syntax alternatives that are only allowed to be generated by participants in other roles (i.e., a role that the sender does not have for that message).¶ Conformance to HTTP includes both conformance to the particular messaging syntax of the protocol version in use and conformance to the semantics of protocol elements sent. For example, a client that claims conformance to HTTP/1.1 but fails to recognize the features required of HTTP/1.1 recipients will fail to interoperate with servers tha...","site_name":"Japan Network Information Center","site_icon":"https://cdn.deepseek.com/site-icons/nic.ad.jp","published_at":"2002-06-05T16:00:00+00:00"},{"type":"url","url":"https://datatracker.ietf.org/doc/rfc9110/history/#1","title":"HTTP Semantics RFC 9110 also known as STD 97","snippet":"Received changes through RFC Editor sync (created alias RFC 9110, changed abstract to 'The Hypertext Transfer Protocol (HTTP) is a stateless application-level protocol for … ... changed abstract to 'The Hypertext Transfer Protocol (HTTP) is a stateless","site_name":"IETF Datatracker","site_icon":"https://cdn.deepseek.com/site-icons/ietf.org"},{"type":"url","url":"https://auth48-transition.rfc-editor.org/authors/rfc9988.pdf#6#8#6","title":"[RFC8126] Cotton, M","snippet":"Fielding, R., Ed., Nottingham, M., Ed., and J. Reschke, Ed., \"HTTP Semantics\", STD 97, RFC 9110, DOI 10.17487/RFC9110, June 2022, <https://www.rfc- editor.org/info/rfc9110>.","site_icon":"https://cdn.deepseek.com/site-icons/rfc-editor.org"}]}},"output_index":0,"sequence_number":6}

