                arguments: "{\"city\": \"Paris\", \"summary\": \"Paris, the capital of France, is one of the most iconic and visited cities in the world. Known as the \\\"City of Light\\\" (La Ville Lumière), Paris is celebrated for its rich history, art, culture, architecture, and romance. Here are some key highlights:\\n\\n1. **Landmarks and Monuments**: \\n   - **Eiffel Tower**: The symbol of Paris, built in 1889, offers breathtaking views of the city.\\n   - **Louvre Museum**: The world's largest art museum, home to the Mona Lisa, Venus de Milo, and thousands of other masterpieces.\\n   - **Notre-Dame Cathedral**: A masterpiece of Gothic architecture, currently under restoration after the 2019 fire.\\n   - **Arc de Triomphe**: A historic monument honoring those who fought for France, with a panoramic view from the top.\\n   - **Sacré-Cœur Basilica**: Located in Montmartre, it offers stunning views and a serene atmosphere.\\n\\n2. **Culture and Arts**: \\n   - Paris has been a center of art and culture for centuries, inspiring artists like Monet, Picasso, and Van Gogh.\\n   - The city is home to over 1,000 art galleries and numerous theaters, including the famous Opéra Garnier.\\n   - The **Moulin Rouge** and **Cabaret** shows are iconic symbols of Parisian entertainment.\\n\\n3. **Neighborhoods**: \\n   - **Montmartre**: A historic and artistic district known for its bohemian vibe.\\n   - **Le Marais**: A trendy area with medieval streets, boutique shops, and vibrant nightlife.\\n   - **Champs-Élysées**: A famous avenue lined with shops, cafés, and theaters.\\n   - **Latin Quarter**: A lively student area with historic universities and bustling cafés.\\n\\n4. **Cuisine**: \\n   - Paris is a paradise for food lovers, offering everything from Michelin-starred restaurants to charming bistros.\\n   - Must-try dishes include croissants, baguettes, escargot, coq au vin, and crème brûlée.\\n   - The city is also famous for its patisseries, cheese shops, and wine bars.\\n\\n5. **Parks and Gardens**: \\n   - **Luxembourg Gardens**: A beautiful park with fountains, statues, and lush greenery.\\n   - **Tuileries Garden**: Located between the Louvre and Place de la Concorde, perfect for a leisurely stroll.\\n   - **Bois de Boulogne**: A large public park with lakes, gardens, and walking paths.\\n\\n6. **History**: \\n   - Paris has a rich history dating back over 2,000 years, from its founding by the Parisii tribe to its role in the French Revolution and World War II.\\n   - The city has been a center of political, intellectual, and artistic movements throughout the centuries.\\n\\n7. **Fashion**: \\n   - Paris is one of the world's fashion capitals, hosting prestigious events like Paris Fashion Week.\\n   - The city is home to legendary fashion houses like Chanel, Dior, and Louis Vuitton.\\n\\n8. **Transportation**: \\n   - Paris has an extensive public transportation system, including the Métro, buses, and RER trains.\\n   - The city is also bike-friendly, with numerous bike lanes and rental options.\\n\\nParis is a city that captivates visitors with its charm, elegance, and endless opportunities for exploration.\"}"
