              content: |-
                # Agents

                ...

                ## Introduction

                ...

                Agents are Pydantic AI's primary interface for interacting with LLMs.

                In some use cases a single Agent will control an entire application or component, but multiple agents can also interact to embody more complex workflows.

                ...

                The `Agent` class has full API documentation, but conceptually you can think of an agent as a container for:

                ...

                Instructions

                ...

                A set of instructions for the LLM written by the developer.

                ...

                Function tool(s) and toolsets

                ...

                Functions that the LLM may call to get information while generating a response.

                ...

                Structured output type

                ...

                The structured datatype the LLM must return at the end of a run, if specified.

                ...

                Dependency type constraint

                ...

                Dynamic instructions functions, tools, and output functions may all use dependencies when they're run.

                ...

                LLM model

                ...

                Optional default LLM model associated with the agent. Can also be specified when running the agent.

                ...

                Model Settings

                Optional default model settings to help fine tune requests. Can also be specified when running the agent.

                ...

                Capabilities

                Reusable bundles of tools, hooks, instructions, and model settings that extend agent behavior.

                While each of these can be configured individually, capabilities let you bundle related behavior into reusable units that are easier to compose, share, and load from configuration files.

                ...

                In typing terms, agents are generic in their dependency and output types, e.g., an agent which required dependencies of type `Foobar` and produced outputs of type `list[str]` would have type `Agent[Foobar, list[str]]`. In practice, you shouldn't need to care about this, it should just mean your IDE can tell you when you have the right type, and if you choose to use static type checking it should work well with Pydantic AI.

                ...

                Agents are designed for reuse, like FastAPI Apps

                ...

                You can instantiate one agent and use it globally throughout your application, as you would a small FastAPI app or an APIRouter, or dynamically create as many agents as you want. Both are valid and supported ways to use agents.

                ...

                ## Running Agents

                ...

                There are five ways to run an agent:

                ...

                1. `agent.run()` -- an async function which returns a `RunResult` containing a completed response.
                2. `agent.run_sync()` -- a plain, synchronous function which returns a `RunResult` containing a completed response (internally, this just calls `loop.run_until_complete(self.run())`).
                3. `agent.run_stream()` -- an async context manager which returns a `StreamedRunResult`, which contains methods to stream text and structured output as an async iterable. `agent.run_stream_sync()` is a synchronous variation that returns a `StreamedRunResultSync` with synchronous versions of the same methods.
                4. `agent.run_stream_events()` -- an async context manager which yields an async iterator over `AgentStreamEvent`s ending with an `AgentRunResultEvent` containing the final run result.
                5. `agent.iter()` -- a context manager which returns an `AgentRun`, an async iterable over the nodes of the agent's underlying `Graph`.

                ...

                As shown in the example above, `run_stream()` makes it easy to stream the agent's final output as it comes in. It also takes an optional `event_stream_handler` argument that you can use to gain insight into what is happening during the run before the final output is produced. During a realtime session, the same handler stream can also contain realtime-only `RealtimeEvent` members.

                ...

                Under the hood, each `Agent` in Pydantic AI uses **pydantic-graph** to manage its execution flow. **pydantic-graph** is a generic, type-centric library for building and running finite state machines in Python. It doesn't actually depend on Pydantic AI -- you can use it standalone for workflows that have nothing to do with GenAI -- but Pydantic AI makes use of it to orchestrate the handling of model requests and model responses in an agent's run.

                ...

                In many scenarios, you don't need to worry about pydantic-graph at all; calling `agent.run(...)` simply traverses the underlying graph from start to finish. However, if you need deeper insight or control -- for example to inject your own logic at specific stages -- Pydantic AI exposes the lower-level iteration process via `Agent.iter`. This method returns an `AgentRun`, which you can async-iterate over, or manually drive node-by-node via the `next` method. Once the agent's graph returns an `End`, you have the final result along with a detailed history of all steps.

                ...

                ## Type safe by design

                ...

                ## Agent Specs

                ...

                Agents can also be defined declaratively in YAML or JSON using agent specs. This separates agent configuration from application code:
