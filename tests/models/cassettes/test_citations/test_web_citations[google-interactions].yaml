        - content:
          - text: |-
              The official documentation for **Pydantic AI** is hosted at:

              * **Official Documentation Portal**: [Pydantic AI Documentation](https://ai.pydantic.dev/) (also available through [Pydantic Docs](https://pydantic.dev/docs/ai/))
              * **Source Code & Repository**: [GitHub - pydantic/pydantic-ai](https://github.com/pydantic/pydantic-ai)

              ---

              ### Key Documentation Sections

              * **Overview & Quickstart**: [ai.pydantic.dev](https://ai.pydantic.dev/) -- Introduction to building type-safe, production-ready AI agents using Python.
              * **Agents**: [Agents Documentation](https://ai.pydantic.dev/agent/) -- How to configure agent loops, manage system prompts, inject runtime dependencies, and enforce structured outputs.
              * **Models & Providers**: [Models and Providers Guide](https://ai.pydantic.dev/models/) -- Instructions on swapping and configuring model backends (OpenAI, Anthropic, Gemini, Groq, local models, etc.).
              * **Tools & Toolsets**: [Tools & Common Tools](https://ai.pydantic.dev/tools/) -- Defining custom Python functions as tools, using the Model Context Protocol (MCP), and standard utilities.
              * **Observability**: Built-in tracing, cost-tracking, and evaluation integration with [Pydantic Logfire](https://pydantic.dev/logfire).
