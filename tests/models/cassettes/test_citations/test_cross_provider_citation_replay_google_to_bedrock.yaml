              The documentation for Pydantic AI can be found on the official Pydantic Docs website. Pydantic AI is described as the Python AI SDK, offering a typed and extensible agent loop. It is designed for building production-grade agents and provides capabilities such as real-time voice, image generation, and embeddings.

              The documentation details various aspects of Pydantic AI, including:
              *   **Agents:** Pydantic AI's primary interface for interacting with Large Language Models (LLMs).
              *   **Instrumentation:** Pydantic AI is OpenTelemetry-native, allowing for the emission of standard OTel spans for model and tool calls.
              *   **Pydantic AI Harness:** A framework that provides agents with capabilities like memory, sub-agents, and context management for complex, long-running tasks.

              The documentation is available in formats like `llms.txt`, which is suited for LLMs and AI coding assistants. Additionally, a specific tool called `read_pyai_docs(topic)` allows agents to locate and return Pydantic AI documentation pages on demand.
