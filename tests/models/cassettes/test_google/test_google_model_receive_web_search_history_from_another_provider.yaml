              Here are the latest Dutch headlines I found. The most recent items are from around 25 October 2026, mainly from NL Times and DutchNews.nl.

              **Weather and travel**
              - Storm Boelo's high winds forced dozens of flight cancellations at Schiphol on 25 October.
              - The clocks go back an hour this Sunday.

              **Politics and government (Jetten I Cabinet: D66, VVD and CDA)**
              - The cabinet says it can't afford to cap student-loan interest at the promised 2.5%. The national student union LSVB criticised this.
              - NRC reports that civil servants at three ministries face the biggest risk of job losses. The cabinet plans to cut €3.4 billion from central government, and the details are due by the end of the month.
              - A record 7 in 10 Dutch people are dissatisfied with the cabinet, according to an early-September poll.
              - The government again blocked the sale of Solvinity, the company behind DigiD, to a US buyer. A court had earlier ruled the cabinet was allowed to ban the takeover.
              - The cabinet is postponing the large Zuidasdok project in Amsterdam, and an Amsterdam alderman has warned of rising costs. DutchNews.nl also reports that several major infrastructure projects have been shelved to free up €18 billion for repairs.
              - Lawmakers are pressing the cabinet to rescue the nearly bankrupt seal centre in Lauwersoog.

              **Society**
              - A survey found 87% of Dutch livestock farmers have lost faith in their future because of nitrogen rules.
              - Police arrested a 27-year-old man over the explosion at a barbershop in Vlaardingen. The area has seen shootings and explosions linked to a feud between barbershops.
              - A major fire broke out at a car scrapyard in Zoetermeer. The same site burned last February.
              - Eleven people fell ill after tasting water on a tour of the Grolsch brewery in Enschede.

              **Sport**
              - In the Eredivisie, Twente beat AZ with late goals.

              **Other**
              - Egyptian protests shut the Dutch embassy over the arrest of a Sisi loyalist, according to DutchNews.nl.

              These come from search snippets, so some details are thin. For full stories, see nltimes.nl, dutchnews.nl or nos.nl. I can look further into any of these topics if you want.
