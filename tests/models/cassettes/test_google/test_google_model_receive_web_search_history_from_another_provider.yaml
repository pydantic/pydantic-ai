        - parts:
          - text: What are the latest news in the Netherlands?
          role: user
        - parts:
          - text: |-
              Here's a roundup of the latest news from the Netherlands across various topics:

              ---

              ### 🏛️ Politics
              -
          - text: >-
              The centrist D66 party, led by Rob Jetten, has been confirmed as the winner of
              the Dutch general election. With nearly all votes counted, Geert Wilders'
              far-right PVV party could not overtake D66.
          - text: " "
          - text: Rob Jetten, 38, could become the country's youngest ever prime minister.
          - text: |-


              ---

              ### 🚆 Security & Public Order
              -
          - text: >-
              Four train stations were evacuated over suspicious packages, with four arrests
              made so far.
          - text: |-

              -
          - text: >-
              A far-right anti-immigration rally in The Hague led to clashes between police
              and protesters.
          - text: |-


              ---

              ### 🎶 Eurovision
              -
          - text: >-
              The Netherlands has announced its withdrawal from the Eurovision 2026 contest,
              joining Spain, Slovenia, and Ireland in a boycott over Israel's continued
              participation in the competition.
          - text: |-


              ---

              ### 🚗 Technology
              -
          - text: >-
              Tesla has won Dutch approval to use self-driving features -- a first for
              Europe. The Netherlands' decision now goes to the European Commission for full
              authorization.
          - text: |-


              ---

              ### ⚖️ Crime & Justice
              -
          - text: >-
              In 2025, the Dutch Public Prosecution Service recorded 46 antisemitic criminal
              discrimination cases, representing 26% of all registered discrimination offenses.
          - text: |-

              -
          - text: >-
              Dutch prosecutors are seeking up to 25 years for a father and sons in an
              alleged "honor killing" of an 18-year-old over her refusal to conform to her family's
              strict cultural expectations.
          - text: |-


              ---

              ### 🌍 Tourism & Economy
              -
          - text: >-
              The Netherlands' accommodation sector posted steady growth in 2025, with total
              guest numbers rising to 52.2 million across hotels, campsites, and holiday parks.
          - text: " "
          - text: International visitors reached 22.3 million, up 5% year-on-year.
          - text: |-

              -
          - text: >-
              According to the 2025 central government financial annual report, 2025 was a
              year of economic stability for the Netherlands, despite increasing geopolitical
              uncertainty.
          - text: |-


              ---

              ### 🏛️ Culture & History
