ies from the 2025 edition in Rotterdam\n\nAug 20, 2025\n\n\n\nPolice officers in Amsterdam deploy amid anti-Israel protests during the Ajax-Macabbi Tel Aviv soccer game\n---\nResult 2: Netherlands news - Today’s latest updates - CBS News\nWhat's on the NATO summit agenda? As tensions appear to ease in the Middle East, President Trump is meeting with NATO allies. CBS News senior White House and political correspondent Ed O'Keefe reports from The Hague, Netherlands.\n\n## Netherlands\n#### Tesla wins Dutch approval to use self-driving features, a first for Europe\nThe Netherlands' decision now goes to the European Commission for full authorization.\n\n#### Dutch angry at U.S. for yanking panels honoring Black World War II troops\nThe removal by a U.S. military cemetery in the Netherlands of two displays recognizing Black troops who fought in World War II has spurred anger there.\n\n- Dec 30, 2025\n\n#### Netherlands set to return 3,500-year-old stolen sculpture to Egypt\nA day after attending the opening ceremony of the Grand Egyptian Museum, the leader of the Netherlands said an ancient statue discovered at an art fair would be returned.\n\n- Nov 3, 2025\n\n#### Dutch far-right loses ground to centrists in close general election\n\n\nWhile no party emerges as a clear winner, Geert Wilders' far right Party for Freedom has lost 11 seats to Dutch centrist party D66.\n\n- Oct 30, 2025\n\n#### Century-old grenades found hidden in delivery of onions\nThe grenades, dating from 1925, were found in a consignment of onions heading from France to a factory in the northern Dutch province of Zeeland.\n\n- Oct 8, 2025\n\n#### Mystery behind famous Rembrandt artwork solved 4 centuries later\nThe Rijksmuseum museum said that it had finally sniffed out a s\n---\nResult 3: Netherlands Articles and latest stories\nQuarter of all Dutch discrimination offenses in 2025 were antisemitic, new report reveals. In 2025, the Dutch Public Prosecution Service recorded 46 antisemitic criminal discrimination cases, representing 26% of all registered discrimination ...\n\n# Netherlands\n### Quarter of all Dutch discrimination offenses in 2025 were antisemitic, new report reveals\nIn 2025, the Dutch Public Prosecution Service recorded 46 antisemitic criminal discrimination cases, representing 26% of all registered discrimination offenses.\n\n### Amin Abu Rashid acquitted by Dutch court of financing Hamas, convicted of sanction evasion\nAmin Abu Rashid was acquitted of financing Hamas but convicted of sanctions evasion and managing a banned organization, drawing criticism from pro-Israel groups and sparking protests in Rotterdam.\n\nProtesters take part in a demonstration organized by the Palestinian community in the Netherlands against hunger and the numerous deaths in Gaza, on Dom Square in Utrecht on August 3, 2025\n\n\n\n{\"name\":\"\",\"mainEntity\":{\"itemListElement\":[{\"name\":\"HRF files complaint against MKs over alleged 'incitement to genocide' ahead of Netherlands trip\"},{\"name\":\"New AI-powered research project aims to uncover the origins of the Dead Sea Scrolls\"},{\"name\":\"Archaeologists find over 3,000 artifacts from Stone Age to WWII in Netherlands valley\"},{\"name\":\"Dutch police foil alleged bomb, arson plot against synagogue - report\"},{\"name\":\"Why one non-Jewish woman moved to Israel amid rising antisemitism\n---\nResult 4: Netherlands sees domestic decline and international tourism boost ...\nThe Netherlands saw fewer overnight stays by Dutch but more international visitors in 2025. The Netherlands’ accommodation sector posted steady growth in 2025, with total guest numbers rising to 52.2 million across hotels, campsites and holiday ...\n\nNetherlands tourism grows in 2025 as international arrivals rise 5%, driving total guests to 52.2 million.\n\n# The Netherlands saw fewer overnight stays by Dutch but more international visitors in 2025\n**The Netherlands’ accommodation sector posted steady growth in 2025, with total guest numbers rising to 52.2 million across hotels, campsites and holiday parks,** according to provisional figures from **Statistics Netherlands.**\n\nThis marks an increase of nearly 2% compared to 2024, driven largely by international demand.\n\n**International visitors reached indeed 22.3 million, up 5% year-on-year**, while **domestic travel softened slightly**. Dutch residents accounted for 29.9 million stays, a marginal decline of 0.4%.\n\n\n\n**Groningen and Friesland also saw strong gains**, particularly in international arrivals.\n\nBy contrast, **Zeeland and Utrecht recorded declines in total guest numbers**, with Zeeland seeing drops in both domestic and international segments.\n\n**Noord-Holland, home to Amsterdam, remained the country’s top destination, attracting 16.3 million guests, up 2%.**\n\nAmong major cities, **Amsterdam recorded the largest increase in overnight stays, rising 2% to 9.5 million guests**. Rotterdam and The Hague also posted modest \n---\nResult 5: Netherlands politics\nNetherlands national elections 2025: The results in pictures. … Netherlands. Dutch far-right MP Wilders resumes campaign after alleged terror plot. Geert Wilders had suspended his election campaign after being identified among the alleged ...\n\n# Netherlands politics\n## New Dutch minority government sworn in under centrist PM Jetten\n### Centrist D66 confirmed as Dutch general election winner\nWith nearly all votes counted, Geert Wilders' far-right PVV party no longer has a chance at overtaking the centrist D66 party led by Rob Jetten.\n\n31/10/2025\n\nD66 leader Rob Jetten after the exit polls came out.\n\n### Dutch election shocker: What you need to know\nDutch election goes to the wire as progressive forces led by newcomer Rob Jetten make gains in blow to rightwing firebrand Geert Wilders.\n\n30/10/2025\n\nRob Jetten, 38, could be the next Dutch prime minister.\n\n### Who is Rob Jetten, the potential next Dutch prime minister?\n\n\nThe 38-year-old's D66 party is neck-a