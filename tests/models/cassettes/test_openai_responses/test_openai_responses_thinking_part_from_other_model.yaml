            # How to Cross the Street Safely

            ## At a crosswalk or intersection
            1. **Stop at the curb**, a step back from the edge.
            2. **Press the pedestrian button** if there is one, and wait for the "Walk" signal.
            3. **Look and listen** in all directions. In countries where traffic drives on the right, look left, right, then left again. In left-driving countries like the UK, Australia, and Japan, look right first. Also check for turning cars.
            4. **Make eye contact with drivers** so you know they see you.
            5. **Walk, don't run**, and keep scanning as you cross.

            ## Reading the signals
            - **Walking person or "Walk":** you may go, but still watch for turning vehicles.
            - **Flashing hand or countdown:** don't start crossing. If you're already in the street, keep going.
            - **Solid red hand or "Don't Walk":** wait.

            ## If there's no crosswalk
            - Choose a spot with a clear view in both directions, not near a curve, a hill, or between parked cars.
            - Wait for a big gap in traffic.
            - Cross straight over rather than diagonally.
            - Check your local jaywalking laws.

            ## Extra tips
            - **Put your phone away** and keep headphone volume low.
            - **On multi-lane roads,** make sure every lane is clear or stopped. A car stopping in one lane can block your view of a car still moving in the next.
            - **At night,** wear light or reflective clothing.
            - **Don't assume** a driver will stop, even if you have the right of way.
            - **With children,** hold their hand and have them practice the look-and-listen routine.

            If you have a specific situation in mind, such as teaching a child, crossing in a foreign country, or accessibility needs, tell me and I can tailor the advice.
