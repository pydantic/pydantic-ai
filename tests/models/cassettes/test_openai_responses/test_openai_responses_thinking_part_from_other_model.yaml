            text: |-
              Great question. Use the same mindset as crossing a street: choose the safest place, pause, scan, communicate, move deliberately, and keep reassessing. Mapped directly:

              - Find a safe place to cross
                - Street: crosswalk or light. River: bridge, ferry, or a marked/known ford. These are far safer than wading or swimming.

              - Stop at the edge
                - Pause on the bank. Identify both your entry and exit points.

              - Look both ways
                - Scan upstream and downstream for hazards: fast current, rapids, dams, strainers (downed trees), boats, deep pools.

              - Wait for the "walk signal"
                - If you must wade, wait for the safest conditions: broad, shallow, slow, and clear water. After rain, snowmelt, or dam releases, water may be too high--wait or reroute.

              - Make eye contact/communicate
                - Let partners know the plan, signal boaters if relevant, and make sure someone knows where you'll cross.

              - Walk, don't run
                - If wading is the only option:
                  - Choose a wide, shallow, straight section with a firm bottom.
                  - Keep footwear on for traction; use a sturdy pole/trekking poles.
                  - Unclip your pack's hip and chest straps so you can shed it if needed.
                  - Face slightly upstream, lean into the current, and shuffle sideways with small steps, keeping 2-3 points of contact.
                  - Avoid wading if water is above your knees or the current can push you off balance.

              - Stay alert
                - Keep scanning the water and bottom; be ready to turn back if it worsens.

              - Keep watching as you cross
                - Maintain your line to the chosen exit; don't commit to deeper, faster water.

              If you slip: release the pack if needed, float on your back with feet pointed downstream, steer to shore, and only stand up once the water is slow and shallow to avoid foot entrapment.

              If it isn't clearly safe, don't cross--use a bridge, wait for levels to drop, or find another route.

              Want guidance for a specific river or situation (hiking ford, using a small boat, with kids or a dog)?
