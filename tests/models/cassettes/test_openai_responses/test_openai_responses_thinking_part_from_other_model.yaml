          content: |-
            Here are some basic steps for crossing the street safely:

            1. **Find a safe place to cross**, such as:
               - A crosswalk
               - An intersection with traffic signals
               - A pedestrian crossing

            2. **Stop at the curb** before stepping into the street

            3. **Look both ways** - look left, then right, then left again (in countries where traffic drives on the right side)

            4. **Wait for traffic to clear** or for the walk signal if there's a traffic light

            5. **Make eye contact with drivers** when possible to ensure they see you

            6. **Walk, don't run** across the street

            7. **Stay alert** - avoid looking at your phone while crossing

            8. **Continue watching for traffic** as you cross

            **Additional tips:**
            - Use marked crosswalks whenever possible
            - Be extra cautious at driveways and parking lot exits
            - Watch for turning vehicles even when you have a walk signal
            - Be visible - wear bright clothing at night
            - Follow local traffic laws and signals

            Would you like more specific advice for a particular situation?
