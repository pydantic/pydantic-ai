            text: |-
              How to cross a river safely (by analogy to crossing a street)

              Preferred options (the "crosswalks" of rivers)
              - Use a bridge, footbridge, or ferry. Obey signs and barriers; wait your turn; hold rails where provided.
              - Ask locals/park staff about designated fords or stepping stones.

              Reading the river's "signals"
              - Speed: Fast, pushy water is a red light. If the current makes it hard to stand or walk, don't wade.
              - Depth: Above knee-deep in moving water becomes dangerous quickly.
              - Bottom: Slippery rocks, deep mud, or big boulders raise the risk.
              - Hazards: Avoid rapids, waterfalls, low-head dams, fallen trees (strainers), and blind bends.
              - Weather and releases: Recent rain, snowmelt, tides, or dam releases can raise levels suddenly.

              If there's no bridge and you're considering wading
              - Choose the best spot: Wider, shallower, braided sections are usually safer than narrow, deep channels. Ensure an easy exit on the far bank.
              - Prepare:
                - Keep footwear on for traction; use a sturdy stick/trekking poles.
                - Loosen backpack hip/chest straps so you can ditch it if you fall.
                - Secure loose items; wear a PFD if you have one.
              - Technique:
                - Face slightly upstream; shuffle sideways with small steps.
                - Keep 3 points of contact (two feet and a pole).
                - Cross at a slight upstream angle toward your exit; don't rush.
                - In a group, link up (partners side by side, arms over each other's packs) and move as one.
              - Abort if it feels unstable at the edge--conditions won't improve midstream.

              Swimming or boating
              - Swimming across is risky; only attempt if trained, with a PFD and a clear downstream landing zone. Don't fight the current; use a ferry angle and keep feet up to avoid foot entrapment.
              - In a boat, wear a PFD, scout the line, avoid low-head dams, and be ready to portage.

              Driving
              - Don't drive through floodwater. As little as 15 cm/6 in can float a small car. Turn around, don't drown.

              Big red flags--do not cross
              - Swift water above your knees, water you can't see into, night/poor visibility, thunderstorm or rising water, upstream dams or obvious hazards, you're alone or with kids/pets, or you lack proper footwear/PFD.

              With children or pets
              - Use only bridges or supervised ferries. Hold hands and keep pets leashed. Avoid wading with kids in moving water.

              Plan ahead
              - Check local advisories, river gauges/tides, and ask rangers or locals about fords and hazards.
              - If in doubt, don't cross; reroute to a known crossing.

              If you share your situation (location, season, gear, whether you're on foot or driving), I can tailor this to your exact crossing.
