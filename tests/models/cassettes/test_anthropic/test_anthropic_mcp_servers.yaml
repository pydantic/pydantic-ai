        data: {"type":"content_block_start","index":1,"content_block":{"type":"mcp_tool_result","tool_use_id":"mcptoolu_01JxbFZBiryiWQLhzt2gwFxc","is_error":false,"content":[{"type":"text","text":"Pydantic is a widely used Python library for data validation and serialization, primarily leveraging Python type hints to define data schemas  . Its core purpose is to transform unvalidated input data into validated Python objects, and it also provides serialization capabilities and JSON Schema generation .\n\n## Main Features\nPydantic offers several key features:\n*   **Type-hint driven validation**: Validation rules are expressed using standard Python type annotations, which integrates well with IDEs and static analysis tools .\n*   **High performance**: The core validation logic is implemented in Rust via the `pydantic-core` package, making it one of the fastest data validation libraries for Python .\n*   **Two validation modes**: It supports both strict mode (no type coercion) and lax mode (with type coercion) .\n*   **JSON Schema generation**: Pydantic models can automatically generate JSON Schema, facilitating integration with other tools .\n*   **Support for various types**: It supports validation for standard library types like `dataclass` and `TypedDict` .\n*   **Customization**: Pydantic allows for custom validators and serializers to modify data processing .\n\n## Structure\nPydantic's architecture is divided into two main parts:\n1.  **`pydantic` (Python frontend)**: This part handles high-level logic, schema generation (translating Python types into a format understood by Rust), configuration, and public APIs .\n2.  **`pydantic-core` (Rust backend)**: This package contains the high-performance validation and serialization engine. It processes a `CoreSchema` (a Python dictionary representation of the schema) to build a `SchemaValidator`  .\n\nThe interaction between these two parts involves a schema generation and validation pipeline :\n*   **Schema Generation (Python)**: Python type annotations and field definitions are used by the `GenerateSchema` class to create a `CoreSchema` (a dictionary representation)  .\n*   **Compilation (Rust)**: The `CoreSchema` is then passed to `pydantic-core`, which compiles it into a `SchemaValidator` and `SchemaSerializer` .\n*   **Execution**: The `SchemaValidator` is used to validate input data, producing a validated object, which can then be serialized by the `SchemaSerializer` .\n\nPydantic models, typically defined by inheriting from `BaseModel` , serve as the primary entry point for defining structured data models .\n\n## Notes\nThe provided context also mentions other entry points like `TypeAdapter`, `@dataclass`, `@validate_call`, and `RootModel` for various validation scenarios . Additionally, Pydantic V2 is a significant rewrite with performance improvements and new features compared to V1 .\n\nWiki pages you might want to explore:\n- [Overview (pydantic/pydantic)](/wiki/pydantic/pydantic#1)\n\nView this search on DeepWiki: https://deepwiki.com/search/what-is-pydantic-what-are-its_9591dd73-8740-4aaa-972e-ba4a0aa0a486\n"}]}           }

