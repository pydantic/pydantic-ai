        event: content_block_start
        data: {"type":"content_block_start","index":2,"content_block":{"type":"mcp_tool_result","tool_use_id":"mcptoolu_01EgV5ALUAtQk3tVCBMbwgyj","is_error":false,"content":[{"type":"text","text":"Available pages for pydantic/pydantic-ai:\n\n- 1 Overview\n  - 1.1 Package Structure and Organization\n  - 1.2 Installation and Dependencies\n  - 1.3 Project Philosophy and Contribution Guidelines\n- 2 Core Agent System\n  - 2.1 Agent Classes and Architecture\n  - 2.2 Execution Flow and State Management\n  - 2.3 Message System and Types\n  - 2.4 Message History and Context\n  - 2.5 Dependencies and RunContext\n  - 2.6 Output Modes and Validation\n  - 2.7 Streaming Responses\n  - 2.8 Capabilities System\n  - 2.9 Usage Tracking and Limits\n- 3 Tools and Function Calling\n  - 3.1 Tool Registration and Types\n  - 3.2 Tool Execution and Lifecycle\n  - 3.3 Deferred Execution and Approval\n  - 3.4 Built-in Tools\n  - 3.5 Third-Party Tool Integrations\n- 4 Model Provider Integration\n  - 4.1 Model Architecture and Abstraction\n  - 4.2 OpenAI Integration\n  - 4.3 Anthropic Integration\n  - 4.4 Google and Gemini Integration\n  - 4.5 AWS Bedrock Integration\n  - 4.6 Additional Model Providers\n  - 4.7 Local Inference with Outlines\n  - 4.8 Model Utilities, Wrappers, and Gateway\n  - 4.9 Multimodal Input\n  - 4.10 Embeddings\n- 5 Observability and Instrumentation\n  - 5.1 Instrumentation Architecture\n  - 5.2 Message and Event Tracking\n- 6 Model Context Protocol (MCP)\n  - 6.1 MCP Server Types and Connection\n  - 6.2 MCP Tools and Resources\n  - 6.3 MCP Configuration\n- 7 Durable Execution and Workflow Integration\n  - 7.1 Temporal Integration\n  - 7.2 DBOS Integration\n  - 7.3 Prefect, Restate, Airflow, and Kitaru Integration\n  - 7.4 Durable Capabilities and Operations\n  - 7.5 Agent-to-Agent Communication (A2A)\n- 8 User Interfaces\n  - 8.1 Command Line Interface (clai)\n  - 8.2 Web Chat Interface\n  - 8.3 AG-UI and Vercel AI SDK Integration\n- 9 Evaluation Framework\n  - 9.1 Datasets and Test Cases\n  - 9.2 Evaluators\n  - 9.3 Reports and Analysis\n- 10 pydantic-graph Library\n  - 10.1 Graph Nodes and Execution\n  - 10.2 Graph Persistence and Mermaid Visualization\n  - 10.3 Beta Graph API\n- 11 Advanced Features\n  - 11.1 Direct Model Requests\n  - 11.2 Multi-Agent Applications\n  - 11.3 Format Utilities and Exceptions\n  - 11.4 Extensibility and Publishing Capability Packages\n  - 11.5 Realtime Voice and Audio Sessions\n    - 11.5.1 Realtime Session Lifecycle and Audio\n    - 11.5.2 Realtime Provider Backends\n    - 11.5.3 Realtime Testing: Simulation and WS Cassettes\n  - 11.6 Example Applications\n  - 11.7 Framework Comparisons and Migration\n- 12 Development and Testing\n  - 12.1 Development Workflow\n  - 12.2 CI/CD Pipeline\n  - 12.3 Testing Infrastructure\n  - 12.4 AI-Assisted Development\n- 13 pydantic-ai-harness Capability Library\n  - 13.1 Workspaces, Filesystem, Shell, and Coder\n  - 13.2 Context Management and Compaction\n  - 13.3 Code Mode\n  - 13.4 Delegation, Planning, and Knowledge\n  - 13.5 Safety, Spend Limits, and Guardrails\n  - 13.6 Step Persistence and Durability Backends\n  - 13.7 Research, Browsing, and SaaS Integrations\n  - 13.8 ACP and gh-aw Integrations\n  - 13.9 Authoring and Testing Capabilities\n- 14 clai2 Terminal Coding Agent\n  - 14.1 Plugin System and Commands\n  - 14.2 Terminal UI and Rendering\n  - 14.3 Sessions, Tasks, and Worktrees\n  - 14.4 Configuration, Auth, and Model Selection\n  - 14.5 clai2 Web UI\n  - 14.6 Telemetry, Self-Update, and Distribution\n- 15 Glossary"}]}   }

