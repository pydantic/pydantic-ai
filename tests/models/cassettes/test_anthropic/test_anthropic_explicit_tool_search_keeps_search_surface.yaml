    body:
      type: json
      content:
        max_tokens: 128000
        messages:
        - role: user
          content:
          - text: >-
              Use tool search to find search_only_tool, call it with query "recorded", then
              return only its result.
            type: text
        model: claude-sonnet-4-6
        stream: true
        system:
        - type: text
          text: |-
            The following capabilities are deferred and can be loaded using the `load_capability` tool. A capability's tools stay hidden until it is loaded -- load the capability first rather than searching for its tools:
            - refunds: Refund policy tools.
        tool_choice:
          type: auto
        tools:
        - name: load_capability
          description: >-
            Load a listed capability whenever it is plausibly relevant to the task. Loading
            makes the capability instructions and any tools it provides available.
          input_schema:
            description: Typed arguments for a `load_capability` tool call.
            properties:
              id:
                description: The id of the capability to load.
                type: string
            required:
            - id
            type: object
        - name: search_only_tool
          description: ""
          input_schema:
            additionalProperties: false
            properties:
              query:
                type: string
            required:
            - query
            type: object
          defer_loading: true
        - name: search_tools
          description: >-
            Search first for a standalone deferred tool when current tools and catalog
            descriptions do not name the requested operation. A capability id used as an ordinary
            domain word does not request that capability. This cannot find capability-owned
            tools; load a listed capability by id instead. If no tools are found, do not
            retry.
          input_schema:
            additionalProperties: false
            properties:
              queries:
                description: >-
                  List of search queries to match against tool names and descriptions. Use
                  specific words likely to appear in tool names or descriptions to narrow down relevant
                  tools. Each query is independently tokenized; matches across queries are unioned.
                items:
                  type: string
                type: array
            required:
            - queries
            type: object
