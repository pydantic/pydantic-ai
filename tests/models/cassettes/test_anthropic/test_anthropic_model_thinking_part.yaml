          - thinking: |+
              This is a simple, practical safety question, so I should give clear step-by-step guidance: find a crosswalk, stop at the curb, look both directions, use pedestrian signals, and make eye contact with drivers before crossing.

            signature: >-
              
            type: thinking
          - text: |-
              # How to Cross the Street Safely

              **1. Choose a good spot**
              - Use a crosswalk or intersection with a signal if possible.
              - If there isn't one, pick a spot with a clear view of traffic in both directions, away from curves, hills, or parked vehicles that block sight lines.

              **2. Stop at the curb or edge**
              - Stand a step back from the curb, not in the road.

              **3. Check the signal (if there is one)**
              - **Walk signal (walking person):** You may cross, but still look for turning cars.
              - **Flashing hand or countdown:** Don't start crossing. If you're already in the street, keep going.
              - **Solid hand:** Wait.

              **4. Look and listen**
              - Look **left, right, then left again**. In left-driving countries like the UK, Australia, and Japan, start by looking right.
              - Also check for cars turning into your path.
              - Take out your earbuds or lower the volume, and put your phone away.

              **5. Make eye contact**
              - Make sure drivers see you and are stopping before you step out.

              **6. Cross promptly**
              - Walk, don't run, and keep scanning for traffic as you go.
              - On multi-lane roads, watch for a car in one lane stopping while another car passes in the next lane.

              **7. Be extra careful at night or in bad weather**
              - Wear light or reflective clothing, and give drivers more room to stop.

              ---

              If you're asking for a specific situation (teaching a child, crossing without signals, accessibility needs, or traffic rules in a particular country), let me know and I can tailor the advice.
            type: text
        - role: user
          content:
          - text: Considering the way to cross the street, analogously, how do I cross the river?
            type: text
