            signature: >-
              
            type: thinking
          - text: |-
              Here's how to cross the street safely:

              ## Basic Steps

              1. **Find a safe crossing spot**
                 - Use crosswalks, intersections, or pedestrian signals when available
                 - Avoid crossing between parked cars or on curves

              2. **Stop at the curb/edge**
                 - Don't step into the street yet

              3. **Look left, right, then left again**
                 - Keep looking while you cross

              4. **Wait for traffic to clear**
                 - Make eye contact with drivers if possible
                 - Obey traffic signals if present

              5. **Walk, don't run**
                 - Cross steadily and predictably
                 - Stay alert for turning vehicles

              ## Additional Tips

              - **Put away distractions** - no phones or headphones while crossing
              - **At night, wear visible/reflective clothing**
              - **Watch for vehicles backing up or turning**
              - **Teach children** to always cross with an adult or follow these rules

              Is there a specific crossing situation you're dealing with (like a busy intersection, rural road, or something else)?
            type: text
