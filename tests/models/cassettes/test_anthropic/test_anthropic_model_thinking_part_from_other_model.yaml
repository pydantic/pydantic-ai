            type: text
        - role: user
          content:
          - text: |-
              <assistant_thinking>
              **Answering a broad question**

              I'm thinking about how to respond to the user's very broad question. It's important to provide a general procedure while also inviting them to share a specific scenario, like whether they're in a busy city or an area without signals. I want to keep my language simple and clear, avoiding any moralizing. Also, I should mention that kids should hold an adult's hand when crossing the street, although that might not be necessary to emphasize.
              </assistant_thinking>
            type: text
          - text: |-
              <assistant_thinking>
              **Creating a crossing safety guide**

              I need to create a clear and concise bullet list about safely crossing the street. First, I should emphasize finding a safe crossing point, like a crosswalk or intersection, while avoiding blind curves. At signalized intersections, it's essential to push the button and wait for the WALK signal, but always check for vehicles first. For unsignalized crossings, I'll suggest standing at the edge and looking around. While crossing, it's crucial to keep looking and walking in a straight line, staying aware of turning vehicles.
              </assistant_thinking>
            type: text
          - text: |-
              <assistant_thinking>
              **Listing crossing precautions**

              I want to ensure I cover essential precautions for crossing streets safely. It's good to check the crosswalk for obstacles and avoid distractions like phones or headphones. At night, wearing bright clothing and using a light is crucial, along with being cautious in poorly lit areas. In countries with left-side driving, I need to reverse my look direction. For multi-lane roads and roundabouts, I'll suggest using crosswalks and waiting for a safe gap. Snow or ice requires careful steps, and if mobility is an issue, using audible signals or asking for assistance can be helpful. Plus, when with kids or pets, keeping them close is necessary.
              </assistant_thinking>
            type: text
          - text: |-
              <assistant_thinking>
              **Providing safe crossing instructions**

              I need to add disclaimers about obeying local laws and signals, emphasizing that safety comes first. Since the user asked how to cross the street, I'll keep my instructions simple and child-friendly. I want to provide step-by-step lines while asking if they're at a crosswalk with signals or not, catering to both situations. I should also remind them that just because one car has stopped doesn't mean others will too, and to watch for quiet EVs, bicycles, and runners. A bullet list format will work best for clarity.
              </assistant_thinking>
            type: text
          - text: |-
              <assistant_thinking>
              **Providing street crossing guidance**

              Here's a simple, safe way to cross a street:

              - Pick the safest spot: use crosswalks, avoid mid-block.
              - If there's a signal:
                - Press the button and wait for the WALK signal.
                - Check for traffic both ways, even on WALK.
                - If flashing DON'T WALK starts and you haven't entered, wait to cross.
              - If no signal:
                - Stand back from the curb and look left-right-left.
                - Check behind you for bikes or turning vehicles.
                - Wait for a clear gap before crossing.
              - While crossing:
                - Keep scanning for turning vehicles and stay in the crosswalk.
                - Be cautious of driveways, bikes, and buses.
              - Extra tips:
                - Put away phones and headphones; at night, wear bright clothing.
                - With kids or pets, hold on closely.

              If you're at a crosswalk with a signal, these steps apply. If you're in a different situation, tell me, and I can tailor the guidance more specifically!
              </assistant_thinking>
            type: text
        - role: assistant
          content:
          - text: |-
              Here's a simple, safe way to cross a street:

              - Choose the safest place: a marked crosswalk or intersection. Avoid crossing from between parked cars, on curves, or over hills where drivers can't see you.

              - If there's a pedestrian signal:
                - Press the button (if there is one) and wait for the WALK symbol.
                - Before stepping out, look for cars turning across the crosswalk in both directions.
                - If the signal starts flashing Don't Walk after you've already started, keep going to the other side; if you haven't started yet, wait.

              - If there's no signal:
                - Stand at the edge of the curb (not in the road). Look left-right-left; in countries with left‐side driving, look right-left-right first.
                - Listen for approaching vehicles and bikes. Make sure all lanes you'll cross are clear or traffic has fully stopped.
                - Make eye contact with drivers when possible, but don't assume they'll yield unless they're fully stopped.

              - While crossing:
                - Keep scanning for traffic, including turning cars, bikes, buses, and vehicles from driveways.
                - Walk, don't run; stay straight within the crosswalk. Be ready to stop at a median or refuge island if needed.
                - Put phones away and remove earbuds so you can hear.

              - Extra tips:
                - At night or in rain/fog, choose well‐lit crossings and wear something bright/reflective.
                - With kids or pets, keep them close and step out only when you're sure it's safe.
                - If in doubt, wait for the next gap. Follow local signs and laws.

              If you tell me whether you're at a signalized crosswalk, an unsignalized one, or no crosswalk at all, I can tailor the steps to your situation.
            type: text
