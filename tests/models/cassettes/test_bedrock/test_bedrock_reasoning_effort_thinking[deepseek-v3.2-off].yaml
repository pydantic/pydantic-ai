                23 \times 10 = 230
                \]
                \[
                23 \times 7 = 161
                \]
                Add them:
                \[
                230 + 161 = 391
                \]

                **Method 3: Check using the difference of squares (trick)**
                \[
                17 \times 23 = (20 - 3)(20 + 3) = 20^2 - 3^2
                \]
                \[
                400 - 9 = 391
                \]

                All methods give the same result.

