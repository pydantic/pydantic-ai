                Let's multiply \(17 \times 23\) step by step.

                First, write it as:
                \[
                17 \times 23
                \]

                **Method 1: Direct multiplication**
                \[
                17 \times 20 = 340
                \]
                \[
                17 \times 3 = 51
                \]
                Add them:
                \[
                340 + 51 = 391
                \]

                **Method 2: Another grouping**
