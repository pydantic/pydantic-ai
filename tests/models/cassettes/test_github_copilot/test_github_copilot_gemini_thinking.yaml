            My mind immediately went to the square root of 3600, which is a familiar value: 60. So, I could express 3599 as $60^2 - 1$. This form, $a^2 - b^2$, is a classic difference of squares, which factors as $(a-b)(a+b)$. Applying this, I saw that $60^2 - 1$ could be factored into $(60-1)(60+1)$.

