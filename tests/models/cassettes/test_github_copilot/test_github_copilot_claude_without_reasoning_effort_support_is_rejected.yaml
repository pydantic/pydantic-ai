    parsed_body:
      messages:
      - content: Be concise.
        role: system
      - content: Is 221 prime?
        role: user
      model: claude-haiku-4.5
      reasoning_effort: medium
      stream: false
    uri: https://api.githubcopilot.com/chat/completions
