      string: |
        {"error":{"message":"reasoning_effort \"medium\" was provided, but model claude-haiku-4.5 does not support reasoning effort","code":"invalid_reasoning_effort"}}
    headers:
      content-length:
      - '161'
      content-security-policy:
      - default-src 'none'; sandbox
      content-type:
      - text/plain; charset=utf-8
      strict-transport-security:
      - max-age=31536000
    status:
      code: 400
      message: Bad Request
