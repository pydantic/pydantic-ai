interactions:
- request:
    headers:
      accept:
      - application/json
      accept-encoding:
      - gzip, deflate, br, zstd
      connection:
      - keep-alive
      content-length:
      - '182'
      content-type:
      - application/json
      copilot-integration-id:
      - vscode-chat
      editor-plugin-version:
      - copilot-chat/0.26.7
      editor-version:
      - vscode/1.95.0
      host:
      - api.githubcopilot.com
      openai-intent:
      - conversation-panel
