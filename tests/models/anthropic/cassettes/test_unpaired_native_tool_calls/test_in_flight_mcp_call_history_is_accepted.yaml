        data: {"type":"message_start","message":{"model":"claude-sonnet-4-5-20250929","id":"msg_011CfY5zbf8HkCQjuLzCRa6W","type":"message","role":"assistant","content":[],"container":null,"stop_reason":null,"stop_sequence":null,"stop_details":null,"usage":{"input_tokens":2151,"cache_creation_input_tokens":0,"cache_read_input_tokens":0,"cache_creation":{"ephemeral_5m_input_tokens":0,"ephemeral_1h_input_tokens":0},"output_tokens":1,"service_tier":"standard","inference_geo":"not_available"},"diagnostics":null}     }

        event: content_block_start
        data: {"type":"content_block_start","index":0,"content_block":{"type":"mcp_tool_result","tool_use_id":"mcptoolu_01SAss3KEwASziHZoMR6HcZU","is_error":false,"content":[{"type":"text","text":"Pydantic AI is a Python framework for building production-grade Generative AI applications, emphasizing type safety, structured outputs, and model-agnostic design   . It provides a unified interface for interacting with various Large Language Models (LLMs) from different providers and managing complex agent workflows  . The framework is built by the team behind Pydantic Validation and aims to bring a similar ergonomic design to GenAI development .\n\n## Core Purpose and Features\nPydantic AI's primary purpose is to simplify the development of robust and reliable Generative AI applications  . It achieves this by offering a structured, type-safe, and extensible framework that abstracts away the complexities of interacting with different LLM providers  .\n\nKey features include:\n*   **Type-Safe Agents**: Agents are defined with generic types for compile-time validation, leveraging Pydantic for output validation and dependency injection  .\n*   **Model-Agnostic Design**: It supports over 20 LLM providers through a unified `Model` interface, allowing for easy switching between different models and providers   .\n*   **Structured Outputs**: It provides automatic Pydantic validation and reflection/self-correction to ensure structured and reliable outputs from LLMs   .\n*   **Comprehensive Observability**: Integration with OpenTelemetry and Pydantic Logfire provides real-time debugging, performance monitoring, and cost tracking  .\n*   **Production-Ready Tooling**: This includes an evaluation framework (`pydantic-evals`), durable execution capabilities, and various protocol integrations like MCP, A2A, and AG-UI  .\n*   **Graph Execution**: The `pydantic_graph.Graph` module provides a graph-based state machine for orchestrating agent execution, using nodes like `UserPromptNode`, `ModelRequestNode`, and `CallToolsNode`  .\n\n## Framework Architecture\nPydantic AI is organized as a `uv` workspace monorepo, containing several distinct Python packages  .\n\n### Core Packages\n*   `pydantic-ai-slim`: Contains the core framework components such as `Agent`, `Model`, and tools  .\n*   `pydantic-ai`: A meta-package that bundles all features and common providers  .\n\n### Supporting Packages\n*   `pydantic-graph`: A typed graph and state machine library used for agent loops and workflows  .\n*   `pydantic-evals`: A framework for systematic testing and evaluation of LLM performance  .\n*   `clai`: A command-line interface for interacting with agents and models  .\n*   `pydantic-ai-examples`: A collection of examples demonstrating Pydantic AI capabilities .\n\n## Agent Execution Flow\nThe `Agent` class serves as the primary orchestrator . Agent execution is graph-based, utilizing a state machine from `pydantic_graph.Graph` . The execution involves three core node types :\n*   `UserPromptNode`: Processes user input and creates initial `ModelRequest` .\n*   `ModelRequestNode`: Calls `model.request()` or `model.request_stream()` and handles retries .\n*   `CallToolsNode`: Executes tool functions via `RunContext[Deps]` .\n\nThe `Agent` provides methods like `run()`, `run_sync()`, and `run_stream()` for different execution scenarios .\n\n## Notes\nThe `pydantic-ai` repository also includes specialized *migration skills* as agents to assist in migrating codebases from other frameworks like Mastra, Google ADK, and Claude Agent SDK to Pydantic AI . These skills guide users through tracing source application paths, mapping concepts, and substituting constructs with Pydantic AI primitives .\n\nWiki pages you might want to explore:\n- [Overview (pydantic/pydantic-ai)](/wiki/pydantic/pydantic-ai#1)\n- [Project Philosophy and Contribution Guidelines (pydantic/pydantic-ai)](/wiki/pydantic/pydantic-ai#1.3)\n- [Framework Comparisons and Migration (pydantic/pydantic-ai)](/wiki/pydantic/pydantic-ai#11.7)\n\nView this search on DeepWiki: https://deepwiki.com/search/what-is-pydanticai_a3924ae7-8439-4063-9485-11b01101fda2\n"}]}            }

