        data: {"type":"message_start","message":{"model":"claude-sonnet-5-5","id":"msg_011CgPEtuevVXSDCCsxKFBvj","type":"message","role":"assistant","content":[],"container":null,"stop_reason":null,"stop_sequence":null,"stop_details":null,"usage":{"input_tokens":2487,"cache_creation_input_tokens":0,"cache_read_input_tokens":0,"cache_creation":{"ephemeral_5m_input_tokens":0,"ephemeral_1h_input_tokens":0},"output_tokens":2,"service_tier":"standard","inference_geo":"global","speed":"standard"},"diagnostics":null}}

        event: content_block_start
        data: {"type":"content_block_start","index":0,"content_block":{"type":"mcp_tool_result","tool_use_id":"mcptoolu_01SAss3KEwASziHZoMR6HcZU","is_error":false,"content":[{"type":"text","text":"Pydantic AI is a Python SDK and agent framework for building production-grade Generative AI applications and workflows.  It is designed to be provider-agnostic, supporting various LLM providers like OpenAI, Anthropic, and Google through a unified interface.  The framework emphasizes type safety, observability, and extensibility, leveraging Pydantic V2 for robust validation. \n\n## Core Features and Design Principles\n\nPydantic AI is built with several key design principles:\n*   **Model-Agnostic**: It supports a wide range of models and providers through a unified interface, allowing for easy swapping of models. \n*   **Type Safety**: The framework is designed for maximum IDE context and static type checking, aiming to catch errors at write-time rather than runtime. \n*   **Seamless Observability**: It integrates with Pydantic Logfire and OpenTelemetry for real-time debugging, tracing, and cost tracking of agent runs. \n*   **Structured Output**: Pydantic AI provides powerful streaming of structured data with immediate Pydantic validation. \n*   **Durable Execution**: It supports preserving agent progress across restarts and handling long-running workflows using technologies like Temporal. \n*   **Composable Capabilities**: Agents can be built from reusable units that bundle tools, hooks, instructions, and model settings. \n\n## Package Structure\n\nPydantic AI is organized as a `uv` workspace monorepo with several distinct Python packages:\n*   `pydantic-ai`: This is a meta-package that bundles common provider extras and dependencies. \n*   `pydantic-ai-slim`: This package contains the minimal core framework, including the agent logic and models. \n*   `pydantic-graph`: A typed graph and state machine library used for workflows. \n*   `pydantic-evals`: An evaluation framework for running tests and benchmarks. \n*   `pydantic-ai-harness`: A capability and harness library offering composable tools and sandboxes for advanced agent behaviors. \n*   `clai`: A Command Line Artificial Intelligence terminal utility. \n*   `pydantic-ai-examples`: A suite of demonstration examples. \n\n## Installation\n\nYou can install Pydantic AI using `pip` or `uv`. \n*   **Standard Installation**: `pip install pydantic-ai` includes core packages and libraries for major providers like OpenAI, Anthropic, and Google, along with integrations for Logfire and the CLI. \n*   **Slim Installation**: `pip install pydantic-ai-slim` provides a minimal footprint, allowing you to add specific providers or features via extras (e.g., `[openai]`, `[temporal]`). \n\n## Example Usage\n\nA basic Pydantic AI agent can be created and run with a few lines of code. For instance, to create an agent that uses Anthropic's Claude model and responds concisely:\n```python\nfrom pydantic_ai import Agent\n\nagent = Agent(\n    'anthropic:claude-sonnet-4-0',\n    instructions='Be concise, reply with one sentence.',\n)\nresult = agent.run_sync('Where does \"hello world\" come from?')\nprint(result.output)\n```\nThis example configures an `Agent` with a specific model and instructions, then runs it synchronously with a prompt.  The `result.output` will contain the LLM's response. \n\n## Notes\n\nThe `pydantic-ai` project aims to provide a robust and type-safe framework for AI agent development, similar to how FastAPI provides an ergonomic design for web development.  The `AGENTS.md` file provides guidelines for contributors, emphasizing the importance of high-quality, type-safe, and well-documented code. \n\nWiki pages you might want to explore:\n- [Overview (pydantic/pydantic-ai)](/wiki/pydantic/pydantic-ai#1)\n- [Package Structure and Organization (pydantic/pydantic-ai)](/wiki/pydantic/pydantic-ai#1.1)\n\nView this search on DeepWiki: https://deepwiki.com/search/what-is-pydanticai_c53c7a8b-7b20-4641-90a6-8c7752b7d064\n"}]}  }

