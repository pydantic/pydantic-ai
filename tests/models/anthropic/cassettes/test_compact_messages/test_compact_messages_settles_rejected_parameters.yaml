            - **OPS-2:** Ship logs and traces to Logfire. Reason: one place to debug both the API and the workers.
            - **DB-4:** Run migrations with Alembic in a pre-deploy step. Reason: a failed migration must block the release.

            **Open task:** Help the user pick a job queue for the workers. I said I would look up the queue options by calling `list_job_queues`, but no result from that call appears in the transcript. The options are still unknown, so the call needs to be made (or retried) before recommending anything.

            **Constraints from existing decisions to weigh when choosing a queue:**
            - The worker fleet already causes connection pressure on PostgreSQL, which is fronted by pgbouncer (DB-2). A queue that holds many open connections or polls heavily would make this worse.
