        content:
        - type: compaction
          content: |-
            **Role:** I track project decisions for a web application project. When the user asks to record a decision, I confirm it in one sentence in the form "Recorded ID: decision."

            **Decisions recorded so far (ID, decision, reason):**

            | ID | Decision | Reason |
            |---|---|---|
            | DB-1 | Use PostgreSQL 17 as the primary database | The team already runs it in two other services |
            | FE-1 | Use React 19 for the web client | Server components cut the bundle size for the dashboard |
            | DB-2 | Put pgbouncer in front of PostgreSQL | The worker fleet opens too many short-lived connections |
            | OPS-1 | Deploy on Fly.io in two regions | Latency for European customers was over 300 ms |
            | DB-3 | Take nightly base backups to S3 with 30-day retention | Compliance asked for a month of history |
            | FE-2 | Use Tailwind CSS for styling | The design system tokens map onto its theme config |
            | OPS-2 | Ship logs and traces to Logfire | One place to debug both the API and the workers |
            | DB-4 | Run migrations with Alembic in a pre-deploy step | A failed migration must block the release |

            Next IDs if needed: DB-5, FE-3, OPS-3.

            **Pending task (not yet answered):** The user asked for help picking a job queue for the workers. The answer should take the existing stack into account:
            - **Python-based backend:** Alembic and Logfire suggest Python.
            - **PostgreSQL 17 behind pgbouncer:** Postgres-backed queues (such as Procrastinate or pgqueuer) would avoid new infrastructure. However, LISTEN/NOTIFY and session-level features may conflict with pgbouncer in transaction-pooling mode.
            - **Worker fleet with many short-lived connections:** this is already a known pain point.
            - **Two-region deployment on Fly.io:** this affects where a broker such as Redis would live.
            - **Observability:** the queue should work with Logfire/OpenTelemetry tracing.

            Reasonable options to compare are a Postgres-based queue, Celery or Dramatiq with Redis, arq or RQ with Redis, and a managed service. I should give a recommendation and offer to record it as a decision (likely an OPS- or new-category ID).
