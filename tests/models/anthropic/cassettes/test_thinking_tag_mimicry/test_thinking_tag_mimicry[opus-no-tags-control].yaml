      content:
      - text: |-
          **28 days.**

          **Reasoning:** Each full day-night cycle the snail nets only 1 foot (3 up, 2 back). But on the final day, once it reaches the top during the climb, it's out -- no sliding back that night.

          After 27 days the snail has netted 27 feet. On day 28 it climbs 3 more feet, reaching 30 feet and escaping before night falls.
        type: text
