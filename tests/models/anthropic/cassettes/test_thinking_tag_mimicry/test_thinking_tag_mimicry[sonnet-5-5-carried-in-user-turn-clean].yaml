            **28 days.**

            The tempting answer is 30, since the snail nets 1 foot per day (3 up, 2 back). But that ignores that once the snail reaches the top, it doesn't slide back.

            - Each full day-and-night cycle gains a net 1 foot, so after n complete days the snail sits at n feet (after sliding back).
            - On any given day, the snail reaches its peak height during the climb, before the night slide. It escapes on the first day when its starting height plus 3 feet is at least 30.
            - That means it needs to start a day at 27 feet or higher. It starts day 28 at 27 feet (after 27 full cycles), climbs 3 feet, and reaches 30 feet, out of the well.

            So the snail escapes during the daytime climb of day 28, and the night slide never happens.
