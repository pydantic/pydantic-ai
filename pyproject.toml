[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true

[project]
name = "pydantic-ai"
dynamic = ["version", "dependencies", "optional-dependencies"]
description = "AI Agent Framework, the Pydantic way"
authors = [
    { name = "Douwe Maan", email = "douwe@pydantic.dev" },
    { name = "David Sanchez", email = "david.sanchez@pydantic.dev" },
    { name = "Aditya Vardhan", email = "aditya@pydantic.dev" },
    { name = "David Montague", email = "david@pydantic.dev" },
    { name = "Marcelo Trylesinski", email = "marcelotryle@gmail.com" },
    { name = "Alex Hall", email = "alex@pydantic.dev" },
    { name = "Samuel Colvin", email = "samuel@pydantic.dev" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Topic :: Internet",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
]
requires-python = ">=3.10"

[tool.hatch.metadata.hooks.uv-dynamic-versioning]
dependencies = [
    "pydantic-ai-slim[openai,anthropic,google,cli,mcp,evals,web,logfire]=={{ version }}",
]

[tool.hatch.metadata.hooks.uv-dynamic-versioning.optional-dependencies]
examples = ["pydantic-ai-examples=={{ version }}"]
dbos = ["pydantic-ai-slim[dbos]=={{ version }}"]
prefect = ["pydantic-ai-slim[prefect]=={{ version }}"]
sentence-transformers = ["pydantic-ai-slim[sentence-transformers]=={{ version }}"]
voyageai = ["pydantic-ai-slim[voyageai]=={{ version }}"]
# Opt-in extras forwarded from `pydantic-ai-slim` (some previously included in the
# default `pydantic-ai` install, others newly exposed here for convenience).
# Exposed at the root so users (and CI's `uv run --all-extras` matrix entry) can
# pull them through `pydantic-ai[<name>]`.
cohere = ["pydantic-ai-slim[cohere]=={{ version }}"]
mistral = ["pydantic-ai-slim[mistral]=={{ version }}"]
bedrock = ["pydantic-ai-slim[bedrock]=={{ version }}"]
bedrock-mantle = ["pydantic-ai-slim[bedrock-mantle]=={{ version }}"]
xai = ["pydantic-ai-slim[xai]=={{ version }}"]
groq = ["pydantic-ai-slim[groq]=={{ version }}"]
openrouter = ["pydantic-ai-slim[openrouter]=={{ version }}"]
huggingface = ["pydantic-ai-slim[huggingface]=={{ version }}"]
ag-ui = ["pydantic-ai-slim[ag-ui]=={{ version }}"]
ui = ["pydantic-ai-slim[ui]=={{ version }}"]
duckduckgo = ["pydantic-ai-slim[duckduckgo]=={{ version }}"]
tavily = ["pydantic-ai-slim[tavily]=={{ version }}"]
exa = ["pydantic-ai-slim[exa]=={{ version }}"]
web-fetch = ["pydantic-ai-slim[web-fetch]=={{ version }}"]
retries = ["pydantic-ai-slim[retries]=={{ version }}"]
temporal = ["pydantic-ai-slim[temporal]=={{ version }}"]
spec = ["pydantic-ai-slim[spec]=={{ version }}"]
mcp-tasks = ["pydantic-ai-slim[mcp-tasks]=={{ version }}"]
realtime = ["pydantic-ai-slim[realtime]=={{ version }}"]
openai-realtime = ["pydantic-ai-slim[openai-realtime]=={{ version }}"]
google-realtime = ["pydantic-ai-slim[google-realtime]=={{ version }}"]
xai-realtime = ["pydantic-ai-slim[xai-realtime]=={{ version }}"]

[project.urls]
Homepage = "https://pydantic.dev/docs/ai/"
Source = "https://github.com/pydantic/pydantic-ai"
Documentation = "https://pydantic.dev/docs/ai/"
Changelog = "https://github.com/pydantic/pydantic-ai/releases"

[project.scripts]
pai = "pydantic_ai._cli:cli_exit" # TODO(v3): remove this alias; clai has been on PyPI since 2025-05. https://pypi.org/project/clai/#history

[tool.uv.sources]
pydantic-ai = { workspace = true }
pydantic-ai-slim = { workspace = true }
pydantic-evals = { workspace = true }
pydantic-graph = { workspace = true }
pydantic-ai-examples = { workspace = true }

[tool.uv.workspace]
members = [
    "pydantic_ai_slim",
    "pydantic_evals",
    "pydantic_graph",
    "clai",
    "examples",
]

[tool.uv]
# `exclude-newer` relative durations need >= 0.9.17, `exclude-newer-package` `false` needs >= 0.9.25
required-version = ">=0.9.25"
default-groups = ["dev", "lint"]
exclude-newer = "7 days"
conflicts = [
    # The `mcp-tasks` extra lives in the FastMCP 4 / MCP SDK v2 universe, while the dev group
    # deliberately locks FastMCP 3 (the FastMCP 4 CI job layers `--with` overrides onto the
    # frozen lock). Lock-side forks only: pip resolves `[mcp,mcp-tasks]` together fine — in the
    # mcp-tasks fork the extra's pre-release floor opts the shared `fastmcp-slim` range into the
    # FastMCP 4 betas. Every `--all-extras` invocation in CI and the Makefile carries
    # `--no-extra mcp-tasks` to stay on the dev side of the fork.
    [
        { package = "pydantic-ai-slim", extra = "mcp-tasks" },
        { group = "dev" },
    ],
    [
        { package = "pydantic-ai", extra = "mcp-tasks" },
        { group = "dev" },
    ],
]
constraint-dependencies = [
    "ray>=2.55.0",
    "authlib>=1.6.7",
    # Security-driven floors for purely transitive deps. Each line lifts the
    # minimum to the first patched release flagged by Dependabot so we don't
    # have to wait for upstream packages to bump.
    "urllib3>=2.7.0",
    "idna>=3.15",
    "cryptography>=48.0.1",
    "lxml>=6.1.0",
    "mako>=1.3.12",
    "pillow>=12.3.0",
    "pyarrow>=23.0.1",
    "pyasn1>=0.6.4",
    "pymdown-extensions>=10.21.3",
    "python-dotenv>=1.2.2",
    "pygments>=2.20.0",
    "xgrammar>=0.1.32",
    "langchain-core>=1.3.3",
    "langchain-text-splitters>=1.1.2",
    "langsmith>=0.8.18",
    "joserfc>=1.6.7",
    "pydantic-settings>=2.14.2",
    "setuptools>=83.0.0",
    "vcrpy>=8.2.1",
    "starlette>=1.3.1",
    "aiohttp>=3.14.1",
    "python-multipart>=0.0.31",
    "pyjwt>=2.13.0",
    "torch>=2.13.0",
    "transformers>=5.5.0",
]
build-constraint-dependencies = [
    # hatchling 1.32.0 (2026-08-11) bumped its default core metadata version to 2.5,
    # which the pinned gh-action-pypi-publish validator rejects as "not a valid
    # metadata version". Ceiling until the publish action (or PyPI's own validator)
    # catches up. Affects `uv build`'s PEP 517 build isolation, not runtime installs.
    # Not covered by `exclude-newer` above: hatchling 1.32.0 rolls out of that
    # 7-day window on 2026-08-18, so this needs its own explicit ceiling.
    "hatchling<1.32",
]

[tool.uv.exclude-newer-package]
# These are our own packages, not worth defending from supply chain attacks on them.
# `listentome` is maintained by a Pydantic team member and counts as one of ours.
listentome = false
pydantic = false
pydantic-core = false
pydantic-extra-types = false
pydantic-settings = false
pydantic-handlebars = false
genai-prices = false
logfire = false
logfire-api = false

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "asgi-lifespan>=2.1.0",
    "httpx>=0.27",
    "devtools>=0.12.2",
    "coverage[toml]>=7.10.7",
    "dirty-equals>=0.9.0",
    "duckduckgo-search>=7.0.0",
    "pydocket>=0.20.2",
    "exa-py>=2.0.0",
    "tavily-python>=0.5.0",
    "markdownify>=1.2",
    "inline-snapshot>=0.32.5",
    "pytest>=9.0.3",
    "pytest-examples>=0.0.18",
    "pytest-mock>=3.14.0",
    "pytest-pretty>=1.3.0",
    "pytest-recording>=0.13.2",
    "boto3-stubs[bedrock-runtime]>=1.42.63",
    # Pinned at the in-process rework, which reads `Coverage._get_file_reporter` -- a private API --
    # and so declares `coverage>=7,<8`. A future coverage 8.x bump would be blocked on this
    # dependency until upstream reworks it off that API.
    "strict-no-cover @ git+https://github.com/pydantic/strict-no-cover.git@6c644106e03138abae01d8d60105d4a7ad4916a1",
    "pytest-xdist>=3.6.1",
    # Needed for PyCharm users
    "pip>=26.1",
    "genai-prices>=0.1.0",
    "brotli>=1.2.0",
    # `tests/durable_exec/test_dbos.py`'s fixture sets `enable_otlp=True` to cover DBOS's OTLP integration, and
    # dbos's own `config_logger` imports this unconditionally on that path without requiring its
    # `[otel]` extra (only a real bug for callers who set `enable_otlp=True` without it — most don't,
    # so the public `dbos` extra doesn't need this): https://github.com/dbos-inc/dbos-transact-py/issues/832
    "opentelemetry-instrumentation-logging>=0.63b0",
    # Tests use `FastMCP(...)` in-process servers via fastmcp's server module — the user-facing
    # `[mcp]` extra ships `fastmcp-slim[client]` which lacks server support, so devs need the full
    # `fastmcp` package alongside, tracking the same range as the `[mcp]` extra (#6661).
    "fastmcp>=3.3.0,<5",
    # The MCP SDK v2 wire types as a standalone pure-Pydantic distribution, so the tests can check
    # the compat readers' field-name pairs against the real v2 models while running against v1.
    "mcp-types>=2.0.0",
    # BlockBuster minor releases may add breaking detection rules; keep this test detector on 1.5.x.
    "blockbuster>=1.5.26,<1.6",
]
lint = [
    "griffecli>=2.1.0,<3",
    "mypy>=1.11.2",
    "pyright>=1.1.408",
    "ruff>=0.14.14",
]
[tool.hatch.build.targets.wheel]
bypass-selection = true
exclude = ["/pydantic_ai_slim/pydantic_ai/.agents"]

[tool.hatch.build.targets.sdist]
include = ["/README.md", "/Makefile"]
# We are excluding the tests because we have 100MB of test data in this repository.
# Obviously that's a problem, but for now, we'll just exclude them.
exclude = ["/tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
include = [
    "pydantic_ai_slim/**/*.py",
    "pydantic_evals/**/*.py",
    "pydantic_graph/**/*.py",
    "examples/**/*.py",
    "clai/**/*.py",
    "tests/**/*.py",
    "docs/**/*.py",
    ".github/scripts/ci_duration.py",
    ".github/scripts/check_api_compatibility.py",
    ".github/scripts/test_ci_duration.py",
    ".github/scripts/test_check_api_compatibility.py",
    ".github/scripts/pydantic_ai_gh_aw_shim/**/*.py",
    ".github/scripts/test_pydantic_ai_runner.py",
    ".github/scripts/issue_pr_attention_monitor.py",
    ".github/scripts/test_issue_pr_attention_monitor.py",
    ".github/scripts/semantic_owner_router.py",
    ".github/scripts/test_semantic_owner_router.py",
    ".github/scripts/community_demand.py",
    ".github/scripts/test_community_demand.py",
    ".github/scripts/triage_telemetry.py",
    ".github/scripts/test_triage_telemetry.py",
    ".github/scripts/feature_digest.py",
    ".github/scripts/test_feature_digest.py",
    ".github/scripts/agentic_workflow_guard.py",
    ".github/scripts/test_agentic_workflow_guard.py",
    ".github/scripts/agent_spend_report.py",
    ".github/scripts/test_agent_spend_report.py",
    ".github/scripts/test_docs_navigation_workflow.py",
    ".github/scripts/test_protect_github_dir.py",
]

[tool.ruff.lint]
preview = true  # For `PLW1514`
explicit-preview-rules = true
select = ["E4", "E7", "E9", "F"]
extend-select = [
    "Q",
    "RUF100",
    "RUF018", # https://docs.astral.sh/ruff/rules/assignment-in-assert/
    "RUF043", # https://docs.astral.sh/ruff/rules/pytest-raises-ambiguous-pattern/
    "C90",
    "UP",
    "I",
    "D",
    "TID251",
    "PLW1514", # https://docs.astral.sh/ruff/rules/unspecified-encoding/
    "PGH003", # https://docs.astral.sh/ruff/rules/blanket-type-ignore/
]
flake8-quotes = { inline-quotes = "single", multiline-quotes = "double" }
mccabe = { max-complexity = 15 }
ignore = [
    "D100", # ignore missing docstring in module
    "D102", # ignore missing docstring in public method
    "D104", # ignore missing docstring in public package
    "D105", # ignore missing docstring in magic methods
    "D107", # ignore missing docstring in __init__ methods
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["pydantic_ai", "pydantic_evals", "pydantic_graph"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.TypedDict".msg = "Use typing_extensions.TypedDict instead."
"typing.assert_never".msg = "Use typing_extensions.assert_never instead."
"asyncio.Lock".msg = "Use anyio.Lock instead."

[tool.ruff.format]
# don't format python in docstrings, pytest-examples takes care of it
docstring-code-format = false
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["D101", "D103"]
"tests/**/*.py" = ["D"]
"docs/**/*.py" = ["D"]
".github/scripts/ci_duration.py" = ["D"]
".github/scripts/check_api_compatibility.py" = ["D"]
".github/scripts/test_ci_duration.py" = ["D"]
".github/scripts/test_check_api_compatibility.py" = ["D"]
".github/scripts/test_pydantic_ai_runner.py" = ["D"]
".github/scripts/test_issue_pr_attention_monitor.py" = ["D"]
".github/scripts/test_semantic_owner_router.py" = ["D"]
".github/scripts/test_community_demand.py" = ["D"]
".github/scripts/test_triage_telemetry.py" = ["D"]
".github/scripts/test_feature_digest.py" = ["D"]
".github/scripts/test_agentic_workflow_guard.py" = ["D"]
".github/scripts/test_agent_spend_report.py" = ["D"]
".github/scripts/test_docs_navigation_workflow.py" = ["D"]
".github/scripts/test_protect_github_dir.py" = ["D"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnnecessaryIsInstance = false
reportUnnecessaryTypeIgnoreComment = true
reportMissingModuleSource = false
include = [
    "pydantic_ai_slim",
    "pydantic_evals",
    "pydantic_graph",
    "tests",
    "examples",
    "clai",
    ".github/scripts/ci_duration.py",
    ".github/scripts/check_api_compatibility.py",
    ".github/scripts/test_ci_duration.py",
    ".github/scripts/test_check_api_compatibility.py",
    ".github/scripts/pydantic_ai_gh_aw_shim",
    ".github/scripts/test_pydantic_ai_runner.py",
    ".github/scripts/issue_pr_attention_monitor.py",
    ".github/scripts/semantic_owner_router.py",
    ".github/scripts/community_demand.py",
    ".github/scripts/triage_telemetry.py",
    ".github/scripts/feature_digest.py",
]
# The monitor policy tests deliberately exercise private helpers and loose GitHub
# webhook dictionaries through monkeypatching; pytest covers them, while the
# production policy module above remains under strict Pyright.
venvPath = '.'
venv = ".venv"
# see https://github.com/microsoft/pyright/issues/7771 - we don't want to error on decorated functions in tests
# which are not otherwise used
executionEnvironments = [
    { root = "tests", extraPaths = ["examples"], reportUnusedFunction = false, reportPrivateImportUsage = false },
    # `extraPaths` lets pyright resolve the shim package (which sits next to
    # the test file, not under the project root) the same way the runtime
    # `sys.path.insert(...)` at the top of the test does.
    { root = ".github/scripts/test_ci_duration.py", extraPaths = [".github/scripts"], reportUnusedFunction = false, reportPrivateImportUsage = false },
    { root = ".github/scripts/test_check_api_compatibility.py", extraPaths = [".github/scripts"], reportUnusedFunction = false, reportPrivateImportUsage = false },
    { root = ".github/scripts/test_pydantic_ai_runner.py", extraPaths = [".github/scripts"], reportUnusedFunction = false, reportPrivateImportUsage = false },
]
exclude = [
    "examples/pydantic_ai_examples/weather_agent_gradio.py",
    "pydantic_ai_slim/pydantic_ai/embeddings/voyageai.py",   # voyageai package has no type stubs
]

[tool.mypy]
files = "tests/typed_agent.py"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests", ".github/scripts/test_ci_duration.py"]
xfail_strict = true
filterwarnings = [
    "error",
    # boto3
    "ignore::DeprecationWarning:botocore.*",
    "ignore::RuntimeWarning:pydantic_ai.mcp",
    # ag-ui-protocol >= 0.1.15 deprecated BinaryInputContent
    "ignore:BinaryInputContent is deprecated:DeprecationWarning",
    # uvicorn (mcp server)
    "ignore:websockets.legacy is deprecated.*:DeprecationWarning:websockets.legacy",
    "ignore:websockets.server.WebSocketServerProtocol is deprecated:DeprecationWarning",
    # random resource warnings; I suspect these are coming from vendor SDKs when running examples..
    "ignore:unclosed <socket:ResourceWarning",
    "ignore:unclosed <ssl.SSLSocket:ResourceWarning",
    "ignore:unclosed event loop:ResourceWarning",
    # prefect has a Pydantic v2 compatibility issue in RRuleSchedule
    "ignore:The 'default' attribute with value 'UTC' was provided.*:UserWarning",
    # This is because of cohere.
    "ignore: 'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:cohere",
    # This is because of google.
    "ignore: '_UnionGenericAlias' is deprecated and slated for removal:DeprecationWarning:google.genai",
    # DBOS logs through the `LoggingHandler` that OpenTelemetry SDK 1.40 deprecated, reached whenever
    # `enable_otlp` is set as `tests/durable_exec/test_dbos.py` does.
    # TODO(v3): Require `dbos>=2.31.0` and drop this filter.
    # https://github.com/dbos-inc/dbos-transact-py/pull/822
    "ignore:`LoggingHandler` in `opentelemetry-sdk` is deprecated:DeprecationWarning:opentelemetry.sdk._logs",
    # TODO(Marcelo): Drop this once voyageai stops using Pydantic V1 functionality.
    # Fixed upstream in 0.4.0: https://github.com/voyage-ai/voyageai-python/pull/60 — drop when we bump past 0.3.7.
    "ignore: Core Pydantic V1 functionality:UserWarning",
    # prefect has a Pydantic v2 compatibility issue in RRuleSchedule
    "ignore:UnsupportedFieldAttributeWarning:UserWarning",
    # coolname (prefect dep) uses codecs.open(), deprecated in Python 3.14
    "ignore:codecs.open\\(\\) is deprecated:DeprecationWarning",
    # outlines' llamacpp backend calls llama-cpp-python's `Llama.from_pretrained`, which forwards
    # `local_dir_use_symlinks` to `hf_hub_download`; huggingface-hub >= 1.0 deprecated (and ignores)
    # that arg and warns about it. The arg is a no-op and the call site isn't ours to change.
    "ignore:The `local_dir_use_symlinks` argument is deprecated and ignored:UserWarning",
    # fastmcp v3 does standard OTel distributed tracing (inject on client, extract on server).
    # logfire's default config wraps the global propagator to warn on extract via warnings.warn(),
    # which crashes tool execution when filterwarnings=["error"]. The proper upstream fix is for
    # logfire to use logging.warning() instead of warnings.warn() for this diagnostic — it's
    # informational, not a deprecation, and should never be able to crash execution.
    "ignore:Found propagated trace context:RuntimeWarning",
]

# https://coverage.readthedocs.io/en/latest/config.html#run
[tool.coverage.run]
patch = ["subprocess"]
concurrency = ["multiprocessing", "thread"]
# We use a subdirectory for coverage data to avoid noisy coverage data files.
data_file = ".coverage/.coverage"
# required to avoid warnings about files created by create_module fixture
include = [
    "pydantic_ai_slim/**/*.py",
    "pydantic_evals/**/*.py",
    "pydantic_graph/**/*.py",
    "tests/**/*.py",
]
omit = [
    "tests/example_modules/*.py",
    "pydantic_ai_slim/pydantic_ai/common_tools/exa.py",  # exa-py integration with external API calls
    "tests/models/xai_proto_cassettes.py", # dev-only helpers for recording/replaying xAI gRPC protobuf cassettes
    "tests/_inline_snapshot.py",  # test utility wrapper; branches depend on CLI flags
    "tests/kw_only_walker.py",  # only ever runs in a coverage-free subprocess, so it is unmeasurable by construction
    "tests/providers/test_gateway_catalog.py",  # live gateway catalog smoke test; execution depends on opt-in flag and credentials
]
branch = true
# Disable include-ignored warnings as --source is enabled automatically causing a self conflict as per:
# https://github.com/pytest-dev/pytest-cov/issues/532
# https://github.com/pytest-dev/pytest-cov/issues/369
# This prevents coverage being generated by pytest-cov which has direct editor support in VS Code,
# making it super useful to check coverage while writing tests.
disable_warnings = ["include-ignored"]

[tool.coverage.paths]
# Allow CI run assets to be downloaded an replicated locally.
source = [
    ".",
    "/home/runner/work/pydantic-ai/pydantic-ai",
    "/System/Volumes/Data/home/runner/work/pydantic-ai/pydantic-ai",
]

# https://coverage.readthedocs.io/en/latest/config.html#report
[tool.coverage.report]
fail_under = 100
skip_covered = true
show_missing = true
ignore_errors = true
precision = 2
exclude_lines = [
    # `# pragma: no cover` is standard marker for code that's not covered, this will error if code is covered
    'pragma: no cover',
    # use `# pragma: lax no cover` if you want to ignore cases where (some of) the code is covered
    'pragma: lax no cover',
    'raise NotImplementedError',
    'if TYPE_CHECKING:',
    'if typing.TYPE_CHECKING:',
    '@overload',
    '@deprecated',
    '@typing.overload',
    '@abstractmethod',
    '\(Protocol\):$',
    'typing.assert_never',
    '$\s*assert_never\(',
    'if __name__ == .__main__.:',
    'except ImportError as _import_error:',
    '$\s*pass$',
    'assert False',
    '@pytest\.mark\.skip',
    '@pytest\.mark\.xfail',
]

[tool.logfire]
ignore_no_config = true

[tool.inline-snapshot]
format-command = "ruff format --stdin-filename {filename}"

[tool.inline-snapshot.shortcuts]
snap-fix = ["create", "fix"]
snap = ["create"]

[tool.codespell]
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = '.git*,*.svg,*.lock,*.css,*.yaml'
check-hidden = true
# Ignore "formatting" like **L**anguage
ignore-regex = '\*\*[A-Z]\*\*[a-z]+\b'
ignore-words-list = 'asend,fpr,aci,gage'
